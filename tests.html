<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Održavanje — testovi</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;
  color:#1b2430;margin:0;padding:18px;font-size:15px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#5b6570;font-size:13px;margin-bottom:14px}
#sazetak{padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px}
.ok{background:#e8f3ec;color:#1e6f3d;border:1px solid #cbe3d3}
.fail{background:#fdeaea;color:#c0181c;border:1px solid #f3cbcb}
.run{background:#edecf7;color:#3a3285;border:1px solid #d5d2ef}
#rez{background:#fff;border:1px solid #e3e6eb;border-radius:10px;overflow:hidden}
.t{padding:8px 12px;border-bottom:1px solid #e3e6eb;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.t:last-child{border-bottom:none}
.t .z{flex-shrink:0;font-weight:700}
.t.p .z{color:#1e6f3d}.t.f .z{color:#c0181c}
.t .d{color:#c0181c;font-size:12px;margin-top:2px}
.grupa{background:#f0f1f5;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
  color:#5b6570;padding:7px 12px}
iframe{width:390px;height:700px;border:1px solid #e3e6eb;border-radius:10px;margin-top:16px;background:#fff}
</style>
</head>
<body>
<h1>Održavanje — automatski testovi</h1>
<div class="sub">Pokreće pravu aplikaciju u demo načinu i provjerava ključne tokove.
  Pokretati nakon svake izmjene: <code>python -m http.server</code> pa otvoriti ovu stranicu.</div>
<div id="sazetak" class="run">Pokretanje…</div>
<div id="rez"></div>
<iframe id="app" title="aplikacija pod testom"></iframe>

<script>
var REZ = [], GRUPA = '';
function grupa(n){ GRUPA = n; REZ.push({grupa:n}); }
function ok(naziv, uvjet, detalj){
  REZ.push({naziv:naziv, prosao:!!uvjet, detalj:uvjet?'':(detalj||'')});
}
function jednako(naziv, dobiveno, ocekivano){
  ok(naziv, dobiveno === ocekivano, 'dobiveno: '+JSON.stringify(dobiveno)+', očekivano: '+JSON.stringify(ocekivano));
}
function ispisi(){
  var pali = REZ.filter(function(r){ return r.naziv && !r.prosao; });
  var svi = REZ.filter(function(r){ return r.naziv; });
  var s = document.getElementById('sazetak');
  s.className = pali.length ? 'fail' : 'ok';
  s.textContent = pali.length
    ? ('PALO ' + pali.length + ' od ' + svi.length + ' testova')
    : ('SVE PROLAZI — ' + svi.length + ' testova');
  document.getElementById('rez').innerHTML = REZ.map(function(r){
    if(r.grupa) return '<div class="grupa">'+r.grupa+'</div>';
    return '<div class="t '+(r.prosao?'p':'f')+'"><span class="z">'+(r.prosao?'✓':'✕')+'</span>'+
      '<span>'+r.naziv+(r.detalj?'<div class="d">'+r.detalj+'</div>':'')+'</span></div>';
  }).join('');
}
function cekaj(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function posalji(form){ form.dispatchEvent(new Event('submit', {cancelable:true})); }

/* čekaj da se aplikacija u iframeu digne (radi i ako se učitala prije ove skripte) */
(async function pokreni(){
  var iframe = document.getElementById('app');
  /* uvijek svježa verzija — inače service worker servira staru iz cachea */
  iframe.src = 'index.html?test=' + Date.now();
  /* cekamo da se kod digne; DATA jos ne mora postojati — na objavljenoj verziji
     aplikacija prvo trazi prijavu, pa testove vrtimo kroz demo nacin */
  for(var i=0; i<100; i++){
    var W0 = iframe.contentWindow;
    if(W0 && W0.app && W0.buildSeed && typeof W0.app.demoUlaz === 'function') break;
    await cekaj(100);
  }
  var W = iframe.contentWindow, D = iframe.contentDocument;
  if(!W || !W.app || typeof W.app.demoUlaz !== 'function'){
    ok('Aplikacija se nije pokrenula u iframeu', false,
       'Otvori ovu stranicu preko http(s)://, ne preko file://');
    ispisi(); return;
  }
  /* testovi uvijek rade u demo nacinu — nikad ne diraju pravu bazu */
  W.app.demoUlaz();
  for(var j=0; j<50; j++){ if(W.DATA) break; await cekaj(100); }
  if(!W.DATA){ ok('Demo podaci se nisu ucitali', false, 'app.demoUlaz() nije postavio DATA'); ispisi(); return; }
  if(W.REMOTE){ ok('Testovi moraju raditi u demo nacinu', false, 'REMOTE je ostao true'); ispisi(); return; }
  try{ await testovi(W, D); }
  catch(e){ ok('Testovi su se srušili', false, String(e && e.stack || e)); }
  ispisi();
})();

async function testovi(W, D){
  var app = W.app;
  W.app.demoUlaz();
  await cekaj(120);
  /* determinizam: svaki run kreće od netaknutog seeda */
  try{ W.localStorage.removeItem(W.LS_KEY); }catch(e){}
  W.DATA = W.buildSeedSFotkom();
  W.save();
  W.showScreen('pregled');
  await cekaj(60);

  grupa('Osnovni podaci i izračuni');
  ok('aplikacija se pokrenula u demo načinu', W.REMOTE === false);
  jednako('11 strojeva u šifrarniku', W.DATA.machines.length, 11);
  ok('27 kvarova u seedu', W.DATA.kvarovi.length === 27, 'ima ' + W.DATA.kvarovi.length);
  ok('svi kvarovi imaju stroj i opis', W.DATA.kvarovi.every(function(k){ return k.m && k.opis; }));
  ok('svi kvarovi referenciraju postojeći stroj',
     W.DATA.kvarovi.every(function(k){ return !k.m || !!W.machineById(k.m); }));
  ok('preventiva referencira postojeći stroj',
     W.DATA.preventiva.every(function(p){ return !!W.machineById(p.m); }));
  jednako('trošak = sati × €/h (tunel 500)', W.kvarCost({m:'t1', sati:2}), 1000);
  jednako('trošak linije (350 €/h)', W.kvarCost({m:'e1', sati:3}), 1050);
  jednako('nepoznat stroj ne ruši izračun', W.kvarCost({m:'nema', sati:1}), 350);
  jednako('interval "svakih 30 dana" = 30', W.intervalDays('svakih 30 dana'), 30);
  jednako('interval "svakih 12 mjeseci" = 365', W.intervalDays('svakih 12 mjeseci'), 365);
  jednako('pomak datuma za godinu', W.addDaysISO('2026-08-13', 365), '2027-08-13');
  ok('kategorizacija po opisu radi', W.autoKat('puknuti remen') === 'Mehanički' &&
     W.autoKat('senzor temperature') === 'Električni' &&
     W.autoKat('pad tlaka kompresora') === 'Pneumatika i rashlada');
  ok('3 dijela ispod minimuma',
     W.DATA.dijelovi.filter(function(p){ return p.stanje < p.min; }).length === 3);

  grupa('Prijava kvara');
  app.go('kvarovi');
  var prije = W.DATA.kvarovi.length;
  app.noviKvar();
  var f = D.querySelector('#modal-root form');
  f.elements.m.value = 'e1';
  f.elements.opis.value = 'TEST puknuti remen';
  f.elements.sati.value = '2';
  posalji(f); await cekaj(150);
  jednako('novi kvar je dodan', W.DATA.kvarovi.length, prije + 1);
  var novi = W.DATA.kvarovi[W.DATA.kvarovi.length - 1];
  jednako('automatska kategorija iz opisa', novi.kategorija, 'Mehanički');
  jednako('status je otvoren', novi.status, 'otvoren');
  ok('sistemski zapis o prijavi je nastao',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('TEST puknuti remen') > -1; }));

  grupa('Validacije');
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  f.elements.m.value = 'e1'; f.elements.opis.value = 'TEST nevaljano'; f.elements.sati.value = '999';
  var brojPrije = W.DATA.kvarovi.length;
  var stariAlert = W.alert; W.alert = function(){};
  posalji(f); await cekaj(120);
  W.alert = stariAlert;
  jednako('999 sati zastoja je odbijeno', W.DATA.kvarovi.length, brojPrije);
  app.closeModal();

  grupa('Rješavanje kvara i skladište');
  var dio = W.DATA.dijelovi.filter(function(p){ return p.naziv.indexOf('Remen HTD') === 0; })[0];
  var stanjePrije = dio.stanje;
  app.rijesiKvar(novi.id);
  f = D.querySelector('#modal-root form');
  f.elements.tko.value = 'Majstor 1';
  f.elements.dio.value = dio.id;
  f.elements.kol.value = '1';
  posalji(f); await cekaj(150);
  jednako('kvar je riješen', novi.status, 'rijesen');
  jednako('skladište je razduženo', dio.stanje, stanjePrije - 1);
  ok('utrošeni dio je upisan u "zamijenjeno"', (novi.zam || '').indexOf('Remen HTD') > -1);

  grupa('Uređivanje i storno');
  app.urediKvar(novi.id);
  f = D.querySelector('#modal-root form');
  ok('riješen kvar se može uređivati', !!f && !!f.elements.sati);
  f.elements.sati.value = '5';
  posalji(f); await cekaj(150);
  jednako('ispravljeni sati su spremljeni', novi.sati, 5);
  var stariPrompt = W.prompt; W.prompt = function(){ return 'dupli unos'; };
  var stariConfirm = W.confirm; W.confirm = function(){ return true; };  /* potvrda upozorenja o utrošenom dijelu */
  app.stornirajKvar(novi.id); await cekaj(200);
  W.prompt = stariPrompt; W.confirm = stariConfirm;
  jednako('storno postavlja status', novi.status, 'otkazan');
  ok('storno upozorava kad je dio bio utrošen', (novi.zam||'').length > 0);
  ok('stornirani kvar ne ulazi u izračune',
     W.samoKvarovi().every(function(k){ return k.id !== novi.id; }));

  grupa('Filteri i pretraga');
  app.go('kvarovi');
  app.setFilter('status', 'otvoren');
  ok('filter otvorenih vraća samo otvorene',
     D.querySelectorAll('#screen-kvarovi .kvar-item').length ===
     W.DATA.kvarovi.filter(function(k){ return k.status === 'otvoren'; }).length);
  app.setFilter('majstor', 'Majstor 1');
  ok('filter po majstoru radi',
     Array.prototype.every.call(D.querySelectorAll('#screen-kvarovi .kvar-item'), function(el){
       return el.textContent.indexOf('Majstor 1') > -1; }));
  app.resetFiltere();
  app.setFilter('vrsta', 'zadatak');
  jednako('nema zadataka u seedu', D.querySelectorAll('#screen-kvarovi .kvar-item').length, 0);
  app.resetFiltere();

  grupa('Zadaci');
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  f.elements.tip.value = 'zadatak';
  f.elements.opis.value = 'TEST zadatak bez stroja';
  f.elements.rok.value = W.todayISO();
  posalji(f); await cekaj(150);
  var zad = W.DATA.kvarovi.filter(function(k){ return k.tip === 'zadatak'; })[0];
  ok('zadatak je spremljen bez stroja', !!zad && !zad.m);
  jednako('zadatak ima rok', zad.rok, W.todayISO());
  jednako('zadatak ne ulazi u trošak zastoja', W.samoKvarovi().filter(function(k){ return k.tip === 'zadatak'; }).length, 0);

  grupa('Preventiva');
  var prev = W.DATA.preventiva.filter(function(p){ return p.next < W.todayISO(); })[0];
  ok('postoji preventiva koja kasni', !!prev);
  var interval = W.intervalDays(prev.interval);
  app.obaviPreventivu(prev.id);
  f = D.querySelector('#modal-root form');
  posalji(f); await cekaj(150);
  jednako('zadnje obavljeno = danas', prev.zadnje, W.todayISO());
  jednako('sljedeći termin je pomaknut za interval', prev.next, W.addDaysISO(W.todayISO(), interval));
  ok('sistemski zapis o preventivi',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('Preventiva obavljena') > -1; }));

  grupa('Uloge');
  W.SESSION = { ime:'Majstor 1', role:'majstor' };
  D.body.dataset.role = 'majstor';
  W.showScreen('pregled');
  ok('majstor ne vidi eure na pregledu', D.querySelector('#screen-pregled').innerHTML.indexOf('€') === -1);
  ok('majstor ne vidi IFS gumb', W.getComputedStyle(D.querySelector('.btn-audit')).display === 'none');
  ok('majstor vidi svoje zadatke', D.querySelector('#screen-pregled').innerHTML.indexOf('Moji zadaci') > -1);
  W.SESSION = { ime:'Direktor', role:'readonly' };
  D.body.dataset.role = 'readonly';
  W.showScreen('kvarovi');
  var pisi = D.querySelector('#screen-kvarovi .role-write');
  ok('direktor ne vidi gumbe za pisanje', !pisi || W.getComputedStyle(pisi).display === 'none');
  W.SESSION = { ime:'Voditelj', role:'voditelj' };
  D.body.dataset.role = 'voditelj';

  grupa('Analitika');
  W.ANA_DANA = 365;
  app.go('analitika');
  var d = W.anaPodaci();
  ok('analitika grupira po stroju', Object.keys(d.poStroju).length > 3);
  ok('analitika grupira po smjeni', Object.keys(d.poSmjeni).length >= 2);
  ok('analitika grupira po kategoriji', Object.keys(d.poKat).length >= 2);
  ok('stornirani nisu u analitici', d.KV.every(function(k){ return k.status !== 'otkazan'; }));
  ok('tablice su iscrtane', D.querySelectorAll('#screen-analitika .tbl').length >= 3);

  grupa('Offline red');
  ok('red je prazan na početku (demo)', W.RED.length === 0);
  W.uRed('kvarovi', 'insert', {opis:'TEST offline'}, {id:'kv999'});
  jednako('unos je stavljen u red', W.RED.length, 1);
  W.zamijeniIdURedu('kv999', 'uuid-pravi');
  jednako('privremeni ID je zamijenjen pravim', W.RED[0].tempId, 'uuid-pravi');
  W.RED = []; W.redSpremi();
  ok('mrežna greška se prepoznaje', W.mreznaGreska({message:'Failed to fetch'}) === true);
  ok('greška baze nije mrežna', W.mreznaGreska({message:'duplicate key value'}) === false);

  grupa('Izvještaji');
  app.audit(90);
  ok('IFS izvještaj se otvara', !!D.querySelector('#modal-root .modal.audit'));
  ok('IFS ima memorandum za ispis', !!D.querySelector('#modal-root .print-head'));
  ok('IFS pokriva razdoblje iz odabira', D.querySelector('#modal-root').textContent.indexOf('90 dana') > -1);
  app.closeModal();
  app.analitikaIspis();
  ok('analitika ima verziju za ispis', !!D.querySelector('#modal-root .print-head'));
  app.closeModal();

  grupa('Kalendar rasporeda');
  app.go('raspored');
  ok('kalendar je iscrtan', D.querySelectorAll('.cal-d').length >= 28);
  ok('dani s preventivom su označeni', D.querySelectorAll('.cal-t').length > 0);
  var naslovPrije = D.querySelector('.cal-naslov').textContent;
  app.rasporedMjesec(1);
  ok('navigacija po mjesecima radi', D.querySelector('.cal-naslov').textContent !== naslovPrije);
  app.rasporedMjesec(-1);

  grupa('Dijelovi i kontakti');
  app.go('dijelovi');
  ok('kritični dijelovi su na vrhu', D.querySelector('#parts-list h2').textContent.indexOf('minimuma') > -1);
  app.traziDio('remen');
  ok('pretraga dijelova filtrira', D.querySelectorAll('#parts-list .row').length < W.DATA.dijelovi.length);
  app.traziDio('');
  app.go('kontakti');
  ok('kontakti su grupirani po vrsti', D.querySelectorAll('#kontakti-list h2').length >= 2);
  app.traziKontakt('frigo');
  jednako('pretraga kontakata', D.querySelectorAll('#kontakti-list .row').length, 1);
  app.traziKontakt('');

  grupa('Status "u radu"');
  var otv = W.DATA.kvarovi.filter(function(k){ return k.status === 'otvoren'; })[0];
  W.SESSION = { ime:'Majstor 2', role:'majstor' };
  await app.preuzmiKvar(otv.id); await cekaj(200);
  jednako('preuzimanje postavlja status', otv.status, 'u_radu');
  jednako('preuzimatelj postaje dodijeljen', otv.dodijeljen, 'Majstor 2');
  ok('zapis o preuzimanju je u kanalu',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('radi na') > -1; }));
  ok('kvar u radu i dalje broji kao otvoren', W.jeOtvoren(otv) === true);
  W.SESSION = { ime:'Voditelj', role:'voditelj' };
  W.showScreen('kvarovi');
  ok('u listi se vidi oznaka "U radu"',
     D.querySelector('#screen-kvarovi').innerHTML.indexOf('U radu') > -1);
  app.setFilter('status','u_radu');
  jednako('filter "u radu" nalazi kvar', D.querySelectorAll('#screen-kvarovi .kvar-item').length, 1);
  app.resetFiltere();

  grupa('Usporedba razdoblja');
  W.ANA_DANA = 30;
  var sada = W.zbroji(W.anaKvarovi());
  var prije = W.anaKvaroviPrethodno();
  ok('prethodno razdoblje se izračunava', Array.isArray(prije));
  ok('zbroj vraća sve mjere', typeof sada.n === 'number' && typeof sada.cost === 'number' && typeof sada.mttr === 'number');
  ok('pad troška je označen zeleno', W.deltaChip(50, 100, true).indexOf('dobro') > -1);
  ok('rast troška je označen crveno', W.deltaChip(150, 100, true).indexOf('lose') > -1);
  app.go('analitika'); await cekaj(150);
  ok('analitika prikazuje usporedbu',
     D.querySelector('#screen-analitika').textContent.indexOf('usporedba s prethodnih') > -1);
  W.ANA_DANA = 90;

  grupa('Poruke i obavijesti');
  app.go('poruke'); await cekaj(200);
  var svih = W.DATA.poruke.length;
  ok('kanal prikazuje poruke', D.querySelectorAll('#screen-poruke .msg').length > 0);
  ok('poruke su grupirane po danu', D.querySelectorAll('#screen-poruke .msg-dan').length >= 1);
  app.porukeFilter('ljudi'); await cekaj(200);
  ok('filter "samo ljudi" skriva sistemske',
     Array.prototype.every.call(D.querySelectorAll('#screen-poruke .msg'), function(el){
       return !el.classList.contains('sustav'); }));
  app.porukeFilter('sustav'); await cekaj(200);
  ok('filter "samo sustav" prikazuje samo sistemske',
     D.querySelectorAll('#screen-poruke .msg').length > 0 &&
     Array.prototype.every.call(D.querySelectorAll('#screen-poruke .msg'), function(el){
       return el.classList.contains('sustav'); }));
  app.porukeFilter('sve'); await cekaj(200);
  var forma = D.querySelector('#screen-poruke form');
  forma.elements.tekst.value = 'TEST poruka iz testa';
  posalji(forma); await cekaj(250);
  jednako('poruka je dodana u kanal', W.DATA.poruke.length, svih + 1);
  ok('sistemski zapis o kvaru ima vezu na kvar',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.kvar_id; }));
  /* komentar na kvaru mora ostaviti kratak trag u zajedničkom kanalu */
  var porukaPrije = W.DATA.poruke.length;
  var neki = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k); })[0];
  app.detaljKvara(neki.id); await cekaj(120);
  var kf = D.querySelector('#modal-root form');
  kf.elements.tekst.value = 'TEST komentar za kanal';
  posalji(kf); await cekaj(250);
  jednako('komentar je stvorio zapis u kanalu', W.DATA.poruke.length, porukaPrije + 1);
  var zadnja = W.DATA.poruke[W.DATA.poruke.length - 1];
  ok('zapis je kratak i vodi na kvar', zadnja.kvar_id === neki.id && zadnja.tekst.length < 160);
  app.closeModal();
  ok('nepročitane se broje', typeof W.brojNeprocitanih() === 'number');

  grupa('Nabava');
  app.go('dijelovi'); await cekaj(150);
  ok('Dijelovi imaju ulaz u nabavu', D.querySelector('#screen-dijelovi').innerHTML.indexOf('Nabava') > -1);
  app.go('nabava'); await cekaj(200);
  ok('nabava prikazuje što treba naručiti',
     D.querySelector('#screen-nabava').textContent.indexOf('Za naručiti') > -1);
  var brNarudzbi = W.DATA.nabava.length;
  var kritican = W.DATA.dijelovi.filter(function(p){ return p.stanje < p.min; })[0];
  app.naruciDio(kritican.id); await cekaj(150);
  var nf = D.querySelector('#modal-root form');
  ok('narudžba predlaže količinu do dvostrukog minimuma',
     parseInt(nf.elements.kolicina.value,10) >= kritican.min);
  nf.elements.kolicina.value = '3';
  posalji(nf); await cekaj(250);
  jednako('narudžba je zabilježena', W.DATA.nabava.length, brNarudzbi + 1);
  var nova = W.DATA.nabava[W.DATA.nabava.length-1];
  /* "naručeno" se izvodi iz otvorene narudžbe — ne drži se drugi put na dijelu */
  ok('stanje "naručeno" se izvodi iz narudžbe, ne iz polja na dijelu',
     !!W.narudzbaZaDio(kritican.id) && W.dioPoId(kritican.id).naruceno === undefined);
  ok('zapis o narudžbi je u kanalu',
     W.DATA.poruke.some(function(p){ return p.tko==='Sustav' && p.tekst.indexOf('Naručeno') > -1; }));
  var stanjePrijePrimitka = W.dioPoId(kritican.id).stanje;
  var sp = W.prompt; W.prompt = function(){ return '3'; };
  await app.primiNabavu(nova.id); await cekaj(250);
  W.prompt = sp;
  jednako('primitak povećava stanje', W.dioPoId(kritican.id).stanje, stanjePrijePrimitka + 3);
  jednako('narudžba je zatvorena', nova.primljeno, W.todayISO());
  ok('oznaka "naručeno" nestaje s dijela nakon primitka', !W.narudzbaZaDio(kritican.id));
  ok('primljena narudžba više nije u dolasku',
     W.otvoreneNarudzbe().every(function(x){ return x.id !== nova.id; }));

  /* narudžba pokrenuta s ekrana Dijelovi mora završiti u Nabavi — ne kao gola oznaka */
  var kritican2 = W.DATA.dijelovi.filter(function(p){
    return p.stanje < p.min && !W.narudzbaZaDio(p.id); })[0];
  ok('postoji dio ispod minimuma bez narudžbe', !!kritican2);
  app.go('dijelovi'); await cekaj(150);
  ok('redak dijela nudi "Naruči", ne "Označi naručeno"',
     D.querySelector('#parts-list').innerHTML.indexOf('toggleNaruceno') === -1);
  var brPrijeD = W.DATA.nabava.length;
  app.naruciDio(kritican2.id); await cekaj(150);
  var nf2 = D.querySelector('#modal-root form');
  nf2.elements.kolicina.value = '2';
  posalji(nf2); await cekaj(250);
  jednako('narudžba s Dijelova je zabilježena u Nabavi', W.DATA.nabava.length, brPrijeD + 1);
  ok('dio je sada "u dolasku"', !!W.narudzbaZaDio(kritican2.id));
  ok('dio više nije na popisu "Za naručiti"',
     D.querySelector('#screen-nabava').innerHTML.indexOf('app.naruciDio(\''+kritican2.id+'\')') === -1);

  grupa('Iskustvo na stroju');
  app.openStroj('e1'); await cekaj(150);
  ok('kartica iskustva prikazuje ponovljene kvarove i rješenja',
     D.querySelector('#screen-stroj').textContent.indexOf('Iskustvo') > -1);

  grupa('IFS — stvarna polja, ne fiksni tekst');
  /* otpuštanje linije: ispisuje se samo ako ga je netko stvarno potvrdio */
  var zaIfs = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && k.m; })[0];
  app.rijesiKvar(zaIfs.id);
  var rf = D.querySelector('#modal-root form');
  ok('obrazac rješavanja ima kvačicu otpuštanja', !!rf.elements.otpusteno);
  rf.elements.otpusteno.checked = false;      /* namjerno NE potvrđujemo */
  posalji(rf); await cekaj(200);
  ok('kvar zatvoren bez kvačice nije označen kao otpušten', zaIfs.otpusteno === false);
  app.audit(90); await cekaj(120);
  var ifsTekst = D.querySelector('#modal-root').textContent;
  ok('zahvat je u odjeljku 2.', ifsTekst.indexOf(zaIfs.opis) > -1);
  /* redak o otpuštanju smije se pojaviti točno onoliko puta koliko ima potvrđenih zahvata */
  var t90 = W.isoShift(-90);
  var ocekivanoOtp = W.DATA.kvarovi.filter(function(k){
    return k.status==='rijesen' && k.date >= t90 && k.otpusteno; }).length;
  var stvarnoOtp = ifsTekst.split('otpuštanje linije').length - 1;
  jednako('otpuštanje se ispisuje samo za potvrđene zahvate', stvarnoOtp, ocekivanoOtp);
  ok('zahvat bez kvačice nije među njima', ocekivanoOtp < W.DATA.kvarovi.filter(function(k){
       return k.status==='rijesen' && k.date >= t90; }).length);
  app.closeModal();

  /* privremeni popravak s prošlim rokom mora doći u odjeljak 3. s oznakom KASNI */
  var zaPriv = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && k.m && !k.privremeni; })[0];
  app.urediKvar(zaPriv.id);
  var pf = D.querySelector('#modal-root form');
  ok('obrazac uređivanja ima privremeni popravak i rok', !!pf.elements.privremeni && !!pf.elements.rok_sanacije);
  pf.elements.privremeni.checked = true;
  pf.elements.rok_sanacije.value = W.isoShift(-3);   /* rok je prošao */
  posalji(pf); await cekaj(200);
  jednako('privremeni popravak je spremljen', zaPriv.privremeni, true);
  app.audit(90); await cekaj(120);
  var ifs2 = D.querySelector('#modal-root').textContent;
  ok('privremeni popravak je u odjeljku 3.', ifs2.indexOf('3. Privremeni popravci (') > -1 &&
     ifs2.indexOf(zaPriv.opis) > -1);
  ok('prekoračen rok sanacije nosi oznaku KASNI', ifs2.indexOf('KASNI') > -1);
  ok('fiksna rečenica "Nema aktivnih privremenih popravaka" je nestala',
     ifs2.indexOf('Nema aktivnih privremenih popravaka') === -1);
  app.closeModal();
  /* i natrag — kad se kvačica makne, odjeljak 3 je opet prazan */
  app.urediKvar(zaPriv.id);
  pf = D.querySelector('#modal-root form');
  pf.elements.privremeni.checked = false;
  posalji(pf); await cekaj(200);
  ok('gašenje kvačice briše i rok sanacije', zaPriv.privremeni === false && !zaPriv.rok_sanacije);

  grupa('Trajanje otvorenog kvara');
  var otvKv = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && k.m; })[0];
  otvKv.sati = 0;
  otvKv.poceo_at = new Date(Date.now() - 5*3600000).toISOString();   /* stoji 5 sati */
  ok('otvoren kvar prijavljuje koliko već traje', W.trajanjeKvara(otvKv).indexOf('traje već') === 0);
  ok('trajanje se ne prikazuje kao 0 h', W.trajanjeKvara(otvKv).indexOf('0 h') === -1);
  W.showScreen('kvarovi'); await cekaj(120);
  var kartica = D.querySelector('#screen-kvarovi').innerHTML;
  ok('kartica otvorenog kvara ne piše "Zastoj 0 h"', kartica.indexOf('Zastoj 0 h') === -1);
  ok('kartica otvorenog kvara piše "traje već"', kartica.indexOf('traje već') > -1);
  otvKv.poceo_at = null;
  ok('bez poceo_at trajanje se računa iz datuma prijave', W.trajanjeKvara(otvKv).indexOf('traje već') === 0);

  grupa('Poštena usporedba mjeseci');
  var danMj = new Date().getDate();
  /* prošli mjesec: jedan kvar u prvom danu, jedan na 28. — drugi NE smije ući u usporedbu
     ako je danas prije 28. */
  var pmD = new Date(); pmD.setDate(1); pmD.setMonth(pmD.getMonth()-1);
  var pmKey = pmD.getFullYear()+'-'+W.pad2(pmD.getMonth()+1);
  W.DATA.kvarovi.push({id:'kvPM1', m:'e1', date:pmKey+'-01', opis:'TEST prošli mjesec rano', sati:1,
                       status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo'});
  W.DATA.kvarovi.push({id:'kvPM2', m:'e1', date:pmKey+'-28', opis:'TEST prošli mjesec kasno', sati:10,
                       status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo'});
  W.showScreen('pregled'); await cekaj(150);
  var pregled = D.querySelector('#screen-pregled').textContent;
  ok('velika kartica kaže da mjesec još traje', pregled.indexOf('prvih '+danMj+' dana') > -1);
  if(danMj < 28){
    ok('usporedba se veže na isti broj dana', pregled.indexOf('vs prvih '+danMj+' dana') > -1);
    ok('kasniji dio prošlog mjeseca ne ulazi u usporedbu',
       pregled.indexOf('TEST prošli mjesec kasno') === -1);
  } else {
    ok('usporedba se veže na isti broj dana', pregled.indexOf('vs prvih '+danMj+' dana') > -1);
  }
  ok('graf označava tekući mjesec kao nepotpun',
     D.querySelector('#screen-pregled').innerHTML.indexOf('u tijeku') > -1);
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id!=='kvPM1' && k.id!=='kvPM2'; });

  grupa('Trenutno stoji');
  W.showScreen('pregled'); await cekaj(120);
  var stojiIma = D.querySelector('#screen-pregled').textContent.indexOf('Trenutno stoji') > -1;
  var imaPravihKvarova = W.DATA.kvarovi.some(function(k){ return W.jeOtvoren(k) && !k.upoz && k.m; });
  jednako('sekcija se prikazuje točno kad nešto stoji', stojiIma, imaPravihKvarova);
  ok('upozorenja se ne broje kao zastoj', (function(){
    var upoz = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && k.upoz; })[0];
    if(!upoz) return true;
    var html = D.querySelector('#screen-pregled').innerHTML;
    var od = html.indexOf('Trenutno stoji');
    if(od === -1) return true;
    return html.slice(od, html.indexOf('<h2', od+5)).indexOf(upoz.opis) === -1;
  })());

  grupa('Filtar "otvoreni + u radu"');
  W.SESSION = { ime:'Voditelj', role:'voditelj' };
  D.body.dataset.role = 'voditelj';
  app.resetFiltere();
  var brojNaKartici = W.samoKvarovi().filter(function(k){ return W.jeOtvoren(k); }).length;
  app.goKvaroviOtvoreni(); await cekaj(150);
  jednako('klik na karticu postavlja filtar "aktivni"', W.FILTER.status, 'aktivni');
  jednako('filtar vraća isti broj kao kartica',
     D.querySelectorAll('#screen-kvarovi .kvar-item').length,
     W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k); }).length);
  ok('kartica i filtar se slažu i po broju kvarova (bez zadataka)',
     W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && (k.tip||'kvar')==='kvar'; }).length === brojNaKartici);
  app.resetFiltere();

  grupa('Brze radnje i HITNO');
  var zaBrzo = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k); })[0];
  W.showScreen('kvarovi'); await cekaj(120);
  ok('kartica nudi dodjelu i "Čeka dio"',
     D.querySelector('#screen-kvarovi').innerHTML.indexOf('kvar-brzo') > -1);
  var cekaPrije = !!zaBrzo.ceka_dio;
  await app.brzoCekaDio(zaBrzo.id); await cekaj(150);
  jednako('"Čeka dio" se prebacuje s kartice', !!zaBrzo.ceka_dio, !cekaPrije);
  await app.brzoDodijeli(zaBrzo.id, 'Majstor 2'); await cekaj(150);
  jednako('dodjela s kartice je spremljena', zaBrzo.dodijeljen, 'Majstor 2');
  /* brza prijava: prekidač HITNO stvarno postavlja prioritet */
  app.brzaPrijava();
  var bf = D.querySelector('#modal-root form');
  ok('brza prijava ima prekidač HITNO', !!bf.elements.hitno);
  bf.elements.m.value = 'e1';
  bf.elements.opis.value = 'TEST hitna brza prijava';
  bf.elements.hitno.checked = true;
  posalji(bf); await cekaj(250);
  var hitniKvar = W.DATA.kvarovi.filter(function(k){ return k.opis==='TEST hitna brza prijava'; })[0];
  ok('hitan kvar iz brze prijave je spremljen kao hitan', !!hitniKvar && hitniKvar.prioritet==='hitno');
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k !== hitniKvar; });

  grupa('Peta uloga — proizvodnja (readonly)');
  ok('Proizvodnja je u ugrađenom popisu za prijavu',
     W.KORISNICI_DEMO.some(function(u){ return u.naziv==='Proizvodnja'; }));
  /* sa spojenom bazom popis dolazi iz prijava_popis i prepiše ugrađeni — demo ga mora vratiti,
     inače pločica ovisi o tome je li dohvat iz baze stigao prije ulaska u demo */
  W.KORISNICI = [{ naziv:'Netko iz baze', email:'x@y.local' }];
  W.app.demoUlaz(); await cekaj(150);
  ok('demo vraća ugrađeni popis, ne ostavlja popis iz baze',
     W.KORISNICI.some(function(u){ return u.naziv==='Proizvodnja'; }) &&
     !W.KORISNICI.some(function(u){ return u.naziv==='Netko iz baze'; }));
  ok('pločica Proizvodnja je iscrtana na prijavi',
     Array.prototype.some.call(D.querySelectorAll('#user-tiles .user-tile'),
       function(el){ return el.textContent === 'Proizvodnja'; }));
  W.SESSION = { ime:'Proizvodnja', role:'readonly' };
  D.body.dataset.role = 'readonly';
  W.showScreen('pregled'); await cekaj(120);
  ok('proizvodnja vidi Pregled', D.querySelector('#screen-pregled').innerHTML.length > 200);
  ok('proizvodnja nema nijedan gumb za unos', (function(){
    var ekrani = ['pregled','kvarovi','dijelovi','strojevi'];
    for(var i=0;i<ekrani.length;i++){
      W.showScreen(ekrani[i]);
      var pisi = D.querySelectorAll('#screen-'+ekrani[i]+' .role-write');
      for(var j=0;j<pisi.length;j++)
        if(W.getComputedStyle(pisi[j]).display !== 'none') return false;
    }
    return true;
  })());
  ok('proizvodnja ne vidi gumb Sustav',
     W.getComputedStyle(D.querySelector('.btn-audit.role-voditelj')).display === 'none');
  W.SESSION = { ime:'Voditelj', role:'voditelj' };
  D.body.dataset.role = 'voditelj';
  W.showScreen('pregled');

  grupa('Otpornost');
  W.DATA.kvarovi.push({id:'kvX', m:'nepostojeci', date:W.todayISO(), opis:'TEST siroče',
                       sati:1, status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo'});
  var palo = false;
  try{ ['pregled','kvarovi','strojevi','dijelovi','analitika','raspored','poruke','kontakti']
        .forEach(function(s){ W.showScreen(s); }); }
  catch(e){ palo = true; }
  ok('zapis s nepostojećim strojem ne ruši nijedan ekran', !palo);
  try{ app.audit(); app.closeModal(); }catch(e){ ok('IFS izvještaj preživi siroče', false, String(e)); }
  ok('IFS izvještaj preživi siroče', true);
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id !== 'kvX'; });
  W.showScreen('pregled');
}
</script>
</body>
</html>
