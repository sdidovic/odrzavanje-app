<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Održavanje — testovi</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;
  color:#1b2430;margin:0;padding:18px;font-size:15px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#5b6570;font-size:13px;margin-bottom:14px}
#sazetak{padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px}
.ok{background:#e8f3ec;color:#1e6f3d;border:1px solid #cbe3d3}
.fail{background:#fdeaea;color:#c0181c;border:1px solid #f3cbcb}
.run{background:#edecf7;color:#3a3285;border:1px solid #d5d2ef}
#rez{background:#fff;border:1px solid #e3e6eb;border-radius:10px;overflow:hidden}
.t{padding:8px 12px;border-bottom:1px solid #e3e6eb;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.t:last-child{border-bottom:none}
.t .z{flex-shrink:0;font-weight:700}
.t.p .z{color:#1e6f3d}.t.f .z{color:#c0181c}
.t .d{color:#c0181c;font-size:12px;margin-top:2px}
.grupa{background:#f0f1f5;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
  color:#5b6570;padding:7px 12px}
iframe{width:390px;height:700px;border:1px solid #e3e6eb;border-radius:10px;margin-top:16px;background:#fff}
</style>
</head>
<body>
<h1>Održavanje — automatski testovi</h1>
<div class="sub">Pokreće pravu aplikaciju u demo načinu i provjerava ključne tokove.
  Pokretati nakon svake izmjene: <code>python -m http.server</code> pa otvoriti ovu stranicu.</div>
<div id="sazetak" class="run">Pokretanje…</div>
<div id="rez"></div>
<iframe id="app" title="aplikacija pod testom"></iframe>

<script>
var REZ = [], GRUPA = '';
function grupa(n){ GRUPA = n; REZ.push({grupa:n}); }
function ok(naziv, uvjet, detalj){
  REZ.push({naziv:naziv, prosao:!!uvjet, detalj:uvjet?'':(detalj||'')});
}
function jednako(naziv, dobiveno, ocekivano){
  ok(naziv, dobiveno === ocekivano, 'dobiveno: '+JSON.stringify(dobiveno)+', očekivano: '+JSON.stringify(ocekivano));
}
function ispisi(){
  var pali = REZ.filter(function(r){ return r.naziv && !r.prosao; });
  var svi = REZ.filter(function(r){ return r.naziv; });
  var s = document.getElementById('sazetak');
  s.className = pali.length ? 'fail' : 'ok';
  s.textContent = pali.length
    ? ('PALO ' + pali.length + ' od ' + svi.length + ' testova')
    : ('SVE PROLAZI — ' + svi.length + ' testova');
  document.getElementById('rez').innerHTML = REZ.map(function(r){
    if(r.grupa) return '<div class="grupa">'+r.grupa+'</div>';
    return '<div class="t '+(r.prosao?'p':'f')+'"><span class="z">'+(r.prosao?'✓':'✕')+'</span>'+
      '<span>'+r.naziv+(r.detalj?'<div class="d">'+r.detalj+'</div>':'')+'</span></div>';
  }).join('');
}
function cekaj(ms){
  return new Promise(function(r){
    /* U pozadinskoj/sakrivenoj kartici preglednik prigušuje setTimeout i na minutu,
       pa se niz od 200 testova "smrzne". MessageChannel se ne prigušuje. */
    if(document.visibilityState === 'visible'){ setTimeout(r, ms); return; }
    var kraj = performance.now() + ms;
    var ch = new MessageChannel();
    ch.port1.onmessage = function(){ if(performance.now() >= kraj) r(); else ch.port2.postMessage(0); };
    ch.port2.postMessage(0);
  });
}
function posalji(form){ form.dispatchEvent(new Event('submit', {cancelable:true})); }

/* čekaj da se aplikacija u iframeu digne (radi i ako se učitala prije ove skripte) */
(async function pokreni(){
  var iframe = document.getElementById('app');
  /* uvijek svježa verzija — inače service worker servira staru iz cachea */
  iframe.src = 'index.html?test=' + Date.now();
  /* cekamo da se kod digne; DATA jos ne mora postojati — na objavljenoj verziji
     aplikacija prvo trazi prijavu, pa testove vrtimo kroz demo nacin */
  for(var i=0; i<100; i++){
    var W0 = iframe.contentWindow;
    if(W0 && W0.app && W0.buildSeed && typeof W0.app.demoUlaz === 'function') break;
    await cekaj(100);
  }
  var W = iframe.contentWindow, D = iframe.contentDocument;
  if(!W || !W.app || typeof W.app.demoUlaz !== 'function'){
    ok('Aplikacija se nije pokrenula u iframeu', false,
       'Otvori ovu stranicu preko http(s)://, ne preko file://');
    ispisi(); return;
  }
  /* testovi uvijek rade u demo nacinu — nikad ne diraju pravu bazu.
     Uvodni pomoc() modal (prikazuje se JEDNOM po uređaju) mora ostati isključen ovdje —
     inače prvi demoUlaz() otvori modal koji ništa u testovima ne zatvara. */
  try{ W.localStorage.setItem(W.UVOD_VIDEN_KEY, '1'); }catch(e){}
  W.app.demoUlaz();
  for(var j=0; j<50; j++){ if(W.DATA) break; await cekaj(100); }
  if(!W.DATA){ ok('Demo podaci se nisu ucitali', false, 'app.demoUlaz() nije postavio DATA'); ispisi(); return; }
  if(W.REMOTE){ ok('Testovi moraju raditi u demo nacinu', false, 'REMOTE je ostao true'); ispisi(); return; }
  try{ await testovi(W, D); }
  catch(e){ ok('Testovi su se srušili', false, String(e && e.stack || e)); }
  ispisi();
})();

async function testovi(W, D){
  var app = W.app;
  W.app.demoUlaz();
  await cekaj(120);
  /* determinizam: svaki run kreće od netaknutog seeda */
  try{ W.localStorage.removeItem(W.LS_KEY); }catch(e){}
  try{ W.localStorage.removeItem(W.ZADNJI_EKRAN_KEY); W.localStorage.removeItem(W.ZADNJI_FILTER_KEY); }catch(e){}
  W.FILTER = { stroj:'svi', status:'svi', majstor:'svi', od:'', do:'', q:'' };   /* moglo se učitati iz prošlog runa prije ovog čišćenja */
  W.DATA = W.buildSeedSFotkom();
  W.save();
  W.showScreen('pregled');
  await cekaj(60);

  grupa('Osnovni podaci i izračuni');
  ok('aplikacija se pokrenula u demo načinu', W.REMOTE === false);
  jednako('11 strojeva u šifrarniku', W.DATA.machines.length, 11);
  ok('27 kvarova + 3 zadatka u seedu', W.DATA.kvarovi.length === 30, 'ima ' + W.DATA.kvarovi.length);
  ok('svi kvarovi imaju stroj i opis', W.DATA.kvarovi.every(function(k){
     return (k.tip||'kvar')!=='kvar' || (k.m && k.opis); }));
  ok('svi kvarovi referenciraju postojeći stroj',
     W.DATA.kvarovi.every(function(k){ return !k.m || !!W.machineById(k.m); }));
  ok('preventiva referencira postojeći stroj',
     W.DATA.preventiva.every(function(p){ return !!W.machineById(p.m); }));
  jednako('trošak = sati × €/h (tunel 500)', W.kvarCost({m:'t1', sati:2}), 1000);
  jednako('trošak linije (350 €/h)', W.kvarCost({m:'e1', sati:3}), 1050);
  jednako('nepoznat stroj ne ruši izračun', W.kvarCost({m:'nema', sati:1}), 350);
  jednako('interval "svakih 30 dana" = 30', W.intervalDays('svakih 30 dana'), 30);
  jednako('interval "svakih 12 mjeseci" = 365', W.intervalDays('svakih 12 mjeseci'), 365);
  jednako('pomak datuma za godinu', W.addDaysISO('2026-08-13', 365), '2027-08-13');
  ok('kategorizacija po opisu radi', W.autoKat('puknuti remen') === 'Mehanički' &&
     W.autoKat('senzor temperature') === 'Električni' &&
     W.autoKat('pad tlaka kompresora') === 'Pneumatika i rashlada');
  ok('3 dijela ispod minimuma',
     W.DATA.dijelovi.filter(function(p){ return p.stanje < p.min; }).length === 3);

  grupa('Prijava kvara');
  app.go('kvarovi');
  var prije = W.DATA.kvarovi.length;
  app.noviKvar();
  var f = D.querySelector('#modal-root form');
  jednako('trajanje zastoja pri prijavi je zadano 0, ne nagađanje (audit-fix §14)', f.elements.sati.value, '0');
  f.elements.m.value = 'e1';
  f.elements.opis.value = 'TEST puknuti remen';
  f.elements.sati.value = '2';
  posalji(f); await cekaj(150);
  jednako('novi kvar je dodan', W.DATA.kvarovi.length, prije + 1);
  var novi = W.DATA.kvarovi[W.DATA.kvarovi.length - 1];
  jednako('automatska kategorija iz opisa', novi.kategorija, 'Mehanički');
  jednako('status je otvoren', novi.status, 'otvoren');
  ok('sistemski zapis o prijavi je nastao',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('TEST puknuti remen') > -1; }));

  grupa('Validacije');
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  f.elements.m.value = 'e1'; f.elements.opis.value = 'TEST nevaljano'; f.elements.sati.value = '999';
  var brojPrije = W.DATA.kvarovi.length;
  var stariAlert = W.alert; W.alert = function(){};
  posalji(f); await cekaj(120);
  W.alert = stariAlert;
  jednako('999 sati zastoja je odbijeno', W.DATA.kvarovi.length, brojPrije);
  app.closeModal();

  grupa('Rješavanje kvara i skladište');
  var dio = W.DATA.dijelovi.filter(function(p){ return p.naziv.indexOf('Remen HTD') === 0; })[0];
  var stanjePrije = dio.stanje;
  app.rijesiKvar(novi.id);
  f = D.querySelector('#modal-root form');
  f.elements.tko.value = 'Tehničar';
  f.elements.dio.value = dio.id;
  f.elements.kol.value = '1';
  posalji(f); await cekaj(150);
  jednako('kvar je riješen', novi.status, 'rijesen');
  jednako('skladište je razduženo', dio.stanje, stanjePrije - 1);
  ok('utrošeni dio je upisan u "zamijenjeno"', (novi.zam || '').indexOf('Remen HTD') > -1);

  grupa('Uređivanje i storno');
  app.urediKvar(novi.id);
  f = D.querySelector('#modal-root form');
  ok('riješen kvar se može uređivati', !!f && !!f.elements.sati);
  f.elements.sati.value = '5';
  posalji(f); await cekaj(150);
  jednako('ispravljeni sati su spremljeni', novi.sati, 5);
  /* storno je modal (PLAN-KAIZEN K-1), ne prompt() */
  app.stornirajKvar(novi.id); await cekaj(120);
  f = D.querySelector('#modal-root form');
  ok('storno je uredan modal s obveznim razlogom', !!f && !!f.elements.razlog);
  ok('storno upozorava kad je dio bio utrošen',
     D.querySelector('#modal-root').textContent.indexOf('utrošeni dio') > -1);
  f.elements.razlog.value = 'dupli unos';
  posalji(f); await cekaj(200);
  jednako('storno postavlja status', novi.status, 'otkazan');
  jednako('razlog storna je spremljen', novi.storno_razlog, 'dupli unos');
  ok('stornirani kvar ne ulazi u izračune',
     W.samoKvarovi().every(function(k){ return k.id !== novi.id; }));

  grupa('§16.7: Uredi kvar — "+ Dodatno" (D)');
  /* §16.4 P2 dovršetak: tehničaru je "Detaljno" maknuto s prijave — Uredi kvar mu ostaje
     jedini put do prioriteta, pa smije nuditi samo TRI stalna polja (Opis, Datum, Prioritet). */
  var zaDodatno = { id:'kvD1', m:'e1', date:W.todayISO(), opis:'TEST D dodatno', sati:0,
    status:'otvoren', upoz:false, tip:'kvar', kategorija:'Ostalo', prioritet:'normalno',
    created_at:new Date().toISOString() };
  W.DATA.kvarovi.push(zaDodatno);
  app.urediKvar(zaDodatno.id);
  var fD = D.querySelector('#modal-root form');
  var btnD = Array.prototype.filter.call(D.querySelectorAll('#modal-root button'),
    function(b){ return b.textContent.indexOf('+ Dodatno') > -1; })[0];
  ok('modal Uredi kvar ima gumb "+ Dodatno"', !!btnD);
  ok('prije klika na "+ Dodatno" Prioritet je vidljiv', !!fD.elements.prioritet && fD.elements.prioritet.offsetParent !== null);
  ok('prije klika na "+ Dodatno" Opis i Datum su vidljivi', fD.elements.opis.offsetParent !== null && fD.elements.date.offsetParent !== null);
  ok('prije klika na "+ Dodatno" Stroj/Dodijeljen su SAKRIVENI', fD.elements.m.offsetParent === null && fD.elements.dodijeljen.offsetParent === null);
  if(btnD) btnD.click();
  ok('nakon klika na "+ Dodatno" Stroj i Dodijeljen postaju vidljivi',
     fD.elements.m.offsetParent !== null && fD.elements.dodijeljen.offsetParent !== null);
  app.closeModal();

  grupa('§16.7: "Nije riješeno — vrati u rad" (E)');
  /* iz "Riješen" dosad je jedini izlaz bio Storniraj — a to briše zapis iz analitike/MTTR-a/
     CSV-a/IFS-a, iako se rad stvarno dogodio (popravak samo nije držao). */
  var zaVrati = { id:'kvE1', m:'e1', date:W.todayISO(), opis:'TEST E vrati u rad', sati:3.5,
    status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo', tko:'Tehničar', zam:'TEST remen',
    dodijeljen:null, closed_at:new Date().toISOString(), created_at:new Date().toISOString() };
  W.DATA.kvarovi.push(zaVrati);
  app.detaljKvara(zaVrati.id);
  ok('detalj riješenog kvara nudi gumb "Nije riješeno — vrati u rad"',
     D.querySelector('#modal-root').textContent.indexOf('Nije riješeno') > -1);
  app.closeModal();
  app.vratiURad(zaVrati.id);
  var fE = D.querySelector('#modal-root form');
  ok('vratiURad traži razlog (isti obrazac kao storno, ne prompt())', !!fE && !!fE.elements.razlog);
  fE.elements.razlog.value = 'popravak nije držao';
  posalji(fE); await cekaj(150);
  jednako('vratiURad vraća status (bez dodjele → otvoren)', zaVrati.status, 'otvoren');
  ok('vratiURad briše closed_at', !zaVrati.closed_at);
  jednako('sati ostaju netaknuti (rad je stvarno obavljen)', zaVrati.sati, 3.5);
  jednako('tko ostaje netaknut', zaVrati.tko, 'Tehničar');
  jednako('zamijenjeno ostaje netaknuto', zaVrati.zam, 'TEST remen');
  ok('razlog je upisan kao komentar na kvar',
     (W.DATA.komentari||[]).some(function(c){ return c.kvar_id===zaVrati.id && c.tekst.indexOf('popravak nije držao') > -1; }));
  ok('sistemski zapis (sysPoruka) je nastao', W.DATA.poruke.some(function(p){ return p.kvar_id===zaVrati.id; }));
  /* dodijeljen kvar vraća se u u_radu, ne u otvoren */
  zaVrati.status = 'rijesen'; zaVrati.dodijeljen = 'Tehničar'; zaVrati.closed_at = new Date().toISOString();
  app.vratiURad(zaVrati.id);
  fE = D.querySelector('#modal-root form');
  fE.elements.razlog.value = 'opet se pokvarilo';
  posalji(fE); await cekaj(150);
  jednako('uz postojeću dodjelu vraća u u_radu (ne otvoren)', zaVrati.status, 'u_radu');
  app.detaljKvara(zaVrati.id);
  ok('gumb "Nije riješeno" nestaje kad kvar više nije riješen',
     D.querySelector('#modal-root').textContent.indexOf('Nije riješeno') === -1);
  app.closeModal();
  W.DATA.komentari = (W.DATA.komentari||[]).filter(function(c){ return c.kvar_id !== 'kvE1'; });
  W.DATA.poruke = W.DATA.poruke.filter(function(p){ return p.kvar_id !== 'kvE1'; });

  grupa('§16.7: eskalacija na HITNO se javlja (F)');
  /* obavijest se dosad slala ISKLJUČIVO kad se promijeni dodijeljen — promjena prioriteta
     je tiho odlazila u bazu; kvar prijavljen bez kvačice pa eskaliran na hitno je prošao
     nezamijećen. */
  var zaHitno = { id:'kvF1', m:'e1', date:W.todayISO(), opis:'TEST F eskalacija', sati:0,
    status:'otvoren', upoz:false, tip:'kvar', kategorija:'Ostalo', prioritet:'normalno',
    created_at:new Date().toISOString() };
  W.DATA.kvarovi.push(zaHitno);
  var porukeBrPrijeF = W.DATA.poruke.length;
  app.urediKvar(zaHitno.id);
  var fF = D.querySelector('#modal-root form');
  fF.elements.prioritet.value = 'hitno';
  posalji(fF); await cekaj(150);
  jednako('prioritet je spremljen kao hitno', zaHitno.prioritet, 'hitno');
  var novePorukeF = W.DATA.poruke.slice(porukeBrPrijeF);
  ok('promjena prioriteta na hitno stvara sysPoruku koja sadrži "HITNO"',
     novePorukeF.some(function(p){ return p.kvar_id===zaHitno.id && p.tekst.indexOf('HITNO') > -1; }));
  var porukeBrPrijeF2 = W.DATA.poruke.length;
  app.urediKvar(zaHitno.id);
  posalji(D.querySelector('#modal-root form')); await cekaj(150);
  jednako('ponovno spremanje bez promjene (već hitno) ne šalje novu HITNO poruku',
     W.DATA.poruke.length, porukeBrPrijeF2);
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return ['kvD1','kvE1','kvF1'].indexOf(k.id) === -1; });
  W.DATA.poruke = W.DATA.poruke.filter(function(p){ return p.kvar_id !== 'kvF1'; });

  grupa('Filteri i pretraga');
  app.go('kvarovi');
  app.setFilter('status', 'otvoren');
  ok('filter otvorenih vraća samo otvorene (kvarove — zadaci su na Rasporedu)',
     D.querySelectorAll('#screen-kvarovi .kvar-item').length ===
     W.DATA.kvarovi.filter(function(k){ return k.status === 'otvoren' && (k.tip||'kvar')==='kvar'; }).length);
  app.setFilter('majstor', 'Tehničar');
  ok('filter po majstoru radi',
     Array.prototype.every.call(D.querySelectorAll('#screen-kvarovi .kvar-item'), function(el){
       return el.textContent.indexOf('Tehničar') > -1; }));
  app.resetFiltere();

  grupa('Zadaci — organizacija na Rasporedu, ne među kvarovima');
  /* seed ima zadatak, a Kvarovi ga NE smiju prikazati — to su prijave problema */
  ok('zadatak iz seeda se ne prikazuje na Kvarovi',
     D.querySelector('#screen-kvarovi').textContent.indexOf('Dogovoriti termin godišnjeg servisa') === -1);
  ok('brojka na kartici Kvarovi ne broji zadatke', (function(){
     var b = D.querySelector('#badge-kvarovi');
     var kvarova = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && (k.tip||'kvar')==='kvar'; }).length;
     return parseInt(b.textContent,10) === kvarova;
  })());
  /* detaljna prijava vise ne nudi vrstu — uvijek je kvar, sa strojem */
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  ok('detaljna prijava nema izbor vrste (uvijek kvar)', !f.elements.tip);
  app.closeModal();
  /* zadatak se stvara na Rasporedu */
  app.go('raspored'); await cekaj(150);
  var brZad = W.otvoreniZadaci().length;
  app.noviZadatak();
  f = D.querySelector('#modal-root form');
  f.elements.opis.value = 'TEST zadatak bez stroja';
  f.elements.rok.value = W.todayISO();
  posalji(f); await cekaj(200);
  var zad = W.DATA.kvarovi.filter(function(k){ return k.opis === 'TEST zadatak bez stroja'; })[0];
  ok('zadatak je spremljen bez stroja', !!zad && !zad.m && zad.tip==='zadatak');
  jednako('zadatak ima rok', zad.rok, W.todayISO());
  jednako('novi zadatak je na Rasporedu', W.otvoreniZadaci().length, brZad + 1);
  jednako('zadatak ne ulazi u trošak zastoja', W.samoKvarovi().filter(function(k){ return k.tip === 'zadatak'; }).length, 0);
  ok('zadatak se vidi u agendi Rasporeda',
     D.querySelector('#screen-raspored').textContent.indexOf('TEST zadatak bez stroja') > -1);
  /* kvacica obavlja zadatak izravno iz popisa */
  await app.obaviZadatak(zad.id); await cekaj(150);
  jednako('kvačica obavlja zadatak', zad.status, 'rijesen');
  /* SMJER-B (23.8.): obavljena današnja stavka VIŠE NE nestaje — ostaje u sekciji Danas,
     precrtana, na dnu (li-gotov) — korisnik mora vidjeti da je nešto stvarno napravljeno. */
  ok('obavljeni zadatak ostaje na Rasporedu, precrtan (li-gotov)', (function(){
     var r = D.querySelector('#screen-raspored .li.li-gotov[data-id="'+zad.id+'"]');
     return !!r && r.textContent.indexOf('TEST zadatak bez stroja') > -1;
  })());
  ok('zapis o obavljenom zadatku je u kanalu',
     W.DATA.poruke.some(function(p){ return p.tko==='Sustav' && p.tekst.indexOf('Zadatak obavljen') > -1; }));

  grupa('Zadaci v2 — veza s kvarom i kontaktom (F3)');
  var kvarZaZad = W.DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='kvar' && k.status!=='otkazan'; })[0];
  app.detaljKvara(kvarZaZad.id); await cekaj(120);
  ok('kvar nudi gumb "+ Zadatak iz ovog kvara"',
     D.querySelector('#modal-root').innerHTML.indexOf('+ Zadatak iz ovog kvara') > -1);
  app.noviZadatak(null, kvarZaZad.id); await cekaj(120);
  f = D.querySelector('#modal-root form');
  ok('obrazac iz kvara ima skrivenu vezu na kvar', f.elements.izvor_kvar.value === kvarZaZad.id);

  ok('sistemski zapis o utrošku dijela uz pregled',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('Utrošeno uz pregled') > -1 &&
       p.tekst.indexOf(dioB1.naziv) > -1 && p.tekst.indexOf('×2') > -1; }));

  grupa('SIM-FIX B1 — preventiva bez odabranog dijela ne dira skladište');
  var prevB1b = W.DATA.preventiva.filter(function(p){ return p.id !== prevB1.id; })[0];
  var porukeBrojPrije = W.DATA.poruke.length;
  app.obaviPreventivu(prevB1b.id);
  var fB1b = D.querySelector('#modal-root form');
  fB1b.elements.tko.value = 'Tehničar';
  posalji(fB1b); await cekaj(150);
  ok('bez odabira dijela nema dodatnog zapisa o utrošku',
     !W.DATA.poruke.slice(porukeBrojPrije).some(function(p){ return p.tekst.indexOf('Utrošeno uz pregled') > -1; }));

  grupa('SIM-FIX B3 — trag ručnog +/- na skladištu (debounce)');
  /* Debounce se oslanja na setTimeout u aplikaciji, a preglednik ga u POZADINSKOJ kartici
     prigušuje — fiksno čekanje zato čini test nepouzdanim. Čekamo uvjet, ne sat, i
     skraćujemo QTY_TRAG_MS gdje mjerimo ishod (ne trajanje). */
  function tragova(dio){
    return W.DATA.poruke.filter(function(p){
      return p.tekst.indexOf('Ispravak stanja') > -1 && p.tekst.indexOf(dio.naziv) > -1; }).length;
  }
  async function cekajDok(uvjet, maxMs){
    var kraj = Date.now() + (maxMs||20000);
    while(Date.now() < kraj){ if(uvjet()) return true; await cekaj(100); }
    return uvjet();
  }
  W.SESSION = { ime:'Tehničar', role:'majstor' };

  /* 1) ne šalje se po dodiru — tvrdnja o IZOSTANKU, sigurna i uz prigušene tajmere */
  var dioB3 = W.DATA.dijelovi[1] || W.DATA.dijelovi[0];
  var stanjeB3Prije = dioB3.stanje;
  await app.qty(dioB3.id, 1);
  await cekaj(150);
  ok('poruka o ispravku stanja se ne šalje odmah (čeka debounce)', tragova(dioB3) === 0);

  /* 2) serija dodira → točno jedna poruka, s prije → poslije i imenom */
  W.QTY_TRAG_MS = 0;                      /* mjerimo ishod, ne trajanje */
  await app.qty(dioB3.id, 1);             /* ukupno +2 od početnog stanja */
  await cekajDok(function(){ return tragova(dioB3) > 0; });
  jednako('serija brzih dodira daje jednu poruku (ne po dodiru)', tragova(dioB3), 1);
  jednako('stanje nakon dva +1', dioB3.stanje, stanjeB3Prije + 2);
  ok('poruka nosi prije → poslije i ime iz SESSION',
     W.DATA.poruke.some(function(p){ return p.tekst.indexOf('Ispravak stanja') > -1 && p.tekst.indexOf(dioB3.naziv) > -1 &&
       p.tekst.indexOf(String(stanjeB3Prije)+' → '+String(stanjeB3Prije+2)) > -1 && p.tekst.indexOf('Tehničar') > -1; }));

  /* 3) neto nula ne ostavlja trag. Da razlikujemo "još nije" od "nikad", pustimo poslije
     njega kontrolni dodir na drugom dijelu: kad stigne NJEGOVA poruka, prošao je i raniji tajmer. */
  var dioB3b = W.DATA.dijelovi[2] || W.DATA.dijelovi[0];
  var stanjeB3bPrije = dioB3b.stanje;
  await app.qty(dioB3b.id, 1);
  await app.qty(dioB3b.id, -1);
  var dioB3c = W.DATA.dijelovi[3] || W.DATA.dijelovi[0];
  await app.qty(dioB3c.id, 1);
  await cekajDok(function(){ return tragova(dioB3c) > 0; });
  jednako('neto promjena +1-1 vraća stanje na isto', dioB3b.stanje, stanjeB3bPrije);
  ok('bez neto promjene (prije===poslije) ne šalje se poruka', tragova(dioB3b) === 0);
  W.QTY_TRAG_MS = 1500;                   /* vrati zadano da ne curi u druge testove */

  grupa('SIM-FIX — vrijeme u lokalnoj zoni');
  /* Supabase vraća timestamptz kao UTC ("...+00:00"/"...Z") — dosad se prikaz
     samo REZAO iz stringa pa je satnica bila UTC, ne hrvatska. localDT to
     ispravlja SAMO za prikaz; usporedbe/sortiranja i dalje rade nad sirovim
     stringom (ostaju netaknute — konzistentne su same sa sobom). */
  ok('localDT postoji', typeof W.localDT === 'function');

  var utcISO = '2026-08-22T09:29:07+00:00';
  var refD = new Date(utcISO);
  var ocekT = W.pad2(refD.getHours())+':'+W.pad2(refD.getMinutes());
  var ocekD = refD.getFullYear()+'-'+W.pad2(refD.getMonth()+1)+'-'+W.pad2(refD.getDate());
  var lt1 = W.localDT(utcISO);
  /* NE upisujemo tvrdo "11:29" — offset ovisi o vremenskoj zoni stroja koji vrti teste */
  jednako('localDT pretvara UTC vrijeme u lokalni sat (iz getHours, ne tvrdi offset)', lt1.t, ocekT);
  jednako('localDT pretvara UTC vrijeme u lokalni dan', lt1.d, ocekD);

  var lt2 = W.localDT('2026-08-21T09:10:00');
  jednako('localDT ne dira naivan zapis bez zone (demo/seed) — vrijeme ostaje isto', lt2.t, '09:10');
  jednako('localDT ne dira naivan zapis bez zone (demo/seed) — dan ostaje isti', lt2.d, '2026-08-21');

  ok('localDT na praznom stringu ne ruši prikaz', JSON.stringify(W.localDT('')) === JSON.stringify({d:'',t:''}));
  ok('localDT na besmislenom stringu ne ruši prikaz', JSON.stringify(W.localDT('ovo nije datum')) === JSON.stringify({d:'',t:''}));

  /* poruka poslana u UTC-u oko ponoći mora se grupirati pod SVOJ lokalni dan,
     ne pod UTC dan iz baze — inače naslov dana "kasni" ili "žuri" sat-dva */
  app.go('poruke'); await cekaj(150);
  var pomocniISO = '2026-01-15T23:30:00Z';
  var refPom = new Date(pomocniISO);
  var ocekPomD = refPom.getFullYear()+'-'+W.pad2(refPom.getMonth()+1)+'-'+W.pad2(refPom.getDate());
  W.DATA.poruke.push({id:'poTESTponoc', tko:'Sustav', tekst:'TEST poruka oko ponoći', kvar_id:null, created_at:pomocniISO});
  await W.renderPoruke(); await cekaj(100);
  var danHeaders = Array.from(D.querySelectorAll('#screen-poruke .msg-dan')).map(function(e){ return e.textContent; });
  ok('poruka oko ponoći (UTC) grupirana je pod svoj lokalni dan',
     danHeaders.indexOf(W.fmtDate(ocekPomD)) > -1,
     'naslovi dana: ' + JSON.stringify(danHeaders) + ', očekivan: ' + W.fmtDate(ocekPomD));
  W.DATA.poruke = W.DATA.poruke.filter(function(p){ return p.id !== 'poTESTponoc'; });
  await W.renderPoruke(); await cekaj(100);

  grupa('§16.7: danSazetak uspoređuje lokalni dan, ne UTC (C)');
  /* closed_at je UTC iz baze; todayISO() je LOKALNI datum — usporedba sirovih stringova
     (String(closed_at).slice(0,10)!==iso) krivo broji "odrađeno danas" u rubnim satima kad
     lokalna ponoć još nije UTC ponoć (ili obrnuto). localDT(ts).d mora se koristiti umjesto. */
  var isoC = W.todayISO();
  var closedUtcC = new Date(isoC+'T00:20:00').toISOString();   /* lokalno rano jutros danas */
  ok('test je stvarno rubni slučaj (UTC dan kalendarski različit od lokalnog)',
     closedUtcC.slice(0,10) !== isoC, 'closed_at (UTC): '+closedUtcC+', lokalni dan: '+isoC);
  var zadC = { id:'kvC1', m:null, date:isoC, opis:'TEST C UTC rub', sati:0,
    status:'rijesen', upoz:false, tip:'zadatak', kategorija:'Ostalo', tko:'Tehničar',
    closed_at: closedUtcC };
  W.DATA.kvarovi.push(zadC);
  var szC = W.danSazetak(isoC);
  ok('kvar zatvoren u UTC vremenu koje lokalno pada na drugi dan broji se pod lokalni dan (C)',
     szC.gotove.some(function(g){ return g.item && g.item.id === 'kvC1'; }));
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id !== 'kvC1'; });

  grupa('Otpornost');
  W.DATA.kvarovi.push({id:'kvX', m:'nepostojeci', date:W.todayISO(), opis:'TEST siroče',
                       sati:1, status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo'});
  var palo = false;
  try{ ['pregled','kvarovi','strojevi','dijelovi','analitika','raspored','poruke','kontakti']
        .forEach(function(s){ W.showScreen(s); }); }
  catch(e){ palo = true; }
  ok('zapis s nepostojećim strojem ne ruši nijedan ekran', !palo);
  try{ app.audit(); app.closeModal(); }catch(e){ ok('IFS izvještaj preživi siroče', false, String(e)); }
  ok('IFS izvještaj preživi siroče', true);
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id !== 'kvX'; });
  W.showScreen('pregled');

  grupa('SMJER-B ljuska');
  D.body.dataset.role = 'voditelj'; W.SESSION = { ime:'Voditelj', role:'voditelj' };
  app.go('kvarovi'); await cekaj(80);
  ok('naslov headera prati ekran — Kvarovi', D.querySelector('.hdr-brand h1').textContent === 'Kvarovi');
  ok('badge na Kvarovima sadrži broj otvorenih', (function(){
    var b = D.getElementById('hdr-badges');
    if(!b) return false;
    var n = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && (k.tip||'kvar')==='kvar'; }).length;
    return b.textContent.indexOf(String(n)) > -1;
  })());
  ok('na Kvarovima više nema gumba s tekstom "Brza prijava" u tijelu ekrana', (function(){
    var el = Array.prototype.filter.call(D.querySelectorAll('#screen-kvarovi button, #screen-kvarovi a'),
      function(x){ return /Brza prijava/.test(x.textContent); })[0];
    return !el;
  })());
  ok('#fab postoji i vidljiv na Kvarovi', (function(){
    var f = D.getElementById('fab');
    return !!f && W.getComputedStyle(f).display !== 'none';
  })());
  app.go('poruke'); await cekaj(80);
  ok('#fab skriven na Poruke', W.getComputedStyle(D.getElementById('fab')).display === 'none');
  app.go('kvarovi'); await cekaj(80);
  app.noviKvar(); await cekaj(80);
  ok('#fab skriven dok je modal otvoren', W.getComputedStyle(D.getElementById('fab')).display === 'none');
  app.closeModal(); await cekaj(80);
  ok('#fab se vrati kad se modal zatvori', W.getComputedStyle(D.getElementById('fab')).display !== 'none');
  app.demoUloga('Tehničar'); await cekaj(100);
  ok('naslov headera na Rasporedu za majstora sadrži njegovo ime', D.querySelector('.hdr-brand h1').textContent.indexOf('Tehničar') > -1);
  app.demoUloga('Direktor'); await cekaj(100);
  app.go('kvarovi'); await cekaj(80);
  ok('za ulogu readonly (Direktor) #fab je skriven', W.getComputedStyle(D.getElementById('fab')).display === 'none');
  app.demoUloga('Voditelj'); await cekaj(100);
  D.body.dataset.role = 'voditelj';

  grupa('SMJER-B Detalj (ZADATAK 4/5) — novi oblik detaljKvara');
  W.SESSION = { ime:'Voditelj', role:'voditelj' }; D.body.dataset.role = 'voditelj';
  var otvSmjB = W.DATA.kvarovi.filter(function(k){ return k.status==='otvoren' && (k.tip||'kvar')==='kvar'; })[0];
  app.detaljKvara(otvSmjB.id); await cekaj(100);
  ok('otvoren kvar ima primarnu radnju "Preuzimam…"', (function(){
     var b = D.querySelector('#modal-root .act.prim');
     return !!b && b.textContent.indexOf('Preuzimam') > -1;
  })());
  ok('meta mreža sadrži "Traje"', D.querySelector('#modal-root .meta').textContent.indexOf('Traje') > -1);
  app.closeModal();

  var uRaduSmjB = W.DATA.kvarovi.filter(function(k){ return k.status==='u_radu' && (k.tip||'kvar')==='kvar'; })[0];
  if(uRaduSmjB){
    app.detaljKvara(uRaduSmjB.id); await cekaj(100);
    ok('preuzet (u radu) kvar ima primarnu radnju "Riješi kvar"', (function(){
       var b = D.querySelector('#modal-root .act.prim');
       return !!b && b.textContent.indexOf('Riješi kvar') > -1;
    })());
    app.closeModal();
  }

  W.SESSION = { ime:'Vod. proizvodnje', role:'proizvodnja' }; D.body.dataset.role = 'proizvodnja';
  app.detaljKvara(otvSmjB.id); await cekaj(100);
  ok('proizvodnja ne vidi "Trošak" u detalju kvara', D.querySelector('#modal-root .meta').textContent.indexOf('Trošak') === -1);
  app.closeModal();
  W.SESSION = { ime:'Voditelj', role:'voditelj' }; D.body.dataset.role = 'voditelj';

  var rijesenSmjB = W.DATA.kvarovi.filter(function(k){ return k.status==='rijesen' && (k.tip||'kvar')==='kvar'; })[0];
  var rijesenSmjBTest = false;
  if(!rijesenSmjB){
    rijesenSmjB = { id:'smjBrij'+Date.now(), m:W.DATA.machines[0].id, date:W.todayISO(), opis:'TEST riješen za SMJER-B',
      sati:1, status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo', dodijeljen:'Tehničar', tko:'Tehničar',
      ceka_dio:false, ceka_servis:false, prioritet:'normalno', otpusteno:false, privremeni:false, rok_sanacije:null };
    W.DATA.kvarovi.push(rijesenSmjB); rijesenSmjBTest = true;
  }
  app.detaljKvara(rijesenSmjB.id); await cekaj(100);
  ok('riješen kvar ima "Nije riješeno — vrati u rad"',
     D.querySelector('#modal-root').textContent.indexOf('Nije riješeno — vrati u rad') > -1);
  ok('riješen kvar nema "+ Ugrađen dio"', D.querySelector('#modal-root').textContent.indexOf('Ugrađen dio') === -1);
  app.closeModal();
  if(rijesenSmjBTest) W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id !== rijesenSmjB.id; });

  /* Tijek: kronologija sysPoruka vezanih uz kvar — koristi kvar koji sigurno ima poruku (prijava) */
  var kvarSaPorukom = W.DATA.kvarovi.filter(function(k){
    return (k.tip||'kvar')==='kvar' && k.status!=='otkazan' &&
      W.DATA.poruke.some(function(p){ return p.kvar_id===k.id; });
  })[0];
  if(kvarSaPorukom){
    var porukaOcekivana = W.DATA.poruke.filter(function(p){ return p.kvar_id===kvarSaPorukom.id; })[0];
    app.detaljKvara(kvarSaPorukom.id); await cekaj(100);
    ok('sekcija "Tijek" sadrži tekst sysPoruke tog kvara', (function(){
       var m = D.querySelector('#modal-root');
       if(!m || m.textContent.indexOf('Tijek') === -1) return false;
       var jezgra = porukaOcekivana.tekst.replace(/^[^\wČĆŽŠĐčćžšđ]+\s*/u,'').slice(0,20);
       return m.textContent.indexOf(jezgra) > -1;
    })());
    app.closeModal();
  }

  var zadSmjB = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && (k.tip||'kvar')==='zadatak'; })[0];
  if(zadSmjB){
    app.detaljKvara(zadSmjB.id); await cekaj(100);
    ok('zadatak ima "Označi obavljeno"', D.querySelector('#modal-root').textContent.indexOf('Označi obavljeno') > -1);
    ok('zadatak nema "Ugrađen dio"', D.querySelector('#modal-root').textContent.indexOf('Ugrađen dio') === -1);
    app.closeModal();
  }

  grupa('SMJER-B Prijava');
  W.SESSION = { ime:'Tehničar', role:'majstor' }; D.body.dataset.role = 'majstor';
  app.brzaPrijava(); await cekaj(100);
  ok('modal brze prijave nosi klasu .sheet (donji list)',
     !!D.querySelector('#modal-root .modal.sheet'));
  var selStroj = D.querySelector('#modal-root form select[name="m"]');
  ok('select stroja ima prvu opciju "— odaberi stroj —"',
     !!selStroj && selStroj.options[0].textContent === '— odaberi stroj —');
  var cipoviB = D.querySelectorAll('#modal-root textarea[name="opis"] ~ div button.btn-mini');
  ok('čipovi simptoma postoje uz textarea', cipoviB.length >= 4);
  app.dodajBrziOpis('buka');
  jednako('klik na čip upisuje tekst u textarea (postojeće ponašanje)',
     D.getElementById('brza-opis').value, 'buka');
  var hitnoLbl = D.querySelector('#modal-root label.hitno-prekidac');
  var hitnoChk = hitnoLbl ? hitnoLbl.querySelector('input[name="hitno"]') : null;
  ok('checkbox HITNO je unutar labela koji pokriva cijeli crveni blok', !!hitnoLbl && !!hitnoChk);
  var naslovHitno = hitnoLbl ? hitnoLbl.querySelector('.h-t') : null;
  ok('naslov "HITNO — stoji linija" je unutar tog istog labela',
     !!naslovHitno && naslovHitno.textContent.indexOf('HITNO') > -1);
  if(hitnoChk && naslovHitno){
    var prijeChk = hitnoChk.checked;
    naslovHitno.click();
    jednako('dodir na naslov (unutar labela) mijenja checked', hitnoChk.checked, !prijeChk);
    naslovHitno.click();   /* vrati kako je bilo */
  }
  var bB = D.querySelector('#modal-root form');
  bB.elements.m.value = 'e1';
  bB.elements.opis.value = 'TEST SMJER-B hitna prijava sheet';
  bB.elements.hitno.checked = true;
  posalji(bB); await cekaj(250);
  var kvSmjB = W.DATA.kvarovi.filter(function(k){ return k.opis==='TEST SMJER-B hitna prijava sheet'; })[0];
  ok('spremanje s hitno=true daje prioritet "hitno"', !!kvSmjB && kvSmjB.prioritet==='hitno');
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k !== kvSmjB; });

  grupa('SUSTAV — tokeni (KORAK 2: tipografija/razmaci/boje)');
  try{
    var izvor = await (await fetch('index.html?tok=' + Date.now())).text();
    var TOKENI = ['--t-tab','--t-label','--t-sub','--t-meta','--t-body','--t-title','--t-stat','--t-hero'];
    var rootMatch = izvor.match(/:root\{[\s\S]*?\n\}/);
    var rootBlok = rootMatch ? rootMatch[0] : '';
    TOKENI.forEach(function(t){
      ok('token '+t+' definiran u :root', rootBlok.indexOf(t+':') !== -1);
    });
    /* (b) nema font-size:NNpx literala izvan @media print — dopuštene iznimke: nema ih (0) */
    var styleMatch = izvor.match(/<style>[\s\S]*?<\/style>/);
    var styleBlok = styleMatch ? styleMatch[0] : '';
    var printOvi = styleBlok.match(/@media print\{[\s\S]*?\n  \}\n/g) || [];
    var bezPrinta = styleBlok;
    printOvi.forEach(function(p){ bezPrinta = bezPrinta.replace(p, ''); });
    var literaliStyle = (bezPrinta.match(/font-size\s*:\s*[\d.]+px/g) || []);
    var literaliCijeli = (izvor.match(/font-size\s*:\s*[\d.]+px/g) || []);
    /* dopušteno najviše 5 iznimaka ukupno u cijeloj datoteci (nema poznatih iznimaka trenutno) */
    ok('font-size literali izvan @media print (<=5 iznimaka): ' + literaliCijeli.length,
       literaliCijeli.length <= 5, 'literali: ' + literaliCijeli.join(', '));
    /* (c) svaki var(--x) u datoteci ima definiciju u :root */
    var definirani = {};
    (rootBlok.match(/--[a-zA-Z0-9-]+(?=\s*:)/g) || []).forEach(function(d){ definirani[d] = true; });
    var koristeni = izvor.match(/var\(--[a-zA-Z0-9-]+\)/g) || [];
    var nedostaju = [];
    koristeni.forEach(function(v){
      var ime = v.slice(4, -1);
      if(!definirani[ime] && nedostaju.indexOf(ime) === -1) nedostaju.push(ime);
    });
    ok('svaki var(--…) ima definiciju u :root', nedostaju.length === 0, 'nedostaje: ' + nedostaju.join(', '));
  }catch(e){
    ok('SUSTAV — tokeni provjera nije mogla dohvatiti index.html', false, String(e));
  }
}
</script>
