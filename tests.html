<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Održavanje — testovi</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;
  color:#1b2430;margin:0;padding:18px;font-size:15px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#5b6570;font-size:13px;margin-bottom:14px}
#sazetak{padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px}
.ok{background:#e8f3ec;color:#1e6f3d;border:1px solid #cbe3d3}
.fail{background:#fdeaea;color:#c0181c;border:1px solid #f3cbcb}
.run{background:#edecf7;color:#3a3285;border:1px solid #d5d2ef}
#rez{background:#fff;border:1px solid #e3e6eb;border-radius:10px;overflow:hidden}
.t{padding:8px 12px;border-bottom:1px solid #e3e6eb;font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.t:last-child{border-bottom:none}
.t .z{flex-shrink:0;font-weight:700}
.t.p .z{color:#1e6f3d}.t.f .z{color:#c0181c}
.t .d{color:#c0181c;font-size:12px;margin-top:2px}
.grupa{background:#f0f1f5;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
  color:#5b6570;padding:7px 12px}
iframe{width:390px;height:700px;border:1px solid #e3e6eb;border-radius:10px;margin-top:16px;background:#fff}
</style>
</head>
<body>
<h1>Održavanje — automatski testovi</h1>
<div class="sub">Pokreće pravu aplikaciju u demo načinu i provjerava ključne tokove.
  Pokretati nakon svake izmjene: <code>python -m http.server</code> pa otvoriti ovu stranicu.</div>
<div id="sazetak" class="run">Pokretanje…</div>
<div id="rez"></div>
<iframe id="app" title="aplikacija pod testom"></iframe>

<script>
var REZ = [], GRUPA = '';
function grupa(n){ GRUPA = n; REZ.push({grupa:n}); }
function ok(naziv, uvjet, detalj){
  REZ.push({naziv:naziv, prosao:!!uvjet, detalj:uvjet?'':(detalj||'')});
}
function jednako(naziv, dobiveno, ocekivano){
  ok(naziv, dobiveno === ocekivano, 'dobiveno: '+JSON.stringify(dobiveno)+', očekivano: '+JSON.stringify(ocekivano));
}
function ispisi(){
  var pali = REZ.filter(function(r){ return r.naziv && !r.prosao; });
  var svi = REZ.filter(function(r){ return r.naziv; });
  var s = document.getElementById('sazetak');
  s.className = pali.length ? 'fail' : 'ok';
  s.textContent = pali.length
    ? ('PALO ' + pali.length + ' od ' + svi.length + ' testova')
    : ('SVE PROLAZI — ' + svi.length + ' testova');
  document.getElementById('rez').innerHTML = REZ.map(function(r){
    if(r.grupa) return '<div class="grupa">'+r.grupa+'</div>';
    return '<div class="t '+(r.prosao?'p':'f')+'"><span class="z">'+(r.prosao?'✓':'✕')+'</span>'+
      '<span>'+r.naziv+(r.detalj?'<div class="d">'+r.detalj+'</div>':'')+'</span></div>';
  }).join('');
}
function cekaj(ms){
  return new Promise(function(r){
    /* U pozadinskoj/sakrivenoj kartici preglednik prigušuje setTimeout i na minutu,
       pa se niz od 200 testova "smrzne". MessageChannel se ne prigušuje. */
    if(document.visibilityState === 'visible'){ setTimeout(r, ms); return; }
    var kraj = performance.now() + ms;
    var ch = new MessageChannel();
    ch.port1.onmessage = function(){ if(performance.now() >= kraj) r(); else ch.port2.postMessage(0); };
    ch.port2.postMessage(0);
  });
}
function posalji(form){ form.dispatchEvent(new Event('submit', {cancelable:true})); }

/* čekaj da se aplikacija u iframeu digne (radi i ako se učitala prije ove skripte) */
(async function pokreni(){
  var iframe = document.getElementById('app');
  /* uvijek svježa verzija — inače service worker servira staru iz cachea */
  iframe.src = 'index.html?test=' + Date.now();
  /* cekamo da se kod digne; DATA jos ne mora postojati — na objavljenoj verziji
     aplikacija prvo trazi prijavu, pa testove vrtimo kroz demo nacin */
  for(var i=0; i<100; i++){
    var W0 = iframe.contentWindow;
    if(W0 && W0.app && W0.buildSeed && typeof W0.app.demoUlaz === 'function') break;
    await cekaj(100);
  }
  var W = iframe.contentWindow, D = iframe.contentDocument;
  if(!W || !W.app || typeof W.app.demoUlaz !== 'function'){
    ok('Aplikacija se nije pokrenula u iframeu', false,
       'Otvori ovu stranicu preko http(s)://, ne preko file://');
    ispisi(); return;
  }
  /* testovi uvijek rade u demo nacinu — nikad ne diraju pravu bazu */
  W.app.demoUlaz();
  for(var j=0; j<50; j++){ if(W.DATA) break; await cekaj(100); }
  if(!W.DATA){ ok('Demo podaci se nisu ucitali', false, 'app.demoUlaz() nije postavio DATA'); ispisi(); return; }
  if(W.REMOTE){ ok('Testovi moraju raditi u demo nacinu', false, 'REMOTE je ostao true'); ispisi(); return; }
  try{ await testovi(W, D); }
  catch(e){ ok('Testovi su se srušili', false, String(e && e.stack || e)); }
  ispisi();
})();

async function testovi(W, D){
  var app = W.app;
  W.app.demoUlaz();
  await cekaj(120);
  /* determinizam: svaki run kreće od netaknutog seeda */
  try{ W.localStorage.removeItem(W.LS_KEY); }catch(e){}
  try{ W.localStorage.removeItem(W.ZADNJI_EKRAN_KEY); W.localStorage.removeItem(W.ZADNJI_FILTER_KEY); }catch(e){}
  W.FILTER = { stroj:'svi', status:'svi', majstor:'svi', od:'', do:'', q:'' };   /* moglo se učitati iz prošlog runa prije ovog čišćenja */
  W.DATA = W.buildSeedSFotkom();
  W.save();
  W.showScreen('pregled');
  await cekaj(60);

  grupa('Osnovni podaci i izračuni');
  ok('aplikacija se pokrenula u demo načinu', W.REMOTE === false);
  jednako('11 strojeva u šifrarniku', W.DATA.machines.length, 11);
  ok('27 kvarova + 1 zadatak u seedu', W.DATA.kvarovi.length === 28, 'ima ' + W.DATA.kvarovi.length);
  ok('svi kvarovi imaju stroj i opis', W.DATA.kvarovi.every(function(k){
     return (k.tip||'kvar')!=='kvar' || (k.m && k.opis); }));
  ok('svi kvarovi referenciraju postojeći stroj',
     W.DATA.kvarovi.every(function(k){ return !k.m || !!W.machineById(k.m); }));
  ok('preventiva referencira postojeći stroj',
     W.DATA.preventiva.every(function(p){ return !!W.machineById(p.m); }));
  jednako('trošak = sati × €/h (tunel 500)', W.kvarCost({m:'t1', sati:2}), 1000);
  jednako('trošak linije (350 €/h)', W.kvarCost({m:'e1', sati:3}), 1050);
  jednako('nepoznat stroj ne ruši izračun', W.kvarCost({m:'nema', sati:1}), 350);
  jednako('interval "svakih 30 dana" = 30', W.intervalDays('svakih 30 dana'), 30);
  jednako('interval "svakih 12 mjeseci" = 365', W.intervalDays('svakih 12 mjeseci'), 365);
  jednako('pomak datuma za godinu', W.addDaysISO('2026-08-13', 365), '2027-08-13');
  ok('kategorizacija po opisu radi', W.autoKat('puknuti remen') === 'Mehanički' &&
     W.autoKat('senzor temperature') === 'Električni' &&
     W.autoKat('pad tlaka kompresora') === 'Pneumatika i rashlada');
  ok('3 dijela ispod minimuma',
     W.DATA.dijelovi.filter(function(p){ return p.stanje < p.min; }).length === 3);

  grupa('Prijava kvara');
  app.go('kvarovi');
  var prije = W.DATA.kvarovi.length;
  app.noviKvar();
  var f = D.querySelector('#modal-root form');
  f.elements.m.value = 'e1';
  f.elements.opis.value = 'TEST puknuti remen';
  f.elements.sati.value = '2';
  posalji(f); await cekaj(150);
  jednako('novi kvar je dodan', W.DATA.kvarovi.length, prije + 1);
  var novi = W.DATA.kvarovi[W.DATA.kvarovi.length - 1];
  jednako('automatska kategorija iz opisa', novi.kategorija, 'Mehanički');
  jednako('status je otvoren', novi.status, 'otvoren');
  ok('sistemski zapis o prijavi je nastao',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('TEST puknuti remen') > -1; }));

  grupa('Validacije');
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  f.elements.m.value = 'e1'; f.elements.opis.value = 'TEST nevaljano'; f.elements.sati.value = '999';
  var brojPrije = W.DATA.kvarovi.length;
  var stariAlert = W.alert; W.alert = function(){};
  posalji(f); await cekaj(120);
  W.alert = stariAlert;
  jednako('999 sati zastoja je odbijeno', W.DATA.kvarovi.length, brojPrije);
  app.closeModal();

  grupa('Rješavanje kvara i skladište');
  var dio = W.DATA.dijelovi.filter(function(p){ return p.naziv.indexOf('Remen HTD') === 0; })[0];
  var stanjePrije = dio.stanje;
  app.rijesiKvar(novi.id);
  f = D.querySelector('#modal-root form');
  f.elements.tko.value = 'Majstor 1';
  f.elements.dio.value = dio.id;
  f.elements.kol.value = '1';
  posalji(f); await cekaj(150);
  jednako('kvar je riješen', novi.status, 'rijesen');
  jednako('skladište je razduženo', dio.stanje, stanjePrije - 1);
  ok('utrošeni dio je upisan u "zamijenjeno"', (novi.zam || '').indexOf('Remen HTD') > -1);

  grupa('Uređivanje i storno');
  app.urediKvar(novi.id);
  f = D.querySelector('#modal-root form');
  ok('riješen kvar se može uređivati', !!f && !!f.elements.sati);
  f.elements.sati.value = '5';
  posalji(f); await cekaj(150);
  jednako('ispravljeni sati su spremljeni', novi.sati, 5);
  /* storno je modal (PLAN-KAIZEN K-1), ne prompt() */
  app.stornirajKvar(novi.id); await cekaj(120);
  f = D.querySelector('#modal-root form');
  ok('storno je uredan modal s obveznim razlogom', !!f && !!f.elements.razlog);
  ok('storno upozorava kad je dio bio utrošen',
     D.querySelector('#modal-root').textContent.indexOf('utrošeni dio') > -1);
  f.elements.razlog.value = 'dupli unos';
  posalji(f); await cekaj(200);
  jednako('storno postavlja status', novi.status, 'otkazan');
  jednako('razlog storna je spremljen', novi.storno_razlog, 'dupli unos');
  ok('stornirani kvar ne ulazi u izračune',
     W.samoKvarovi().every(function(k){ return k.id !== novi.id; }));

  grupa('Filteri i pretraga');
  app.go('kvarovi');
  app.setFilter('status', 'otvoren');
  ok('filter otvorenih vraća samo otvorene (kvarove — zadaci su na Rasporedu)',
     D.querySelectorAll('#screen-kvarovi .kvar-item').length ===
     W.DATA.kvarovi.filter(function(k){ return k.status === 'otvoren' && (k.tip||'kvar')==='kvar'; }).length);
  app.setFilter('majstor', 'Majstor 1');
  ok('filter po majstoru radi',
     Array.prototype.every.call(D.querySelectorAll('#screen-kvarovi .kvar-item'), function(el){
       return el.textContent.indexOf('Majstor 1') > -1; }));
  app.resetFiltere();

  grupa('Zadaci — organizacija na Rasporedu, ne među kvarovima');
  /* seed ima zadatak, a Kvarovi ga NE smiju prikazati — to su prijave problema */
  ok('zadatak iz seeda se ne prikazuje na Kvarovi',
     D.querySelector('#screen-kvarovi').textContent.indexOf('Dogovoriti termin godišnjeg servisa') === -1);
  ok('brojka na kartici Kvarovi ne broji zadatke', (function(){
     var b = D.querySelector('#badge-kvarovi');
     var kvarova = W.DATA.kvarovi.filter(function(k){ return W.jeOtvoren(k) && (k.tip||'kvar')==='kvar'; }).length;
     return parseInt(b.textContent,10) === kvarova;
  })());
  /* detaljna prijava vise ne nudi vrstu — uvijek je kvar, sa strojem */
  app.noviKvar();
  f = D.querySelector('#modal-root form');
  ok('detaljna prijava nema izbor vrste (uvijek kvar)', !f.elements.tip);
  app.closeModal();
  /* zadatak se stvara na Rasporedu */
  app.go('raspored'); await cekaj(150);
  var brZad = W.otvoreniZadaci().length;
  app.noviZadatak();
  f = D.querySelector('#modal-root form');
  f.elements.opis.value = 'TEST zadatak bez stroja';
  f.elements.rok.value = W.todayISO();
  posalji(f); await cekaj(200);
  var zad = W.DATA.kvarovi.filter(function(k){ return k.opis === 'TEST zadatak bez stroja'; })[0];
  ok('zadatak je spremljen bez stroja', !!zad && !zad.m && zad.tip==='zadatak');
  jednako('zadatak ima rok', zad.rok, W.todayISO());
  jednako('novi zadatak je na Rasporedu', W.otvoreniZadaci().length, brZad + 1);
  jednako('zadatak ne ulazi u trošak zastoja', W.samoKvarovi().filter(function(k){ return k.tip === 'zadatak'; }).length, 0);
  ok('zadatak se vidi u agendi Rasporeda',
     D.querySelector('#screen-raspored').textContent.indexOf('TEST zadatak bez stroja') > -1);
  /* kvacica obavlja zadatak izravno iz popisa */
  await app.obaviZadatak(zad.id); await cekaj(150);
  jednako('kvačica obavlja zadatak', zad.status, 'rijesen');
  ok('obavljeni zadatak nestaje s Rasporeda',
     D.querySelector('#screen-raspored').textContent.indexOf('TEST zadatak bez stroja') === -1);
  ok('zapis o obavljenom zadatku je u kanalu',
     W.DATA.poruke.some(function(p){ return p.tko==='Sustav' && p.tekst.indexOf('Zadatak obavljen') > -1; }));

  grupa('Zadaci v2 — veza s kvarom i kontaktom (F3)');
  var kvarZaZad = W.DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='kvar' && k.status!=='otkazan'; })[0];
  app.detaljKvara(kvarZaZad.id); await cekaj(120);
  ok('kvar nudi gumb "+ Zadatak iz ovog kvara"',
     D.querySelector('#modal-root').innerHTML.indexOf('+ Zadatak iz ovog kvara') > -1);
  app.noviZadatak(null, kvarZaZad.id); await cekaj(120);
  f = D.querySelector('#modal-root form');
  ok('obrazac iz kvara ima skrivenu vezu na kvar', f.elements.izvor_kvar.value === kvarZaZad.id);
  ok('obrazac iz kvara predispuni stroj kvara', f.elements.m.value === (kvarZaZad.m||''));
  var kontZaTest = W.DATA.partneri[0];
  f.elements.opis.value = 'TEST zadatak iz kvara';
  f.elements.kontakt_id.value = kontZaTest.id;
  posalji(f); await cekaj(200);
  var zadIzK = W.DATA.kvarovi.filter(function(k){ return k.opis==='TEST zadatak iz kvara'; })[0];
  ok('zadatak iz kvara nosi izvor_kvar', !!zadIzK && zadIzK.izvor_kvar === kvarZaZad.id);
  ok('zadatak iz kvara nosi stroj kvara', !!zadIzK && zadIzK.m === kvarZaZad.m);
  ok('zadatak iz kvara nosi kontakt_id', !!zadIzK && zadIzK.kontakt_id === kontZaTest.id);
  app.detaljKvara(kvarZaZad.id); await cekaj(120);
  ok('kvar prikazuje sekciju "Zadaci uz ovaj kvar"',
     D.querySelector('#modal-root').textContent.indexOf('Zadaci uz ovaj kvar') > -1 &&
     D.querySelector('#modal-root').textContent.indexOf('TEST zadatak iz kvara') > -1);
  app.detaljKvara(zadIzK.id); await cekaj(120);
  ok('detalj zadatka prikazuje vezu "Iz kvara"',
     D.querySelector('#modal-root').textContent.indexOf('Iz kvara') > -1);
  ok('detalj zadatka prikazuje kontakt s tel. linkom',
     D.querySelector('#modal-root').textContent.indexOf(kontZaTest.naziv) > -1 &&
     !!D.querySelector('#modal-root a.clink[href^="tel:"]'));
  app.closeModal();
  app.noviZadatak(); await cekaj(80);
  f = D.querySelector('#modal-root form');
  ok('dropdown "Tko" u novom zadatku nudi i Voditelja (OSOBE, ne samo majstore)',
     Array.prototype.some.call(f.elements.dodijeljen.options, function(o){ return o.value==='Voditelj'; }));
  app.closeModal();
  ok('zadatak sa strojem NE prikazuje stroj kao "u kvaru"', (function(){
    /* zadIzK je otvoren i nosi stroj kvara; ako je taj stroj inače čist, status mora ostati ok */
    var drugiNaStroju = W.DATA.kvarovi.some(function(k){
      return k.m===zadIzK.m && k.id!==zadIzK.id && W.jeOtvoren(k) && (k.tip||'kvar')==='kvar' && !k.upoz; });
    return drugiNaStroju || W.machineStatus(zadIzK.m) !== 'kvar';
  })());

  grupa('Preventiva');
  var prev = W.DATA.preventiva.filter(function(p){ return p.next < W.todayISO(); })[0];
  ok('postoji preventiva koja kasni', !!prev);
  var interval = W.intervalDays(prev.interval);
  app.obaviPreventivu(prev.id);
  f = D.querySelector('#modal-root form');
  posalji(f); await cekaj(150);
  jednako('zadnje obavljeno = danas', prev.zadnje, W.todayISO());
  jednako('sljedeći termin je pomaknut za interval', prev.next, W.addDaysISO(W.todayISO(), interval));
  ok('sistemski zapis o preventivi',
     W.DATA.poruke.some(function(p){ return p.tko === 'Sustav' && p.tekst.indexOf('Preventiva obavljena') > -1; }));

  grupa('Uloge');
  W.SESSION = { ime:'Majstor 1', role:'majstor' };
  D.body.dataset.role = 'majstor';
  W.showScreen('pregled');
  ok('majstor ne vidi eure na pregledu', D.querySelector('#screen-pregled').innerHTML.indexOf('€') === -1);
  ok('majstor ne vidi IFS gumb', W.getComputedStyle(D.querySelector('.btn-audit')).display === 'none');
  ok('majstor vidi svoje zadatke', D.querySelector('#screen-pregled').innerHTML.indexOf('Moji zadaci') > -1);
  W.SESSION = { ime:'Direktor', role:'readonly' };
  D.body.dataset.role = 'readonly';
  W.showScreen('kvarovi');
  var pisi = D.querySelector('#screen-kvarovi .role-write');
  ok('direktor ne vidi gumbe za pisanje', !pisi || W.getComputedStyle(pisi).display === 'none');
  W.SESSION = { ime:'Voditelj', role:'voditelj' };
  D.body.dataset.role = 'voditelj';

  grupa('Analitika');
  W.ANA_DANA = 365;
  app.go('analitika');
  var d = W.anaPodaci();
  ok('analitika grupira po stroju', Object.keys(d.poStroju).length > 3);
  ok('analitika grupira po smjeni', Object.keys(d.poSmjeni).length >= 2);
  ok('analitika grupira po kategoriji', Object.keys(d.poKat).length >= 2);
  ok('stornirani nisu u analitici', d.KV.every(function(k){ return k.status !== 'otkazan'; }));
  ok('tablice su iscrtane', D.querySelectorAll('#screen-analitika .tbl').length >= 3);

  grupa('Offline red');
  ok('red je prazan na početku (demo)', W.RED.length === 0);
  W.uRed('kvarovi', 'insert', {opis:'TEST offline'}, {id:'kv999'});
  jednako('unos je stavljen u red', W.RED.length, 1);
  W.zamijeniIdURedu('kv999', 'uuid-pravi');
  jednako('privremeni ID je zamijenjen pravim', W.RED[0].tempId, 'uuid-pravi');
  W.RED = []; W.redSpremi();
  ok('mrežna greška se prepoznaje', W.mreznaGreska({message:'Failed to fetch'}) === true);
  ok('greška baze nije mrežna', W.mreznaGreska({message:'duplicate key value'}) === false);

  grupa('Izvještaji');
  app.audit(90);
  ok('IFS izvještaj se otvara', !!D.querySelector('#modal-root .modal.audit'));
  ok('IFS ima memorandum za ispis', !!D.querySelector('#modal-root .print-head'));
  ok('IFS pokriva razdoblje iz odabira', D.querySelector('#modal-root').textContent.indexOf('90 dana') > -1);
  app.closeModal();
  app.analitikaIspis();
  ok('analitika ima verziju za ispis', !!D.querySelector('#modal-root .print-head'));
  app.closeModal();

  grupa('Raspored — organizacija po danima');
  app.go('raspored'); await cekaj(150);
  ok('stara mjesečna mreža s točkicama u boji je izbačena (kritika §11.4)',
     D.querySelectorAll('.cal-d').length === 0 && D.querySelectorAll('.cal-t').length === 0);
  ok('kasne preventive su na vrhu, crveno',
     D.querySelector('#screen-raspored').textContent.indexOf('Kasni (') > -1);
  ok('dani nose ime dana u tjednu', (function(){
     var t = D.querySelector('#screen-raspored').textContent;
     return ['ponedjeljak','utorak','srijeda','četvrtak','petak','subota','nedjelja']
       .some(function(d){ return t.indexOf(d) > -1; });
  })());
  ok('postoji gumb za novi zadatak',
     D.querySelector('#screen-raspored').innerHTML.indexOf('noviZadatak') > -1);
  ok('preventiva se može potvrditi i iz agende',
     D.querySelector('#screen-raspored .okbtn') !== null);
  /* korisnikov feedback iz pogona: kalendar je orijentir, mora biti prvi na ekranu */
  ok('kalendar dolazi prije "Kasni" liste i gumba "+ Novi zadatak"', (function(){
     var html = D.querySelector('#screen-raspored').innerHTML;
     var iMreza = html.indexOf('rasp-grid'), iKasni = html.indexOf('Kasni ('), iGumb = html.indexOf('noviZadatak');

  jednako('login footer koristi --text-2 (dovoljan kontrast), ne --muted', bojaNoga, bojaText2);
  D.getElementById('screen-login').classList.remove('show');

  /* manifest: ikone nose "maskable" svrhu za Android home-screen */
  try{
    var manRes = await W.fetch('manifest.json', {cache:'no-store'});
    var man = await manRes.json();
    ok('manifest ikone nose "maskable" svrhu (Android home-screen)',
       man.icons && man.icons.length > 0 && man.icons.every(function(i){ return (i.purpose||'').indexOf('maskable') > -1; }));
  }catch(e){ ok('manifest ikone nose "maskable" svrhu (Android home-screen)', false, String(e)); }

  grupa('AUDIT-FIX2 srednje — atomarni qty(), istekla sesija na izravnom putu');
  /* app.qty() koristi isti atomarni RPC kao trošenje dijela na kvaru — ne slijepi upis */
  var stariSb8 = W.sb, stariRemote5 = W.REMOTE, stariNM5 = W.naMrezi;
  W.REMOTE = true; W.naMrezi = function(){ return true; };
  var dioZaQty = W.DATA.dijelovi[0];
  var stanjeZaQty = dioZaQty.stanje;
  var rpcPoziv = null;
  W.sb = { rpc: function(ime, args){ rpcPoziv = {ime:ime, args:args}; return Promise.resolve({data: stanjeZaQty+1, error:null}); } };
  await W.app.qty(dioZaQty.id, 1); await cekaj(100);
  ok('qty(+1) zove razduzi_dio s negativnom količinom (povećanje)',
     !!rpcPoziv && rpcPoziv.ime==='razduzi_dio' && rpcPoziv.args.p_kolicina === -1);
  jednako('stanje preuzima autoritativnu vrijednost iz RPC odgovora', dioZaQty.stanje, stanjeZaQty+1);
  dioZaQty.stanje = stanjeZaQty;
  W.sb = stariSb8; W.REMOTE = stariRemote5; W.naMrezi = stariNM5;

  /* istekla sesija na izravnom putu (ne u redu čekanja) dobiva istu jasnu poruku */
  var stariSb9 = W.sb, stariRemote6 = W.REMOTE, stariNM6 = W.naMrezi, stariToast2 = W.toast;
  W.REMOTE = true; W.naMrezi = function(){ return true; };
  var redPrijeSesija = W.RED.length;
  var zadnjiToast2 = '';
  W.toast = function(m){ zadnjiToast2 = m; };
  W.sb = { from: function(){ return { update: function(){ return { eq:function(){ return { select:function(){
    return Promise.resolve({error:{code:'PGRST301', message:'JWT expired'}}); } }; } }; } }; } };
  await W.apiUpdate('kvarovi', 'bilo-koji-id', {opis:'x'});
  ok('apiUpdate izravno javlja "sesija je istekla" umjesto generičke greške',
     zadnjiToast2.indexOf('Sesija je istekla') > -1);
  jednako('promjena je spremljena u red umjesto izgubljena', W.RED.length, redPrijeSesija+1);
  W.RED.length = redPrijeSesija; W.redSpremi();
  W.sb = stariSb9; W.REMOTE = stariRemote6; W.naMrezi = stariNM6; W.toast = stariToast2;

  grupa('AUDIT-FIX2 nisko — pin-oko 44px, sdot boje iz varijabli');
  var probniOko = D.createElement('button'); probniOko.className = 'pin-oko';
  D.body.appendChild(probniOko);
  ok('.pin-oko ima dodirnu površinu 44px',
     parseInt(W.getComputedStyle(probniOko).minHeight,10) >= 44 &&
     parseInt(W.getComputedStyle(probniOko).minWidth,10) >= 44);
  probniOko.remove();

  var probniDotOk = D.createElement('span'); probniDotOk.className = 'sdot ok';
  var probniVarZelena = D.createElement('span'); probniVarZelena.style.background = 'var(--green)';
  D.body.appendChild(probniDotOk); D.body.appendChild(probniVarZelena);
  jednako('.sdot.ok koristi var(--green), ne vlastitu nijansu',
     W.getComputedStyle(probniDotOk).backgroundColor, W.getComputedStyle(probniVarZelena).backgroundColor);
  probniDotOk.remove(); probniVarZelena.remove();

  grupa('AUDIT-FIX2 — pokrivenost: app.prijava() validacije');
  /* poznat propust iz 2. kruga audita: app.prijava() nije imala nijedan test,
     testovi su uvijek ulazili kroz demoUlaz() zaobilazeći pravu prijavu potpuno */
  D.getElementById('screen-login').classList.add('show');
  W.LOGIN_SEL = null;
  D.querySelector('#pin').value = '';
  await app.prijava();
  jednako('prijava bez odabranog imena traži odabir', D.querySelector('#login-err').textContent, 'Odaberi svoje ime.');
  app.odaberiKorisnika('Voditelj');
  await app.prijava();
  jednako('prijava bez PIN-a traži unos', D.querySelector('#login-err').textContent, 'Upiši PIN.');
  var stariSb10 = W.sb;
  D.querySelector('#pin').value = '99999999';
  W.sb = { auth: { signInWithPassword: function(){ return Promise.resolve({error:{message:'Invalid login credentials'}}); } } };
  await app.prijava();
  jednako('pogrešan PIN javlja jasnu poruku, ne sirovu grešku baze', D.querySelector('#login-err').textContent, 'Pogrešan PIN.');
  jednako('PIN polje se briše nakon pogrešnog pokušaja (ne ostaje vidljiv/upisan)', D.querySelector('#pin').value, '');
  W.sb = stariSb10;
  D.querySelector('#login-err').textContent = '';
  D.getElementById('screen-login').classList.remove('show');

  grupa('Z3 — push resubscribe nakon rotacije pretplate');
  /* posaljiPushPretplatu(): dijele je pushUkljuci() i poruka od service workera
     nakon automatske rotacije pretplate (pushsubscriptionchange u sw.js) */
  var stariSb11 = W.sb, stariRemote7 = W.REMOTE;
  W.REMOTE = true;
  var upsertPoziv = null;
  W.sb = { from: function(t){ return { upsert: function(row, opts){
    upsertPoziv = {table:t, row:row, opts:opts}; return Promise.resolve({error:null}); } }; } };
  await W.posaljiPushPretplatu({ endpoint:'https://push.test/abc', keys:{p256dh:'p', auth:'a'} });
  ok('posaljiPushPretplatu šalje korisnika, endpoint i ključeve na push_pretplate',
     !!upsertPoziv && upsertPoziv.table==='push_pretplate' &&
     upsertPoziv.row.korisnik===W.SESSION.ime && upsertPoziv.row.endpoint==='https://push.test/abc');

  if(W.navigator.serviceWorker){
    upsertPoziv = null;
    W.navigator.serviceWorker.dispatchEvent(new W.MessageEvent('message', { data:
      { type:'push-resubscribed', subscription:{ endpoint:'https://push.test/rotirano', keys:{p256dh:'p2', auth:'a2'} } } }));
    await cekaj(80);
    ok('poruka "push-resubscribed" od service workera šalje novu pretplatu na server',
       !!upsertPoziv && upsertPoziv.row.endpoint==='https://push.test/rotirano');
  }
  W.sb = stariSb11; W.REMOTE = stariRemote7;

  grupa('Testovi: Sustav — noviKorisnik/korisnikAktivan (2. krug audita)');
  /* mockira app.fnKorisnici (ne fetch/sb.auth) — testira da pozivatelji šalju
     ispravan payload i ispravno reagiraju, ne ponovno unutarnju logiku fnKorisnici.
     Bilježi POVIJEST poziva, ne samo zadnji — i saveKorisnik i korisnikAktivan nakon
     uspjeha (bez await) i sami pozivaju ucitajKorisnike(), koji odmah šalje akciju
     "popis" i tiho bi prepisao jedan dijeljeni "zadnji poziv". */
  var stariFn = W.app.fnKorisnici;
  var pozivi = [];
  W.app.fnKorisnici = function(payload){ pozivi.push(payload); return Promise.resolve({ok:true, korisnici:[]}); };

  app.noviKorisnik(); await cekaj(100);
  var fNk = D.querySelector('#modal-root form');
  ok('obrazac novog korisnika postoji', !!fNk);
  fNk.elements.ime.value = 'TEST Majstor 9';
  fNk.elements.user.value = 'testmajstor9';
  fNk.elements.pin.value = '12345678';
  fNk.elements.role.value = 'majstor';
  var stariAlert3 = W.alert; W.alert = function(){};
  posalji(fNk); await cekaj(120);
  W.alert = stariAlert3;
  ok('novi korisnik šalje akciju "dodaj" s ispravnim poljima',
     pozivi.some(function(p){ return p.akcija==='dodaj' && p.ime==='TEST Majstor 9' &&
       p.email==='testmajstor9@odrzavanje.local' && p.pin==='12345678' && p.role==='majstor'; }));

  /* korisnikAktivan: deaktivacija traži potvrdu, aktivacija ne */
  W.SUS_KORISNICI = [{id:'testK1', ime:'TEST Korisnik', role:'majstor', email:'x@y.local', aktivan:true}];
  pozivi = [];
  var stariConfirm = W.confirm, confirmZvan = false;
  W.confirm = function(){ confirmZvan = true; return true; };
  await app.korisnikAktivan('testK1', false); await cekaj(80);
  ok('deaktivacija traži potvrdu', confirmZvan);
  ok('deaktivacija šalje akciju "aktivan":false',
     pozivi.some(function(p){ return p.akcija==='aktivan' && p.id==='testK1' && p.aktivan===false; }));
  confirmZvan = false; pozivi = [];
  await app.korisnikAktivan('testK1', true); await cekaj(80);
  ok('aktivacija NE traži potvrdu', !confirmZvan);
  ok('aktivacija šalje akciju "aktivan":true',
     pozivi.some(function(p){ return p.akcija==='aktivan' && p.id==='testK1' && p.aktivan===true; }));
  W.confirm = stariConfirm;
  W.app.fnKorisnici = stariFn;

  grupa('Testovi: uvozCSV/saveUvoz (2. krug audita)');
  var strojevaPrije = W.DATA.machines.length;
  app.uvozCSV(); await cekaj(100);
  var fUvoz = D.querySelector('#modal-root form');
  fUvoz.elements.vrsta.value = 'machines';
  fUvoz.elements.csv.value = 'e9;TEST Ekstruder E9;Energetika;350\nneispravan-redak-bez-dovoljno-polja';
  var stariAlert4 = W.alert, alertPoruka2 = '';
  W.alert = function(m){ alertPoruka2 = m; };
  posalji(fUvoz); await cekaj(150);
  W.alert = stariAlert4;
  jednako('uvoz strojeva dodaje ispravan redak', W.DATA.machines.length, strojevaPrije+1);
  ok('uvoz javlja koliko je preskočeno zbog neispravnog retka', alertPoruka2.indexOf('Preskočeno') > -1);
  var noviStroj = W.DATA.machines.filter(function(m){ return m.id==='e9'; })[0];
  ok('novi stroj iz uvoza ima ispravna polja',
     !!noviStroj && noviStroj.name==='TEST Ekstruder E9' && noviStroj.program==='Energetika');
  W.DATA.machines = W.DATA.machines.filter(function(m){ return m.id!=='e9'; });

  grupa('§11.5 — pamćenje zadnjeg ekrana i filtera');
  app.go('dijelovi'); await cekaj(80);
  jednako('showScreen pamti zadnji glavni ekran', W.zadnjiEkran(), 'dijelovi');
  app.openStroj('e1'); await cekaj(80);
  jednako('pod-ekran (stroj) ne prepisuje zapamćeni glavni ekran', W.zadnjiEkran(), 'dijelovi');
  app.go('pregled'); await cekaj(80);

  app.go('kvarovi'); await cekaj(80);
  app.setFilter('status', 'rijesen');
  var zapamceno = JSON.parse(W.localStorage.getItem(W.ZADNJI_FILTER_KEY));
  jednako('setFilter odmah sprema filter u localStorage', zapamceno.status, 'rijesen');
  W.FILTER.status = 'svi';   /* simuliraj svježe pokretanje prije učitavanja spremljenog filtera */
  W.ucitajZapamceneFiltere();
  jednako('ucitajZapamceneFiltere vraća spremljeni filter', W.FILTER.status, 'rijesen');
  app.resetFiltere();
  var zapamcenoNakonReset = JSON.parse(W.localStorage.getItem(W.ZADNJI_FILTER_KEY));
  jednako('resetFiltere briše zapamćeni filter natrag na zadano', zapamcenoNakonReset.status, 'svi');
  try{ W.localStorage.removeItem(W.ZADNJI_EKRAN_KEY); W.localStorage.removeItem(W.ZADNJI_FILTER_KEY); }catch(e){}

  grupa('U-snop — vizualni feedback korisnika (16.8. navečer)');
  /* U1: SVG ikona oka na prijavi, ne emoji — prvi ekran mora djelovati profesionalno */
  D.getElementById('screen-login').classList.add('show');
  var okoBtn = D.querySelector('#screen-login .pin-oko');
  ok('PIN oko je SVG ikona, ne emoji', !!okoBtn.querySelector('svg') && okoBtn.textContent.indexOf('👁') === -1);
  app.pinOko('pin', okoBtn);
  ok('i nakon prebacivanja ostaje SVG (prekriženo oko), ne emoji',
     !!okoBtn.querySelector('svg') && okoBtn.textContent.indexOf('🙈') === -1);
  app.pinOko('pin', okoBtn);
  D.getElementById('screen-login').classList.remove('show');

  /* U2: riješen kvar je normalno stanje — kartica bez chipa, bez kategorije, bez "Riješio" */
  app.go('kvarovi'); await cekaj(120); app.resetFiltere(); await cekaj(80);
  var rijesenaKartica = Array.prototype.filter.call(D.querySelectorAll('#screen-kvarovi .kvar-item'),
    function(el){ return el.textContent.indexOf('Zastoj') > -1; })[0];
  ok('kartica riješenog kvara nema chip (riješeno je normalno stanje, ne alarm)',
     !!rijesenaKartica && rijesenaKartica.querySelector('.chip') === null);
  ok('kartica ne prikazuje "Riješio" (živi u detalju)',
     rijesenaKartica.textContent.indexOf('Riješio') === -1);
  var otvorenaKartica = Array.prototype.filter.call(D.querySelectorAll('#screen-kvarovi .kvar-item'),
    function(el){ return el.querySelector('.chip.kvar, .chip.rad, .chip.upoz'); })[0];
  ok('otvoren/u radu kvar i dalje nosi status chip', !!otvorenaKartica);

  /* U4: QR naljepnice — izbor standardnog A4 arka mijenja print raspored */
  app.go('qr'); await cekaj(150);
  var qrSelect = D.querySelector('#screen-qr select');
  ok('QR ekran nudi izbor formata arka (3 standardna)', !!qrSelect && qrSelect.options.length === 3);
  ok('zadani format (8/arak) postavlja raster 105 mm u print stil',
     D.getElementById('qr-print-stil').textContent.indexOf('105mm') > -1);
  app.qrFormat('f24'); await cekaj(120);
  ok('format 24/arak prebacuje raster na 70×36 mm',
     D.getElementById('qr-print-stil').textContent.indexOf('70mm') > -1 &&
     D.getElementById('qr-print-stil').textContent.indexOf('36mm') > -1);
  app.qrFormat('f8'); await cekaj(80);
  app.go('strojevi'); await cekaj(100);
  jednako('odlazak s QR ekrana čisti print stil (ne kvari ispis IFS-a/analitike)',
     D.getElementById('qr-print-stil').textContent, '');

  /* U5: put do uređivanja sektora vidljiv na Strojevima */
  ok('Strojevi nude gumb "Sektori" (otvara postavke tvrtke)',
     !!D.querySelector('#screen-strojevi button[onclick*="urediTvrtku"]'));

  /* U7: Sustav → Korisnici u demo načinu objašnjava, ne vrti "Učitavanje…" zauvijek */
  var susPrije = W.SUS_KORISNICI;
  W.SUS_KORISNICI = null;
  app.go('sustav'); await cekaj(100);
  ok('demo način objašnjava zašto nema popisa korisnika (ne beskonačno "Učitavanje…")',
     D.querySelector('#screen-sustav').textContent.indexOf('demo načinu nema stvarnih korisničkih računa') > -1 &&
     D.querySelector('#screen-sustav').textContent.indexOf('Učitavanje') === -1);
  W.SUS_KORISNICI = susPrije;
  app.go('pregled'); await cekaj(80);

  grupa('Otpornost');
  W.DATA.kvarovi.push({id:'kvX', m:'nepostojeci', date:W.todayISO(), opis:'TEST siroče',
                       sati:1, status:'rijesen', upoz:false, tip:'kvar', kategorija:'Ostalo'});
  var palo = false;
  try{ ['pregled','kvarovi','strojevi','dijelovi','analitika','raspored','poruke','kontakti']
        .forEach(function(s){ W.showScreen(s); }); }
  catch(e){ palo = true; }
  ok('zapis s nepostojećim strojem ne ruši nijedan ekran', !palo);
  try{ app.audit(); app.closeModal(); }catch(e){ ok('IFS izvještaj preživi siroče', false, String(e)); }
  ok('IFS izvještaj preživi siroče', true);
  W.DATA.kvarovi = W.DATA.kvarovi.filter(function(k){ return k.id !== 'kvX'; });
  W.showScreen('pregled');
}
</script>
</body>
</html>
