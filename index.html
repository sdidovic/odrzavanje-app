/* ---------- Raspored v45 — "Dnevna ploča": planer dana, ne lista s gumbima ----------
   Jedan ekran, odozgo: tjedni trak (opterećenje po danu) → hero dana (datum, smjena i "još X h",
   3 brojke, segmentna traka napretka, pilule tima sa satima) → "Sada u pogonu" (kvarovi u radu
   = stvarnost dana, s trakom smjene) → Kasni (+ "Sve na danas") → Plan dana → Sljedećih 7 dana →
   Kasnije / Bez roka (sklopivo) → FAB. Svaka stavka postoji na ekranu TOČNO JEDNOM — hero,
   pilule, trak i sheetovi ispisuju samo brojke/tip/stroj, nikad opis. Dodjela osobe i procjena
   sati = 2 dodira (avatar/čip → sheet), bez punog obrasca. Vlasnikov nalog 17.8.2026.:
   "tu se planira dan i gleda šta ima za odraditi — a bilo je basic i jadno". */
var RASP_TJEDAN = null;            /* ISO ponedjeljka tjedna prikazanog u traci */
var RASP_ODABRAN_ZA = null;        /* datum na koji je RASP_ODABRAN postavljen — novi dan → natrag na danas */
var RASP_FILTER_OSOBA = null;      /* null | ime | '__nitko' — filtar agende po osobi (pilule tima) */
var RASP_FILTER_INIT = null;       /* za koga je filtar inicijaliziran (majstor → svoje ime, ostali null) */
var RASP_PLAN = null;              /* {red:[{tip,id}], i} dok traje "Planiraj dan" */
var RASP_TIHO = false;             /* potiskuje rerender tijekom skupnih radnji (Sve na danas) */
var RASP_SWIPE = null;
var SVG_KVACICA = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

/* JEDAN klasifikacijski prolaz — svaka stavka u točno jednu kantu. Sidro = odabrani dan
   (zadano danas): 'danas' = datum===sidro, 'tjedan' = (sidro, sidro+7], 'kasnije' > sidro+7,
   'kasni' UVIJEK datum < stvarnog danas, 'prije' = između danas i sidra (ne prikazuje se —
   dostupno kroz trak). Zadaci bez roka posebno. Nikad dvije neovisne petlje nad istim podacima. */
function klasifikacijaStavki(sidro){
  var danas = todayISO();
  sidro = sidro || danas;
  var tjedanKraj = addDaysISO(sidro, 7);
  var kasni = [], danasArr = [], tjedan = [], kasnije = [], bezRoka = [], prije = [];
  function stavka(tip, item, datum, osoba, h, krit){
    return { tip:tip, item:item, datum:datum, osoba:osoba||null, h:(h==null?null:h), krit:!!krit, kasni:!!datum && datum < danas };
  }
  function razvrstaj(s){
    var d = s.datum;
    if(d < danas) kasni.push(s);
    else if(d < sidro) prije.push(s);
    else if(d === sidro) danasArr.push(s);
    else if(d <= tjedanKraj) tjedan.push(s);
    else kasnije.push(s);
  }
  DATA.preventiva.forEach(function(p){ razvrstaj(stavka('prev', p, p.next, p.dodijeljen, p.trajanje_h, p.zaustavlja_liniju)); });
  otvoreniZadaci().forEach(function(z){
    if(!z.rok){ bezRoka.push(stavka('zad', z, null, z.dodijeljen, null, false)); return; }
    razvrstaj(stavka('zad', z, z.rok, z.dodijeljen, null, false));
  });
  sanacijeOtvorene().forEach(function(k){ razvrstaj(stavka('san', k, k.rok_sanacije, k.dodijeljen, null, false)); });
  function sortDatum(a,b){ return a.datum < b.datum ? -1 : (a.datum > b.datum ? 1 : 0); }
  kasni.sort(sortDatum); danasArr.sort(sortDatum); tjedan.sort(sortDatum); kasnije.sort(sortDatum); prije.sort(sortDatum);
  return { kasni:kasni, danas:danasArr, tjedan:tjedan, kasnije:kasnije, bezRoka:bezRoka, prije:prije };
}

/* Sažetak dana za hero, pilule i zone — jedan prolaz. Za danas skup = kasni + danas + kvarovi
   (tip kvar) koji su otvoreni ("Sada u pogonu"); za drugi dan = stavke s tim datumom. */
function danSazetak(iso){
  var danas = todayISO(), jeDanas = iso===danas;
  var kl = klasifikacijaStavki(iso);
  var stavke = jeDanas ? kl.kasni.concat(kl.danas)
                       : kl.kasni.concat(kl.prije, kl.danas).filter(function(x){ return x.datum===iso; });
  var sada = jeDanas ? DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='kvar' && jeOtvoren(k); }) : [];
  var gotove = [];
  DATA.preventiva.forEach(function(p){
    if(p.zadnje===iso) gotove.push({ tip:'prev', item:p, osoba:p.tkoZadnji||null, h:p.trajanje_h, kad:'' });
  });
  DATA.kvarovi.forEach(function(z){
    if((z.tip||'kvar')!=='zadatak' || z.status!=='rijesen' || !z.closed_at) return;
    /* C: closed_at je UTC iz baze, iso (todayISO) je LOKALNI datum — usporedba sirovih
       stringova krivo broji "odrađeno danas" u rubnim satima. localDT().d vraća lokalni dan. */
    if(localDT(z.closed_at).d!==iso) return;
    var d = new Date(z.closed_at);
    gotove.push({ tip:'zad', item:z, osoba:z.tko||null, h:null, kad: isNaN(d.getTime()) ? '' : fmtSat(d) });
  });
  var poOsobi = {};
  function po(ime){ var k = ime || '__nitko'; if(!poOsobi[k]) poOsobi[k] = {n:0,h:0,bezH:0,gotN:0,gotH:0}; return poOsobi[k]; }
  MAJSTORI.forEach(function(m){ po(m); }); po('Voditelj'); po(null);
  var sati = 0, bezProcjene = 0, kasni = 0, nMoj = 0, kasniMoj = 0;
  /* A: hero brojke moraju pratiti isti filtar osobe kao popis ispod (prolaziFiltar) — inače
     hero pokaže "5" dok popis ima 3 retka. Nedodijeljene stavke prolaze filtar (kandidati
     svima), pa ulaze i u *Moj varijantu — isto kao što ih popis već prikazuje. */
  stavke.forEach(function(x){
    var o = po(x.osoba); o.n++;
    if(x.tip==='prev'){
      if(x.h==null){ bezProcjene++; o.bezH++; }
      else { sati += x.h; o.h += x.h; }
    }
    if(x.datum < danas) kasni++;
    if(prolaziFiltar(x)){ nMoj++; if(x.datum < danas) kasniMoj++; }
  });
  sada.forEach(function(k){
    var o = po(k.dodijeljen); o.n++;
    if(k.status==='u_radu'){ var s = satiKvara(k); sati += s; o.h += s; }
    if(prolaziFiltar({osoba:k.dodijeljen})) nMoj++;
  });
  gotove.forEach(function(g){ var o = po(g.osoba); o.gotN++; if(g.h) o.gotH += g.h; });
  return {
    iso:iso, danas:jeDanas, kl:kl, stavke:stavke, sada:sada, gotove:gotove,
    n: stavke.length + sada.length, nGotove: gotove.length,
    sati: Math.round(sati*10)/10, bezProcjene:bezProcjene, kasni:kasni,
    nMoj:nMoj, kasniMoj:kasniMoj,
    hitno: sada.filter(function(k){ return k.prioritet==='hitno'; }).length,
    poOsobi:poOsobi
  };
}
/* opterećenje po danu za tjedni trak: {iso:{n, kasni}} */
function tjedanMapa(pon){
  var danas = todayISO(), mapa = {};
  for(var i=0;i<7;i++){
    var iso = addDaysISO(pon, i), st = stavkeZaDan(iso);
    var n = st.prev.length + st.zad.length + st.san.length;
    mapa[iso] = { n:n, kasni: iso < danas && n > 0 };
  }
  return mapa;
}
/* prva stavka nakon dana — samo tip/stroj/datum, nikad opis (svaka stavka jednom na ekranu) */
function sljedecaStavka(iso){
  var best = null;
  function kand(datum, tip, m){
    if(!datum || datum <= iso) return;
    if(!best || datum < best.datum){ var mm = m ? machineById(m) : null; best = { datum:datum, tip:tip, stroj: mm ? mm.name : '' }; }
  }
  DATA.preventiva.forEach(function(p){ kand(p.next, 'Redovni pregled', p.m); });
  otvoreniZadaci().forEach(function(z){ kand(z.rok, 'Zadatak', z.m); });
  sanacijeOtvorene().forEach(function(k){ kand(k.rok_sanacije, 'Sanacija', k.m); });
  return best;
}
function nazivTjedna(pon){
  var ned = addDaysISO(pon, 6);
  var p1 = pon.split('-'), p2 = ned.split('-');
  var d1 = parseInt(p1[2],10), d2 = parseInt(p2[2],10), m1 = parseInt(p1[1],10)-1, m2 = parseInt(p2[1],10)-1;
  return m1===m2 ? d1+'.–'+d2+'. '+MJESECI_G[m1] : d1+'. '+MJESECI_G[m1]+' – '+d2+'. '+MJESECI_G[m2];
}
function prolaziFiltar(x){
  if(!RASP_FILTER_OSOBA) return true;
  if(RASP_FILTER_OSOBA==='__nitko') return !x.osoba;
  return x.osoba===RASP_FILTER_OSOBA || !x.osoba;   /* nedodijeljene su svačiji kandidati */
}
/* poredak u Planu dana: nedodijeljene → zaustavlja liniju → po osobi (redoslijed tima) → sati silazno → sanacije */
function poredakPlana(a, b){
  function rang(x){ if(x.tip==='san') return 9; if(!x.osoba) return 0; if(x.krit) return 1; return 2; }
  var ra = rang(a), rb = rang(b); if(ra!==rb) return ra-rb;
  var red = MAJSTORI.concat(['Voditelj']);
  var ia = red.indexOf(a.osoba), ib = red.indexOf(b.osoba); if(ia<0) ia = 99; if(ib<0) ib = 99;
  if(ia!==ib) return ia-ib;
  return (b.h||0) - (a.h||0);
}

/* ---------- gradivni elementi retka ---------- */
function avatarHtml(ime, o){
  o = o || {};
  var readonly = neMozePlanirati();
  var klik = (!readonly && o.tip && o.id) ? ' onclick="event.stopPropagation();app.sheetTko(\''+o.tip+'\',\''+o.id+'\')"' : '';
  var kl = 'av'+(o.velik?' velik':'');
  if(o.gotov) return '<span class="av ok" aria-label="Obavljeno">'+SVG_KVACICA+'</span>';
  if(o.servis) return '<span class="'+kl+' servis" title="'+esc(o.servis)+'">S</span>';
  if(!ime) return '<span class="'+kl+' prazan"'+klik+' aria-label="Nedodijeljeno"><span class="role-write">+</span></span>';
  return '<span class="'+kl+' '+avatarBoja(ime)+'"'+klik+' title="'+esc(ime)+'">'+esc(inicijali(ime))+'</span>';
}
/* §15 #2 (istraživanje UI): ista osoba = uvijek ista boja avatara, na svakom ekranu — oko
   nauči "plava je Tehničar" i ne mora čitati inicijale. Voditelj je uvijek osnovna (ljubičasta)
   boja tvrtke; ostali dobiju stabilnu boju iz hasha imena (ne ovisi o redoslijedu u popisu). */
function avatarBoja(ime){
  if(ime === 'Voditelj') return 'ab0';
  var h = 0, s = String(ime||'');
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffff;
  return 'ab'+(1 + (h % 5));
}
function trajanjeChip(p){
  var readonly = neMozePlanirati();
  if(p.trajanje_h != null)
    return '<span class="rasp-traj"'+(readonly ? '' : ' onclick="event.stopPropagation();app.sheetSati(\''+p.id+'\')"')+'>≈ '+H(p.trajanje_h)+'</span>';
  if(readonly) return '';
  return '<span class="rasp-traj prazno role-write" onclick="event.stopPropagation();app.sheetSati(\''+p.id+'\')">≈ ? h</span>';
}
/* jedini renderer redaka u zonama Kasni / Plan dana / Sljedećih 7 dana / Kasnije / Bez roka.
   Anatomija: avatar osobe · naslov · meta (tip riječju · stroj · chip trajanja) · jedan element desno (✓).
   Boja SAMO kao 3px pruga: crvena = kasni, isprekidana žuta = sanacija. Nikad chip za tip. */
function planRedak(x, opts){
  opts = opts || {};
  var it = x.item, danas = todayISO();
  var kasni = !!x.datum && x.datum < danas && !opts.gotov;
  var m = it.m ? machineById(it.m) : null;
  var kl = 'row click rasp-st'+(kasni?' st-kasni':'')+(x.tip==='san'?' st-sanacija':'')+(opts.gotov?' st-gotov':'');
  var onclick, naslov, tekst = [], cipovi = '', desno = '', avatar;
  if(opts.gotov){
    avatar = avatarHtml(null, {gotov:true});
    naslov = esc(it.opis);
    tekst.push(x.tip==='prev' ? 'Redovni pregled' : 'Zadatak');
    if(x.osoba) tekst.push(esc(x.osoba));
    if(x.kad) tekst.push(x.kad);
    onclick = x.tip==='prev' ? "app.akcijeStavke('preventiva','"+it.id+"')" : "app.detaljKvara('"+it.id+"')";
  } else if(x.tip==='prev'){
    onclick = "app.akcijeStavke('preventiva','"+it.id+"')";
    naslov = esc(it.opis);
    var vanjski = it.izv && it.izv!=='interno';
    tekst.push('Redovni pregled'+(vanjski ? ' · <b>'+esc(it.izv)+'</b>' : ''));
    if(m) tekst.push(esc(m.name));
    avatar = avatarHtml(it.dodijeljen, { tip:'preventiva', id:it.id, servis:(!it.dodijeljen && vanjski) ? it.izv : null });
    if(!opts.tiho) cipovi += trajanjeChip(it);
    if(it.zaustavlja_liniju) cipovi += ' <span class="chip upoz">Zaustavlja liniju</span>';
    desno = '<button class="okbtn role-write" onclick="event.stopPropagation();obaviAnimirano(this,function(){app.obaviPreventivu(\''+it.id+'\');},true)">✓</button>';
  } else if(x.tip==='zad'){
    onclick = "app.akcijeStavke('zadatak','"+it.id+"')";
    naslov = esc(it.opis);
    tekst.push('Zadatak'+(it.ponavljanje ? ' · ↻ '+it.ponavljanje+' d' : ''));
    if(m) tekst.push(esc(m.name));
    else if(it.kontakt_id){ var kont = DATA.partneri.filter(function(p){ return p.id===it.kontakt_id; })[0]; if(kont) tekst.push(esc(kont.naziv)); }
    if(it.izvor_kvar) tekst.push('iz kvara');
    avatar = avatarHtml(it.dodijeljen, { tip:'zadatak', id:it.id });
    desno = '<button class="okbtn role-write" title="Označi obavljeno" onclick="event.stopPropagation();obaviAnimirano(this,function(){app.obaviZadatak(\''+it.id+'\');})">✓</button>';
  } else {
    onclick = "app.detaljKvara('"+it.id+"')";
    naslov = 'Sanacija: '+esc(it.opis);
    tekst.push('Sanacija · trajni popravak do '+fmtDate(it.rok_sanacije));
    if(m) tekst.push(esc(m.name));
    avatar = avatarHtml(it.dodijeljen, { tip:'kvar', id:it.id });
  }
  if(kasni) tekst.unshift('<b class="kasni-txt">Kasni '+danaOd(x.datum)+' d</b>');
  return '<div class="'+kl+'" data-id="'+it.id+'" onclick="'+onclick+'">'+
    avatar+
    '<div class="grow"><div class="row-title">'+naslov+'</div>'+
      '<div class="row-sub">'+tekst.join(' &middot; ')+(cipovi ? ' '+cipovi : '')+'</div></div>'+
    desno+
  '</div>';
}
/* ✓ s "pop" animacijom; zadatak: redak kolabira pa tek onda obaviZadatak; preventiva:
   odmah (otvara modal Obavio/Datum — obaviPreventivu ostaje sinkron), redak nestaje rerenderom */
function obaviAnimirano(btn, cb, odmah){
  if(btn && btn.classList) btn.classList.add('pop');
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
  if(odmah){ cb(); return; }
  var row = btn;
  while(row && !(row.classList && row.classList.contains('row'))) row = row.parentNode;
  setTimeout(function(){
    if(row && row.style){ row.style.maxHeight = row.offsetHeight+'px'; void row.offsetHeight; row.classList.add('out'); }
    setTimeout(cb, 240);
  }, 180);
}

/* ---------- ZONA 1: tjedni trak ---------- */

      '<button class="qbtn rasp-tj-nav-btn" onclick="app.rasporedTjedan(1)" aria-label="Sljedeći tjedan">›</button>'+
    '</div>'+
    '<div class="rasp-tj-dani">'+dani+'</div>'+
  '</div>'+
  (kalOtvoren ? '<div style="margin-bottom:12px">'+renderKalendarskaMreza()+'</div>' : '');
}

/* ---------- ZONA 2: hero dana ---------- */
function renderTim(sz){
  var red = [];
  if(SESSION.role==='majstor' && SESSION.ime) red.push(SESSION.ime);
  MAJSTORI.forEach(function(m){ if(red.indexOf(m)===-1) red.push(m); });
  if(sz.poOsobi['Voditelj'] && sz.poOsobi['Voditelj'].n>0 && red.indexOf('Voditelj')===-1) red.push('Voditelj');
  var kap = smjenaTrajanje();
  var nitko = sz.poOsobi.__nitko;
  var nitkoHtml = (nitko && nitko.n>0)
    ? '<button class="rasp-os nitko'+(RASP_FILTER_OSOBA==='__nitko'?' aktivna':'')+'" onclick="app.rasporedFilterOsoba(\'__nitko\')">Tko? · '+nitko.n+'</button>'
    : '';
  var osobeHtml = red.map(function(ime){
    var po = sz.poOsobi[ime] || {n:0,h:0};
    var txt = po.h>0 ? H(po.h) : (po.n>0 ? po.n+' st.' : '—');
    var kl = 'rasp-os'+((po.h===0&&po.n===0)?' slobodan':'')+(po.h>kap?' preko':'')+(RASP_FILTER_OSOBA===ime?' aktivna':'');
    return '<button class="'+kl+'" onclick="app.rasporedFilterOsoba(\''+esc(ime)+'\')">'+avatarHtml(ime,{})+'<span>'+txt+'</span></button>';
  }).join('');
  /* "Tko?" (nedodijeljeno) ide PRVI — to je pilula koju voditelj najviše treba, a red je
     horizontalno skrolabilan bez vizualne najave; na uskom zaslonu ne smije završiti odrezana
     s ruba (audit-fix, §14). Iznimka: majstor ima svoju (aktivnu) pilulu prvu — to je već
     njegov filtrirani dan, "Tko?" mu je manje bitan od potvrde "ovo je moje". */
  var html = (SESSION.role==='majstor') ? (osobeHtml+nitkoHtml) : (nitkoHtml+osobeHtml);
  return '<div class="rasp-tim-wrap"><div class="rasp-tim">'+html+'</div></div>';
}
function renderHero(sz){
  var danas = todayISO(), iso = sz.iso, p = iso.split('-');
  var pref = iso===danas ? 'danas · ' : iso===isoShift(1) ? 'sutra · ' : iso===isoShift(-1) ? 'jučer · ' : '';
  var desno;
  if(iso===danas){
    var g = smjenaGranice();
    var jos = g.jos;
    var josTxt = jos >= 1 ? 'još '+Math.floor(jos)+' h '+pad2(Math.round((jos%1)*60))+' min' : 'još '+Math.max(1, Math.round(jos*60))+' min';
    desno = '<div><div class="rasp-smjena">'+esc(g.naziv)+' · '+pad2(g.od)+'–'+pad2(g.do%24)+'</div><div class="rasp-smjena-jos">'+josTxt+'</div></div>';
  } else desno = '<button class="rasp-skok" onclick="app.rasporedDanas()">Danas ›</button>';
  var kapacitet = MAJSTORI.length * smjenaTrajanje();
  var satiTxt = (sz.sati===0 && sz.bezProcjene>0) ? '<span class="stat-num nista">—</span>' : '<span class="stat-num">'+H(sz.sati||0)+'</span>';
  var voditelj = SESSION.role==='voditelj';
  var N = sz.n + sz.nGotove, seg = '';
  if(N===0) seg = '<i class="seg-off"></i>';
  else if(N>12) seg = '<i class="seg-on" style="flex:0 0 '+Math.round(sz.nGotove/N*100)+'%"></i><i class="seg-off"></i>';
  else for(var i=0;i<N;i++) seg += '<i class="'+(i<sz.nGotove?'seg-on':'seg-off')+'"></i>';
  var gotovo = iso===danas && sz.n===0 && sz.nGotove>0;
  var lijevo;
  if(gotovo) lijevo = 'Sve za danas odrađeno';
  else if(RASP_FILTER_OSOBA && RASP_FILTER_OSOBA!=='__nitko'){
    var po = sz.poOsobi[RASP_FILTER_OSOBA] || {n:0,gotN:0};
    lijevo = esc(inicijali(RASP_FILTER_OSOBA))+': odrađeno '+po.gotN+' od '+(po.n+po.gotN);
  } else lijevo = 'Odrađeno '+sz.nGotove+' od '+N;
  /* §16 P1: "od N h" (kapacitet tima) i "N bez procjene sati" su planerske brojke — vrijede
     voditelju koji dodjeljuje, ne tehničaru/proizvodnji/direktoru koji samo čitaju svoj dan.
     Pilule tima (renderTim) OSTAJU svima — vlasnik i postojeći testovi to traže ("pilule
     postoje za čitanje" i za readonly, majstor vidi svoju prvu). */
  var desnoTxt = sz.bezProcjene>0
    ? '<span class="role-voditelj"'+(voditelj ? ' onclick="app.planirajDan()"' : '')+'>'+sz.bezProcjene+' bez procjene sati</span>'
    : (sz.sati>0 ? '<span class="role-voditelj">sve procijenjeno</span>' : '');
  /* A: dok je filtar po osobi aktivan (majstor uvijek, ili bilo tko ručno kroz pilulu),
     hero mora pokazati ISTU brojku koju popis ispod stvarno prikazuje (prolaziFiltar) —
     inače hero laže (npr. "5" dok popis ima 3 retka). */
  var heroN = RASP_FILTER_OSOBA ? sz.nMoj : sz.n;
  var heroKasni = RASP_FILTER_OSOBA ? sz.kasniMoj : sz.kasni;
  return '<div class="card rasp-hero'+(gotovo?' gotovo':'')+'">'+
    '<div class="rasp-hero-r1 fade"><div><div class="rasp-dan-h2">'+pref+danUTjednu(iso)+'</div>'+
      '<div class="rasp-dan-h1">'+(gotovo ? '<span class="rasp-kv-ok">'+SVG_KVACICA+'</span>' : '')+parseInt(p[2],10)+'. '+MJESECI_G[parseInt(p[1],10)-1]+'</div></div>'+desno+'</div>'+
    '<div class="rasp-hero-grid fade">'+
      '<div class="rasp-stat" onclick="app.rasporedSkokNa(\'plan\')"><span class="stat-num">'+heroN+'</span><span class="stat-label">Za odraditi</span></div>'+
      '<div class="rasp-stat role-voditelj"'+(voditelj ? ' onclick="app.planirajDan()"' : '')+'>'+satiTxt+'<span class="stat-label">od '+kapacitet+' h</span></div>'+
      '<div class="rasp-stat" onclick="app.rasporedSkokNa(\'kasni\')"><span class="stat-num'+(heroKasni>0?' crv':'')+'">'+heroKasni+'</span><span class="stat-label">Kasni</span></div>'+
    '</div>'+
    '<div class="rasp-prog-wrap fade"><div class="rasp-prog">'+seg+'</div>'+
      '<div class="rasp-prog-txt"><span>'+lijevo+'</span><span>'+desnoTxt+'</span></div></div>'+
    renderTim(sz)+
  '</div>';
}

/* ---------- ZONA 3: Sada u pogonu (kvarovi = stvarnost dana) ---------- */
function smjenaTrakaHtml(k){
  var poc = pocetakKvara(k); if(!poc) return '';
  var g = smjenaGranice();
  var od = g.od, doS = g.do;
  var sada = new Date(); var hS = sada.getHours() + sada.getMinutes()/60; if(hS < od) hS += 24;
  var hP = poc.getHours() + poc.getMinutes()/60;
  /* kvar preuzet jučer ili ranije: traka od početka smjene */
  if(poc.toDateString() !== sada.toDateString()) hP = od;
  if(hP < od) hP += 24;
  var rasp = doS - od; if(!(rasp > 0)) return '';
  function cl(v){ return Math.max(0, Math.min(1, v)); }
  var x0 = cl((Math.max(od,hP)-od)/rasp), x1 = cl((hS-od)/rasp);
  var proc = '';
  if(k.procjena_gotovo){
    var pg = new Date(k.procjena_gotovo);
    if(!isNaN(pg.getTime())){
      var hG = pg.getHours() + pg.getMinutes()/60; if(hG < od) hG += 24;
      var xp = cl((hG-od)/rasp);
      var a = Math.min(x1,xp), b = Math.max(x1,xp);
      proc = '<i class="proc'+(xp<x1?' kasni':'')+'" style="left:'+(a*100).toFixed(1)+'%;width:'+((b-a)*100).toFixed(1)+'%"></i>';
    }
  }
  return '<div class="rasp-smj-traka">'+
    '<i class="fill" style="left:'+(x0*100).toFixed(1)+'%;width:'+((x1-x0)*100).toFixed(1)+'%"></i>'+proc+
    '<span class="oz l">'+pad2(od)+'</span><span class="oz r">'+pad2(doS%24)+'</span></div>';
}
function sadaRedak(k){
  var m = machineById(k.m) || {name:'—'};
  var urad = k.status==='u_radu';
  var hitno = !urad && k.prioritet==='hitno' && !k.dodijeljen;
  var kl = 'row click rasp-st'+(urad?' st-urad':'')+(hitno?' st-hitno':'');
  var poc = pocetakKvara(k);
  var meta, desno = '';
  if(urad){
    meta = esc(m.name)+' · od '+(poc?fmtSat(poc):'—')+' · '+trajanjeKvara(k);
    if(k.ceka_dio) desno = '<span class="chip upoz">Čeka dio</span>';
    else if(k.ceka_servis) desno = '<span class="chip servis">Čeka servis</span>';
    else if(k.procjena_gotovo){
      var pg = new Date(k.procjena_gotovo);
      if(!isNaN(pg.getTime())) desno = '<span class="rasp-do'+(pg.getTime() < Date.now() ? ' kasni' : '')+'">→ '+fmtSat(pg)+'</span>';
    }
  } else if(hitno){
    meta = 'Hitno · nitko ne radi · prijavljen '+(poc?fmtSat(poc):fmtDate(k.date));
    desno = '<span class="chip kvar">HITNO</span>';
  } else if(k.dodijeljen){
    var jucer = poc && poc.toDateString() !== new Date().toDateString();
    meta = esc(m.name)+' · dodijeljen · još nije preuzeo'+(poc ? ' · '+fmtSat(poc)+(jucer?' jučer':'') : '');
  } else {
    meta = 'Kvar · '+esc(m.name)+' · '+trajanjeKvara(k);
  }
  var naslov = (urad ? '<i class="puls'+(k.ceka_dio?' pauza':'')+'"></i>' : '')+esc(k.opis);
  return '<div class="'+kl+'" data-id="'+k.id+'" onclick="app.detaljKvara(\''+k.id+'\')">'+
    avatarHtml(k.dodijeljen, { tip:'kvar', id:k.id, velik:urad })+
    '<div class="grow"><div class="row-title">'+naslov+'</div><div class="row-sub">'+meta+'</div></div>'+
    desno+
    (urad ? smjenaTrakaHtml(k) : '')+
  '</div>';
}
function renderSadaUPogonu(sz){
  if(!sz.danas || !sz.sada.length) return '';
  var red = sz.sada.slice().sort(function(a,b){
    function r(k){ if(k.status==='u_radu') return 0; if(k.prioritet==='hitno' && !k.dodijeljen) return 1; if(k.dodijeljen) return 2; return 3; }
    return r(a)-r(b);
  });
  var d = new Date();
  return '<h2><span><i class="puls"></i>Sada u pogonu <span class="h2-n">· '+pad2(d.getHours())+':'+pad2(d.getMinutes())+'</span></span></h2>'+
    '<div class="card rasp-sada">'+red.map(sadaRedak).join('')+'</div>';
}

/* ---------- ZONE 4–7: Kasni / Plan dana / Sljedećih 7 dana / Kasnije / Bez roka ---------- */
function renderGrupaZaglavlje(naslov, n, id, otvoreno, kritOznaka, desnoHtml){
  var sklopiva = !!id;
  return '<h2'+
    (sklopiva ? ' class="rasp-grupa-head" onclick="app.rasporedGrupaToggle(\''+id+'\')"' : (kritOznaka ? ' style="color:var(--red)"' : ''))+
    '>'+'<span>'+naslov+(n!=null?' ('+n+')':'')+'</span>'+
    (desnoHtml ? '<span class="h2-desno">'+desnoHtml+'</span>' : '')+
    (sklopiva ? '<span class="chev" style="transform:rotate('+(otvoreno?90:0)+'deg)">›</span>' : '')+
  '</h2>';
}
function rasporedPrazno(iso, sz){
  var danas = todayISO(), jeDanas = iso===danas;
  if(RASP_FILTER_OSOBA && RASP_FILTER_OSOBA!=='__nitko'){
    return '<div class="rasp-prazno"><div class="row-title">'+esc(RASP_FILTER_OSOBA)+(jeDanas?' danas':'')+' nema ništa dodijeljeno</div>'+
      '<div class="row-sub">slobodan '+H(smjenaTrajanje())+'</div>'+
      '<div><button class="btn-mini" onclick="app.rasporedFilterOsoba(null)">Prikaži sve</button></div></div>';
  }
  if(RASP_FILTER_OSOBA==='__nitko')
    return '<div class="rasp-prazno"><div class="row-title">Sve je dodijeljeno</div>'+
      '<div><button class="btn-mini" onclick="app.rasporedFilterOsoba(null)">Prikaži sve</button></div></div>';
  if(jeDanas && sz.gotove.length && sz.n===0) return '';   /* hero već kaže "Sve za danas odrađeno" */
  var sl = sljedecaStavka(iso);
  var imaIsta = DATA.preventiva.length || otvoreniZadaci().length;
  var naslov = !imaIsta ? 'Raspored je prazan' : (jeDanas ? 'Za danas nema planiranog' : 'Ništa planirano za '+danUTjednu(iso));
  var sub = sl ? 'Sljedeće: '+sl.tip+(sl.stroj?' · '+esc(sl.stroj):'')+' · '+danUTjednu(sl.datum).slice(0,3)+' '+fmtDate(sl.datum) : '';
  var gumbi = (iso >= danas ? '<button class="btn-mini role-write" onclick="app.noviZadatak(\''+iso+'\')">Dodaj zadatak</button>' : '')+
    (jeDanas && sz.kasni>0 ? '<button class="btn-mini" onclick="app.rasporedSkokNa(\'kasni\')">Pogledaj Kasni</button>' : '')+
    (!DATA.preventiva.length ? '<button class="btn-mini" onclick="app.go(\'strojevi\')">Otvori strojeve</button>' : '');
  return '<div class="rasp-prazno"><div class="row-title">'+naslov+'</div>'+
    (sub ? '<div class="row-sub">'+sub+'</div>' : '')+(gumbi ? '<div>'+gumbi+'</div>' : '')+'</div>';
}
function renderPlan(sz){
  var danas = todayISO(), iso = sz.iso, jeDanas = iso===danas, kl = sz.kl;
  var voditelj = SESSION.role==='voditelj';
  var html = '';
  if(jeDanas){
    var kasni = kl.kasni.filter(prolaziFiltar);
    if(kasni.length){
      html += '<div id="rasp-z-kasni"></div>'+
        renderGrupaZaglavlje('Kasni', kasni.length, null, false, true,
          /* §15 #3: skupno premještanje plana je voditeljska odluka — tehničaru je to samo
             još jedan gumb koji ne treba (i kojim slučajno prebacuje tuđi plan) */
          '<button class="btn-mini role-voditelj" onclick="app.kasniSveNaDanas()">Sve na danas</button>')+
        '<div class="card">'+kasni.map(function(x){ return '<div data-dan="'+x.datum+'">'+planRedak(x)+'</div>'; }).join('')+'</div>';
    }
  }
  var plan = (jeDanas ? kl.danas : sz.stavke).filter(prolaziFiltar).slice().sort(poredakPlana);
  var naslov = jeDanas ? 'Danas — '+fmtDate(iso) : (iso===isoShift(1) ? 'Sutra — '+fmtDate(iso) : danUTjednu(iso)+' — '+fmtDate(iso));
  var trebaPlan = voditelj && jeDanas && ((sz.poOsobi.__nitko && sz.poOsobi.__nitko.n>0) || sz.bezProcjene>0);
  html += '<div id="rasp-z-plan"></div>'+
    renderGrupaZaglavlje(naslov, null, null, false, false,
      '<span class="h2-n">· '+plan.length+'</span>'+(trebaPlan ? '<button class="btn-mini role-write" onclick="app.planirajDan()">Planiraj dan</button>' : ''));
  var gotoveHtml = '';
  if(sz.gotove.length){
    var otv = !!RASP_OTVORENE_GRUPE.gotovo || !jeDanas;
    gotoveHtml = '<div class="rasp-gotovo-head" onclick="app.rasporedGrupaToggle(\'gotovo\')"><span>'+(jeDanas?'Odrađeno danas':'Odrađeno taj dan')+' · '+sz.gotove.length+'</span>'+
      '<span class="chev" style="transform:rotate('+(otv?90:0)+'deg)">›</span></div>'+
      (otv ? sz.gotove.map(function(g){ return planRedak(g, {gotov:true}); }).join('') : '');
  }
  html += '<div class="card" data-dan="'+iso+'">'+
    (plan.length ? plan.map(function(x){ return planRedak(x); }).join('') : rasporedPrazno(iso, sz))+
    gotoveHtml+'</div>';
  var tj = kl.tjedan.filter(prolaziFiltar);
  if(tj.length){
    /* §16 P2 (vlasnikova primjedba): "kad je sve prenatrpano, to je konfuzija" — Danas i Kasni
       ostaju uvijek otvoreni (moraju upasti u oko), ali tjedan unaprijed je sklopiv i ZATVOREN
       po defaultu, isto kao Kasnije/Bez roka — broj + čim se otvori, prva stavka koja zaustavlja
       liniju je vidljiva odmah (chip je već dio planRedak/cipovi). */
    html += renderGrupaZaglavlje('Sljedećih 7 dana', tj.length, 'sedamDana', RASP_OTVORENE_GRUPE.sedamDana);
    if(RASP_OTVORENE_GRUPE.sedamDana){
      var poDanu = {}, red = [];
      tj.forEach(function(x){ if(!poDanu[x.datum]){ poDanu[x.datum] = []; red.push(x.datum); } poDanu[x.datum].push(x); });
      html += '<div class="card">'+red.map(function(d){
        return '<div data-dan="'+d+'"><div class="rasp-dan-sub">'+danUTjednu(d)+' &middot; '+fmtDate(d)+'</div>'+
          poDanu[d].slice().sort(poredakPlana).map(function(x){ return planRedak(x); }).join('')+'</div>';
      }).join('')+'</div>';
    }
  }
  if(kl.kasnije.length){
    html += renderGrupaZaglavlje('Kasnije', kl.kasnije.length, 'kasnije', RASP_OTVORENE_GRUPE.kasnije);
    if(RASP_OTVORENE_GRUPE.kasnije)
      html += '<div class="card grupa-tiho">'+kl.kasnije.map(function(x){ return '<div data-dan="'+x.datum+'">'+planRedak(x,{tiho:true})+'</div>'; }).join('')+'</div>';
  }
  if(kl.bezRoka.length){
    html += renderGrupaZaglavlje('Bez roka', kl.bezRoka.length, 'bezRoka', RASP_OTVORENE_GRUPE.bezRoka);
    if(RASP_OTVORENE_GRUPE.bezRoka)
      html += '<div class="card grupa-tiho">'+kl.bezRoka.map(function(x){ return planRedak(x,{tiho:true}); }).join('')+'</div>';
  }
  return html;
}

function renderRaspored(){
  if(RASP_TIHO) return;
  var danas = todayISO();
  /* filtar po ulozi: majstor vidi svoj dan (+ nedodijeljeno), ostali cijeli tim */
  if(RASP_FILTER_INIT !== SESSION.ime){ RASP_FILTER_OSOBA = SESSION.role==='majstor' ? SESSION.ime : null; RASP_FILTER_INIT = SESSION.ime; }
  if(!RASP_ODABRAN || RASP_ODABRAN_ZA !== danas){ RASP_ODABRAN = danas; RASP_ODABRAN_ZA = danas; }
  if(!RASP_TJEDAN) RASP_TJEDAN = ponedjeljakTjedna(RASP_ODABRAN);
  if(!RASP_MJESEC) RASP_MJESEC = danas.slice(0,7);
  var sz = danSazetak(RASP_ODABRAN);
  var premjestiHtml = '';
  if(RASP_PREMJESTI){
    var st2 = RASP_PREMJESTI.tip==='preventiva'
      ? DATA.preventiva.filter(function(x){ return x.id===RASP_PREMJESTI.id; })[0]
      : DATA.kvarovi.filter(function(x){ return x.id===RASP_PREMJESTI.id; })[0];
    if(st2){
      premjestiHtml = '<div class="rasp-premjesti">'+
        '<div class="row-sub">Premještaš: '+esc(st2.opis)+'</div>'+
        '<div class="row-sub">Dodirni dan u traci tjedna ili u kalendaru</div>'+
        '<button class="btn-mini" style="margin-top:6px" onclick="app.odustaniPremjestanje()">Odustani</button></div>';
    } else RASP_PREMJESTI = null;
  }
  var scrollY = window.scrollY || 0;
  $('#screen-raspored').innerHTML =
    renderTjedniTrak(sz)+
    premjestiHtml+
    renderHero(sz)+
    renderSadaUPogonu(sz)+
    renderPlan(sz)+
    '<button class="rasp-fab role-write" aria-label="Novi zadatak" onclick="app.noviZadatak(\''+(RASP_ODABRAN>=danas?RASP_ODABRAN:danas)+'\')">+</button>';
  /* swipe lijevo/desno na traci = tjedan naprijed/natrag; chevroni su uvijek tu (rukavice) */
  var tj = $('#screen-raspored .rasp-tj');
  if(tj){
    tj.addEventListener('touchstart', function(e){ var t = e.touches && e.touches[0]; if(t) RASP_SWIPE = {x:t.clientX, y:t.clientY}; }, false);
    tj.addEventListener('touchend', function(e){
      if(!RASP_SWIPE) return;
      var t = e.changedTouches && e.changedTouches[0]; if(!t){ RASP_SWIPE = null; return; }
      var dx = t.clientX - RASP_SWIPE.x, dy = t.clientY - RASP_SWIPE.y; RASP_SWIPE = null;
      if(Math.abs(dx) > 48 && Math.abs(dy) < 30) app.rasporedTjedan(dx < 0 ? 1 : -1);
    }, false);
  }
  if(sz.danas && sz.n===0 && sz.nGotove>0){
    try{ if(!sessionStorage.getItem('rasp-gotovo-'+danas)){ sessionStorage.setItem('rasp-gotovo-'+danas, '1'); toast('Sve za danas odrađeno'); } }catch(e){}
  }
  if(scrollY) window.scrollTo(0, scrollY);
}

/* ---------- sheetovi planiranja: "Tko radi?" i "Koliko traje?" (čipovi, ne obrasci) ---------- */
function cipoviTko(tip, id, trenutni, sz){
  if(neMozePlanirati()) return '';
  var kap = smjenaTrajanje();
  if(SESSION.role==='majstor'){
    if(trenutni===SESSION.ime) return '';
    return '<button class="rasp-cip puni" onclick="app.dodijeliIzSheeta(\''+tip+'\',\''+id+'\',\''+esc(SESSION.ime)+'\')">Preuzimam ja<small>'+esc(SESSION.ime)+'</small></button>';
  }
  var imena = MAJSTORI.slice(); if(tip==='zadatak' && imena.indexOf('Voditelj')===-1) imena.push('Voditelj');
  return imena.map(function(ime){

/* =====================  render: QR naljepnice za strojeve  ===================== */
function appBaseUrl(){
  return location.origin + location.pathname.replace(/[^/]*$/, 'index.html');
}
function qrPrintCss(){
  /* Standardni samoljepivi A4 arci (Herma/Avery raster, bez bočnih margina):
     f8 = 2×4 naljepnice 105×74 mm · f12 = 2×6 od 105×48 mm · f24 = 3×8 od 70×36 mm.
     @page je globalan pa se ubacuje dinamički samo dok je QR ekran otvoren. */
  var F = {
    f8:  { pageTop:'0.5mm', cols:'repeat(2,105mm)', row:'74mm', qr:'42mm', okomito:true,  naziv:'13pt', upute:'9pt',   logo:'8mm', pad:'4mm'  },
    f12: { pageTop:'4.5mm', cols:'repeat(2,105mm)', row:'48mm', qr:'33mm', okomito:false, naziv:'12pt', upute:'8pt',   logo:'7mm', pad:'3mm'  },
    f24: { pageTop:'4.5mm', cols:'repeat(3,70mm)',  row:'36mm', qr:'24mm', okomito:false, naziv:'9pt',  upute:'6.5pt', logo:'0',   pad:'2mm'  }
  };
  var f = F[QR_FORMAT] || F.f8;
  return '@media print{'+
    '@page{size:A4 portrait;margin:0}'+
    '.qr-list{display:grid !important;grid-template-columns:'+f.cols+' !important;'+
      'grid-auto-rows:'+f.row+' !important;gap:0 !important;margin:0 !important;padding:'+f.pageTop+' 0 0 !important;justify-content:center}'+
    '.qr-kart{box-sizing:border-box;width:100%;height:100%;margin:0 !important;border-radius:0 !important;'+
      'border:0.2mm dashed #ccc !important;padding:'+f.pad+' !important;overflow:hidden;'+
      (f.okomito
        ? 'display:flex;flex-direction:column;align-items:center;justify-content:center'
        : 'display:grid;grid-template-columns:'+f.qr+' 1fr;grid-template-rows:auto auto auto;align-items:center;column-gap:'+f.pad+';text-align:left')+'}'+
    (f.okomito ? '' :
      '.qr-kart .qr-slika{grid-column:1;grid-row:1/4}'+
      '.qr-kart .qr-logo{grid-column:2;grid-row:1}'+
      '.qr-kart .qr-naziv{grid-column:2;grid-row:2;margin:1mm 0 !important}'+
      '.qr-kart .qr-upute{grid-column:2;grid-row:3}')+
    '.qr-slika img,.qr-slika canvas{width:'+f.qr+' !important;height:'+f.qr+' !important}'+
    '.qr-naziv{font-size:'+f.naziv+' !important;line-height:1.15 !important}'+
    '.qr-upute{font-size:'+f.upute+' !important;line-height:1.25 !important}'+
    (f.logo==='0' ? '.qr-logo{display:none !important}' : '.qr-logo img{height:'+f.logo+' !important}')+
  '}';
}

      /* na Androidu biblioteka ostavlja canvas — pretvaramo ga u sliku

/* =====================  render: Poruke (zajednički kanal)  ===================== */
/* SIM-FIX: Supabase vraća timestamptz kao UTC ("...+00:00"/"...Z") — dosad se
   samo REZALA string pa je prikazano vrijeme bilo UTC, ne hrvatsko. localDT
   pretvara u lokalno SAMO za prikaz. Demo/seed zapisi bez zone (npr.
   "2026-08-21T09:10:00") su već lokalni — ostavljamo netaknute, inače bi se
   demo pomaknuo za offset. Koristiti isključivo za prikaz, ne za usporedbe
   (te ostaju na sirovom stringu — konzistentne su dok uspoređuju sebe s
   drugim sirovim stringom istog izvora). */
function localDT(ts){
  var s = String(ts||'');
  if(!s) return {d:'', t:''};
  var imaZonu = /(Z|[+\-]\d{2}:?\d{2})$/i.test(s);
  if(!imaZonu){
    /* mora barem izgledati kao YYYY-MM-DD — inače je besmislen ulaz, ne datum */
    if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return {d:'', t:''};
    return { d: s.slice(0,10), t: s.length > 11 ? s.slice(11,16) : '' };
  }
  var dt = new Date(s);
  if(isNaN(dt.getTime())) return {d:'', t:''};
  return {
    d: dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()),
    t: pad2(dt.getHours())+':'+pad2(dt.getMinutes())
  };
}
function fmtDateTime(ts){
  var dt = localDT(ts);
  return (dt.d ? fmtDate(dt.d) : '') + (dt.t ? ' ' + dt.t : '');
}
function brojNeprocitanih(){
  var seen = ''; try{ seen = localStorage.getItem('porukeSeen') || ''; }catch(e){}
  return (DATA && DATA.poruke ? DATA.poruke : []).filter(function(p){ return String(p.created_at) > seen; }).length;
}
function oznaciProcitano(){
  var zadnja = (DATA.poruke||[]).reduce(function(m,p){ return String(p.created_at) > m ? String(p.created_at) : m; }, '');
  try{ if(zadnja) localStorage.setItem('porukeSeen', zadnja); }catch(e){}
}
var PORUKE_Q = '';   /* pretraga kanala — jedina stvarno nedostajuća osnovna funkcija (istraženo) */
function porukeListaHtml(){
  var seenPrije = '';
  try{ seenPrije = localStorage.getItem('porukeSeen') || ''; }catch(e){}
  /* Filtar Sve/Ljudi/Sustav je izbačen (NASTAVAK §11.4) — 4 čovjeka je jedan kanal,
     pregledan bez filtriranja; sistemske poruke se ionako vizualno razlikuju (.msg.sustav).
     Pretraga teksta/imena ostaje — to je jedino što istraživanje označilo kao stvarno
     nedostajuću osnovnu funkciju (naći stariju odluku/kontekst bez ručnog skrolanja). */
  var q = PORUKE_Q.trim().toLowerCase();
  var lista = (DATA.poruke||[]).slice().sort(function(a,b){
    return String(a.created_at).localeCompare(String(b.created_at));
  });
  if(q) lista = lista.filter(function(p){ return (p.tekst+' '+p.tko).toLowerCase().indexOf(q) > -1; });
  var zadnjiDan = '', crtaPostavljena = false;
  return lista.length ? lista.map(function(p){
    var out = '';
    /* SIM-FIX: grupiranje po LOKALNOM danu (localDT), ne po UTC danu iz baze —
       inače poruka poslana npr. u 00:30 lokalno ide pod jučerašnji naslov. */
    var dan = localDT(p.created_at).d;
    if(dan && dan !== zadnjiDan){
      zadnjiDan = dan;
      out += '<div class="msg-dan">'+(dan===todayISO() ? 'Danas' : fmtDate(dan))+'</div>';
    }
    if(!crtaPostavljena && seenPrije && String(p.created_at) > seenPrije && p.tko !== SESSION.ime){
      crtaPostavljena = true;
      out += '<div class="msg-nove">nove poruke</div>';
    }
    var sustav = p.tko === 'Sustav';
    var moja = !sustav && p.tko === SESSION.ime;
    var vrijeme = localDT(p.created_at).t;
    var veza = p.kvar_id ? ' <a class="clink" onclick="app.izPoruke(\''+p.kvar_id+'\')">otvori kvar ›</a>' : '';
    out += '<div class="msg'+(moja?' moja':'')+(sustav?' sustav':'')+'">'+
      (sustav ? '' : '<div class="msg-meta">'+esc(p.tko)+' &middot; '+vrijeme+'</div>')+
      '<div class="msg-txt">'+esc(p.tekst)+(sustav?' <span style="opacity:.6">'+vrijeme+'</span>':'')+veza+'</div></div>';
    return out;
  }).join('') : '<div class="empty">'+(q ? 'Nema poruka za „'+esc(PORUKE_Q.trim())+'”.' : 'Nema poruka.')+'</div>';
}

     Dok se pretražuje, ni skrol ni gumb nemaju smisla — korisnik traži nešto konkretno. */
  var prikaziDolje = !q && !svjezOtvoreno && !bioNaDnu;

  $('#screen-poruke').innerHTML =

  zapamtiEkran(name);
  /* dinamički print-stil naljepnica vrijedi SAMO dok je QR ekran otvoren — inače bi
     @page{margin:0} pokvario ispis IFS izvještaja i analitike */
  if(name !== 'qr'){
    var qps = document.getElementById('qr-print-stil');
    if(qps && qps.textContent) qps.textContent = '';
  }
  ['pregled','strojevi','kvarovi','dijelovi','kontakti','poruke','analitika','raspored','sustav','qr','nabava','stroj'].forEach(function(s){
    $('#screen-'+s).classList.toggle('hidden', s!==name);
  });
  REPS = repCounts();
  RENDERERS[name]();
  /* pod-ekrani osvjetljavaju karticu iz koje su otvoreni (QR je pod Strojevima).
     Raspored je od sada VLASTITA kartica, ne pod-ekran Pregleda; Kontakti dijele
     karticu s Porukama (segment na vrhu ekrana). */
  var tabName = (name==='stroj'||name==='qr') ? 'strojevi'
    : ((name==='analitika'||name==='sustav') ? 'pregled'
       : (name==='nabava' ? 'dijelovi'
          : (name==='kontakti' ? 'poruke' : name)));
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-tab')===tabName);
  });
  updateBadge();
  window.scrollTo(0,0);
}
function updateBadge(){
  /* majstoru badge broji NJEGOVE dodijeljene kvarove, voditelju/direktoru sve otvorene.
     Samo kvarove — zadaci su na Rasporedu i ne smiju napuhavati brojku na "Kvarovi". */
  var n = SESSION.role==='majstor'
    ? DATA.kvarovi.filter(function(k){ return jeOtvoren(k) && (k.tip||'kvar')==='kvar' && k.dodijeljen===SESSION.ime; }).length
    : DATA.kvarovi.filter(function(k){ return jeOtvoren(k) && (k.tip||'kvar')==='kvar'; }).length;
  var b = $('#badge-kvarovi');
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n;
  /* nepročitane zajedničke poruke */
  var bp = $('#badge-poruke');
  if(bp){
    var np = CURRENT_SCREEN === 'poruke' ? 0 : brojNeprocitanih();
    bp.style.display = np ? 'flex' : 'none';
    bp.textContent = np;
  }
}

  logoOdabran: function(e){
    var dat = e.target.files && e.target.files[0];
    if(!dat) return;
    var citac = new FileReader();
    citac.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        /* logo se sprema smanjen — baza i mreža ne trebaju nositi veliku sliku */
        var maxV = 120, om = Math.min(1, maxV / img.height);
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * om); c.height = Math.round(img.height * om);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_LOGO = c.toDataURL('image/png');
        var pr = document.getElementById('logo-prev');
        if(pr){ pr.src = PENDING_LOGO; pr.style.display = 'block'; pr.style.maxHeight = '70px'; }
        var lbl = document.getElementById('logo-label');
        if(lbl) lbl.textContent = '✓ '+dat.name;
      };
      img.src = ev.target.result;
    };
    citac.readAsDataURL(dat);
  },
  saveTvrtku: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    var uListu = function(v){ return String(v||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); };
    TVRTKA.naziv = String(f.get('naziv')||'').trim() || TVRTKA.naziv;
    TVRTKA.puni_naziv = String(f.get('puni_naziv')||'').trim();
    TVRTKA.boja = f.get('boja') || TVRTKA.boja;
    TVRTKA.boja_akcent = f.get('boja_akcent') || TVRTKA.boja_akcent;
    TVRTKA.audit_norma = String(f.get('audit_norma')||'').trim();
    ['programi','smjene','kategorije_kvara','kategorije_dijelova'].forEach(function(k){
      var l = uListu(f.get(k)); if(l.length) TVRTKA[k] = l;
    });
    /* početak smjena: brojevi 0-23, mora ih biti isto koliko i smjena — inače je
       auto-dodjela nepouzdana (tipfeler u satu bi tiho krivo dodjeljivao smjenu) */
    var satiOd = uListu(f.get('smjene_od')).map(function(x){ return parseInt(x,10); })
      .filter(function(n){ return !isNaN(n) && n>=0 && n<24; });
    TVRTKA.smjene_od = (satiOd.length === TVRTKA.smjene.length) ? satiOd : null;
    /* §11.5: maziva/mjerna oprema iz koda u postavku — "naziv | oznaka | primjena" po retku;
       redak koji ne prati format (nema dovoljno "|") se preskoči, ne ruši spremanje */
    var mazivaL = uListu(f.get('maziva')).map(function(r){
      var d = r.split('|').map(function(x){ return x.trim(); });
      return d.length>=3 ? {naziv:d[0], oznaka:d[1], primjena:d.slice(2).join(' | ')} : null;
    }).filter(Boolean);
    if(mazivaL.length) TVRTKA.maziva = mazivaL;
    var mjernaL = uListu(f.get('mjerna_oprema')).map(function(r){
      var d = r.split('|').map(function(x){ return x.trim(); });
      return d.length>=2 ? {naziv:d[0], rezim:d.slice(1).join(' | ')} : null;
    }).filter(Boolean);
    if(mjernaL.length) TVRTKA.mjerna_oprema = mjernaL;
    if(PENDING_LOGO){ TVRTKA.logo = PENDING_LOGO; PENDING_LOGO = ''; }
    primijeniIdentitet();
    app.closeModal();
    showScreen('sustav');
    if(REMOTE){
      await apiUpdate('tvrtka', 1, {
        naziv:TVRTKA.naziv, puni_naziv:TVRTKA.puni_naziv, logo:TVRTKA.logo,
        boja:TVRTKA.boja, boja_akcent:TVRTKA.boja_akcent, programi:TVRTKA.programi,
        smjene:TVRTKA.smjene, smjene_od:TVRTKA.smjene_od, kategorije_kvara:TVRTKA.kategorije_kvara,
        kategorije_dijelova:TVRTKA.kategorije_dijelova, audit_norma:TVRTKA.audit_norma,
        maziva:TVRTKA.maziva, mjerna_oprema:TVRTKA.mjerna_oprema,
        updated_at: new Date().toISOString()
      });
    } else { toast('Spremljeno ✓'); }
  },

  saveUvoz: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    var vrsta = f.get('vrsta');
    var redci = String(f.get('csv')||'').split('\n').map(function(r){ return r.trim(); }).filter(Boolean);
    var dodano = 0, greske = 0;
    for(var i=0;i<redci.length;i++){
      var c = redci[i].split(/[;\t]/).map(function(x){ return x.trim(); });
      if(/^(šifra|sifra|naziv)/i.test(c[0])) continue;   /* preskoči zaglavlje */
      try{
        if(vrsta === 'machines'){
          if(c.length < 2) { greske++; continue; }
          var m = { id:c[0].toLowerCase(), name:c[1], program:c[2] || PROGRAMS[0], rate:parseFloat(c[3])||350, bilj:'' };
          DATA.machines.push(m);
          await apiInsert('machines', m, null);
        } else {
          if(c.length < 2) { greske++; continue; }
          var d = { id:'d'+Date.now()+i, naziv:c[0], stroj:c[1]||'', stanje:parseInt(c[2],10)||0,
                    min:parseInt(c[3],10)||0, dob:c[4]||'', cijena:parseFloat(c[5])||0,
                    kategorija:c[6]||'Ostalo' };
          DATA.dijelovi.push(d);
          await apiInsert('dijelovi', { naziv:d.naziv, stroj:d.stroj, stanje:d.stanje, min:d.min,
            dob:d.dob, cijena:d.cijena, kategorija:d.kategorija }, d);
        }
        dodano++;
      }catch(err){ greske++; }
    }
    app.closeModal();
    alert('Uvezeno: '+dodano+(greske?('\nPreskočeno (neispravan redak): '+greske):''));
    showScreen(vrsta === 'machines' ? 'strojevi' : 'dijelovi');
  },

  detaljKvara: function(kId){

    if(!k) return;
    var zadatak = (k.tip||'kvar')==='zadatak';
    var m = machineById(k.m) || {name: zadatak ? 'Opći zadatak' : '—'};

    if(zadatak) chips += '<span class="chip zadatak">Zadatak</span> ';
    if(k.status==='otkazan') chips += '<span class="chip otkazan">Otkazan</span>';
    else if(jeOtvoren(k)){
      if(k.prioritet==='hitno') chips += '<span class="chip kvar">HITNO</span> ';
      else if(k.prioritet==='visok') chips += '<span class="chip upoz">Visok</span> ';
      if(k.ceka_dio) chips += '<span class="chip upoz">Čeka dio · stoji</span> ';
      if(k.ceka_servis) chips += '<span class="chip servis">Čeka servis</span> ';
      chips += (k.status==='u_radu') ? '<span class="chip rad">U radu</span>'
             : (k.upoz ? '<span class="chip upoz">Upozorenje</span>' : '<span class="chip kvar">Otvoren</span>');
    } else chips += '<span class="chip rijesen">Riješen</span>';
    var izvorK = (zadatak && k.izvor_kvar) ? DATA.kvarovi.filter(function(x){ return x.id===k.izvor_kvar; })[0] : null;
    var kontaktZ = (zadatak && k.kontakt_id) ? DATA.partneri.filter(function(x){ return x.id===k.kontakt_id; })[0] : null;
    var zadaciUzKvar = zadatak ? [] : DATA.kvarovi.filter(function(x){ return x.tip==='zadatak' && x.izvor_kvar===kId; });
    /* K-3: narudžba koja zna za ovaj kvar — prikaži kao obvezu koja stiže, ne samo "čeka dio" */
    var narudzbaZaKvar = zadatak ? null : (DATA.nabava||[]).filter(function(x){ return x.kvar_id===kId && !x.primljeno; })[0];
    var red = function(l, v){ return v ? '<div class="row-sub" style="margin-top:4px"><b style="color:var(--text)">'+l+':</b> '+v+'</div>' : ''; };
    var info =
      red('Datum', fmtDate(k.date)) +
      (zadatak
        ? red('Rok', k.rok ? fmtDate(k.rok) : '—')
        : (jeOtvoren(k)
            /* AUDIT-FIX: dok je otvoren, prikaz SAMO uživo trajanja — stari k.sati je nagađanje
               s prijave (ili prazno) i nije autoritativno dok se kvar ne zatvori; prikazivanje
               oba broja odmah jedno pored drugog bez objašnjenja zbunjivalo je (§14.2 t.1). */
            ? red('Zastoj', trajanjeKvara(k) || 'u tijeku')
            : red('Zastoj', H(k.sati) + (vidiFinancije() ? ' &middot; '+EUR(kvarCost(k)) : '')))) +
      (zadatak || !jeOtvoren(k) || !k.procjena_gotovo ? '' :
        red('Procijenjeno gotovo', esc(k.procjena_gotovo.replace('T',' ')))) +
      red('Dodijeljeno', k.dodijeljen ? esc(k.dodijeljen) : '') +
      red('Riješio', k.tko ? esc(k.tko) : '') +
      red('Sudjelovali', k.sudjelovali ? esc(k.sudjelovali) : '') +
      red('Zamijenjeno', k.zam ? esc(k.zam) : '') +
      (izvorK ? '<div class="row-sub" style="margin-top:4px"><b style="color:var(--text)">Iz kvara:</b> '+
        '<a class="clink" onclick="app.closeModal();app.detaljKvara(\''+izvorK.id+'\')">'+
        esc((machineById(izvorK.m)||{name:'—'}).name)+' — '+esc(izvorK.opis)+'</a></div>' : '') +
      (kontaktZ ? '<div class="row-sub" style="margin-top:4px"><b style="color:var(--text)">Kontakt:</b> '+esc(kontaktZ.naziv)+
        (kontaktZ.tel ? ' &middot; <a class="clink" href="tel:'+esc(String(kontaktZ.tel).replace(/[\s\/]/g,''))+'">'+esc(kontaktZ.tel)+'</a>' : '')+
        '</div>' : '') +
      (narudzbaZaKvar ? red('Narudžba dijela', 'naručeno'+(narudzbaZaKvar.ocekivano ? ', stiže ~'+fmtDate(narudzbaZaKvar.ocekivano) : '')) : '') +
      red('Privremeni popravak', k.privremeni
        ? ('da &middot; rok trajne sanacije: '+(k.rok_sanacije
            ? (k.rok_sanacije < todayISO() && k.status!=='rijesen'
                ? '<b style="color:var(--red)">'+fmtDate(k.rok_sanacije)+' — kasni</b>'
                : fmtDate(k.rok_sanacije))
            : 'nije određen'))
        : '') +
      red('Linija otpuštena', k.otpusteno ? 'čišćenje i pregled na strana tijela — '+esc(k.tko||'') : '') +
      (k.status==='otkazan' ? red('Razlog storna', esc(k.storno_razlog||'')) : '');
    /* AUDIT-FIX (§14): Kategorija/Smjena su metapodaci, ne radnja — iza dodira, po istom
       principu "+ Dodatno" koji Riješi-kvar već koristi, da najčešće otvarani ekran voditelja
       ne traži skrolanje do onoga što stvarno treba (dodjela, radnje, komentari). */
    var dodatnoInfo = zadatak ? '' :
      red('Kategorija', esc(k.kategorija||'Ostalo')) + red('Smjena', k.smjena ? esc(k.smjena) : '');
    if(dodatnoInfo) info += '<button type="button" class="btn-mini" style="margin:4px 0 0" '+

      '<div style="display:none">'+dodatnoInfo+'</div>';
    /* §16 P3: čipovi "Gotovo do" — samo dok je kvar u radu i još nema procjene; nestaju sami
       čim je procjena upisana (onda gore već piše "Procijenjeno gotovo") ili kvar zatvoren. */
    if(!zadatak && k.status==='u_radu' && !k.procjena_gotovo)

        '<button class="rasp-cip" onclick="app.postaviGotovoDo(\''+kId+'\',\'smjena\')">Kraj smjene</button>'+
        '</div></div>';
    var kom = (DATA.komentari||[]).filter(function(c){ return c.kvar_id===kId; });
    var komHtml = kom.length ? kom.map(function(c){
      return '<div class="kvar-item"><div class="kvar-top"><span><b style="color:var(--text)">'+esc(c.tko)+'</b></span>'+
        '<span>'+fmtDateTime(c.created_at)+'</span></div>'+
        '<div style="font-size:13.5px;margin-top:3px">'+esc(c.tekst)+'</div></div>';
    }).join('') : '<div class="empty" style="padding:12px">Još nema komentara.</div>';
    var akcije = '';
    /* Radni tok je preuzmi → radi → riješi (PLAN-KAIZEN S3): na otvorenom kvaru je
       "Preuzimam" glavni gumb. "Riješi" ostaje kao brzi put — majstor koji je već
       popravio ne smije morati dva puta otvarati isti kvar. */
    if(k.status==='otvoren')
      akcije += '<button class="btn '+(zadatak?'sec':'primary')+' block role-write" style="margin-top:14px" onclick="app.preuzmiKvar(\''+kId+'\')">Preuzimam — radim na ovome</button>';
    if(jeOtvoren(k))
      akcije += '<button class="btn '+(k.status==='otvoren' && !zadatak ? 'sec' : 'primary')+' block role-write" style="margin-top:'+(k.status==='otvoren'?'8':'14')+'px" onclick="app.rijesiKvar(\''+kId+'\')">'+(zadatak?'Označi obavljeno':'Riješi kvar')+'</button>';
    /* E: dosad je iz "Riješen" jedini izlaz bio Storniraj — a to briše zapis iz analitike/
       MTTR-a/CSV-a/IFS-a, iako se rad stvarno dogodio. Ovo vraća u tijek bez brisanja traga. */
    if(k.status==='rijesen')
      akcije += '<button class="btn sec block role-write" style="margin-top:8px" onclick="app.vratiURad(\''+kId+'\')">Nije riješeno — vrati u rad</button>';
    if(jeOtvoren(k) && !zadatak)
      /* premješteno s kartice: prekidač koji ne mora stajati na svakoj kartici u popisu */
      akcije += '<button class="btn sec block role-write" style="margin-top:8px" onclick="app.cekaDioIzDetalja(\''+kId+'\')">'+
        /* §16 P3: "Treba dio" je tehničarova strana ("ne mogu dalje bez ovoga") — nabava je
           voditeljev posao (§2), pa tekst i sam kaže kome se to javlja, ne pretpostavlja da je
           TEHNIČAR taj koji naručuje (brzoCekaDio šalje sysPoruku + obavijest voditelju). */
        (k.ceka_dio ? '✓ Čeka dio — makni oznaku' : 'Treba dio — javi voditelju')+'</button>';
    if(jeOtvoren(k) && !zadatak && !narudzbaZaKvar)
      /* K-3: veza narudžba->kvar se upiše sama dolaskom iz ovog konteksta.
         §16 P1: naručivanje (dobavljač, cijena) je voditeljev/nabava posao — tehničar je već
         javio "treba dio" (gore), ne mora i sam naručivati.
         SIM-FIX C3: prije se gumb skrivao dok voditelj ne postavi ceka_dio — a voditelj
         često unaprijed zna da treba naručiti dio, prije nego tehničar javi. */
      akcije += '<button class="btn sec block role-voditelj" style="margin-top:8px" onclick="app.naruciZaKvar(\''+kId+'\')">Naruči dio za ovaj kvar</button>';
    /* §16 P3 (rupa #5 "dio ugrađen usred kvara"): dosad se moglo razdužiti tek pri zatvaranju
       (Riješi kvar) ili na Skladištu "−" (gubi vezu s kvarom) — sad i dok je kvar još otvoren,

    if(jeOtvoren(k) && !zadatak)
      akcije += '<button class="btn sec block role-write" style="margin-top:8px" onclick="app.ugradiDioZaKvar(\''+kId+'\')">+ Ugrađen dio</button>';
    /* §15 #5: vanjski izvođač — kad tehničar/voditelj ne može sam (rashlada, elektro, garancija).
       Zove se s kvara: kontakt vrste Servis → tel: + zabilježi → zadatak s vezom + "Čeka servis". */
    if(jeOtvoren(k) && !zadatak)

    z.status = 'rijesen'; z.tko = SESSION.ime || null;
    z.closed_at = new Date().toISOString();   /* Raspored v45: "Odrađeno danas" na Planu dana */

       Sidro je rok (Todoist pravilo); za davno zakasnjeli zadatak broji se od danas,
       inače bi sljedeći termin odmah bio u prošlosti. */
    var novi = null;
    if(z.ponavljanje && z.rok){
      var baza = z.rok > todayISO() ? z.rok : todayISO();
      novi = {
        id:'kv'+Date.now(), m:z.m||null, date:todayISO(), opis:z.opis, sati:0,
        status:'otvoren', upoz:false, tko:null, zam:null, foto:null,

        ? await apiInsert('kvarovi', { m:novi.m, date:novi.date, opis:novi.opis, sati:0,

    }

  /* Raspored v45: dan je jedinica — dodir na dan (trak ili mreža) prikazuje TAJ dan
     (hero + agenda), ne umeće blok. U modu premještanja dan je meta. */
  rasporedOdaberiDan: function(iso){
    if(RASP_PREMJESTI){ app.izvrsiPremjestanje(iso); return; }
    RASP_ODABRAN = iso; RASP_ODABRAN_ZA = todayISO();
    RASP_TJEDAN = ponedjeljakTjedna(iso);
    if(!RASP_MJESEC) RASP_MJESEC = todayISO().slice(0,7);
    var r = rasporedRaspon();
    if(iso < r.start || iso > r.kraj) RASP_MJESEC = iso.slice(0,7);
    renderRaspored();
    window.scrollTo(0,0);
  },
  rasporedDan: function(iso){ app.rasporedOdaberiDan(iso); },
  rasporedTjedan: function(n){
    RASP_TJEDAN = addDaysISO(RASP_TJEDAN || ponedjeljakTjedna(todayISO()), 7*n);
    var danas = todayISO();

  izvozCSV: function(dani, mjesec){
    var od, doo = null;

      var p = mjesec.split('-');
      od = mjesec+'-01';
      doo = mjesec+'-'+pad2(new Date(parseInt(p[0],10), parseInt(p[1],10), 0).getDate());
    } else {
      dani = parseInt(dani,10)||0;
      od = dani ? isoShift(-dani) : '0000-00-00';
    }
    var glava = 'datum;stroj;vrsta;kategorija;opis;status;prioritet;smjena;sati_zastoja;trosak_eur;'+
                'dodijeljen;rijesio;sudjelovali;zamijenjeno;ceka_dio;linija_otpustena;privremeni_popravak;rok_sanacije';
    /* Analitika i IFS izbacuju storno i zadatke — izvoz mora brojati isto,
       inače voditelj i direktor iz istog klika dobiju dva različita broja. */
    var redovi = DATA.kvarovi.filter(function(k){
      return k.date >= od && (!doo || k.date <= doo) && k.status !== 'otkazan' && (k.tip||'kvar') === 'kvar';
    }).sort(byDateDesc).map(function(k){
      var m = machineById(k.m) || {name:''};
      var c = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };

              k.ceka_dio?'da':'ne', k.otpusteno?'da':'ne', k.privremeni?'da':'ne',
              k.rok_sanacije||''].map(c).join(';');
    });
    var blob = new Blob(['﻿'+glava+'\n'+redovi.join('\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

      var pid = id, naziv = p.naziv;
      clearTimeout(QTY_DEBOUNCE[pid].timer);
      QTY_DEBOUNCE[pid].timer = setTimeout(function(){
        var zap = QTY_DEBOUNCE[pid];
        delete QTY_DEBOUNCE[pid];
        if(zap && zap.prije !== p.stanje){
          sysPoruka('📦 Ispravak stanja: '+naziv+' '+zap.prije+' → '+p.stanje+' ('+esc(SESSION.ime||'')+')');
        }
      }, QTY_TRAG_MS);
    })();
    /* AUDIT-FIX: prije je ovo bio "pročitaj pa piši" (apiUpdate sa zadnjom poznatom
       vrijednosti) — dva brza dodira ili dva uređaja mogla su izgubiti jednu promjenu.
       Isti atomarni RPC koji već koristi trošenje dijela kod zatvaranja kvara: negativan
       p_kolicina znači povećanje (greatest(0, stanje - p_kolicina) sa -delta = +delta). */
    if(REMOTE && naMrezi()){
      try{
        var rpc = await sb.rpc('razduzi_dio', { p_id: p.id, p_kolicina: -delta });
        if(!rpc.error && typeof rpc.data === 'number'){
          p.stanje = rpc.data;
          var el2 = $('#parts-list');
          if(el2) el2.innerHTML = partsListHtml();
        } else {
          await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
        }
      }catch(e){ await apiUpdate('dijelovi', p.id, { stanje:p.stanje }); }
    } else {
      await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
    }

  savePrimitak: async function(e, id){
    e.preventDefault();
    var n = (DATA.nabava||[]).filter(function(x){ return x.id===id; })[0];
    if(!n || n.primljeno) return;
    var preostalo = n.kolicina - (n.primljena_kolicina||0);
    var kol = Math.max(0, Math.min(preostalo, parseInt(new FormData(e.target).get('kol'),10) || 0));
    if(!kol) return;
    app.closeModal();
    var p = dioPoId(n.dio_id);
    var novaPrimljena = (n.primljena_kolicina||0) + kol;
    var zavrseno = novaPrimljena >= n.kolicina;
    n.primljena_kolicina = novaPrimljena;
    n.primljeno = zavrseno ? todayISO() : null;
    if(p) p.stanje = p.stanje + kol;
    showScreen('nabava');
    if(REMOTE && naMrezi()){
      try{
        var rpc = await sb.rpc('primi_nabavu', { p_id:id, p_kolicina:kol, p_datum:todayISO() });
        if(!rpc.error && typeof rpc.data === 'number' && p) p.stanje = rpc.data;
        else throw rpc.error || new Error('rpc');
      }catch(e){
        await apiUpdate('nabava', id, { primljeno:n.primljeno, primljena_kolicina:n.primljena_kolicina });
        if(p) await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
      }
    } else {
      await apiUpdate('nabava', id, { primljeno:n.primljeno, primljena_kolicina:n.primljena_kolicina });
      if(p) await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
    }
    sysPoruka('📦 Primljeno: '+(p?p.naziv:'dio')+' ×'+kol+
      (zavrseno ? ' — narudžba zatvorena' : ' (preostalo ×'+(n.kolicina-novaPrimljena)+', narudžba ostaje otvorena)')+
      ' — na skladištu '+(p?p.stanje:'?')+' ('+(SESSION.ime||'')+')');
    /* K-2/K-3: dio je stigao — javi majstoru koji čeka. Ciljano ako narudžba zna za
       kvar (K-3); inače heuristikom po stroju na koji je dio vezan (K-2). */
    var vecObavijesten = {};
    if(n.kvar_id){
      var kk = DATA.kvarovi.filter(function(x){ return x.id===n.kvar_id; })[0];
      /* §16 P3 (rupa #1): narudžba zna TOČNO za koji kvar je — kad stigne (potpuno, ne
         djelomično), oznaka "Čeka dio" se skida sama. Bez ovoga je Pregled/Raspored za
         proizvodnju i dalje govorio "Čeka dio · stoji" dok tehničar ručno ne makne kvačicu. */
      if(kk && jeOtvoren(kk) && kk.ceka_dio && zavrseno){
        kk.ceka_dio = false;
        await apiUpdate('kvarovi', kk.id, { ceka_dio:false });
        sysPoruka('📦 Dio stigao — "Čeka dio" skinuto s '+(machineById(kk.m)||{name:'—'}).name+': '+kk.opis, kk.id);
      }
      if(kk && jeOtvoren(kk) && kk.dodijeljen){
        posaljiObavijest('📦 Stigao naručeni dio', (p?p.naziv:'dio')+' je stigao za tvoj kvar — možeš nastaviti.', '#kvarovi', kk.dodijeljen);
        vecObavijesten[kk.id] = true;
      }
    }
    if(p && (p.strojevi||[]).length){
      DATA.kvarovi.filter(function(k){
        return jeOtvoren(k) && k.ceka_dio && !vecObavijesten[k.id] && k.m && k.dodijeljen && p.strojevi.indexOf(k.m) > -1;
      }).forEach(function(k){
        var km = machineById(k.m);
        posaljiObavijest('📦 Stigao dio', p.naziv+' je stigao — možda možeš nastaviti na '+(km?km.name:'')+'.', '#kvarovi', k.dodijeljen);
      });
    }
  },

  saveObavljeno: async function(e, pId){
    e.preventDefault();
    var p = DATA.preventiva.filter(function(x){ return x.id===pId; })[0];
    if(!p) return;
    var f = new FormData(e.target);
    var datum = f.get('datum') || todayISO();
    p.zadnje = datum;
    p.tkoZadnji = f.get('tko');
    var sh = parseFloat(f.get('stvarno_h'));
    p.stvarno_h = isNaN(sh) ? null : sh;
    p.next = addDaysISO(datum, intervalDays(p.interval));

      if(pdio){
        var prijeDio = pdio.stanje;

          sysPoruka('📦 Dio ispod minimuma: '+pdio.naziv+' (stanje '+pdio.stanje+', min '+pdio.min+') — naručiti!');

          try{

    app.closeModal();

    }
    await apiUpdate('preventiva', p.id, { zadnje:p.zadnje, tko_zadnji:p.tkoZadnji, next:p.next, stvarno_h:p.stvarno_h });
    if(pd && p.m){
      var path = pd.dataUrl;
      if(REMOTE){
        var poslano = await uploadDokument(p.m, pd.dataUrl, pd.mime);
        if(!poslano) return;   /* zapisnik nije poslao — preventiva je svejedno potvrđena, ne rušimo taj tok */
        path = poslano;
      }
      var dok = { id:'dok'+Date.now(), m:p.m, naziv:p.opis+' — '+fmtDate(datum), tip:'zapisnik', path:path,
        mime:pd.mime, velicina:pd.velicina||0, tko:SESSION.ime||'', created_at:new Date().toISOString(),
        preventiva_id:p.id };
      if(!DATA.dokumenti) DATA.dokumenti = [];

      if(REMOTE){
        var res = await sb.from('dokumenti').insert({ m:dok.m, naziv:dok.naziv, tip:dok.tip, path:dok.path,
          mime:dok.mime, velicina:dok.velicina, tko:dok.tko, preventiva_id:dok.preventiva_id }).select().single();
        if(!res.error) dok.id = res.data.id;
      } else { save(); }

  },

  rijesiKvar: function(kId){

    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    /* SIM-FIX A3: zadatak (npr. iz "Zovi servis") posuđivao je cijeli rječnik kvara —
       "zastoj linije", "Zatvori kvar", skladište — iako zadatak ništa od toga nema. */
    var zadatak = (k.tip||'kvar')==='zadatak';
    PENDING_FOTO = '';
    var m = machineById(k.m) || {name:''};
    var dioOpts = '<option value="">—</option>' + DATA.dijelovi.map(function(d){
      return '<option value="'+d.id+'">'+esc(d.naziv)+' (stanje '+d.stanje+')</option>';
    }).join('');
    var satiPolje = zadatak
      ? '<label>Utrošeno vremena (h, izborno)</label>'+
        '<input type="number" name="sati" step="0.5" min="0" max="720" placeholder="prazno = 0">'
      : (function(){
        /* Brza prijava sprema sati:0. Kad bi ovdje pisala nula, ona bi i ostala —
           a to je jedini kanal kojim stvarni zastoj ikad uđe u evidenciju.
           AUDIT-FIX (§14.2 t.1): prijedlog se računa uživo iz poceo_at→sada, ne iz starog
           k.sati (koji je do sada bio ili zastarjela nagađanje s prijave, ili već upisan). */
        var pK = pocetakKvara(k);
        var satiUzivo = pK ? Math.round(((Date.now()-pK.getTime())/3600000)*2)/2 : 0;

          (satiUzivo > 0
            ? '<div class="row-sub" style="margin-top:-4px">Predloženo prema vremenu otkad je preuzeto — ispravi ako treba.</div>'
            : (predlog > 0 ? '' : '<div class="row-sub" style="margin-top:-4px">Upiši stvarno trajanje — iz ovoga se računa trošak zastoja.</div>'));
      })();
    var dodatno = zadatak ? '' :
        '<label>Utrošeni dio sa skladišta</label><select name="dio">'+dioOpts+'</select>'+

           majstor koji zatvara kvar na licu mjesta ionako zna je li popravak privremen. */
        '<label class="prekidac" style="margin-top:8px"><input type="checkbox" name="privremeni"'+(k.privremeni?' checked':'')+

        '<div id="polje-sanacije" style="margin-top:8px'+(k.privremeni?'':';display:none')+'">'+
          '<label>Rok trajne sanacije</label>'+
          '<input type="date" name="rok_sanacije" value="'+esc(k.rok_sanacije||'')+'">'+
        '</div>';
    $('#modal-root').innerHTML =
      '<div class="overlay" onclick="if(event.target===this)app.closeModal(\'izvan\')"><div class="modal">'+
      '<div class="modal-head"><h3>'+(zadatak?'Označi obavljeno':'Riješi kvar')+'</h3><button class="x" onclick="app.closeModal()">✕</button></div>'+
      '<div class="row-sub" style="margin-bottom:2px">'+esc(m.name)+' &middot; '+esc(k.opis)+'</div>'+

           s njegovog imena na tehničarovo — pretpostavka je "tko je radio", ne "tko zatvara". */
        '<label>Riješio</label><select name="tko">'+majstorOpts(k.dodijeljen || SESSION.ime)+'</select>'+
        (zadatak ? '' :
          '<label class="prekidac"><input type="checkbox" name="otpusteno"'+(k.otpusteno?' checked':'')+'>'+
            '<span>Linija otpuštena nakon čišćenja i pregleda na strana tijela</span></label>')+

  saveRijesen: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var zadatak = (k.tip||'kvar')==='zadatak';
    /* SIM-FIX A3: zadatak nema "zastoj" — polje je izborno, prazno = 0, bez upozorenja o danima */
    var sh = parseFloat(f.get('sati'));
    if(zadatak){
      if(isNaN(sh) || sh < 0) sh = 0;
    } else {
      if(isNaN(sh) || sh < 0 || sh > 720){ alert('Trajanje zastoja mora biti između 0 i 720 sati (30 dana).'); return; }
      if(sh > 72 && !confirm('Upisano je '+H(sh)+' — to je '+Math.round(sh/24*10)/10+' dana. Je li točno?')) return;
    }
    k.sati = sh;
    k.status = 'rijesen'; k.upoz = false; k.ceka_dio = false; k.ceka_servis = false;
    /* IFS: u izvještaj ide samo ono što je netko stvarno potvrdio */
    k.otpusteno = !!f.get('otpusteno');
    k.tko = f.get('tko');
    k.sudjelovali = f.getAll('sudjelovali_ime').join(', ') || null;
    k.zam = String(f.get('zam')||'').trim() || null;
    if(!zadatak){
      /* SIM-FIX C1: privremeni popravak/rok sanacije se sad mogu upisati i pri zatvaranju kvara */
      k.privremeni = !!f.get('privremeni');
      k.rok_sanacije = k.privremeni ? (f.get('rok_sanacije') || null) : null;
    }
    /* razduživanje skladišta: utrošeni dio smanjuje stanje i upisuje se u "Zamijenjeno" */
    var dioId = f.get('dio');
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    if(dioId){
      var p = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(p){
        var prije = p.stanje;
        p.stanje = Math.max(0, p.stanje - kol);
        if(!k.zam) k.zam = p.naziv + (kol>1 ? ' ×'+kol : '');
        else k.zam += ' + ' + p.naziv + (kol>1 ? ' ×'+kol : '');
        if(prije >= p.min && p.stanje < p.min){
          sysPoruka('📦 Dio ispod minimuma: '+p.naziv+' (stanje '+p.stanje+', min '+p.min+') — naručiti!');
          toast('⚠ '+p.naziv+': stanje '+p.stanje+' (min '+p.min+') — naručiti');   /* SIM-FIX B6 */
        }
        /* atomarno u bazi: dva majstora u isto vrijeme ne smiju izgubiti komad */
        if(REMOTE && naMrezi()){
          try{
            var rpc = await sb.rpc('razduzi_dio', { p_id: p.id, p_kolicina: kol });
            if(!rpc.error && typeof rpc.data === 'number') p.stanje = rpc.data;
            else await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
          }catch(e){ await apiUpdate('dijelovi', p.id, { stanje:p.stanje }); }
        } else {
          await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
        }
      }
    }
    var pendingFotoGotov = PENDING_FOTO; PENDING_FOTO = '';
    app.closeModal();
    showScreen($('#screen-stroj').classList.contains('hidden') ? 'kvarovi' : 'stroj');
    var rm = machineById(k.m);
    sysPoruka('✅ '+(k.tip==='zadatak'?'Zadatak obavljen':'Kvar riješen')+': '+
      (rm ? rm.name+' — ' : '')+k.opis+' ('+esc(k.tko||'')+')', k.id);
    /* §11.5: foto i kod rješavanja — dokaz da je popravak stvarno gotov, ne samo prijava */
    if(pendingFotoGotov) k.foto_rijeseno = REMOTE ? await uploadFoto(pendingFotoGotov) : pendingFotoGotov;
    await apiUpdate('kvarovi', k.id, { sati:k.sati, status:k.status, upoz:false, ceka_dio:false, ceka_servis:false,
      otpusteno:k.otpusteno, tko:k.tko, zam:k.zam, sudjelovali:k.sudjelovali,
      privremeni:k.privremeni, rok_sanacije:k.rok_sanacije,
      foto_rijeseno:k.foto_rijeseno, closed_at:new Date().toISOString() });
    /* SIM-FIX A2: "Zovi servis" stvara zadatak (izvor_kvar, opis "Servis …") koji je do sada
       ostajao otvoren i nakon što je sam kvar riješen — nitko ga svjesno ne zatvara. Kvar je
       riješen ⇒ poziv servisu za taj kvar je gotova priča. */
    if(k.tip!=='zadatak'){
      var vezaniZad = DATA.kvarovi.filter(function(x){
        return x.izvor_kvar===k.id && x.tip==='zadatak' && jeOtvoren(x) && String(x.opis||'').indexOf('Servis ')===0;
      });
      for(var vzI=0; vzI<vezaniZad.length; vzI++){
        var vz = vezaniZad[vzI];
        vz.status = 'rijesen';
        sysPoruka('✅ Zadatak obavljen: '+vz.opis, vz.id);
        await apiUpdate('kvarovi', vz.id, { status:'rijesen', closed_at:new Date().toISOString() });
      }
    }
  },

  saveUredi: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var prijeDodijeljen = k.dodijeljen;
    var prijePrioritet = k.prioritet;
    k.m = f.get('m') || null;
    k.opis = String(f.get('opis')||'').trim() || k.opis;
    k.date = f.get('date') || k.date;
    /* Uredi dosad nije provjeravao sate — nerealan unos hvatala je tek baza, i to
       porukom "Spremanje NIJE uspjelo". Ista pravila kao pri prijavi i zatvaranju. */
    var satiU = parseFloat(f.get('sati'));
    if(isNaN(satiU)) satiU = 0;
    if(satiU < 0 || satiU > 720){ alert('Trajanje zastoja mora biti između 0 i 720 sati (30 dana).'); return; }
    if(satiU > 72 && satiU !== k.sati &&
       !confirm('Upisano je '+H(satiU)+' — to je '+Math.round(satiU/24*10)/10+' dana. Je li točno?')) return;
    k.sati = satiU;
    k.kategorija = f.get('kategorija') || 'Ostalo';
    k.dodijeljen = f.get('dodijeljen') || null;
    k.prioritet  = f.get('prioritet') || 'normalno';
    k.smjena     = f.get('smjena') || null;
    if(k.status==='rijesen'){
      k.tko = f.get('tko') || k.tko;
      k.sudjelovali = f.getAll('sudjelovali_ime').join(', ') || null;
      k.zam = String(f.get('zam')||'').trim() || null;
    } else {
      k.ceka_dio = !!f.get('ceka');
      if(k.tip!=='zadatak') k.procjena_gotovo = f.get('procjena_gotovo') || null;
    }
    if(k.tip==='zadatak'){
      k.rok = f.get('rok') || null;
      k.ponavljanje = parseInt(f.get('ponavljanje'),10) || null;
    }
    k.privremeni = !!f.get('privremeni');
    k.rok_sanacije = k.privremeni ? (f.get('rok_sanacije') || null) : null;
    if(k.dodijeljen && k.dodijeljen !== prijeDodijeljen && jeOtvoren(k)){
      var dm = machineById(k.m);
      posaljiObavijest('📋 Dodijeljeno tebi', (dm?dm.name+': ':'')+k.opis, '#kvarovi', k.dodijeljen);
    }
    /* F: obavijest se dosad slala ISKLJUČIVO kad se promijeni dodijeljen — promjena
       prioriteta je tiho odlazila u bazu. Kvar prijavljen bez kvačice pa eskaliran na
       hitno je prošao nezamijećen. Isto pravilo kao obavijestNoviKvar za novi hitni kvar:
       broadcast (bez samoZa) svima, ne samo dodijeljenom. */
    if(k.prioritet==='hitno' && prijePrioritet!=='hitno' && jeOtvoren(k)){
      var hm = machineById(k.m);
      sysPoruka('🔴 HITNO — '+(hm?hm.name+': ':'')+k.opis+' ('+(SESSION.ime||'')+')', k.id);
      posaljiObavijest('🔴 HITNO', (hm?hm.name+': ':'')+k.opis, '#kvarovi');
    }
    app.closeModal();
    /* zadatak uređen s Rasporeda vraća na Raspored, ne na Kvarove */
    showScreen(!$('#screen-stroj').classList.contains('hidden') ? 'stroj'
      : (k.tip==='zadatak' && CURRENT_SCREEN==='raspored' ? 'raspored' : 'kvarovi'));
    var patch = { m:k.m, opis:k.opis, date:k.date, sati:k.sati,
      kategorija:k.kategorija, dodijeljen:k.dodijeljen, prioritet:k.prioritet,
      smjena:k.smjena, ceka_dio:k.ceka_dio, tko:k.tko, sudjelovali:k.sudjelovali, zam:k.zam,
      privremeni:k.privremeni, rok_sanacije:k.rok_sanacije };
    if(k.tip==='zadatak'){ patch.rok = k.rok; patch.ponavljanje = k.ponavljanje; }
    else patch.procjena_gotovo = k.procjena_gotovo;
    await apiUpdate('kvarovi', k.id, patch);
  },

  fotoOdabrana: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_FOTO = c.toDataURL('image/jpeg', 0.72);
        var prev = document.getElementById('foto-prev');
        if(prev){ prev.src = PENDING_FOTO; prev.style.display = 'block'; }
        var lbl = document.getElementById('foto-label');
        if(lbl) lbl.textContent = '✓ '+file.name;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

  /* ---- dokumenti uz stroj (F4) ---- */
  dokumentOdabran: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 10*1024*1024){ alert('Datoteka je veća od 10 MB — smanji je ili odaberi drugu.'); e.target.value=''; return; }
    var oznaci = function(dataUrl, mime){
      PENDING_DOK = { dataUrl:dataUrl, mime:mime, naziv:file.name, velicina:file.size };
      var ime = document.getElementById('dok-ime');
      if(ime) ime.textContent = '✓ '+file.name;
    };
    if(file.type.indexOf('image') === 0){
      /* slika se smanji na canvasu prije slanja — 1600px/kvaliteta .8 (900px iz brze
         prijave kvara je premalo da shema ili sitni tisak zapisnika ostanu čitljivi) */
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var max = 1600, k = Math.min(1, max/Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          oznaci(c.toDataURL('image/jpeg', 0.8), 'image/jpeg');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function(ev){ oznaci(ev.target.result, file.type || 'application/pdf'); };
      reader2.readAsDataURL(file);
    }
  },

      velicina:pd.velicina||0, tko:SESSION.ime||'', created_at:new Date().toISOString() };

/* =====================  prijava — pomoćne  ===================== */
/* Pločice idu po hijerarhiji u firmi, ne abecedno/kako baza vrati red — direktor
   gore, tehničar dolje. Ime nosi ulogu i za stvarne korisnike (nema uloge u
   prijava_popis), pa se prepoznaje po nazivu; nepoznato ime pada na dno kao "tehničar". */
function loginPrioritet(naziv){
  if(naziv==='Direktor') return 0;
  if(naziv==='Voditelj') return 1;
  if(naziv==='Voditelj proizvodnje') return 2;
  return 3;
}

  }).join('');
}

async function postLogin(){
  /* Svaki await ovdje je prilika da korisnik u međuvremenu uđe u demo (ili se
     odjavi). Zastarjeli postLogin tada NE SMIJE nastaviti — njegov load() bi kroz
     localLoad zamijenio DATA i učinio siročadima sve već otvorene zapise. */
  var mojaSesija = SESIJA_GEN;
  var u = (await sb.auth.getUser()).data.user;
  if(SESIJA_GEN !== mojaSesija) return;
  if(!u) throw new Error('nema sesije');
  var prof = await sb.from('users').select('*').eq('id', u.id).single();
  if(SESIJA_GEN !== mojaSesija) return;
  if(prof.error || !prof.data){
    /* račun postoji u Auth, ali nema red u tablici users → nema uloge.
       Jasna poruka umjesto tihe readonly prijave. */
    try{ await sb.auth.signOut(); }catch(e){}
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Račun postoji, ali nema dodijeljenu ulogu (tablica users) — javi voditelju.';
    return;
  }
  if(SESIJA_GEN !== mojaSesija) return;   /* korisnik je u međuvremenu ušao u demo */
  SESSION.ime  = prof.data.ime;
  SESSION.role = prof.data.role;
  document.body.dataset.role = SESSION.role;
  $('#screen-login').classList.remove('show');
  try{
    await load();
  }catch(e){
    /* nema mreže pri pokretanju — radi iz lokalnog keša */
    if(cacheUcitaj()){ primijeniRed(); toast('Radiš iz lokalne kopije — nema mreže'); }
    else { $('#login-err').textContent = 'Nema veze s bazom i nema lokalne kopije.'; throw e; }
  }
  osvjeziOfflineTraku();
  /* §16 P2: direktor (2×/tjedno) ima jedan relevantan ekran — € i "stoji li nešto".
     Zapamćen zadnji ekran (npr. Strojevi od prošlog posjeta) mu ne služi kao svima ostalima.
     §16.5 #2: tehničar nema karticu "Pregled" — prvi ulazak (bez zapamćenog ekrana) ide na
     Raspored, njegov stvarni prvi ekran. */
  if(!initHash()) showScreen(SESSION.role==='readonly' ? 'pregled' :
    (zadnjiEkran() || (SESSION.role==='majstor' ? 'raspored' : 'pregled')));
  dobrodoslica();

}

/* dijelovi se vežu na strojeve preko šifri (ne slobodnog teksta) — podaci ne trunu */

   se svaki put tipkaju iznova bez ijednog prijedloga izvedenog iz postojećih vrijednosti. */

var KAT_KVARA = ['Mehanički','Električni','Pneumatika i rashlada','Ostalo'];
var KAT_DIJELOVA = ['Remeni i prijenos','Ležajevi','Brtve i maziva','Senzori i elektrika',
                    'Grijači','Folije i ambalaža','Rashladna tehnika','Alati i matrice','Ostalo'];

function aktivni(){ return DATA.kvarovi.filter(function(k){ return k.status !== 'otkazan'; }); }
/* nezavrsen = prijavljen ili netko vec radi na njemu */
function jeOtvoren(k){ return k.status === 'otvoren' || k.status === 'u_radu'; }
function samoKvarovi(){ return aktivni().filter(function(k){ return (k.tip||'kvar') === 'kvar'; }); }
function autoKat(opis){

  if(/senzor|grija|fotosen|elektri/.test(o)) return 'Električni';
  if(/tlak|ventil|kompresor|rashlad|kondenzator|led/.test(o)) return 'Pneumatika i rashlada';
  if(/remen|ležaj|matric|brtv|nož|folij|traka|valj|dozator|reduktor/.test(o)) return 'Mehanički';
  return 'Ostalo';
}
/* AUDIT-FIX (UX): najčešći opisi kvara kao dodir, ne tipkanje od nule — dopunjuju
   postojeći tekst, ne zamjenjuju ga (majstor može dodati i stroj/detalj ručno). */

function sysPoruka(tekst, kvarId){

  else save();
