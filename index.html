      '<div class="row-sub" style="margin-bottom:var(--r2)">'+esc(k.opis)+'</div>'+
      '<div class="card">'+listaHtml+'</div>'+
      '<form class="role-write" onsubmit="app.dodajKomentar(event,\''+kId+'\')">'+
        '<label>Novi komentar</label>'+
        '<textarea name="tekst" rows="2" required placeholder="što je napravljeno, što čeka, kome je predano…"></textarea>'+
        '<button class="btn primary block" type="submit">Dodaj komentar</button>'+
      '</form></div></div>';
  },
  /* ─── app [06] BRZA PRIJAVA KVARA — prijaviZaStroj, brzaPrijava, saveBrza ─── */

    var strojOpcije = DATA.machines.map(function(m){ return { v:m.id, t:m.name }; });

          ' Slikaj'+

        '<img id="foto-prev" class="foto-prev" alt="pregled fotografije">'+

           jezikom hale, ne tehničkim "HITNO" (prioritet/obavijesti ostaju nepromijenjeni,

        '<div id="brza-treba-do" style="display:none">'+
          '<label>Treba mi do</label><input type="datetime-local" name="treba_do">'+

          '<label>Datum</label><input type="date" name="date" value="'+todayISO()+'">'+
          '<label>Smjena</label><select name="smjena"><option value="">— automatski —</option>'+
            (TVRTKA.smjene||[]).map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('')+
          '</select>'+
        '</div>'+
        '<button class="btn primary block" type="submit">'+
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"></path></svg>'+
          ' Prijavi kvar'+
        '</button>'+
      '</form></div></div>';
  },
  saveBrza: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    /* AUDIT F1: skriveni select iz odabirPolje nema required, a opis od samih razmaka
       prolazi HTML required — bez ovoga nastaje kvar bez stroja/opisa koji analitika,
       "Stoji" i IFS ne znaju smjestiti. */
    if(!f.get('m')){ toast('Odaberi stroj'); return; }
    if(!String(f.get('opis')||'').trim()){ toast('Upiši što se dogodilo'); return; }
    var hitno = !!f.get('hitno');
    /* ODLUKA 7 (3.9.2026.): "Treba mi do" vrijedi samo dok je "Linija stoji" uključeno —
       polje ostaje u DOM-u (samo skriveno) dok je isključeno, pa se ne smije čitati onda.
       Sprema se kao pravi UTC trenutak (kvarovi.treba_do je timestamptz), ne sirovi tekst
       iz <input>, da prikaz na drugom uređaju/vremenskoj zoni ne odstupa. */
    var trebaDoU = hitno ? f.get('treba_do') : '';
    var trebaDo = null;
    if(trebaDoU){
      var tdDatum = new Date(trebaDoU);

    var prioritetU = f.get('prioritet');

    };

    DATA.kvarovi.push(kvar);
    app.closeModal(); showScreen('kvarovi');
    var bm = machineById(kvar.m) || {name:''};
    if(REMOTE){
      kvar.foto = await uploadFoto(pendingFoto) || null;
      var najavaTekst = (hitno?'🔴 HITNO — ':'⚠ ')+'Prijavljen kvar: '+bm.name+' — '+kvar.opis+' ('+(SESSION.ime||'')+')';
      var spremljen = await apiInsert('kvarovi', { m:kvar.m, date:kvar.date, opis:kvar.opis, sati:0,
        status:'otvoren', upoz:false, foto:kvar.foto, prioritet:kvar.prioritet, smjena:kvar.smjena,
        kategorija:kvar.kategorija, tip:'kvar', dodijeljen:kvar.dodijeljen, treba_do:kvar.treba_do }, kvar,  /* AUDIT F1: dodjela iz "+ Više" se gubila */
        /* AUDIT F3: ako upis ode u offline red, poruka i push krecu tek kad red prodje */
        { najava: { tekst: najavaTekst,
                    obavijest: kvar.prioritet==='hitno' ? { naslov:'HITAN KVAR', tekst:(bm.name?bm.name+': ':'')+kvar.opis, ruta:'#kvarovi', samoZa:null }
                             : kvar.dodijeljen ? { naslov:'Novo za tebe', tekst:(bm.name?bm.name+': ':'')+kvar.opis, ruta:'#kvarovi', samoZa:kvar.dodijeljen }
                             : { naslov:'Novi kvar — nedodijeljen', tekst:(bm.name?bm.name+': ':'')+kvar.opis, ruta:'#kvarovi', samoZa:null } } });
      /* zapis i obavijest tek NAKON sto je kvar stvarno u bazi — inace javljamo nesto sto ne postoji */
      if(spremljen){
        zapamtiMojUnos(kvar.id);
        sysPoruka((hitno?'🔴 HITNO — ':'⚠ ')+'Prijavljen kvar: '+bm.name+' — '+kvar.opis+' ('+(SESSION.ime||'')+')', kvar.id);
        obavijestNoviKvar(kvar, bm);
      }
    } else {
      save();
      sysPoruka((hitno?'🔴 HITNO — ':'⚠ ')+'Prijavljen kvar: '+bm.name+' — '+kvar.opis+' ('+(SESSION.ime||'')+')', kvar.id);

  posaljiPoruku: async function(e){
    e.preventDefault();
    if(PORUKA_SALJE_SE) return;   /* AUDIT F8: renderPoruke() zamijeni gumb PRIJE apiInsert-a */
    var f = new FormData(e.target);
    var txt = String(f.get('tekst')||'').trim();
    if(!txt) return;
    PORUKA_SALJE_SE = true;
    try{
      var p = { id:'po'+Date.now(), tko:SESSION.ime||'Voditelj', tekst:txt, kvar_id:null, created_at:new Date().toISOString() };
      if(!DATA.poruke) DATA.poruke = [];
      DATA.poruke.push(p);
      /* AUDIT-FIX: renderPoruke() (F2) namjerno vraća nacrt koji bi inače nestao kad
         pozadinski poll prerenderira ekran dok korisnik piše — ali čita ga IZ POLJA PRIJE
         nego što ga isprazni. Bez ovoga je upravo poslani tekst ostajao u polju kao da
         nikad nije poslan (i pozivao na slučajni dvostruki resend). Isprazni PRIJE rendera. */
      e.target.reset();
      await renderPoruke();
      /* S9: vlastita poruka uvijek odvede na dno i vrati fokus — bez obzira gdje je
         korisnik čitao prije slanja (sticky obrazac dopušta slanje i dok se čita povijest) */
      app.porukeNaDno();
      var ta = document.querySelector('#screen-poruke textarea[name="tekst"]');
      if(ta) ta.focus();
      /* AUDIT: ako upis ode u offline red, obavijest krece tek kad red prodje sinkronizacijom */
      var spremljenaPoruka = await apiInsert('poruke', { tko:p.tko, tekst:p.tekst }, p,
        { najava: { obavijest: { naslov:'Poruka — '+p.tko, tekst:txt.slice(0,120), ruta:'#poruke', samoZa:null } } });
      if(spremljenaPoruka || !REMOTE) posaljiObavijest('Poruka — '+p.tko, txt.slice(0,120), '#poruke');
    } finally { PORUKA_SALJE_SE = false; }

  saveZadatak: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    var pon = f.get('ponavljanje');
    /* AUDIT-FIX: "Svakih N dana…" bez upisanog broja je tiho stvaralo jednokratni zadatak
       (parseInt('')||null je null) — sad se traži broj prije spremanja. */
    if(pon==='n' && !parseInt(f.get('ponavljanje_n'),10)){ toastUpoz('Upiši broj dana za ponavljanje.'); return; }
    pon = pon==='n' ? (parseInt(f.get('ponavljanje_n'),10) || null) : (parseInt(pon,10) || null);
    var rok = f.get('rok') || null;
    /* ponavljanje bez roka nema sidro — prvi termin je danas */
    if(pon && !rok) rok = todayISO();
    /* AUDIT-FIX: "Bilješka" i "Podsjetnik" imaju poseban naslov/obrazac pri unosu, ali su
       nakon spremanja bili posve nerazlučivi od običnog radnog zadatka (isti tip:'zadatak',
       nema stupca za razliku) — u Rasporedu/"Bez roka" izgledaju kao bilo koji drugi
       zadatak. Lagan vizualni prefiks u samom opisu, bez promjene sheme/arhitekture
       (kvarovi=prijave, organizacija=Raspored+zadaci — jedan tip ostaje jedan izvor istine). */
    var vrsta = f.get('vrsta');
    var opisPrefiks = vrsta==='biljeska' ? '📝 ' : (vrsta==='podsjetnik' ? '🔔 ' : '');
    var z = {
      id:'kv'+Date.now(), m:f.get('m') || null, date:todayISO(),
      opis:opisPrefiks+String(f.get('opis')||'').trim(), sati:0,
      status:'otvoren', upoz:false, tko:null, zam:null, foto:null,
      dodijeljen:f.get('dodijeljen') || null, prioritet:'normalno', smjena:null,
      ceka_dio:false, sudjelovali:null, tip:'zadatak', rok:rok,
      kategorija:'Ostalo', otpusteno:false, privremeni:false, rok_sanacije:null,
      izvor_kvar:f.get('izvor_kvar') || null, kontakt_id:f.get('kontakt_id') || null,
      ponavljanje:pon,
      created_at:new Date().toISOString()
    };
    DATA.kvarovi.push(z);
    app.closeModal(); showScreen('raspored');
    var zadNajava = '📋 Novi zadatak: '+z.opis+(z.dodijeljen?' → '+z.dodijeljen:'')+' ('+(SESSION.ime||'')+')';
    /* AUDIT: ako upis ode u offline red, trag/obavijest krecu tek kad red prodje sinkronizacijom
       (isti obrazac kao saveBrza za prijavu kvara) */
    var spremljen = REMOTE
      ? await apiInsert('kvarovi', { m:z.m, date:z.date, opis:z.opis, sati:0, status:'otvoren',
          upoz:false, dodijeljen:z.dodijeljen, prioritet:'normalno', tip:'zadatak', rok:z.rok,
          kategorija:'Ostalo', izvor_kvar:z.izvor_kvar, kontakt_id:z.kontakt_id,
          ponavljanje:z.ponavljanje }, z,
          { najava: { tekst: zadNajava,
                      obavijest: z.dodijeljen ? { naslov:'📋 Dodijeljeno tebi', tekst:z.opis, ruta:'#raspored', samoZa:z.dodijeljen } : null } })
      : (save(), true);
    if(spremljen){
      if(REMOTE) zapamtiMojUnos(z.id);
      sysPoruka(zadNajava, z.id);
      if(z.dodijeljen) posaljiObavijest('📋 Dodijeljeno tebi', z.opis, '#raspored', z.dodijeljen);

  obaviZadatak: async function(id){
    if(jeTempId(id)){ toastUpoz('Zapis se upravo sprema u bazu — pokušaj za par sekundi.'); return; }
    var z = DATA.kvarovi.filter(function(x){ return x.id===id; })[0];
    if(!z) return;
    if(z.status==='rijesen') return;  /* AUDIT F2: dupli dodir je stvarao drugi ponavljajuci zadatak */
    z.status = 'rijesen'; z.tko = SESSION.ime || null;
    z.closed_at = new Date().toISOString();   /* Raspored v45: "Odrađeno danas" na Planu dana */
    /* SIM-FIX J: obrnuti smjer od SIM-FIX A2 (koja zatvaranjem kvara gasi servisni zadatak).
       "Zovi servis" postavlja izvor.ceka_servis i stvara ovaj zadatak s izvor_kvar — dosad se
       oznaka "Čeka servis" gasila samo zatvaranjem SAMOG kvara, pa je ostajala zauvijek ako bi
       netko prvo kvačicom obavio servisni zadatak. Vrijedi i kad je zadatak ponavljajući (grana
       ispod) — gasi se ceka_servis na izvoru za OVU obavljenu instancu, nova instanca ne dira. */
    if(z.izvor_kvar){
      var izvor = DATA.kvarovi.filter(function(x){ return x.id===z.izvor_kvar; })[0];
      if(izvor && izvor.ceka_servis){
        izvor.ceka_servis = false;
        sysPoruka('✓ "Čeka servis" skinuto (obavljen zadatak: '+z.opis+')', izvor.id);
        await apiUpdate('kvarovi', izvor.id, { ceka_servis:false });
      }
    }
    /* S5: ponavljajući zadatak — obavljanjem se sam stvori sljedeći.
       Sidro je rok (Todoist pravilo); za davno zakasnjeli zadatak broji se od danas,
       inače bi sljedeći termin odmah bio u prošlosti. */
    var novi = null;
    if(z.ponavljanje && z.rok){
      var baza = z.rok > todayISO() ? z.rok : todayISO();
      novi = {
        id:'kv'+Date.now(), m:z.m||null, date:todayISO(), opis:z.opis, sati:0,
        status:'otvoren', upoz:false, tko:null, zam:null, foto:null,
        dodijeljen:z.dodijeljen||null, prioritet:'normalno', smjena:null,
        ceka_dio:false, sudjelovali:null, tip:'zadatak',
        rok:addDaysISO(baza, z.ponavljanje),
        kategorija:'Ostalo', otpusteno:false, privremeni:false, rok_sanacije:null,
        izvor_kvar:z.izvor_kvar||null, kontakt_id:z.kontakt_id||null,
        ponavljanje:z.ponavljanje, created_at:new Date().toISOString()
      };
      DATA.kvarovi.push(novi);
    }
    rerender();
    sysPoruka('✅ Zadatak obavljen: '+z.opis+' ('+(SESSION.ime||'')+')', z.id);
    /* uvjet sprjecava utrku s rasporedPonistiZadatak (toast "Poništi" 5s) — bez ovoga dva
       usporedna zahtjeva nad istim retkom mogu na server stici obrnutim redoslijedom */
    await apiUpdate('kvarovi', z.id, { status:'rijesen', tko:z.tko, closed_at:z.closed_at }, { status:['otvoren','u_radu'] });
    if(novi){
      var spremljen = REMOTE
        ? await apiInsert('kvarovi', { m:novi.m, date:novi.date, opis:novi.opis, sati:0,
            status:'otvoren', upoz:false, dodijeljen:novi.dodijeljen, prioritet:'normalno',
            tip:'zadatak', rok:novi.rok, kategorija:'Ostalo', izvor_kvar:novi.izvor_kvar,
            kontakt_id:novi.kontakt_id, ponavljanje:novi.ponavljanje }, novi)
        : (save(), true);
      if(spremljen) sysPoruka('🔁 Ponavlja se: '+novi.opis+' — sljedeći termin '+fmtDate(novi.rok), novi.id);
    }
  },

  kasniPonistiSveNaDanas: async function(stavke){

       u REMOTE načinu N paralelnih apiUpdate poziva moglo istovremeno pasti i svaki bi
       zasebno digao alert + load() + rerender(). */
    for(var i=0;i<stavke.length;i++){

  izvozCSV: function(dani, mjesec){

      doo = mjesec+'-'+pad2(new Date(parseInt(p[0],10), parseInt(p[1],10), 0).getDate());
    } else {
      dani = parseInt(dani,10)||0;
      od = dani ? isoShift(-dani) : '0000-00-00';
    }
    var glava = 'datum;stroj;vrsta;kategorija;opis;status;prioritet;smjena;sati_zastoja;trosak_eur;'+
                'dodijeljen;rijesio;sudjelovali;zamijenjeno;ceka_dio;linija_otpustena;privremeni_popravak;rok_sanacije';
    /* Analitika i IFS izbacuju storno i zadatke — izvoz mora brojati isto,
       inače voditelj i direktor iz istog klika dobiju dva različita broja. */
    var redovi = DATA.kvarovi.filter(function(k){
      return k.date >= od && (!doo || k.date <= doo) && k.status !== 'otkazan' && (k.tip||'kvar') === 'kvar';
    }).sort(byDateDesc).map(function(k){
      var m = machineById(k.m) || {name:''};
      var c = function(v){ var s = String(v==null?'':v); if(/^[=+\-@\t\r]/.test(s)) s = "'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
      return [k.date, m.name, k.tip||'kvar', k.kategorija||'', k.opis, k.status, k.prioritet||'', k.smjena||'', k.sati,

              k.ceka_dio?'da':'ne', k.otpusteno?'da':'ne', k.privremeni?'da':'ne',
              k.rok_sanacije||''].map(c).join(';');
    });
    var blob = new Blob(['﻿'+glava+'\n'+redovi.join('\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kvarovi-' + todayISO() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();

  qty: async function(id, delta){
    var p = DATA.dijelovi.filter(function(x){ return x.id===id; })[0];
    if(!p) return;
    /* SIM-FIX B3: trag ručnog +/- na skladištu — debounce po dijelu ~1,5s da brzo
       klikanje ne zatrpa kanal jednom porukom po dodiru; šalje se samo prije≠poslije. */
    if(!QTY_DEBOUNCE[id]) QTY_DEBOUNCE[id] = { prije: p.stanje };
    p.stanje = Math.max(0, p.stanje + delta);   /* odmah na ekranu — brz dodir ne smije čekati mrežu */
    var el = $('#parts-list');
    if(el) el.innerHTML = partsListHtml();
    updateBadge();
    (function(){
      var pid = id, naziv = p.naziv;
      clearTimeout(QTY_DEBOUNCE[pid].timer);
      QTY_DEBOUNCE[pid].timer = setTimeout(function(){
        var zap = QTY_DEBOUNCE[pid];
        delete QTY_DEBOUNCE[pid];
        if(zap && zap.prije !== p.stanje){
          sysPoruka('📦 Ispravak stanja: '+naziv+' '+zap.prije+' → '+p.stanje+' ('+(SESSION.ime||'')+')');
        }
      }, QTY_TRAG_MS);
    })();
    /* AUDIT-FIX: prije je ovo bio "pročitaj pa piši" (apiUpdate sa zadnjom poznatom
       vrijednosti) — dva brza dodira ili dva uređaja mogla su izgubiti jednu promjenu.
       Isti atomarni RPC koji već koristi trošenje dijela kod zatvaranja kvara: negativan
       p_kolicina znači povećanje (greatest(0, stanje - p_kolicina) sa -delta = +delta). */
    if(REMOTE){
      await razduziAtomarno(p, -delta);
      var el2 = $('#parts-list');
      if(el2) el2.innerHTML = partsListHtml();
    } else {
      await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
    }
  },

  saveUgradiDio: async function(e, kId){
    e.preventDefault();
    var f = new FormData(e.target);
    /* dio netom kreiran preko "+ Novi dio" nosi privremeni lokalni id dok apiInsert ne
       vrati pravi UUID — isti guard kao naruciDio */
    if(jeTempId(f.get('dio'))){ toastUpoz('Dio se upravo sprema u bazu — pokušaj za par sekundi.'); return; }
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    var p = DATA.dijelovi.filter(function(x){ return x.id===f.get('dio'); })[0];
    if(!k || !p) return;
    /* količina ne smije premašiti stvarno stanje — inače zapis kvara/poruka tvrde da je
       ugrađeno više nego što je fizički skinuto sa skladišta.
       PREGLED serije A: tiho rezanje je bilo pola posla — korisnik mora doznati da je
       zabilježeno manje nego što je upisao, a stanje 0 se odbija (inače bi zapis tvrdio
       "ugrađen dio", a sa skladišta ne bi otišlo ništa). */
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    if(!(p.stanje > 0)){
      toastUpoz(p.naziv+' nema stanja na skladištu — ispravi stanje pa pokušaj ponovno.');
      return;
    }
    if(kol > p.stanje){
      toastUpoz('Na skladištu je '+p.stanje+' kom — zabilježeno '+p.stanje+', ne '+kol+'.');
      kol = p.stanje;
    }
    app.closeModal();
    var prije = p.stanje;
    p.stanje = Math.max(0, p.stanje - kol);
    k.zam = k.zam ? (k.zam+' + '+p.naziv+(kol>1?' ×'+kol:'')) : (p.naziv+(kol>1?' ×'+kol:''));
    /* ODLUKA 2 (3.9.2026.): uz tekst se pamti i prava veza na dio — iz nje žive "potrošeno N
       u 3 mj." i kretanje na kartici dijela te stanje dijela u Iskustvu na stroju. */
    upisiDioUKvar(k, p, kol);
    app.detaljKvara(kId);
    rerender();
    sysPoruka('🔧 Ugrađen dio: '+p.naziv+(kol>1?' ×'+kol:'')+' — '+k.opis+' ('+(SESSION.ime||'')+')', kId);
    if(prije >= p.min && p.stanje < p.min){
      sysPoruka('📦 Dio ispod minimuma: '+p.naziv+' (stanje '+p.stanje+', min '+p.min+') — naručiti!');
      /* SIM-FIX B6: sysPoruka ide u povijest koju treba otvoriti — toast se vidi odmah, na licu mjesta */
      toast('⚠ '+p.naziv+': stanje '+p.stanje+' (min '+p.min+') — naručiti');
    }
    if(REMOTE) await razduziAtomarno(p, kol);
    else await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
    await apiUpdate('kvarovi', kId, { zam:k.zam, dio_id:k.dio_id, dio_kol:k.dio_kol });
  },
  saveNarudzbu: async function(e, dioId, izKartice){

    var p = dioPoId(dioId);

    };
    if(!DATA.nabava) DATA.nabava = [];
    DATA.nabava.push(n);
    /* VLASNIK-3B: sheet je u #sheet-root, ne #modal-root — zatvori sheet i, ako je narudžba
       pokrenuta iz kartice dijela, vrati korisnika na karticu (t.6) umjesto na Skladište.

    /* AUDIT-FIX: "Naručeno ✓" je išao PRIJE await — ako baza odbije (temp dio_id, RLS,

      sysPoruka('🧾 Naručeno: '+(p?p.naziv:'dio')+' ×'+n.kolicina+' kod '+(n.dobavljac||'—')+
        (n.ocekivano ? ', očekivano '+fmtDate(n.ocekivano) : '')+' ('+(SESSION.ime||'')+')');

  savePrimitak: async function(e, id, izKartice){
    e.preventDefault();
    var n = (DATA.nabava||[]).filter(function(x){ return x.id===id; })[0];
    if(!n || n.primljeno) return;
    var preostalo = n.kolicina - (n.primljena_kolicina||0);
    var kol = Math.max(0, Math.min(preostalo, parseInt(new FormData(e.target).get('kol'),10) || 0));
    if(!kol) return;
    /* VLASNIK-3B: sheet je u #sheet-root, ne #modal-root */
    $('#sheet-root').innerHTML = '';
    var p = dioPoId(n.dio_id);
    var novaPrimljena = (n.primljena_kolicina||0) + kol;
    var zavrseno = novaPrimljena >= n.kolicina;
    n.primljena_kolicina = novaPrimljena;
    n.primljeno = zavrseno ? todayISO() : null;
    if(p) p.stanje = p.stanje + kol;
    /* VLASNIK-3B t.6: iz kartice dijela → natrag na karticu (ne na Skladište).
       AUDIT F8: gumb "Stiglo" u retku "U dolasku" (Skladište) je nasilno prebacivao
       korisnika na drugi ekran umjesto da ga ostavi ondje odakle je zaprimanje
       pokrenuto. Ostati na ekranu s kojeg je stvarno pokrenuto (CURRENT_SCREEN) je
       točno za sve uloge otkad je (ODLUKA 1, 3.9.2026.) zaseban ekran Nabava ukinut —
       majstoru više nema kamo "nasukati se" jer taj ekran ne postoji. */
    if(izKartice) app.otvoriDio(n.dio_id);
    else showScreen(CURRENT_SCREEN);
    if(REMOTE && naMrezi()){
      /* SIM-FIX M1: dosad je SVAKI neuspjeh RPC-a (i "prava" mrežna greška i čisto "netko je
         narudžbu već zaprimio") padao u isti catch koji upisuje lokalno optimistički izračunato
         stanje izravno preko apiUpdate — pa su dva uređaja koja zaprime istu narudžbu skoro
         istovremeno mogla dvaput dodati zalihu. primi_nabavu (schema.sql) vraća SQL null (bez
         greške) kad "where primljeno is null" ne nađe redak jer je narudžba u međuvremenu već
         zatvorena — to razdvajamo od prave greške. */
      try{
        var rpc = await rpcMreza('primi_nabavu', { p_id:id, p_kolicina:kol, p_datum:todayISO() });
        if(rpc.error) throw rpc.error;
        if(typeof rpc.data === 'number'){
          if(p) p.stanje = rpc.data;
        } else {
          /* već zaprimljeno negdje drugdje — bez ijednog upisa, samo osvježi iz baze */
          toast('Ova narudžba je već zaprimljena');
          try{ await load(); }catch(e2){}
          rerender();
          return;
        }
      }catch(e){
        /* mrežna/serverska greška — postojeći fallback: upiši izravno (offline-tolerant) */
        await apiUpdate('nabava', id, { primljeno:n.primljeno, primljena_kolicina:n.primljena_kolicina });
        if(p) await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
      }
    } else {
      await apiUpdate('nabava', id, { primljeno:n.primljeno, primljena_kolicina:n.primljena_kolicina });
      if(p) await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
    }
    toast('Zaprimljeno ✓ · na skladištu '+(p?p.stanje:'?'));
    sysPoruka('📦 Primljeno: '+(p?p.naziv:'dio')+' ×'+kol+
      (zavrseno ? ' — narudžba zatvorena' : ' (preostalo ×'+(n.kolicina-novaPrimljena)+', narudžba ostaje otvorena)')+
      ' — na skladištu '+(p?p.stanje:'?')+' ('+(SESSION.ime||'')+')');
    /* K-2/K-3: dio je stigao — javi majstoru koji čeka. Ciljano ako narudžba zna za
       kvar (K-3); inače heuristikom po stroju na koji je dio vezan (K-2). */
    var vecObavijesten = {};
    if(n.kvar_id){
      var kk = DATA.kvarovi.filter(function(x){ return x.id===n.kvar_id; })[0];
      /* §16 P3 (rupa #1): narudžba zna TOČNO za koji kvar je — kad stigne (potpuno, ne
         djelomično), oznaka "Čeka dio" se skida sama. Bez ovoga je Pregled/Raspored za
         proizvodnju i dalje govorio "Čeka dio · stoji" dok tehničar ručno ne makne kvačicu. */
      if(kk && jeOtvoren(kk) && kk.ceka_dio && zavrseno){
        kk.ceka_dio = false;
        await apiUpdate('kvarovi', kk.id, { ceka_dio:false });
        sysPoruka('📦 Dio stigao — "Čeka dio" skinuto s '+(machineById(kk.m)||{name:'—'}).name+': '+kk.opis, kk.id);
      }
      if(kk && jeOtvoren(kk) && kk.dodijeljen){
        posaljiObavijest('📦 Stigao naručeni dio', (p?p.naziv:'dio')+' je stigao za tvoj kvar — možeš nastaviti.', '#kvarovi', kk.dodijeljen);
        vecObavijesten[kk.id] = true;
      }
    }
    if(p && (p.strojevi||[]).length){
      DATA.kvarovi.filter(function(k){
        return jeOtvoren(k) && k.ceka_dio && !vecObavijesten[k.id] && k.m && k.dodijeljen && p.strojevi.indexOf(k.m) > -1;
      }).forEach(function(k){
        var km = machineById(k.m);
        posaljiObavijest('📦 Stigao dio', p.naziv+' je stigao — možda možeš nastaviti na '+(km?km.name:'')+'.', '#kvarovi', k.dodijeljen);
      });
    }
  },

  saveObavljeno: async function(e, pId){
    e.preventDefault();
    var p = DATA.preventiva.filter(function(x){ return x.id===pId; })[0];
    if(!p) return;
    var f = new FormData(e.target);
    var datum = f.get('datum') || todayISO();
    p.zadnje = datum;
    p.tkoZadnji = f.get('tko');
    var sh = parseFloat(f.get('stvarno_h'));
    p.stvarno_h = isNaN(sh) ? null : sh;
    p.next = addDaysISO(datum, intervalDays(p.interval));
    var pd = PENDING_DOK; PENDING_DOK = null;
    /* AUDIT F2: modal dolje PRIJE razduzivanja — isti razlog kao u saveRijesen */
    app.closeModal();
    showScreen(CURRENT_M && !$('#screen-stroj').classList.contains('hidden') ? 'stroj' : (CURRENT_SCREEN||'pregled'));
    /* SIM-FIX B1: utrošeni dio uz redovni pregled — isti obrazac razduživanja kao saveRijesen */
    var dioId = f.get('dio');
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    /* dio netom kreiran preko "+ Novi dio" nosi privremeni lokalni id dok apiInsert ne
       vrati pravi UUID — preventiva se svejedno potvrđuje, samo se razduživanje dijela
       preskače (isti guard kao naruciDio) */
    if(dioId && jeTempId(dioId)){ toastUpoz('Dio se upravo sprema u bazu — utrošak nije zabilježen, pokušaj za par sekundi.'); dioId = null; }
    if(dioId){
      var pdio = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(!pdio) dioId = null;
      /* PREGLED serije A: stanje 0 ⇒ nema se što razdužiti — poruka "Utrošeno ×0" je bila
         zapis bez sadržaja; korisnik dobiva razlog umjesto tihog rezanja na nulu. */
      else if(!(pdio.stanje > 0)){ toastUpoz(pdio.naziv+' nema stanja na skladištu — utrošak nije zabilježen.'); dioId = null; }
      else {
        /* količina ne smije premašiti stvarno stanje — inače poruka tvrdi da je utrošeno
           više nego što je fizički skinuto sa skladišta */
        if(kol > pdio.stanje){
          toastUpoz('Na skladištu je '+pdio.stanje+' kom — zabilježeno '+pdio.stanje+', ne '+kol+'.');
          kol = pdio.stanje;
        }
        var prijeDio = pdio.stanje;
        pdio.stanje = Math.max(0, pdio.stanje - kol);
        if(prijeDio >= pdio.min && pdio.stanje < pdio.min){
          sysPoruka('📦 Dio ispod minimuma: '+pdio.naziv+' (stanje '+pdio.stanje+', min '+pdio.min+') — naručiti!');
          toast('⚠ '+pdio.naziv+': stanje '+pdio.stanje+' (min '+pdio.min+') — naručiti');   /* SIM-FIX B6 */
        }
        if(REMOTE) await razduziAtomarno(pdio, kol);
        else await apiUpdate('dijelovi', pdio.id, { stanje:pdio.stanje });
      }
    }
    var pmm = machineById(p.m);
    sysPoruka('🔧 Preventiva obavljena: '+(pmm ? pmm.name+' — ' : '')+p.opis+' ('+(p.tkoZadnji||'')+')');
    if(dioId){   /* dioId je gore poništen ako se ništa nije razdužilo — poruka ne smije tvrditi suprotno */
      var pdioNaziv = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(pdioNaziv) sysPoruka('🔧 Utrošeno uz pregled: '+pdioNaziv.naziv+' ×'+kol+' — '+p.opis+' ('+(p.tkoZadnji||'')+')');
    }
    await apiUpdate('preventiva', p.id, { zadnje:p.zadnje, tko_zadnji:p.tkoZadnji, next:p.next, stvarno_h:p.stvarno_h });
    if(pd && p.m){
      var path = pd.dataUrl;
      if(REMOTE){
        var poslano = await uploadDokument(p.m, pd.dataUrl, pd.mime);
        if(!poslano) return;   /* zapisnik nije poslao — preventiva je svejedno potvrđena, ne rušimo taj tok */
        path = poslano;
      }
      var dok = { id:'dok'+Date.now(), m:p.m, naziv:p.opis+' — '+fmtDate(datum), tip:'zapisnik', path:path,
        mime:pd.mime, velicina:pd.velicina||0, tko:SESSION.ime||'', created_at:new Date().toISOString(),
        preventiva_id:p.id };
      if(!DATA.dokumenti) DATA.dokumenti = [];
      DATA.dokumenti.push(dok);
      if(REMOTE){
        var res = await sb.from('dokumenti').insert({ m:dok.m, naziv:dok.naziv, tip:dok.tip, path:dok.path,
          mime:dok.mime, velicina:dok.velicina, tko:dok.tko, preventiva_id:dok.preventiva_id }).select().single();
        if(res.error){
          /* AUDIT F8: greška se dosad potpuno gutala — datoteka je vec u Storageu (uploadDokument
             iznad), ali zapis u tablici nikad ne nastane; DATA.dokumenti je i dalje tvrdio da
             postoji. Isti obrazac kao saveDokument: javi i ukloni lokalni "duh"-zapis. */
          zapisiGresku('Zapisnik servisa nije spremljen u tablicu dokumenti', res.error.message || String(res.error));
          alert('Preventiva je potvrđena, ali zapisnik NIJE spremljen u bazu.\n('+res.error.message+')');
          DATA.dokumenti = DATA.dokumenti.filter(function(x){ return x.id!==dok.id; });
          rerender();
        } else { dok.id = res.data.id; }
      } else { save(); }
    }
  },

      ? '<label>Utrošeno vremena (h, izborno)</label>'+

      : (function(){
        /* Brza prijava sprema sati:0. Kad bi ovdje pisala nula, ona bi i ostala —
           a to je jedini kanal kojim stvarni zastoj ikad uđe u evidenciju.
           AUDIT-FIX (§14.2 t.1): prijedlog se računa uživo iz poceo_at→sada, ne iz starog
           k.sati (koji je do sada bio ili zastarjela nagađanje s prijave, ili već upisan). */
        var pK = pocetakKvara(k);

      })();

        '<label>Utrošeni dio sa skladišta</label><select name="dio">'+dioOpts+'</select>'+

        '<label>Što je napravljeno / zamijenjeno</label><input name="zam" value="'+esc(k.zam||'')+'" placeholder="npr. remen, brtva… (prazno ako ništa)">'+

  /* ─── app [20] RJEŠAVANJE I UREĐIVANJE KVARA — saveRijesen, urediKvar, saveUredi ─── */
  saveRijesen: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var zadatak = (k.tip||'kvar')==='zadatak';
    /* SIM-FIX A3: zadatak nema "zastoj" — polje je izborno, prazno = 0, bez upozorenja o danima */
    var sh = parseFloat(f.get('sati'));
    if(zadatak){
      if(isNaN(sh) || sh < 0) sh = 0;
    } else {
      if(isNaN(sh) || sh < 0 || sh > 720){ toastUpoz('Trajanje zastoja mora biti između 0 i 720 sati (30 dana).'); return; }
      if(sh > 72 && !confirm('Upisano je '+H(sh)+' — to je '+Math.round(sh/24*10)/10+' dana. Je li točno?')) return;
    }
    k.sati = sh;
    k.status = 'rijesen'; k.upoz = false; k.ceka_dio = false; k.ceka_servis = false;
    /* IFS: u izvještaj ide samo ono što je netko stvarno potvrdio */
    k.otpusteno = !!f.get('otpusteno');
    k.tko = f.get('tko');
    k.sudjelovali = f.getAll('sudjelovali_ime').join(', ') || null;
    k.zam = String(f.get('zam')||'').trim() || null;
    if(!zadatak){
      /* SIM-FIX C1: privremeni popravak/rok sanacije se sad mogu upisati i pri zatvaranju kvara */
      k.privremeni = !!f.get('privremeni');
      k.rok_sanacije = k.privremeni ? (f.get('rok_sanacije') || null) : null;
    }
    /* AUDIT F2: modal se zatvara PRIJE mreznih poziva — dok je forma na ekranu, drugi tap
       je mogao ponovno razduziti dio (guard je vidio PENDING_OPS 0 za vrijeme RPC-a). */
    var pendingFotoGotov = PENDING_FOTO; PENDING_FOTO = '';
    app.closeModal();
    showScreen($('#screen-stroj').classList.contains('hidden') ? 'kvarovi' : 'stroj');
    /* razduživanje skladišta: utrošeni dio smanjuje stanje i upisuje se u "Zamijenjeno" */
    var dioId = f.get('dio');
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    /* PREGLED serije A: ovo je TREĆE mjesto s istim obrascem (uz saveUgradiDio i
       saveObavljeno) — jeTempId straža i gornja granica po stvarnom stanju moraju
       vrijediti i ovdje, inače je najčešći put (utrošeni dio pri zatvaranju kvara)
       jedini bez njih. */
    if(dioId && jeTempId(dioId)){ toastUpoz('Dio se upravo sprema u bazu — utrošak nije zabilježen, pokušaj za par sekundi.'); dioId = null; }
    if(dioId){
      var p = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(p && !(p.stanje > 0)) toastUpoz(p.naziv+' nema stanja na skladištu — utrošak nije zabilježen.');
      else if(p){
        if(kol > p.stanje){
          toastUpoz('Na skladištu je '+p.stanje+' kom — zabilježeno '+p.stanje+', ne '+kol+'.');
          kol = p.stanje;
        }
        var prije = p.stanje;
        p.stanje = Math.max(0, p.stanje - kol);
        if(!k.zam) k.zam = p.naziv + (kol>1 ? ' ×'+kol : '');
        else k.zam += ' + ' + p.naziv + (kol>1 ? ' ×'+kol : '');
        /* ODLUKA 2 (3.9.2026.): isto kao u saveUgradiDio — uz tekst i strukturirana veza na dio. */
        upisiDioUKvar(k, p, kol);
        if(prije >= p.min && p.stanje < p.min){
          sysPoruka('📦 Dio ispod minimuma: '+p.naziv+' (stanje '+p.stanje+', min '+p.min+') — naručiti!');
          toast('⚠ '+p.naziv+': stanje '+p.stanje+' (min '+p.min+') — naručiti');   /* SIM-FIX B6 */
        }
        /* atomarno u bazi: dva majstora u isto vrijeme ne smiju izgubiti komad */
        if(REMOTE) await razduziAtomarno(p, kol);
        else await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
      }
    }
    var rm = machineById(k.m);
    sysPoruka('✅ '+(k.tip==='zadatak'?'Zadatak obavljen':'Kvar riješen')+': '+
      (rm ? rm.name+' — ' : '')+k.opis+' ('+esc(k.tko||'')+')', k.id);
    /* §11.5: foto i kod rješavanja — dokaz da je popravak stvarno gotov, ne samo prijava */
    if(pendingFotoGotov) k.foto_rijeseno = REMOTE ? await uploadFoto(pendingFotoGotov) : pendingFotoGotov;
    /* lokalni objekt mora nositi closed_at PRIJE apiUpdate (isto kao obaviZadatak/saveVratiURad) —
       inače detalj kvara prikazuje prazno vrijeme rješavanja dok se DATA ne osvježi iz baze */
    k.closed_at = new Date().toISOString();
    /* AUDIT: isti uvjet-obrazac kao preuzmiKvar (F3) — bez ovoga dva majstora koji gotovo
       istovremeno zatvaraju isti kvar mogu jedan drugom tiho prepisati zam/sati/tko */
    await apiUpdate('kvarovi', k.id, { sati:k.sati, status:k.status, upoz:false, ceka_dio:false, ceka_servis:false,
      otpusteno:k.otpusteno, tko:k.tko, zam:k.zam, sudjelovali:k.sudjelovali,
      /* ODLUKA 2 (3.9.2026.): ||null — kvar bez utrošenog dijela šalje null, a kvar kojem je dio
         upisan ranije ("+ Ugrađen dio") šalje tu istu vrijednost, ne briše je. */
      dio_id:k.dio_id||null, dio_kol:k.dio_kol||null,
      privremeni:k.privremeni, rok_sanacije:k.rok_sanacije,
      foto_rijeseno:k.foto_rijeseno, closed_at:k.closed_at }, { status:['otvoren','u_radu'] });
    /* SIM-FIX A2: "Zovi servis" stvara zadatak (izvor_kvar, opis "Servis …") koji je do sada
       ostajao otvoren i nakon što je sam kvar riješen — nitko ga svjesno ne zatvara. Kvar je
       riješen ⇒ poziv servisu za taj kvar je gotova priča. */
    if(k.tip!=='zadatak'){
      var vezaniZad = DATA.kvarovi.filter(function(x){
        return x.izvor_kvar===k.id && x.tip==='zadatak' && jeOtvoren(x) && String(x.opis||'').indexOf('Servis ')===0;
      });
      for(var vzI=0; vzI<vezaniZad.length; vzI++){
        var vz = vezaniZad[vzI];
        vz.status = 'rijesen';
        vz.closed_at = new Date().toISOString();
        sysPoruka('✅ Zadatak obavljen: '+vz.opis, vz.id);
        await apiUpdate('kvarovi', vz.id, { status:'rijesen', closed_at:vz.closed_at });
      }
    }
  },

        '<label>'+(k.tip==='zadatak'?'Utrošeno vremena (h)':'Trajanje zastoja (h)')+'</label><input type="number" name="sati" step="0.5" min="0" value="'+k.sati+'">'+

  saveUredi: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var prijeDodijeljen = k.dodijeljen;
    var prijePrioritet = k.prioritet;
    k.m = f.get('m') || null;
    k.opis = String(f.get('opis')||'').trim() || k.opis;
    k.date = f.get('date') || k.date;
    /* Uredi dosad nije provjeravao sate — nerealan unos hvatala je tek baza, i to
       porukom "Spremanje NIJE uspjelo". Ista pravila kao pri prijavi i zatvaranju —
       ali zadatak (SIM-FIX A3) nema koncept zastoja: bez gornje granice/potvrde o danima. */
    var satiU = parseFloat(f.get('sati'));
    if(isNaN(satiU)) satiU = 0;   /* polje je iza "+ Dodatno" i smije ostati prazno */
    if(k.tip==='zadatak'){
      if(satiU < 0) satiU = 0;
    } else {
      /* PREGLED serije A: negativan unos je za KVAR i dalje greška (kao u saveRijesen),
         ne tiha nula — inače nestane jedina poruka koja kaže zašto broj nije prihvaćen. */
      if(satiU < 0 || satiU > 720){ toastUpoz('Trajanje zastoja mora biti između 0 i 720 sati (30 dana).'); return; }
      if(satiU > 72 && satiU !== k.sati &&
         !confirm('Upisano je '+H(satiU)+' — to je '+Math.round(satiU/24*10)/10+' dana. Je li točno?')) return;
    }
    k.sati = satiU;
    k.kategorija = f.get('kategorija') || 'Ostalo';
    k.dodijeljen = f.get('dodijeljen') || null;
    k.prioritet  = f.get('prioritet') || 'normalno';
    k.smjena     = f.get('smjena') || null;
    if(k.status==='rijesen'){
      k.tko = f.get('tko') || k.tko;
      k.sudjelovali = f.getAll('sudjelovali_ime').join(', ') || null;
      k.zam = String(f.get('zam')||'').trim() || null;
    } else {
      k.ceka_dio = !!f.get('ceka');
      if(k.tip!=='zadatak') k.procjena_gotovo = f.get('procjena_gotovo') || null;
    }
    if(k.tip==='zadatak'){
      k.rok = f.get('rok') || null;
      k.ponavljanje = parseInt(f.get('ponavljanje'),10) || null;
    }
    k.privremeni = !!f.get('privremeni');
    k.rok_sanacije = k.privremeni ? (f.get('rok_sanacije') || null) : null;
    if(k.dodijeljen && k.dodijeljen !== prijeDodijeljen && jeOtvoren(k)){
      var dm = machineById(k.m);
      posaljiObavijest('📋 Dodijeljeno tebi', (dm?dm.name+': ':'')+k.opis, '#kvarovi', k.dodijeljen);
    }
    /* F: obavijest se dosad slala ISKLJUČIVO kad se promijeni dodijeljen — promjena
       prioriteta je tiho odlazila u bazu. Kvar prijavljen bez kvačice pa eskaliran na
       hitno je prošao nezamijećen. Isto pravilo kao obavijestNoviKvar za novi hitni kvar:
       broadcast (bez samoZa) svima, ne samo dodijeljenom. */
    if(k.prioritet==='hitno' && prijePrioritet!=='hitno' && jeOtvoren(k)){
      var hm = machineById(k.m);
      sysPoruka('🔴 HITNO — '+(hm?hm.name+': ':'')+k.opis+' ('+(SESSION.ime||'')+')', k.id);
      posaljiObavijest('🔴 HITNO', (hm?hm.name+': ':'')+k.opis, '#kvarovi');
    }
    app.closeModal();
    /* zadatak uređen s Rasporeda vraća na Raspored, ne na Kvarove */
    showScreen(!$('#screen-stroj').classList.contains('hidden') ? 'stroj'
      : (k.tip==='zadatak' && CURRENT_SCREEN==='raspored' ? 'raspored' : 'kvarovi'));
    var patch = { m:k.m, opis:k.opis, date:k.date, sati:k.sati,
      kategorija:k.kategorija, dodijeljen:k.dodijeljen, prioritet:k.prioritet,
      smjena:k.smjena, ceka_dio:k.ceka_dio, tko:k.tko, sudjelovali:k.sudjelovali, zam:k.zam,
      privremeni:k.privremeni, rok_sanacije:k.rok_sanacije };
    if(k.tip==='zadatak'){ patch.rok = k.rok; patch.ponavljanje = k.ponavljanje; }
    else patch.procjena_gotovo = k.procjena_gotovo;
    await apiUpdate('kvarovi', k.id, patch);
  },
  /* ─── app [21] BRZE RADNJE NA KVARU — brzoDodijeli, brzoCekaDio, postaviGotovoDo, viseKvar ─── */
  brzoDodijeli: async function(kId, ime){

    }
    await apiUpdate('kvarovi', k.id, { dodijeljen:k.dodijeljen });
  },

  /* ─── app [23] FOTOGRAFIJE I DOKUMENTI — fotoOdabrana, dokumentOdabran, saveDokument ─── */
  fotoOdabrana: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    /* AUDIT-FIX: uskladjeno s dokumentOdabran (8114) — bez ograničenja i bez onerror
       je slika bilo koje veličine tiho ostavljala PENDING_FOTO praznim kad dekodiranje
       padne (oštećena datoteka, HEIC na starijem Androidu), bez ijedne poruke. */
    if(file.size > 10*1024*1024){ toastUpoz('Fotografija je veća od 10 MB — smanji je ili odaberi drugu.'); e.target.value=''; return; }
    var reader = new FileReader();
    reader.onerror = function(){ toastUpoz('Fotografiju nije moguće učitati — probaj drugu.'); e.target.value=''; };
    reader.onload = function(ev){
      var img = new Image();
      img.onerror = function(){ toastUpoz('Fotografiju nije moguće učitati — probaj drugu.'); e.target.value=''; };
      img.onload = function(){
        var max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_FOTO = c.toDataURL('image/jpeg', 0.72);
        var prev = document.getElementById('foto-prev');
        if(prev){ prev.src = PENDING_FOTO; prev.style.display = 'block'; }
        var lbl = document.getElementById('foto-label');
        if(lbl) lbl.textContent = '✓ '+file.name;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

  /* ---- dokumenti uz stroj (F4) ---- */
  dokumentOdabran: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 10*1024*1024){ toastUpoz('Datoteka je veća od 10 MB — smanji je ili odaberi drugu.'); e.target.value=''; return; }
    var oznaci = function(dataUrl, mime){
      PENDING_DOK = { dataUrl:dataUrl, mime:mime, naziv:file.name, velicina:file.size };
      var ime = document.getElementById('dok-ime');
      if(ime) ime.textContent = '✓ '+file.name;
    };
    if(file.type.indexOf('image') === 0){
      /* slika se smanji na canvasu prije slanja — 1600px/kvaliteta .8 (900px iz brze
         prijave kvara je premalo da shema ili sitni tisak zapisnika ostanu čitljivi) */
      var reader = new FileReader();
      /* AUDIT-FIX: dekodiranje slike moglo je tiho pasti (oštećena datoteka, HEIC na
         starijem Androidu) — obrazac je ostajao bez PENDING_DOK i bez ikakve poruke. */
      reader.onerror = function(){ toastUpoz('Sliku nije moguće učitati — probaj drugu ili odaberi PDF.'); e.target.value=''; };
      reader.onload = function(ev){
        var img = new Image();
        img.onerror = function(){ toastUpoz('Sliku nije moguće učitati — probaj drugu ili odaberi PDF.'); e.target.value=''; };
        img.onload = function(){
          var max = 1600, k = Math.min(1, max/Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          oznaci(c.toDataURL('image/jpeg', 0.8), 'image/jpeg');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      var reader2 = new FileReader();
      reader2.onerror = function(){ toastUpoz('Datoteku nije moguće učitati — probaj drugu.'); e.target.value=''; };
      reader2.onload = function(ev){ oznaci(ev.target.result, file.type || 'application/pdf'); };
      reader2.readAsDataURL(file);
    }

  saveDokument: async function(e, mId){
    e.preventDefault();
    if(!PENDING_DOK){ toastUpoz('Odaberi datoteku prije spremanja.'); return; }
    var f = new FormData(e.target);
    var naziv = String(f.get('naziv')||'').trim();
    if(!naziv) return;
    var pd = PENDING_DOK; PENDING_DOK = null;
    var tip = f.get('tip') || 'ostalo';
    app.closeModal();
    var path = pd.dataUrl;
    if(REMOTE){
      var poslano = await uploadDokument(mId, pd.dataUrl, pd.mime);
      if(!poslano){ alert('Slanje datoteke NIJE uspjelo — pokušaj ponovno.'); return; }
      path = poslano;
    }
    var dok = { id:'dok'+Date.now(), m:mId, naziv:naziv, tip:tip, path:path, mime:pd.mime,
      velicina:pd.velicina||0, tko:SESSION.ime||'', created_at:new Date().toISOString() };
    if(!DATA.dokumenti) DATA.dokumenti = [];
    DATA.dokumenti.push(dok);
    showScreen('stroj');
    var dm = machineById(mId);
    if(REMOTE){
      var res = await sb.from('dokumenti').insert({ m:mId, naziv:dok.naziv, tip:dok.tip, path:dok.path,
        mime:dok.mime, velicina:dok.velicina, tko:dok.tko }).select().single();
      if(res.error){
        alert('Zapis NIJE spremljen u bazu.\n('+res.error.message+')');
        DATA.dokumenti = DATA.dokumenti.filter(function(x){ return x.id!==dok.id; });
        rerender();
        return;
      }
      dok.id = res.data.id;
      rerender();
    } else { save(); }
    sysPoruka('📎 Dodan dokument: '+dok.naziv+(dm?' — '+dm.name:'')+' ('+(SESSION.ime||'')+')');
  },

  /* ─── app [25] IFS AUDIT IZVJEŠTAJ — audit() ─── */
  audit: function(dani){
    dani = parseInt(dani,10) || 30;
    var t30 = isoShift(-dani);
    /* SIM-FIX I: zadaci (tip='zadatak', npr. "Naruči ležaj") nisu zahvat na stroju niti
       otvorena stavka održavanja — bez ovog uvjeta ulazili su u audit sa zastojem 0,0 h i
       zbunjivali auditora među stvarnim kvarovima. */
    var zahvati = DATA.kvarovi.filter(function(k){ return k.status==='rijesen' && k.date>=t30 && (k.tip||'kvar')==='kvar'; }).sort(byDateDesc);
    var otvoreni = DATA.kvarovi.filter(function(k){ return jeOtvoren(k) && (k.tip||'kvar')==='kvar'; });

    var prevHtml = DATA.machines.map(function(m){
      var ps = DATA.preventiva.filter(function(p){ return p.m===m.id; });
      if(!ps.length) return '';
      return '<div class="a-m">'+esc(m.name)+' <span class="a-sub">('+esc(m.program)+')</span></div>'+
        ps.map(function(p){
          var late = p.next < todayISO();
          return '<div class="a-item">'+esc(p.opis)+' — '+esc(p.interval)+
            '<div class="a-sub">sljedeće: '+fmtDate(p.next)+' &middot; izvođač: '+esc(p.izv||'interno')+
            (p.zadnje ? ' &middot; zadnje obavljeno: '+fmtDate(p.zadnje)+(p.tkoZadnji?' ('+esc(p.tkoZadnji)+')':'') : '')+
            (late?' <span class="late">— KASNI</span>':'')+'</div></div>';
        }).join('');
    }).join('');

    var zahvatiHtml = zahvati.length ? zahvati.map(function(k){
      var m = machineById(k.m) || {name: (k.tip==='zadatak' ? 'Zadatak' : '—')};
      return '<div class="a-item"><b>'+fmtDate(k.date)+'</b> — '+esc(m.name)+': '+esc(k.opis)+
        '<div class="a-sub">zastoj '+H(k.sati)+' &middot; izvršio: '+esc(k.tko||'—')+
        (k.zam?' &middot; zamijenjeno: '+esc(k.zam):'')+'</div>'+
        /* samo ono što je majstor stvarno potvrdio pri zatvaranju kvara */
        (k.otpusteno
          ? '<div class="a-sub">otpuštanje linije: čišćenje i pregled na strana tijela — '+esc(k.tko||'—')+', '+fmtDate(k.date)+'</div>'
          : '')+
        '</div>';
    }).join('') : '<div class="a-sub">Nema zahvata u zadnjih '+dani+' dana.</div>';

    /* 3. Privremeni popravci — iz stvarnih zapisa, ne iz fiksnog teksta */
    /* Zatvoren kvar NE znači trajno saniran: linija radi, ali popravak je i dalje
       privremen dok netko ne makne kvačicu. Ranije su takvi ispadali iz izvještaja
       i odjeljak 3 se vraćao na "nema privremenih popravaka" — točno u trenutku
       kad ih ima. */
    var privremeni = DATA.kvarovi.filter(function(k){
      return k.privremeni && k.status !== 'otkazan';
    }).sort(function(a,b){
      return String(a.rok_sanacije||'9999').localeCompare(String(b.rok_sanacije||'9999'));
    });
    var privremeniHtml = privremeni.length
      ? privremeni.map(function(k){
          var m = machineById(k.m) || {name: (k.tip==='zadatak' ? 'Zadatak' : '—')};
          var kasni = k.rok_sanacije && k.rok_sanacije < todayISO();
          return '<div class="a-item"><b>'+esc(m.name)+'</b> — '+esc(k.opis)+
            '<div class="a-sub">privremeni popravak od '+fmtDate(k.date)+
              ' &middot; '+(k.status==='rijesen' ? 'linija radi, trajna sanacija otvorena' : 'kvar još otvoren')+
              ' &middot; '+(k.dodijeljen||k.tko ? 'zadužen: '+esc(k.dodijeljen||k.tko) : 'nije zadužen nitko')+
              ' &middot; rok trajne sanacije: '+(k.rok_sanacije ? fmtDate(k.rok_sanacije) : 'nije određen')+
              (kasni ? ' <span class="late">— KASNI</span>' : '')+'</div></div>';
        }).join('')
      : '<div class="a-sub">Nema aktivnih privremenih popravaka. Privremeni popravak se označava, '+
        'procjenjuje s aspekta sigurnosti hrane i dobiva rok trajne sanacije.</div>';

    var mjernaHtml = MJERNA.map(function(u){
      return '<div class="a-item">'+esc(u.naziv)+'<div class="a-sub">'+esc(u.rezim)+'</div></div>';
    }).join('');

    var mazivaHtml = MAZIVA.map(function(z){
      return '<div class="a-item">'+esc(z.naziv)+' <span class="chip fg">food-grade &middot; '+esc(z.oznaka)+'</span>'+
        '<div class="a-sub">primjena: '+esc(z.primjena)+'</div></div>';
    }).join('');

    var otvHtml = otvoreni.length
      ? '<h4>7. Otvorene stavke</h4>'+otvoreni.map(function(k){
          var m = machineById(k.m) || {name: (k.tip==='zadatak' ? 'Zadatak' : '—')};
          /* SIM-FIX I: "upoz" ne postavlja nijedan obrazac — status je uvijek pisao krivo.
             Isti redoslijed prioriteta kao Raspored (sadaRedak, ~3524): ceka_dio → ceka_servis
             → u radu → otvoren. */
          var stanje = k.ceka_dio ? 'čeka dio' : k.ceka_servis ? 'čeka servis' : k.status==='u_radu' ? 'u radu' : 'otvoren';
          return '<div class="a-item"><b>'+fmtDate(k.date)+'</b> — '+esc(m.name)+': '+esc(k.opis)+
            '<div class="a-sub">status: '+stanje+', u tijeku</div></div>';
        }).join('')
      : '';

    $('#modal-root').innerHTML =
      '<div class="overlay" onclick="if(event.target===this)app.closeModal(\'izvan\')"><div class="modal audit">'+
      '<div class="modal-head"><h3>Izvještaj za audit (IFS)</h3>'+
        '<span style="display:flex;gap:var(--r2);align-items:center">'+
        '<button class="btn sec sm" onclick="window.print()">Ispis / PDF</button>'+
        '<button class="x" onclick="app.closeModal()">✕</button></span></div>'+
      '<div class="print-head"><img src="'+esc(document.querySelector('.hdr-logo').src)+'" alt="Clarum">'+
        '<div><div class="ph-naslov">Izvještaj za audit (IFS)</div>'+
        '<div class="ph-sub">'+esc(TVRTKA.puni_naziv||TVRTKA.naziv)+' &middot; Sektor održavanja &middot; '+fmtDate(todayISO())+
        ' &middot; ref. '+esc(TVRTKA.audit_norma)+'</div></div></div>'+
      '<div class="a-meta">Generirano: '+fmtDate(todayISO())+' &middot; '+esc(TVRTKA.puni_naziv||TVRTKA.naziv)+' &middot; Sektor održavanja &middot; ref. '+esc(TVRTKA.audit_norma)+'</div>'+
      '<label style="font-size:var(--t-label);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Razdoblje zahvata</label>'+
      '<select onchange="app.audit(this.value)" style="margin:4px 0 6px">'+

      '<h4>1. Plan preventivnog održavanja po stroju</h4>'+prevHtml+

      '<h4>6. Rashladni sustav (F-gas)</h4>'+

      '<button class="btn sec block" style="margin-top:18px" onclick="window.print()">Ispis / PDF</button>'+

  /* ─── app [26] ČAROBNJAK „PRVI DAN" — carobnjak, carobnjakKorak, carobnjakSpremi, carobnjakKraj ─── */
  /* ODLUKA 3 (3.9.2026.): prvi dan kod kupca — pet koraka od praznog ekrana do plana
     pregleda. Nijedan korak nema svoj obrazac: koristi POSTOJEĆE (identitet, CSV uvoz,

  carobnjak: function(){

async function postLogin(){
  /* Svaki await ovdje je prilika da korisnik u međuvremenu uđe u demo (ili se
     odjavi). Zastarjeli postLogin tada NE SMIJE nastaviti — njegov load() bi kroz
     localLoad zamijenio DATA i učinio siročadima sve već otvorene zapise. */
  var mojaSesija = SESIJA_GEN;
  var u = (await sb.auth.getUser()).data.user;
  if(SESIJA_GEN !== mojaSesija) return;
  if(!u) throw new Error('nema sesije');
  var prof = await sb.from('users').select('*').eq('id', u.id).single();
  if(SESIJA_GEN !== mojaSesija) return;
  /* AUDIT F3: mrezna greska pri dohvatu profila NIJE "nema uloge" — postgrest i pad
     WiFi-ja vraca kao prof.error. Odjaviti korisnika bas u trenutku kad je bez mreze
     znaci izgubiti i offline red; umjesto toga radi se iz lokalne kopije. */
  if(prof.error && prof.error.code !== 'PGRST116' && !(prof.data)){
    var kesirana = null;
    try{ kesirana = JSON.parse(localStorage.getItem(SESIJA_CACHE_KEY) || 'null'); }catch(eS){}
    if(kesirana && kesirana.id === u.id && kesirana.ime && kesirana.role){
      prof = { data: kesirana, error: null };
      toast('Nema veze s bazom — radiš iz lokalne kopije');
    } else {
      $('#screen-login').classList.add('show');
      $('#login-err').textContent = 'Nema veze s bazom — provjeri internet pa pokušaj ponovno.';
      return;   /* sesija se NE gasi — kad se mreza vrati, ulazak prolazi bez PIN-a */
    }
  }
  if(prof.error || !prof.data){
    /* račun postoji u Auth, ali nema red u tablici users → nema uloge.
       Jasna poruka umjesto tihe readonly prijave. */
    try{ await sb.auth.signOut(); }catch(e){}
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Račun postoji, ali nema dodijeljenu ulogu (tablica users) — javi voditelju.';
    return;
  }
  try{ localStorage.setItem(SESIJA_CACHE_KEY, JSON.stringify({ id:u.id, ime:prof.data.ime, role:prof.data.role })); }catch(eS2){}
  if(SESIJA_GEN !== mojaSesija) return;   /* korisnik je u međuvremenu ušao u demo */
  /* stabilan id (ne prikazano ime — dva korisnika se mogu zvati isto) za "je li ovo moj račun" */
  SESSION.id   = u.id;
  SESSION.ime  = prof.data.ime;
  SESSION.role = prof.data.role;
  document.body.dataset.role = SESSION.role;
  $('#screen-login').classList.remove('show');
  try{
    await load();
  }catch(e){
    /* nema mreže pri pokretanju — radi iz lokalnog keša */
    if(cacheUcitaj()){ primijeniRed(); toast('Radiš iz lokalne kopije — nema mreže'); }
    else {
      /* AUDIT F8: #screen-login je vec skinuo 'show' iznad — bez ponovnog dodavanja
         korisnik ostaje na praznom bijelom ekranu (DATA je i dalje null) */
      $('#screen-login').classList.add('show');
      $('#login-err').textContent = 'Nema veze s bazom i nema lokalne kopije.';
      throw e;
    }
  }
  osvjeziOfflineTraku();
  /* §16 P2: direktor (2×/tjedno) ima jedan relevantan ekran — € i "stoji li nešto".
     Zapamćen zadnji ekran (npr. Strojevi od prošlog posjeta) mu ne služi kao svima ostalima.
     §16.5 #2: tehničar nema karticu "Pregled" — prvi ulazak (bez zapamćenog ekrana) ide na
     Raspored, njegov stvarni prvi ekran. */
  if(!initHash()) showScreen(SESSION.role==='readonly' ? 'pregled' :
    (zadnjiEkran() || (SESSION.role==='majstor' ? 'raspored' : 'pregled')));
  dobrodoslica();
  /* ODLUKA 3 (3.9.2026.): prazna baza znači prvi dan — čarobnjak se ponudi (jednom) */
  if(!prikaziUvodAkoPrvi()) ponudiPrviDanAkoPrazno();
  sinkroniziraj();   /* pošalji što je ostalo od prošlog puta */
}

var KAT_KVARA = ['Mehanički','Električni','Pneumatika i rashlada','Ostalo'];
var KAT_DIJELOVA = ['Remeni i prijenos','Ležajevi','Brtve i maziva','Senzori i elektrika',
                    'Grijači','Folije i ambalaža','Rashladna tehnika','Alati i matrice','Ostalo'];

function aktivni(){ return DATA.kvarovi.filter(function(k){ return k.status !== 'otkazan'; }); }
/* nezavrsen = prijavljen ili netko vec radi na njemu */
function jeOtvoren(k){ return k.status === 'otvoren' || k.status === 'u_radu'; }
/* SIM-FIX: "stoji li linija" dosad je ovisilo o polju upoz koje nijedan obrazac ne
   postavlja (samo demo seed) — pa je u živoj bazi SVAKI otvoreni kvar trošio satnicu

function autoKat(opis){

/* VLASNIK-1 (TOČKA 5): brziOpisChipovi (čipovi s predloženim tekstom u brzoj prijavi) i
   BRZI_OPISI su uklonjeni iz brze prijave po specifikaciji — funkcija se više nigdje ne
   poziva pa je izbrisana zajedno s poljem. */
function sysPoruka(tekst, kvarId){
  /* automatski sistemski zapis u zajedničkom kanalu — živa knjiga smjene */
  var veza = (kvarId && !jeTempId(kvarId)) ? kvarId : null;
  var p = { id:'po'+Date.now(), tko:'Sustav', tekst:tekst, kvar_id:veza, created_at:new Date().toISOString() };
  if(!DATA.poruke) DATA.poruke = [];
  DATA.poruke.push(p);
  if(REMOTE){
    zapamtiMojSistemski(tekst);
    /* AUDIT F8: prije je ovo bilo fire-and-forget bez uRed() fallbacka — sistemski trag
       ("Kvar riješen", "Prijavljen kvar"...) nastao bez mreže je tiho nestajao zauvijek.
       row NE nosi p.id (nije valjan uuid, samo lokalna knjigovodstvena oznaka za red). */
    var row = { tko:'Sustav', tekst:tekst, kvar_id:veza };
    if(!naMrezi()){
      uRed('poruke', 'insert', row, p);
    } else {
      try{
        /* AUDIT F8 (ispravak): supabase-js NE odbija (reject) obećanje na mreznu gresku —
           vraca ga RIJESENIM s {error:...} (vidi mreznaGreska/sesijaIstekla obrazac u
           apiInsert). Prazan uspjeh-callback bi ovdje progutao bas onu gresku koju red
           treba uhvatiti — provjerava se res.error, a ne samo odbijanje. */
        sb.from('poruke').insert(row).then(function(res){
          if(res && res.error){
            uRed('poruke', 'insert', row, p);
            zapisiGresku('Sistemska poruka nije poslana', res.error.message || String(res.error));
            osvjeziOfflineTraku();
          }
        }, function(err){
          uRed('poruke', 'insert', row, p);
          zapisiGresku('Sistemska poruka nije poslana', (err && err.message) || String(err));
          osvjeziOfflineTraku();
        });
      }catch(e){ uRed('poruke', 'insert', row, p); }
    }
    osvjeziOfflineTraku();
  }
  else save();
  updateBadge();
}
/* Uobičajene granice kad postavka smjene_od nije upisana — čuva stari raspored za
   2 smjene (6-14 / 14-6) i dodaje Clarumov stvarni raspored za 3 (6-14 / 14-22 / 22-6). */
function zadaneGraniceSmjena(n){
  if(n === 2) return [6,14];
  if(n === 3) return [6,14,22];
  var korak = Math.floor(24/n) || 8, niz = [];
  for(var i=0;i<n;i++) niz.push((6+i*korak)%24);
  return niz;
}
/* Koja smjena radi u zadanom trenutku — radi za bilo koji broj smjena, ne samo dvije.
   Zadnja smjena u nizu prelazi preko ponoći (npr. 22-6), pa je ujedno i zadana kad je
   sat prije prve granice. */
function autoSmjena(kad){
  var sm = TVRTKA.smjene && TVRTKA.smjene.length ? TVRTKA.smjene : ['1. smjena','2. smjena'];
  var od = (TVRTKA.smjene_od && TVRTKA.smjene_od.length === sm.length)
    ? TVRTKA.smjene_od : zadaneGraniceSmjena(sm.length);
  /* duck-typing umjesto instanceof Date: testovi zovu ovu funkciju iz iframe-a s Date
     objektom napravljenim u roditeljskom prozoru — instanceof tada tiho pada jer su
     to dvije različite Date klase, pa bi se svaki poziv vratio na "sada" */
  var h = (kad && typeof kad.getHours === 'function' ? kad : new Date()).getHours();
  var idx = sm.length - 1;   /* zadano: zadnja smjena (pokriva sate prije prve granice) */
  for(var i=0;i<od.length;i++){ if(h >= od[i]) idx = i; }
  return sm[idx] || sm[0];
}
/* ---------- Raspored v45: smjene kao vremenski okvir planiranja ---------- */
function smjeneGraniceNiz(){
  var sm = TVRTKA.smjene && TVRTKA.smjene.length ? TVRTKA.smjene : ['1. smjena','2. smjena'];
  var od = (TVRTKA.smjene_od && TVRTKA.smjene_od.length === sm.length)
    ? TVRTKA.smjene_od : zadaneGraniceSmjena(sm.length);
  return { imena:sm, od:od };
}
/* trajanje jedne smjene u satima (razmak susjednih granica; zadano 8) */
function smjenaTrajanje(){
  var g = smjeneGraniceNiz();
  if(g.od.length < 2) return 8;
  var d = g.od[1] - g.od[0];
  if(d <= 0) d += 24;
  return d > 0 && d <= 24 ? d : 8;
}
/* trenutna smjena s granicama: {naziv, od, do, jos} — do može biti >24 (prelazak ponoći),
   jos = decimalni sati do kraja smjene */
function smjenaGranice(kad){
  var g = smjeneGraniceNiz();
  var d = (kad && typeof kad.getHours === 'function') ? kad : new Date();
  var h = d.getHours() + d.getMinutes()/60;
  var idx = g.imena.length - 1;
  for(var i=0;i<g.od.length;i++){ if(h >= g.od[i]) idx = i; }
  var od = g.od[idx];
  var doS = g.od[(idx+1) % g.od.length];
  if(doS <= od) doS += 24;
  var hh = h < od ? h + 24 : h;
  return { naziv:g.imena[idx] || g.imena[0], od:od, do:doS, jos:Math.max(0, doS - hh) };
}
/* sati koje kvar u radu "zauzima" u danu: do procjene ako je ima, inače do sada; min 0,5 */
function satiKvara(k){
  var p = pocetakKvara(k);
  if(!p) return 0.5;
  var kraj = null;
  if(k.procjena_gotovo){ var pg = new Date(k.procjena_gotovo); if(!isNaN(pg.getTime())) kraj = pg; }
  if(!kraj) kraj = new Date();
  var s = (kraj.getTime() - p.getTime()) / 3600000;
  if(isNaN(s) || s < 0.5) s = 0.5;
  return Math.round(s*2)/2;
}
function fmtSat(d){ return d ? pad2(d.getHours())+':'+pad2(d.getMinutes()) : ''; }
/* inicijali za avatar: 'Majstor 2' → 'M2', 'Voditelj' → 'V', 'Ivan Horvat' → 'IH' */
function inicijali(ime){
  var s = String(ime||'').trim();
  if(!s) return '?';
  var br = /(\d+)\s*$/.exec(s);
  var rijeci = s.replace(/\d+\s*$/,'').trim().split(/\s+/).filter(Boolean);
  var slova = rijeci.map(function(r){ return r.charAt(0).toUpperCase(); }).join('');
  if(br) return (slova.charAt(0) + br[1]).slice(0,3);
  return slova.slice(0,2) || s.charAt(0).toUpperCase();
}
function smjenaOpts(){
  var sm = TVRTKA.smjene && TVRTKA.smjene.length ? TVRTKA.smjene : ['1. smjena','2. smjena'];
  var def = autoSmjena();
  return sm.map(function(s){
    return '<option'+(s===def?' selected':'')+'>'+esc(s)+'</option>';
  }).join('');
}
/* Push obavijesti šalju #kvarovi / #raspored / #poruke — dosad su sve, uz #stroj=,
   tiho padale na Pregled jer je initHash prepoznavao samo strojeve. Klik na "Novi kvar"
   mora otvoriti Kvarove, ne opći Pregled iz kojeg se opet traži isti dodir. */
/* ODLUKA 6 (3.9.2026.): 'analitika' dodana — direktoru (readonly) je sad tab u donjoj traci,
   pa mora podnositi hash-deep-link i "zadnji ekran" kao i ostali glavni ekrani. */
var HASH_EKRANI = ['pregled','kvarovi','raspored','strojevi','dijelovi','poruke','analitika'];
function initHash(){
  var stroj = /#stroj=([\w-]+)/.exec(location.hash || '');
  if(stroj && machineById(stroj[1])){ app.openStroj(stroj[1]); return true; }
  var ime = String(location.hash || '').replace('#','');
  /* B: jutarnja obavijest šalje #pregled, ali tehničar tu karticu nema u donjoj traci —
     bez straže klik na obavijest baca majstora na ekran bez osvijetljene kartice i bez
     "natrag". Pokrivа i već poslane obavijesti (ruta se ne mijenja, samo odredište). */
  if(ime==='pregled' && SESSION.role==='majstor') ime = 'raspored';
  if(HASH_EKRANI.indexOf(ime) > -1){ showScreen(ime); return true; }
  return false;
}

/* ═══ [33] START — ulazna točka: demo ili Supabase sesija ═══ */
async function start(){

  /* Mrežni poziv iznad traje promjenjivo dugo. Ako je korisnik u međuvremenu ušao
     u demo (ili se prijavio), demo/prijava su već postavili SVE — uključujući DATA.
     Zastarjeli nastavak starta bi ovdje kroz localLoad() zamijenio DATA kopijom i
     učinio siročadima svaki zapis koji netko već drži otvoren. */
  if(SESIJA_GEN !== genStart) return;

      ? 'Greška u vezi s bazom. Internet izgleda uredu — baza je možda u mirovanju (dulje bez korištenja). Javi administratoru da je probudi, pa pokušaj za par minuta.'
      : 'Greška u vezi s bazom — provjeri internet pa osvježi stranicu.';
  }
}
start();

/* ═══ [34] OSVJEŽAVANJE I REALTIME — povuciSvjeze, rtNovo ═══ */
/* AUDIT F8: od v69-v71 su glavni obrasci donji listovi (#sheet-root) — narudžba,
   primitak, "Više"... — a stara straza je gledala samo #modal-root, pa je polling/
   realtime znao pregaziti otvoren donji list dok korisnik jos bira/upisuje. */
function formaOtvorena(){ return !!($('#modal-root') && $('#modal-root').innerHTML) || !!($('#sheet-root') && $('#sheet-root').innerHTML); }
async function povuciSvjeze(){
  if(!REMOTE || document.visibilityState !== 'visible') return;
  if(!DATA || $('#screen-login').classList.contains('show')) return;
  if(formaOtvorena()) return;   /* ne diraj otvorenu formu */
  if(PENDING_OPS > 0) return;              /* ne gazi unos koji još putuje u bazu */
  if(!naMrezi()) return;
  if(RED.length){ await sinkroniziraj(); return; }   /* prvo pošalji svoje, pa povlači tuđe */
  try{
    await load(true);                      /* tiho — bez loadera */
    rerender();
  }catch(e){
    /* AUDIT F8: istekla sesija se dosad tiho gutala — korisnik je nastavljao "raditi"
       na zamrznutom ekranu (svaki idući pokušaj spremanja bi tek TADA otkrio problem). */
    if(sesijaIstekla(e)){
      $('#screen-login').classList.add('show');
      var el = $('#login-err'); if(el) el.textContent = 'Sesija je istekla — prijavi se ponovno.';
      renderLoginTiles();
    }
  }
}
/* osvježavanje za rad u 2 smjene (multi-user): polling dok je tab vidljiv */
setInterval(povuciSvjeze, 30000);
/* AUDIT-FIX: povratak na tab (drugi ekran, minimizirano) čekao je do sljedećeg tika
   od 30 s da povuče promjene — isti uvjeti kao polling, samo odmah pri povratku. */
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') povuciSvjeze(); });

/* realtime: nove poruke/kvarovi/komentari odmah stižu svima (multi-user) */
async function rtNovo(tip, pl){
  var row = (pl && pl['new']) ? pl['new'] : {};
  if(row.tko && row.tko === SESSION.ime) return;   /* moj vlastiti unos (poruke, komentari) */
  if(row.id && MOJI_UNOSI[row.id]) return;         /* moj vlastiti kvar — ne javljaj mi ga natrag */
  if(row.tko==='Sustav' && MOJI_SISTEMSKI[row.tekst]) return;   /* moj vlastiti sistemski zapis (sysPoruka) */
  if(tip==='poruke')    toast('💬 Nova poruka — ' + (row.tko||''));
  if(tip==='kvarovi')   toast('⚠ Novi kvar prijavljen');
  if(tip==='komentari') toast('💬 Novi komentar na kvaru');
  if(PENDING_OPS > 0 || formaOtvorena()){ return; }
  try{ await load(true); rerender(); }catch(e){}
}
if(REMOTE){
  ['poruke','kvarovi','komentari'].forEach(function(t){
    sb.channel('rt-'+t)
      .on('postgres_changes', {event:'INSERT', schema:'public', table:t},
          function(pl){ rtNovo(t, pl); })
      .subscribe();
  });
}

/* ═══ [35] PWA, VERZIJA, GLOBALNI LISTENERI — service worker, traka nove verzije, Escape, MutationObserver ═══ */
/* PWA servisni radnik (samo preko http/https, ne za file://) */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
  /* AUDIT-FIX §4: sw.js zove skipWaiting()+clients.claim() pri objavi nove verzije,
     ali bez ovog listenera otvoren tab ostaje zauvijek na starom JS-u dok se ručno
     ne zatvori — čest slučaj kad netko ostavi app otvoren na hali danima.
     "vecKontroliran" razlikuje PRVU instalaciju (nema što osvježiti) od stvarne
     nove verzije koja preuzima kontrolu nad već otvorenom stranicom. */
  var vecKontroliran = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!vecKontroliran){ vecKontroliran = true; return; }
    prikaziNovuVerziju();
  });
  /* AUDIT-FIX (Z3): sw.js se sam ponovno pretplati na push kad preglednik rotira
     pretplatu (pushsubscriptionchange), ali nema pristup Supabase sesiji da to javi
     serveru — javlja ovom prozoru porukom, mi imamo sesiju pa dovršimo posao. */
  navigator.serviceWorker.addEventListener('message', function(ev){
    if(ev.data && ev.data.type === 'push-resubscribed' && ev.data.subscription){
      posaljiPushPretplatu(ev.data.subscription);
    }
  });
}
/* AUDIT-FIX: modali (i od v69-v71 sheetovi #sheet-root/#sheet-root2, koji su glavni
   obrasci — narudžba, primitak, "Više", FAB "Dodaj", odabir) su desetke ".modal"
   stringova bez role="dialog"/aria-modal — umjesto da se svaki predložak ručno
   dopunjuje, jedan observer po korijenu nakon svakog otvaranja označi modal i
   prebaci fokus na prvi fokusabilan element u njemu. */
function oznaciDialog(root){
  var m = root && root.querySelector('.modal');
  if(m){
    if(!m.hasAttribute('role')) m.setAttribute('role','dialog');
    m.setAttribute('aria-modal','true');
    /* PREGLED-C: ne otimaj fokus ako je već unutar ovog sloja. odabirTrazi() (donji list
       "Odaberi" s pretragom) prerenderira cijeli sheet na svaki upisani znak i sam vrati
       fokus u polje za pretragu — observer se javlja tek nakon toga (mikrozadatak) pa bi
       bez ove provjere fokus odveo na "✕" i dalje se ne bi moglo tipkati. Pri stvarnom
       otvaranju je fokus vani (na gumbu koji je otvorio sloj ili na <body>), pa ovo ne
       dira ni automatski fokus ni pomak fokusa iz modala u sheet. */
    if(root.contains(document.activeElement)) return;
    var prvi = m.querySelector('button, [href], input, select, textarea, [tabindex]');
    if(prvi) prvi.focus();
  }
}
/* SMJER-B: #modal-root se puni innerHTML-om na desetke mjesta u kodu — umjesto da svako
   od njih zove osvjeziFab(), jedan observer na childList pokriva sva otvaranja/zatvaranja. */
if(window.MutationObserver){
  var mrEl = document.getElementById('modal-root');
  if(mrEl) new MutationObserver(function(){
    osvjeziFab();
    oznaciDialog(mrEl);
  }).observe(mrEl, {childList:true});
  ['sheet-root','sheet-root2'].forEach(function(id){
    var shEl = document.getElementById(id);
    if(shEl) new MutationObserver(function(){ oznaciDialog(shEl); }).observe(shEl, {childList:true});
  });
}
/* AUDIT-FIX: Escape zatvara otvoreni modal ili sheet — isto što radi vidljivi "✕" gumb
   (bez potvrde, kao i taj gumb). Redoslijed prati vizualni sloj (sheet-root2 iznad
   sheet-root iznad modal-root, v. z-index gore) pa se zatvara ono što je stvarno na vrhu. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  var s2 = document.getElementById('sheet-root2'), s1 = document.getElementById('sheet-root');
  var x = (s2 && s2.innerHTML && s2.querySelector('.modal-head .x'))
       || (s1 && s1.innerHTML && s1.querySelector('.modal-head .x'));
  if(x){ x.click(); return; }
  if($('#modal-root').innerHTML) app.closeModal();
});
function prikaziNovuVerziju(){
  var el = document.getElementById('verzija-traka');
  if(!el) return;
  el.style.display = '';
  el.className = 'off-traka ceka';
  el.innerHTML = '⬆️ Dostupna je nova verzija — <button type="button" class="link-btn" onclick="location.reload()">osvježi</button>';
}
