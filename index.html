async function uploadFoto(dataUrl){
  if(!REMOTE || !dataUrl) return dataUrl;
  try{
    var blob = await (await fetch(dataUrl)).blob();
    /* nasumicno ime — fotografije se ne smiju moci pogadjati redom */
    var nasumicno = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                    : (Date.now()+'-'+Math.random().toString(36).slice(2,10));
    var path = 'kv-' + nasumicno + '.jpg';
    var up = await sb.storage.from('fotke-kvarova').upload(path, blob, {contentType:'image/jpeg'});
    if(up.error) return dataUrl;  /* fallback: base64 ostaje u zapisu */
    return sb.storage.from('fotke-kvarova').getPublicUrl(path).data.publicUrl;
  }catch(e){ return dataUrl; }
}
/* Dokumenti uz stroj (F4, PLAN-MODULI §1) — za razliku od fotki kvara NEMA base64
   fallback: papir od servisera može pričekati mrežu 10 minuta (§1d), a jedan PDF u
   localStorage redu čekanja bi mu srušio kvotu i oborio SVE buduće offline unose. */
async function uploadDokument(mId, dataUrl, mime){
  if(!REMOTE) return null;
  try{
    var blob = await (await fetch(dataUrl)).blob();
    var ext = mime==='application/pdf' ? '.pdf' : '.jpg';
    var nasumicno = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                    : (Date.now()+'-'+Math.random().toString(36).slice(2,10));
    var path = mId + '/' + nasumicno + ext;
    var up = await sb.storage.from('dokumenti').upload(path, blob, {contentType:mime});
    if(up.error) return null;
    return path;
  }catch(e){ return null; }
}
function dokUrl(dok){
  if(!REMOTE) return dok.path;   /* demo način: path je već dataURL */
  return sb.storage.from('dokumenti').getPublicUrl(dok.path).data.publicUrl;
}
function dokIkona(tip){
  return tip==='manual' ? '📄' : tip==='shema' ? '📐' : tip==='zapisnik' ? '🧾' : tip==='certifikat' ? '📋' : '📎';
}
var DOK_TIPOVI = [['manual','Manual'],['shema','Shema'],['zapisnik','Zapisnik servisa'],['certifikat','Certifikat'],['ostalo','Ostalo']];
function dokTipLabel(tip){
  var t = DOK_TIPOVI.filter(function(x){ return x[0]===tip; })[0];
  return t ? t[1] : 'Ostalo';
}
function velicinaTxt(bajtova){
  if(!bajtova) return '';
  return bajtova >= 1024*1024 ? (Math.round(bajtova/1024/1024*10)/10)+' MB' : Math.round(bajtova/1024)+' KB';
}

/* =====================  render: Pregled  ===================== */
var PREGLED_FIN_OTVOREN = false;   /* AUDIT-FIX (UX): financijski blok sklopiv, zatvoren po
  defaultu — Pregled je jedini ekran gdje "gustoća iza dodira" (već primijenjeno na
  Kvarovima/Skladištu) nije postojala, iako je ovo i prvi ekran nakon prijave i demo ekran. */
function renderPregled(){
  var KV = samoKvarovi();  /* bez storniranih i bez zadataka — financije i brojke */
  var mm = todayISO().slice(0,7);
  var mk = KV.filter(function(k){ return k.date.slice(0,7)===mm; });
  var cost = 0, hrs = 0;
  mk.forEach(function(k){ cost += kvarCost(k); hrs += k.sati; });
  /* Zatvoreni kvarovi nose sate, otvoreni ih još nemaju — pa mjesečna brojka vrijedi
     0 € za kvar koji upravo stoji, dok sekcija ispod za isti kvar kaže 1.962 €.
     Procjenu držimo odvojeno od dokazive brojke, ali je ne prešućujemo. */
  var uTijekuCost = 0;
  mk.forEach(function(k){
    /* isto pravilo kao "Trenutno stoji": upozorenje nije zaustavljena linija */
    if(!jeOtvoren(k) || k.upoz) return;
    var p0 = pocetakKvara(k);
    if(!p0) return;
    var sm0 = machineById(k.m);
    uTijekuCost += Math.max(0, (Date.now() - p0.getTime())/3600000) * (sm0 ? sm0.rate : 350);
  });
  var open = KV.filter(function(k){ return jeOtvoren(k); });
  var low  = zaNaruciti();   /* ista definicija kao na Nabavi: bez otvorene narudžbe */
  var late = DATA.preventiva.filter(function(p){ return p.next < todayISO(); });
  var last3 = aktivni().slice().sort(byDateDesc).slice(0,3);
  /* §16 P1/P2: druga statistika je "Za naručiti" — voditeljev/direktorov posao (nabava).
     Tehničaru ne kaže ništa o njegovom danu; proizvodnji ne kaže ništa o liniji. */
  var drugaStat;
  if(SESSION.role==='majstor'){
    drugaStat = statCard(danSazetak(todayISO()).n, 'Danas na Rasporedu', 'green', "app.go('raspored')");
  } else if(SESSION.role==='proizvodnja'){
    var zast = sljedeciZastojLinije();
    drugaStat = zast
      ? statCard(Math.max(0,-danaOd(zast.next)), 'dana do zastoja linije', 'yellow', "app.go('raspored')")
      : statCard('—', 'Nema planiranih zastoja', 'green', "app.go('raspored')");
  } else {
    drugaStat = statCard(low.length, 'Za naručiti', low.length ? 'red' : 'green', "app.go('nabava')");
  }

  /* usporedba s prošlim mjesecom — samo do istog dana u mjesecu.
     Inače nepuni tekući mjesec ide protiv cijelog prošlog i svaki mjesec lažno pokazuje pad. */
  var now = new Date();
  var danMj = now.getDate();
  var pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
  var pmKey = pm.getFullYear()+'-'+pad2(pm.getMonth()+1);
  var prevCost = 0;
  KV.forEach(function(k){
    if(k.date.slice(0,7)===pmKey && parseInt(k.date.slice(8,10),10) <= danMj) prevCost += kvarCost(k);
  });
  var trend = '';
  if(prevCost > 0){
    var pct = Math.round((cost - prevCost) / prevCost * 100);
    /* pad se ne smije bojiti zeleno dok kvarovi koji traju još nisu ušli u brojku */
    var padJeSiguran = pct < 0 && uTijekuCost === 0;
    trend = '<span class="trend '+(pct>=0 ? 'up' : (padJeSiguran ? 'down' : ''))+
      '" title="usporedba s istim brojem dana prošlog mjeseca">'+
      (pct>=0?'▲ +':'▼ ')+Math.abs(pct)+'% vs prvih '+danMj+' dana '+esc(MJESECI_G[pm.getMonth()])+'</span>';
  }

  /* najskuplji strojevi u zadnja 3 mjeseca */
  var t90 = isoShift(-92), costBy = {};
  KV.forEach(function(k){ if(k.date >= t90 && k.m) costBy[k.m] = (costBy[k.m]||0) + kvarCost(k); });
  var top = Object.keys(costBy).map(function(id){ return {id:id, c:costBy[id]}; })
    .sort(function(a,b){ return b.c - a.c; }).slice(0,3);
  var maxC = top.length ? top[0].c : 1;
  var topHtml = top.map(function(t){
    var tm = machineById(t.id) || {name:'—'};
    return '<div class="bar-row" onclick="app.openStroj(\''+t.id+'\')">'+
      '<div class="bar-name">'+esc(tm.name)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(t.c/maxC*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(t.c)+'</div></div>';
  }).join('');

  /* Redak "Raspored i zadaci" je izbačen (PLAN-KAIZEN S1) — Raspored ima svoju
     karticu u dnu, a "Preventive kasne" u stat-mreži već vodi onamo. */

  /* trend troška po mjesecima (zadnja 3) — zadnji stupac je nepotpun i tako je i označen */
  var mjeseci3 = [2,1,0].map(function(off){
    var d0 = new Date(); var md = new Date(d0.getFullYear(), d0.getMonth()-off, 1);
    var key = md.getFullYear()+'-'+pad2(md.getMonth()+1);
    var c = 0;
    KV.forEach(function(k){ if(k.date.slice(0,7)===key) c += kvarCost(k); });
    return { label: MJESECI[md.getMonth()], c: c, uTijeku: off === 0 };
  });
  var maxM = Math.max.apply(null, mjeseci3.map(function(x){ return x.c; }).concat([1]));
  var trendHtml = mjeseci3.map(function(x){
    return '<div class="bar-row" style="cursor:default">'+
      '<div class="bar-name">'+esc(x.label)+(x.uTijeku ? ' <span class="nepotpun">u tijeku</span>' : '')+'</div>'+
      '<div class="bar-track"><div class="bar-fill'+(x.uTijeku?' u-tijeku':'')+
        '" style="width:'+Math.round(x.c/maxM*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(x.c)+'</div></div>';
  }).join('');

  /* "Trenutno stoji" — jedina sekcija koja odgovara i direktoru i voditelju proizvodnje.
     Samo pravi kvarovi (ne upozorenja), koliko već stoje i koliko je to do sada koštalo.
     Prazna lista → sekcija se ne prikazuje uopće. */
  var stoje = open.filter(function(k){ return !k.upoz && k.m; })
    .sort(function(a,b){
      var pa = pocetakKvara(a), pb = pocetakKvara(b);
      /* najdulji zastoj na vrh; bez poznatog početka sortiramo po danu prijave */
      var ta = pa ? pa.getTime() : new Date(a.date+'T00:00:00').getTime();
      var tb = pb ? pb.getTime() : new Date(b.date+'T00:00:00').getTime();
      return ta - tb;
    });
  var stojiHtml = stoje.length
    ? '<h2>Trenutno stoji ('+stoje.length+')</h2><div class="card">'+stoje.map(function(k){
        var sm = machineById(k.m) || {name:'—', rate:350};
        var p = pocetakKvara(k);
        /* bez poznatog početka ne postoji trošak "do sada" — prazno je poštenije od nule */
        var sati = p ? Math.max(0, (Date.now() - p.getTime())/3600000) : null;
        return '<div class="row click" onclick="app.detaljKvara(\''+k.id+'\')">'+
          '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(sm.name)+
            (k.prioritet==='hitno' ? ' <span class="chip kvar">HITNO</span>' : '')+
            (k.ceka_dio ? ' <span class="chip upoz">Čeka dio · stoji</span>' : '')+
            (k.ceka_servis ? ' <span class="chip servis">Čeka servis</span>' : '')+'</div>'+
          '<div class="row-sub">'+esc(k.opis)+'</div>'+
          '<div class="row-sub">'+(trajanjeKvara(k) || 'u tijeku')+
            (k.dodijeljen ? ' &middot; <b>'+esc(k.dodijeljen)+'</b>' : ' &middot; nedodijeljen')+'</div></div>'+
          (vidiFinancije() && sati !== null
            ? '<div class="row-right"><div class="stoji-cijena">'+EUR(sati * (sm.rate||350))+
              '<span>do sada</span></div></div>'
            : '')+
        '</div>';
      }).join('')+'</div>'
    : '';

  /* S2 (PLAN-KAIZEN): majstor ne vidi financije — njegov pregled počinje zadacima,
     bigCard se za njega uopće ne iscrtava (Moji zadaci mu je u istom slotu). */
  /* mjesec još traje — to mora pisati, inače broj izgleda kao konačan */
  var mjesecSub = esc(monthLabel())+' — prvih '+danMj+' dana';
  var bigCard = '<div class="big-card" onclick="app.go(\'kvarovi\')">'+
      '<div class="big-label">Trošak zastoja ovaj mjesec</div>'+
      '<div class="big-num">'+EUR(cost)+trend+'</div>'+
      '<div class="big-sub">'+mjesecSub+' &middot; '+mk.length+' zastoja &middot; ukupno '+H(hrs)+
        (uTijekuCost > 0 ? '<br>+ '+EUR(uTijekuCost)+' iz kvarova koji još traju' : '')+'</div>'+
    '</div>';
  /* S2 (PLAN-KAIZEN): prvo ono što gori, pa brojke, pa povijest — financije nisu
     prva stvar koju voditelj traži ujutro, a majstora uopće ne zanimaju. */
  var mojiZadaciHtml = (function(){
    var moji = aktivni().filter(function(k){ return jeOtvoren(k) && k.dodijeljen===SESSION.ime; });
    return moji.length
      ? '<h2>Moji zadaci ('+moji.length+')</h2><div class="card">'+moji.map(function(k){ return kvarItem(k,true); }).join('')+'</div>'
      : '';
  })();
  /* AUDIT-FIX (UX): bigCard + oba bar-grafa su nekad uvijek stajala razvijena — najgušći
     dio najgušćeg (i demo) ekrana, a bar-grafovi dupliraju ono što Analitika već pokazuje.
     Sad su iza jednog sklopivog retka: prvi pogled ostaje "što gori" (Trenutno stoji, 3
     stat kartice, Moji zadaci), financije su tu kad ih netko stvarno traži. */
  var finTraka = '<div class="rasp-kal-traka" onclick="app.pregledFinToggle()">'+
    '<span>Trošak zastoja ovaj mjesec — '+EUR(cost)+'</span>'+
    '<span class="chev" style="transform:rotate('+(PREGLED_FIN_OTVOREN?90:0)+'deg)">›</span></div>';
  var finDetalji = PREGLED_FIN_OTVOREN
    ? bigCard+
      '<button class="btn sec sm block" style="margin-top:10px" onclick="app.go(\'analitika\')">Analitika i izvoz</button>'+
      '<h2>Najskuplji strojevi — zadnja 3 mj.</h2><div class="card">'+topHtml+'</div>'+
      '<h2>Trošak zastoja po mjesecima</h2><div class="card">'+trendHtml+'</div>'
    : '';
  /* §15 #4 — direktor (readonly): jedan hero blok umjesto sklopljenih financija + 3 kartice.
     On ne radi ništa u alatu — čita "koliko košta, što stoji, što je najskuplje". Sve što
     traži radnju (Moji zadaci, dodjela) direktoru se uopće ne iscrtava. Isti vizualni jezik
     kao Raspored hero, da app izgleda kao jedan alat, ne dva. */
  var dirHero = '';
  if(SESSION.role==='readonly'){
    /* §16 P3 (rupa #6 "Direktor: zašto je trošak skočio?"): trend (▲ +21%) do sada nije vodio
       ni do jednog krivca — najskuplji POJEDINAČNI zastoj ovaj mjesec, jedan klik do detalja. */
    var najveciK = null, najveciTrosak = -1;
    mk.forEach(function(k){
      /* SIM-FIX: upozorenje ne zaustavlja liniju — isto pravilo kao uTijekuCost (~1893) i
         filtar "Trenutno stoji" (~1974). Bez ovoga je stroj koji nikad nije stao mogao
         ispasti "najveći zastoj mjeseca" jer mu je trošak rastao dok upozorenje traje. */
      if(k.upoz) return;
      var mN = machineById(k.m);
      var c = jeOtvoren(k)
        ? (function(){ var pN = pocetakKvara(k); return pN ? Math.max(0,(Date.now()-pN.getTime())/3600000)*(mN?mN.rate:350) : 0; })()
        : kvarCost(k);
      if(c > najveciTrosak){ najveciTrosak = c; najveciK = k; }
    });
    var najveciRedak = najveciK && najveciTrosak > 0
      ? '<div class="row click" onclick="app.detaljKvara(\''+najveciK.id+'\')" style="margin-top:8px">'+
          '<div class="grow"><div class="row-title" style="font-size:13.5px">Najveći zastoj: '+
            esc((machineById(najveciK.m)||{name:'—'}).name)+'</div>'+
          '<div class="row-sub">'+(trajanjeKvara(najveciK)||H(najveciK.sati))+' &middot; '+EUR(najveciTrosak)+
            (jeOtvoren(najveciK) ? ' &middot; u tijeku' : '')+'</div></div>'+
          '<span class="chev">›</span></div>'
      : '';
    var sveRadi = stoje.length === 0;
    var stojiRedak;
    if(sveRadi){
      stojiRedak = '<div class="dir-stoji" onclick="app.go(\'kvarovi\')"><span class="tocka"></span>'+
        '<span>Sve linije rade</span><span class="chev">›</span></div>';
    } else {
      var k0 = stoje[0], sm0 = machineById(k0.m) || {name:'—', rate:350};
      var p0 = pocetakKvara(k0);
      var s0 = p0 ? Math.max(0, (Date.now()-p0.getTime())/3600000) : null;
      stojiRedak = '<div class="dir-stoji stoji" onclick="app.detaljKvara(\''+k0.id+'\')"><span class="tocka"></span>'+
        '<span>Stoji: <b>'+esc(sm0.name)+'</b>'+(stoje.length>1 ? ' <span class="row-sub">+ još '+(stoje.length-1)+'</span>' : '')+
          '<span class="row-sub"> · '+(trajanjeKvara(k0)||'u tijeku')+(s0!==null ? ' · '+EUR(s0*(sm0.rate||350))+' do sada' : '')+'</span></span>'+
        '<span class="chev">›</span></div>';
    }
    dirHero = '<div class="card rasp-hero dir-hero'+(sveRadi && !open.length ? ' gotovo' : '')+'">'+
      '<div class="rasp-hero-r1"><div>'+
        '<div class="rasp-dan-h2">Trošak zastoja · '+esc(monthLabel())+'</div>'+
        '<div class="rasp-dan-h1">'+EUR(cost)+trend+'</div>'+
        /* SIM-FIX (§16 rupa "Analitika" — tri slabe mete): iznos u eurima više nije dodir
           (tri mete za istu radnju svode se na jednu), a diskretni sivi tekst postaje prava
           pilula — isti uzorak (.rasp-skok) kao "Danas ›" na Rasporedu, min. 44px za dodir. */
        '<button class="rasp-skok" style="margin-top:8px;min-height:44px" onclick="app.go(\'analitika\')">Analitika i izvoz ›</button>'+
      '</div><div><div class="rasp-smjena">prvih '+danMj+' dana</div>'+
        (uTijekuCost > 0 ? '<div class="rasp-smjena-jos">+ '+EUR(uTijekuCost)+' još traje</div>' : '')+'</div></div>'+
      najveciRedak+
      '<div class="rasp-hero-grid">'+
        '<div class="rasp-stat" onclick="app.goKvaroviOtvoreni()"><span class="stat-num'+(open.length?' crv':'')+'">'+open.length+'</span><span class="stat-label">otvoreno</span></div>'+
        '<div class="rasp-stat" onclick="app.go(\'kvarovi\')"><span class="stat-num">'+H(hrs)+'</span><span class="stat-label">zastoja</span></div>'+
        '<div class="rasp-stat" onclick="app.go(\'raspored\')"><span class="stat-num'+(late.length?' crv':'')+'">'+late.length+'</span><span class="stat-label">kasni servis</span></div>'+
      '</div>'+
      stojiRedak+
    '</div>';
  }
  /* §16 P1: proizvodnja nema dir-hero (ne treba joj €), ali zaslužuje isto "Sve linije rade"
     kad ništa ne stoji — dosad je sekcija naprosto nestala i ekran je počeo brojkama. */
  var sveRadiProizvodnja = SESSION.role==='proizvodnja' && !stoje.length
    ? '<div class="dir-stoji" onclick="app.go(\'kvarovi\')"><span class="tocka"></span>'+
      '<span>Sve linije rade</span><span class="chev">›</span></div>'
    : '';
  $('#screen-pregled').innerHTML =
    (SESSION.role==='readonly'
      ? dirHero+
        (top.length ? '<h2>Najskuplji strojevi — zadnja 3 mj.</h2><div class="card">'+topHtml+'</div>' : '')
      : sveRadiProizvodnja+stojiHtml+
        '<div class="stat-grid">'+
          statCard(open.length, 'Otvoreni kvarovi',        open.length ? 'red'    : 'green', "app.goKvaroviOtvoreni()")+
          drugaStat+
          /* organizacija se radi na Rasporedu — i brojka vodi onamo. AUDIT-FIX (UX):
             "Preventive" je žargon bez imenice ("preventivni pregledi") — nekome tko nije
             iz održavanja djeluje kao nedovršena rečenica. */
          statCard(late.length, 'Zaostali servisi',        late.length ? 'yellow' : 'green', "app.go('raspored')")+
        '</div>'+
        mojiZadaciHtml+
        (vidiFinancije() ? finTraka+finDetalji : ''))+
    /* §16 P1: direktoru (2×/tjedno) je "Zadnji događaji" 3 retka bez financija bespredmetno —
       dir-hero + top-3 stroja mu je dovoljan uvid; ostalima je uvid u "što se upravo dogodilo". */
    (SESSION.role==='readonly' ? '' :
      '<h2>Zadnji događaji</h2>'+
      '<div class="card">'+ last3.map(function(k){ return eventRow(k); }).join('') +'</div>')+
    '<div class="session-row">'+
      (REMOTE ? 'Prijavljen: <b>'+esc(SESSION.ime)+'</b> ('+esc(NAZIV_ULOGE[SESSION.role]||SESSION.role)+') &middot; <a onclick="app.odjava()">Odjava</a> &middot; ' : '')+
      /* SIM-FIX: razdjelnik prije "Pomoć" je stajao izvan role-voditelj span-a, pa je
         direktoru (oba linka iznad skrivena) ostajao sirot "· Pomoć". Razdjelnik je sad
         UNUTAR span-a koji nosi svoj link, pa se skriva zajedno s njim. */
      '<span class="role-voditelj"><a onclick="app.izvoz()">Izvoz podataka</a> &middot; </span>'+
      '<span class="role-voditelj"><a onclick="app.izvozCSV()">Izvoz CSV</a> &middot; </span>'+
      '<a onclick="app.pomoc()">Pomoć</a>'+
    '</div>';
}
function statCard(n, label, color, onclick){

function eventRow(k){

    '<div class="row-right">'+chip+'</div></div>';
}

/* =====================  render: Strojevi  ===================== */
var STROJ_Q = '';
function strojeviListaHtml(){
  var q = STROJ_Q.trim().toLowerCase();
  if(q){
    var nadjeno = DATA.machines.filter(function(m){
      return (m.name+' '+(m.program||'')).toLowerCase().indexOf(q) > -1;
    });
    return '<div class="card">'+(nadjeno.length ? nadjeno.map(function(m){ return machineRow(m); }).join('')
      : '<div class="empty">Nema strojeva za traženi pojam.</div>')+'</div>';
  }
  var html = '';
  PROGRAMS.forEach(function(prog){
    var ms = DATA.machines.filter(function(m){ return m.program===prog; });
    if(!ms.length) return;   /* prazan sektor ne treba prazan naslov */
    html += '<h2>'+esc(prog)+'</h2><div class="card">'+
      ms.map(function(m){ return machineRow(m); }).join('') + '</div>';
  });
  /* stroj čiji sektor nije na popisu (npr. vlasnik preimenovao sektore u postavkama,
     a stroj još nosi stari naziv) NE SMIJE nestati s ekrana */
  var bezSektora = DATA.machines.filter(function(m){ return PROGRAMS.indexOf(m.program) === -1; });
  if(bezSektora.length){
    html += '<h2>Ostalo</h2><div class="card">'+

/* =====================  render: detalj stroja  ===================== */
var CURRENT_M = null;
var POV_SVE = false;   /* skraćena povijest kvarova na stroju — "Prikaži sve" ju proširi */
function renderStroj(){
  var m = machineById(CURRENT_M);
  if(!m){ CURRENT_M = null; showScreen('strojevi'); return; }
  var ks = DATA.kvarovi.filter(function(k){ return k.m===m.id; }).sort(byDateDesc);
  var ps = DATA.preventiva.filter(function(p){ return p.m===m.id; });
  /* §16 P2 (bug nađen u obilasku): oznaka piše "zadnja 3 mj." ali je do sada zbrajala CIJELU
     povijest stroja (uklj. otkazane kvarove i zadatke) — isti prozor i filtar kao Pregled
     "Najskuplji strojevi" (samoKvarovi(), isoShift(-92)), da broj stvarno znači ono što piše. */
  var t90stroj = isoShift(-92), ukupno = 0;
  samoKvarovi().forEach(function(k){ if(k.m===m.id && k.date>=t90stroj) ukupno += kvarCost(k); });
  var rijeseni = ks.filter(function(k){ return k.status==='rijesen'; });
  var mttr = rijeseni.length ? rijeseni.reduce(function(s,k){ return s+k.sati; },0) / rijeseni.length : 0;

  var prevHtml = ps.length ? ps.map(function(p){
    var late = p.next < todayISO();
    var izv = (p.izv && p.izv!=='interno') ? ' &middot; izvođač: '+esc(p.izv) : '';
    var dod = p.dodijeljen ? ' &middot; '+esc(p.dodijeljen) : '';
    var traj = p.trajanje_h ? ' &middot; ~'+H(p.trajanje_h) : '';
    var zadnje = p.zadnje ? '<div class="row-sub">zadnje obavljeno: '+fmtDate(p.zadnje)+
      (p.tkoZadnji ? ' ('+esc(p.tkoZadnji)+')' : '')+'</div>' : '';
    /* AUDIT-FIX: isti klik-na-redak uzorak kao na Rasporedu (prevRedak) — dosad je ovaj
       redak imao stalni gumb "Uredi" dok je Raspored za istu stavku nudio samo ✓ i
       klik-kroz izbornik; "Uredi" je sad među radnjama u zajedničkom akcijeStavke() listu. */
    return '<div class="row click" onclick="app.akcijeStavke(\'preventiva\',\''+p.id+'\')"><div class="grow">'+
      '<div class="row-title" style="font-size:13.5px">'+esc(p.opis)+
        (p.zaustavlja_liniju ? ' <span class="chip upoz">Zaustavlja liniju</span>' : '')+'</div>'+
      '<div class="row-sub">'+esc(p.interval)+' &middot; sljedeće: '+fmtDate(p.next)+izv+dod+traj+'</div>'+zadnje+
      '</div>'+(late ? '<div class="row-right"><span class="chip upoz">Kasni</span></div>' : '')+'</div>';
  }).join('') : '<div class="empty">Nema planiranih stavki.</div>';

  /* povijest kvarova skraćena na zadnjih 10 — starije se rijetko traže, a duga
     nezavršiva lista na svakom stroju čini ekran neupotrebljivim za stariji stroj */
  var POVIJEST_N = 10;
  var kvarPrikaz = POV_SVE ? ks : ks.slice(0, POVIJEST_N);
  var kvarHtml = ks.length ? kvarPrikaz.map(function(k){ return kvarItem(k,false); }).join('')+
      (!POV_SVE && ks.length > POVIJEST_N
        ? '<button class="btn sec sm block" style="margin:8px 0 0" onclick="app.prikaziSvuPovijest()">Prikaži svih '+ks.length+'</button>'
        : '')
    : '<div class="empty">Nema zabilježenih kvarova.</div>';

  $('#screen-stroj').innerHTML =
    '<button class="back" onclick="app.go(\'strojevi\')">‹ Strojevi</button>'+
    '<div class="card"><div class="detail-head"><div>'+
      '<div class="detail-name">'+esc(m.name)+'</div>'+
      '<div class="detail-sub">'+esc(m.program)+
      (vidiFinancije() ? ' &middot; trošak zastoja '+m.rate+' €/h &middot; ukupno zadnja 3 mj.: <b>'+EUR(ukupno)+'</b>' : '')+
      (mttr ? ' &middot; prosj. trajanje popravka: <b>'+H(mttr)+'</b>' : '')+'</div>'+
      '<div style="margin-top:7px"><button class="btn-mini role-voditelj" onclick="app.urediStroj(\''+m.id+'\')">Uredi stroj</button></div></div>'+
      statusChip(machineStatus(m.id))+'</div></div>'+
    '<button class="btn primary block role-write" style="margin-bottom:4px" onclick="app.prijaviZaStroj(\''+m.id+'\')">Prijavi kvar na ovom stroju</button>'+
    '<h2>Plan redovnih pregleda</h2><div class="card">'+prevHtml+'</div>'+
    '<button class="btn sec sm block role-write" style="margin-top:8px" onclick="app.novaPreventiva(\''+m.id+'\')">+ Dodaj stavku redovnog pregleda</button>'+
    '<h2>Bilješke o stroju</h2><div class="card"><div style="padding:11px 13px">'+
      (m.bilj ? '<div style="font-size:13.5px;white-space:pre-wrap">'+esc(m.bilj)+'</div>'
              : '<div class="row-sub">Nema bilješki (manual, serijski broj, napomene o servisu…)</div>')+
      '<button class="btn sec sm role-voditelj" style="margin-top:9px" onclick="app.urediBiljeske(\''+m.id+'\')">Uredi bilješke</button>'+
    '</div></div>'+
    (function(){
      /* F4: dokument je papir koji je serviser ostavio uz stroj — slikan ili PDF,
         umjesto da završi "u registratoru kod nekoga". Online-only (§1d). */
      var dok = (DATA.dokumenti||[]).filter(function(x){ return x.m===m.id; })
        .sort(function(a,b){ return String(b.created_at).localeCompare(String(a.created_at)); });
      var dokHtml = dok.length ? dok.map(function(d){
        return '<div class="row click" onclick="app.otvoriDokument(\''+d.id+'\')">'+
          '<div class="grow"><div class="row-title" style="font-size:13.5px">'+dokIkona(d.tip)+' '+esc(d.naziv)+'</div>'+
          '<div class="row-sub">'+dokTipLabel(d.tip)+(d.tko?' &middot; '+esc(d.tko):'')+
            ' &middot; '+fmtDate(localDT(d.created_at).d)+(velicinaTxt(d.velicina)?' &middot; '+velicinaTxt(d.velicina):'')+'</div></div>'+
          '<button class="btn-mini opasno role-voditelj" onclick="event.stopPropagation();app.obrisiDokument(\''+d.id+'\')">Obriši</button>'+
        '</div>';
      }).join('') : '<div class="empty">Nema dokumenata (manual, shema, zapisnik servisa…)</div>';
      return '<h2>Dokumenti</h2><div class="card">'+dokHtml+'</div>'+
        (naMrezi()
          ? '<button class="btn sec sm block role-write" style="margin-top:8px" onclick="app.dodajDokument(\''+m.id+'\')">+ Dodaj dokument</button>'
          : '<div class="row-sub role-write" style="margin-top:8px">Dokumenti se dodaju kad ima mreže.</div>');
    })()+
    (function(){
      /* Kartica znanja: što se najčešće kvari na ovom stroju i čime je riješeno.
         Ovo je jedini način da iskustvo majstora ostane u firmi kad on nije tu. */
      var rijeseni = ks.filter(function(k){ return k.status==='rijesen' && (k.tip||'kvar')==='kvar'; });
      var grupe = {};
      rijeseni.forEach(function(k){
        var sig = kvarSig(k) || ('x|'+k.opis.slice(0,18).toLowerCase());
        var g = grupe[sig] = grupe[sig] || { n:0, sati:0, rjesenja:{}, primjer:k };
        g.n++; g.sati += k.sati;
        if(k.zam) g.rjesenja[k.zam] = (g.rjesenja[k.zam]||0)+1;
      });
      var red = Object.keys(grupe).map(function(s){ return grupe[s]; })
        .filter(function(g){ return g.n >= 2; })
        .sort(function(a,b){ return b.n - a.n; }).slice(0,5);
      if(!red.length) return '';
      return '<h2>Iskustvo — što se ponavlja i čime se rješava</h2><div class="card">'+
        red.map(function(g){
          var rj = Object.keys(g.rjesenja).sort(function(a,b){ return g.rjesenja[b]-g.rjesenja[a]; });
          return '<div class="row"><div class="grow">'+
            '<div class="row-title" style="font-size:13.5px">'+esc(g.primjer.opis)+
              ' <span class="rep">'+g.n+'×</span></div>'+
            '<div class="row-sub">prosječno '+H(g.sati/g.n)+' po zahvatu'+
              (rj.length ? ' &middot; rješenje: <b style="color:var(--text)">'+esc(rj[0])+'</b>' : '')+
              (rj.length > 1 ? ' (i: '+esc(rj.slice(1,3).join(', '))+')' : '')+'</div>'+
          '</div></div>';
        }).join('')+'</div>';
    })()+
    '<h2>Povijest kvarova ('+ks.length+')</h2><div class="card">'+kvarHtml+'</div>';
}
function kvarItem(k, showMachine){
  var zadatak = (k.tip||'kvar') === 'zadatak';
  var m = machineById(k.m) || {id:'', name: zadatak ? 'Opći zadatak' : 'Nepoznat stroj'};
  /* ČIŠĆENJE (korisnikov feedback: "natrpano, ništa ne dolazi do izražaja"):
     riješen kvar je NORMALNO stanje popisa — chip "Riješen" na većini kartica bio je
     čisti šum. Chip nose samo stanja koja traže pažnju: otvoren/u radu/upozorenje,
     hitno/visok/čeka dio, otkazan, zadatak. Kategorija i "Riješio" žive u detalju. */
  var chip = '';
  if(k.status==='otkazan') chip = '<span class="chip otkazan">Otkazan</span>';
  else if(k.status==='u_radu') chip = '<span class="chip rad">U radu</span>';
  else if(k.status==='otvoren') chip = k.upoz ? '<span class="chip upoz">Upozorenje</span>' : '<span class="chip kvar">Otvoren</span>';
  var meta;
  if(zadatak){
    meta = k.rok ? ('Rok: '+(k.rok < todayISO() && jeOtvoren(k) ? '<b style="color:var(--red)">'+fmtDate(k.rok)+'</b>' : fmtDate(k.rok))) : 'Bez roka';
  } else if(jeOtvoren(k)){
    /* dok linija stoji, "Zastoj 0h" je suprotno od istine — pokazujemo koliko već traje */
    meta = trajanjeKvara(k) || 'u tijeku';
    if(k.dodijeljen) meta += ' &middot; <b>'+esc(k.dodijeljen)+'</b>';
  } else {
    meta = 'Zastoj '+H(k.sati)+(vidiFinancije() ? ' &middot; <b>'+EUR(kvarCost(k))+'</b>' : '');
  }
  var pChip = '';
  if(zadatak) pChip += '<span class="chip zadatak">Zadatak</span> ';
  if(jeOtvoren(k)){
    if(k.prioritet==='hitno') pChip += '<span class="chip kvar">HITNO</span> ';
    else if(k.prioritet==='visok') pChip += '<span class="chip upoz">Visok</span> ';
    if(k.ceka_dio) pChip += '<span class="chip upoz">Čeka dio · stoji</span> ';
    if(k.ceka_servis) pChip += '<span class="chip servis">Čeka servis</span> ';
  }
  var sig = zadatak ? null : kvarSig(k);
  var rep = (sig && REPS[sig] >= 2) ? ' <span class="rep">'+REPS[sig]+'× u 3 mj.</span>' : '';
  /* Kartica je za čitanje — na njoj stoji SAMO radnja koja nedostaje: dodjela
     nedodijeljenog kvara. Sve ostalo ("Čeka dio", rješavanje, uređivanje) je u
     detalju koji se ionako otvara dodirom na karticu. */
  var brzeAkcije = '';
  if(jeOtvoren(k) && !k.dodijeljen){
    /* §16 P2: s jednim tehničarom (stvarni Clarum ustroj) je izbornik s jednom opcijom
       nepotreban dodir viška — jedan dodir na čip odmah dodjeljuje. S više tehničara (drugi
       kupac) ostaje izbornik, jer čip-red od N imena ne staje u redak kartice. */
    brzeAkcije = '<div class="kvar-brzo role-write" onclick="event.stopPropagation()">'+
      (MAJSTORI.length===1
        ? '<button class="rasp-cip puni" onclick="app.brzoDodijeli(\''+k.id+'\',\''+esc(MAJSTORI[0])+'\')">→ '+esc(MAJSTORI[0])+'</button>'
        : '<select onchange="app.brzoDodijeli(\''+k.id+'\',this.value)" aria-label="Dodijeli tehničaru">'+
          '<option value="">Dodijeli…</option>'+
          MAJSTORI.map(function(mj){ return '<option>'+esc(mj)+'</option>'; }).join('')+'</select>')+
    '</div>';
  }
  return '<div class="kvar-item click"'+(k.status==='otkazan'?' style="opacity:.55"':'')+
    ' onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="kvar-top"><span>'+(showMachine?'<b style="color:var(--text)">'+esc(m.name)+'</b> &middot; ':'')+fmtDate(k.date)+'</span>'+
    ((pChip||chip) ? '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'+pChip+chip+'</span>' : '')+'</div>'+
    '<div class="kvar-opis">'+esc(k.opis)+rep+'</div>'+
    '<div class="kvar-meta">'+meta+'</div>'+brzeAkcije+'</div>';
}

/* =====================  render: Kvarovi — samo prijave problema  =====================
   Zadaci (kupiti, dogovoriti…) su organizacija i žive na Rasporedu — miješati ih
   među kvarove nije imalo logike ni za brojku na kartici ni za majstora u hali. */
var FILTER = { stroj:'svi', status:'svi', majstor:'svi', od:'', do:'', q:'' };
/* §11.5 dovršetak: pamćenje filtera na Kvarovima kroz osvježavanje stranice */
var ZADNJI_FILTER_KEY = 'odrzavanje-zadnji-filter-kvarovi';
function zapamtiFiltere(){
  try{ localStorage.setItem(ZADNJI_FILTER_KEY, JSON.stringify(FILTER)); }catch(e){}
}
function ucitajZapamceneFiltere(){
  try{
    var v = JSON.parse(localStorage.getItem(ZADNJI_FILTER_KEY) || 'null');
    if(v && typeof v==='object'){
      ['stroj','status','majstor','od','do','q'].forEach(function(k){
        if(typeof v[k] === 'string') FILTER[k] = v[k];
      });
    }
  }catch(e){}
}
ucitajZapamceneFiltere();
var KV_FILTRI_OTVORENI = false;
var KV_RIJESENI_OTVOREN = false;   /* §16 P2: povijest je sklopljena dok se ne zatraži */
var PENDING_FOTO = '';
var PENDING_DOK = null;   /* {dataUrl, mime, naziv, velicina} — dokument uz stroj čeka spremanje */
var PENDING_LOGO = '';
function brojAktivnihFiltera(){
  var n = 0;
  if(FILTER.stroj!=='svi') n++;
  if(FILTER.status!=='svi') n++;
  if(FILTER.majstor!=='svi') n++;
  if(FILTER.od) n++;
  if(FILTER.do) n++;
  return n;
}
function renderKvarovi(){
  var list = DATA.kvarovi.filter(function(k){
    if((k.tip||'kvar')!=='kvar') return false;   /* zadaci su na Rasporedu */
    if(FILTER.status==='svi' && k.status==='otkazan') return false;  /* otkazane samo na izričit zahtjev */
    if(FILTER.stroj!=='svi' && k.m!==FILTER.stroj) return false;
    /* "aktivni" = otvoren + u radu — isto što broji kartica "Otvoreni kvarovi" na Pregledu */
    if(FILTER.status==='aktivni'){ if(!jeOtvoren(k)) return false; }
    else if(FILTER.status!=='svi' && k.status!==FILTER.status) return false;
    if(FILTER.majstor==='nedodijeljeno'){ if(k.dodijeljen || !jeOtvoren(k)) return false; }
    else if(FILTER.majstor!=='svi' && k.dodijeljen!==FILTER.majstor) return false;
    if(FILTER.od && k.date < FILTER.od) return false;
    if(FILTER.do && k.date > FILTER.do) return false;
    if(FILTER.q && (k.opis+' '+(k.zam||'')+' '+(k.kategorija||'')).toLowerCase().indexOf(FILTER.q.toLowerCase()) === -1) return false;
    return true;
  }).sort(function(a,b){
    /* otvoreni prije riješenih; među otvorenima HITNO → Visok → Normalno; pa najnoviji */
    var oa = jeOtvoren(a)?0:1, ob = jeOtvoren(b)?0:1;
    if(oa!==ob) return oa-ob;
    if(oa===0){
      var red = {hitno:0, visok:1, normalno:2};
      var pa = red[a.prioritet]!==undefined?red[a.prioritet]:2;
      var pb = red[b.prioritet]!==undefined?red[b.prioritet]:2;
      if(pa!==pb) return pa-pb;
    }
    return b.date===a.date ? 0 : (b.date>a.date?1:-1);
  });

  var strojOpts = '<option value="svi">Svi strojevi</option>'+DATA.machines.map(function(m){
    return '<option value="'+m.id+'"'+(FILTER.stroj===m.id?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join('');
  var statusOpts =
    '<option value="svi"'+(FILTER.status==='svi'?' selected':'')+'>Svi statusi</option>'+
    '<option value="aktivni"'+(FILTER.status==='aktivni'?' selected':'')+'>Otvoreni + u radu</option>'+
    '<option value="otvoren"'+(FILTER.status==='otvoren'?' selected':'')+'>Otvoreni</option>'+
    '<option value="u_radu"'+(FILTER.status==='u_radu'?' selected':'')+'>U radu</option>'+
    '<option value="rijesen"'+(FILTER.status==='rijesen'?' selected':'')+'>Riješeni</option>'+
    '<option value="otkazan"'+(FILTER.status==='otkazan'?' selected':'')+'>Otkazani (storno)</option>';
  var majstorOpts = '<option value="svi">Svi tehničari</option>'+
    MAJSTORI.map(function(mj){
      return '<option'+(FILTER.majstor===mj?' selected':'')+'>'+mj+'</option>';
    }).join('')+
    '<option value="nedodijeljeno"'+(FILTER.majstor==='nedodijeljeno'?' selected':'')+'>Nedodijeljeni</option>';

  /* miran ekran: stalno su vidljivi samo pretraga i gumb "Filtri" —
     pet padajućih polja i dva datuma otvore se tek na dodir */
  var nAkt = brojAktivnihFiltera();
  $('#screen-kvarovi').innerHTML =
    /* AUDIT-FIX (UX): oba gumba su nekad bila jednake težine iako "Detaljna prijava"
       otvara obrazac s ~3x više polja za identičnu svrhu (prijaviti kvar) — slučajan
       dodir u žurbi bacao je korisnika u puno teži put. Brza prijava je sada vidno glavni
       put, Detaljna je manja, sporedna opcija za rijetke slučajeve. */
    /* §15: proizvodnja smije SAMO brzu prijavu (role-prijava), ne i detaljnu (role-write).
       §16 P1: "Detaljno" (10 polja: dodjela/prioritet/kategorija/status) je voditeljev alat za
       povijesni/potpuni unos — tehničaru i proizvodnji ostaje samo ⚡ Brza prijava, puna širina
       (.kvar-akcije-grid se sažima na 1 stupac kad Detaljno nije vidljivo, vidi CSS). */
    '<div class="role-write role-prijava kvar-akcije-grid" style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:12px;align-items:stretch">'+
      '<button class="btn primary role-write role-prijava" onclick="app.brzaPrijava()">⚡ Brza prijava</button>'+
      '<button class="btn sec sm role-voditelj" onclick="app.noviKvar()">Detaljno</button>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px">'+
      '<input type="search" value="'+esc(FILTER.q)+'" placeholder="Pretraži opis…" oninput="app.setFilterTiho(\'q\',this.value)" style="flex:1">'+
      '<button class="btn sec" style="flex-shrink:0" onclick="app.prekidacFiltre()">Filtri'+(nAkt?' ('+nAkt+')':'')+'</button>'+
    '</div>'+
    (KV_FILTRI_OTVORENI
      ? '<div class="filters">'+
        '<select onchange="app.setFilter(\'stroj\',this.value)">'+strojOpts+'</select>'+
        '<select onchange="app.setFilter(\'status\',this.value)">'+statusOpts+'</select>'+
        '<select onchange="app.setFilter(\'majstor\',this.value)">'+majstorOpts+'</select>'+
        /* title tooltip ne postoji na mobitelu — bez oznake korisnik ne zna koje je polje od/do */
        '<div><label class="filtar-oznaka">Od datuma</label>'+
          '<input type="date" value="'+FILTER.od+'" onchange="app.setFilter(\'od\',this.value)"></div>'+
        '<div><label class="filtar-oznaka">Do datuma</label>'+
          '<input type="date" value="'+FILTER.do+'" onchange="app.setFilter(\'do\',this.value)"></div>'+
        '</div>'
      : '')+
    ((FILTER.q||nAkt)
      ? '<button class="btn-mini" style="margin-bottom:10px" onclick="app.resetFiltere()">✕ Poništi filtere ('+list.length+' rezultata)</button>' : '')+
    (function(){
      /* §16 P2 (vlasnikova primjedba): "samo ono što je aktualno" — dok se ništa ne
         traži/filtrira, aktivni kvarovi su gore, povijest je sklopljena ispod. Čim netko
         pretraži ili postavi filtar, prikaz se vraća na jednu ravnu listu (najbolje
         rješenje = ono što je zatraženo, ne umjetna podjela). */
      var zadano = !nAkt && !FILTER.q;
      if(!zadano){
        return '<div class="card">'+
          (list.length ? list.map(function(k){ return kvarItem(k,true); }).join('')
                       : '<div class="empty">Nema kvarova za odabrani filter.</div>')+
          '</div>';
      }
      var aktivniL = list.filter(function(k){ return jeOtvoren(k); });
      var mj30 = isoShift(-30);
      var rijeseniL = list.filter(function(k){ return !jeOtvoren(k) && k.date>=mj30; });
      return (aktivniL.length ? '<div class="card">'+aktivniL.map(function(k){ return kvarItem(k,true); }).join('')+'</div>'
                : '<div class="card"><div class="empty">Nema prijavljenih kvarova. Prvi prijavi gumbom Brza prijava.</div></div>')+
        (rijeseniL.length
          ? '<div class="rasp-kal-traka" style="margin-top:10px" onclick="app.kvRijeseniToggle()">'+
              '<span>Riješeni — zadnjih 30 dana ('+rijeseniL.length+')</span>'+
              '<span class="chev" style="transform:rotate('+(KV_RIJESENI_OTVOREN?90:0)+'deg)">›</span></div>'+
            (KV_RIJESENI_OTVOREN ? '<div class="card" style="margin-top:6px">'+rijeseniL.map(function(k){ return kvarItem(k,true); }).join('')+'</div>' : '')
          : '');
    })();
}

/* =====================  render: Dijelovi  ===================== */
var PART_Q = '';
var PART_OPEN = '';   /* id dijela čiji su detalji rastvoreni — jedan po jedan */
function partRow(p){
  var low = p.stanje < p.min;
  /* "naručeno" se izvodi iz stvarne narudžbe u Nabavi — ne drži se drugi put na dijelu */
  var nar = narudzbaZaDio(p.id);
  /* Naručeno != stiglo (korisnikov feedback) — "Naručeno" je zvučalo kao gotova stvar
     dok je dio i dalje na 0 na skladištu. "U dolasku" je pošteniji opis stanja, a
     zakašnjela isporuka ostaje crvena umjesto smirene žute — i dalje nešto gori. */
  var chip = '';
  if(nar){
    var kasniIsporuka = nar.ocekivano && nar.ocekivano < todayISO();
    chip = kasniIsporuka
      ? ' <span class="chip kvar">Kasni isporuka</span>'
      : ' <span class="chip upoz">U dolasku</span>';
  }
  else if(low) chip = ' <span class="chip kvar">'+(p.stanje===0?'Naruči odmah':'Naruči')+'</span>';
  var otvoren = PART_OPEN === p.id;
  /* Sklopljen redak: naziv, oznaka i stanje — to je sve što se čita pri prolasku.
     Dobavljač, cijena, +/- i gumbi otvore se dodirom na redak. */
  var preostaloNar = nar ? nar.kolicina - (nar.primljena_kolicina||0) : 0;
  var glava = '<div class="row click" onclick="app.otvoriDio(\''+p.id+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(p.naziv)+chip+'</div>'+
    (otvoren ? '<div class="row-sub">'+esc(p.stroj)+' &middot; '+esc(p.dob)+
       (p.lokacija ? ' &middot; '+esc(p.lokacija) : '')+
       (vidiFinancije() ? ' &middot; '+EUR(p.cijena) : '')+
       (nar ? ' &middot; u dolasku &times;'+preostaloNar+(nar.ocekivano ? ' do '+fmtDate(nar.ocekivano) : '') : '')+'</div>' : '')+
    '</div>'+
    '<div class="row-right"><span class="qval'+(low?' low':'')+'">'+p.stanje+'<span>min '+p.min+'</span></span>'+
    '<span class="chev" style="transform:rotate('+(otvoren?'90':'0')+'deg)">›</span></div></div>';
  if(!otvoren) return glava;
  /* S8.2/S8.3: potrošnja kroz vrijeme i zadnje narudžbe — samo u rastvorenom retku,
     da sklopljeni popis ostane miran (brojevi koje netko traži, ne brojevi koje gleda uvijek) */
  var potr = potrosnjaDijela(p, 180);
  var povijestN = (DATA.nabava||[]).filter(function(n){ return n.dio_id===p.id; })
    .sort(function(a,b){ return String(b.narucen).localeCompare(String(a.narucen)); }).slice(0,3);
  var infoHtml = (potr.komada
      ? '<div class="row-sub" style="margin-top:8px">Potrošeno zadnjih 6 mj.: <b style="color:var(--text)">'+
        potr.komada+' kom</b> (u '+potr.zahvata+(potr.zahvata===1?' kvaru':' kvarova')+')</div>'
      : '')+
    (povijestN.length
      ? '<div class="row-sub" style="margin-top:6px"><b style="color:var(--text)">Zadnje narudžbe:</b>'+
        povijestN.map(function(n){
          return '<br>'+fmtDate(n.narucen)+' &middot; ×'+n.kolicina+
            (vidiFinancije() && n.cijena ? ' &middot; '+EUR(n.cijena)+'/kom' : '')+
            (n.primljeno ? ' &middot; stiglo' : ' &middot; u dolasku');
        }).join('')+'</div>'
      : '');
  return glava +
    (infoHtml ? '<div class="dio-info" onclick="event.stopPropagation()">'+infoHtml+'</div>' : '')+
    '<div class="dio-detalj" onclick="event.stopPropagation()">'+
      (nar
        ? '<button class="btn-mini role-voditelj" onclick="app.go(\'nabava\')">Otvori u Nabavi</button> '
        : '<button class="btn-mini role-voditelj" onclick="app.naruciDio(\''+p.id+'\')">Naruči</button> ')+
      '<button class="btn-mini role-voditelj" onclick="app.urediDio(\''+p.id+'\')">Uredi</button>'+
      /* AUDIT-FIX (UX): +/- mijenja stanje samo za 1 po dodiru — kod veće isporuke ili
         ispravka nakon inventure to je deseci dodira. Izravan upis broja bio je dostupan
         SAMO kroz "Uredi" (voditelj, uz cijenu/dobavljača) — ovo je lagana radnja
         dostupna svima koji smiju pisati (role-write), bez diranja ostalih polja dijela. */
      '<button class="btn-mini role-write" onclick="app.postaviKolicinu(\''+p.id+'\')">Upiši broj</button>'+
      '<span class="dio-qty role-write">'+
        '<button class="qbtn" onclick="app.qty(\''+p.id+'\',-1)">−</button>'+
        '<span class="qval" style="min-width:0">'+p.stanje+'</span>'+
        '<button class="qbtn" onclick="app.qty(\''+p.id+'\',1)">+</button>'+
      '</span>'+
    '</div>';
}
/* S8.2: procjena potrošnje iz slobodnog teksta "Zamijenjeno" — dio nema strukturiranu
   vezu na kvar (namjerno, F3 je odbila tablicu veza za rijedak scenarij više dijelova
   po kvaru), pa se broji podudaranje naziva; dovoljno dobro za "otprilike koliko trošimo". */
function potrosnjaDijela(p, dana){
  var od = dana ? isoShift(-dana) : '0000-00-00';
  var re = new RegExp(p.naziv.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\s*[×x](\\d+))?', 'i');
  var zahvata = 0, komada = 0;
  samoKvarovi().forEach(function(k){
    if(!k.zam || k.date < od) return;
    var m = re.exec(k.zam);
    if(m){ zahvata++; komada += m[1] ? parseInt(m[1],10) : 1; }
  });
  return { zahvata:zahvata, komada:komada };
}
function partsListHtml(){
  var q = PART_Q.trim().toLowerCase();
  var list = DATA.dijelovi.slice().sort(function(a,b){
    var la = a.stanje < a.min ? 0 : 1, lb = b.stanje < b.min ? 0 : 1;
    if(la!==lb) return la-lb;
    /* među kritičnima: najbliže nuli prvo (omjer stanje/minimum) */
    var ra = a.min ? a.stanje/a.min : 99, rb = b.min ? b.stanje/b.min : 99;
    if(ra!==rb) return ra-rb;
    return a.naziv.localeCompare(b.naziv,'hr');
  });
  if(q){
    list = list.filter(function(p){
      return (p.naziv+' '+p.stroj+' '+p.dob+' '+(p.kategorija||'')).toLowerCase().indexOf(q) > -1;
    });
    return '<div class="card">'+(list.length ? list.map(partRow).join('')
      : '<div class="empty">Nema dijelova za traženi pojam.</div>')+'</div>';
  }
  /* bez pretrage: kritično na vrh, ostalo grupirano po kategorijama */
  var krit = list.filter(function(p){ return p.stanje < p.min; });
  var ost  = list.filter(function(p){ return p.stanje >= p.min; });
  var html = '';
  if(krit.length){
    html += '<h2 style="color:var(--red)">Ispod minimuma — naručiti</h2>'+
            '<div class="card" style="border-color:var(--red-border)">'+krit.map(partRow).join('')+'</div>';
  }
  var kats = {};
  ost.forEach(function(p){ var k = p.kategorija || 'Ostalo'; (kats[k] = kats[k] || []).push(p); });
  Object.keys(kats).sort(function(a,b){ return a.localeCompare(b,'hr'); }).forEach(function(k){
    html += '<h2>'+esc(k)+'</h2><div class="card">'+kats[k].map(partRow).join('')+'</div>';
  });
  return html || '<div class="card"><div class="empty">Nema dijelova.</div></div>';
}
function otvoreneNarudzbe(){
  return (DATA.nabava||[]).filter(function(n){ return !n.primljeno; })
    .sort(function(a,b){ return String(a.ocekivano||'9999').localeCompare(String(b.ocekivano||'9999')); });
}
function dioPoId(id){ return DATA.dijelovi.filter(function(x){ return x.id===id; })[0] || null; }
// SIM-FIX B2: "Naruči dio"/"Ugrađen dio" su dosad prikazivali SAMO dijelove vezane uz stroj —
// dio bez veze u šifrarniku izgledao je kao da ga skladište nema. Sad: prvo vezani, pa razdjelnik,
// pa svi ostali (abecedno) — ništa se ne skriva.
function dioOptsZaStroj(mId){
  var vezani = DATA.dijelovi.filter(function(p){ return (p.strojevi||[]).indexOf(mId) > -1; });
  var vezaniIds = {}; vezani.forEach(function(p){ vezaniIds[p.id] = true; });
  var ostali = DATA.dijelovi.filter(function(p){ return !vezaniIds[p.id]; })
    .sort(function(a,b){ return a.naziv.localeCompare(b.naziv,'hr'); });
  var opt = function(p){ return '<option value="'+p.id+'">'+esc(p.naziv)+' (stanje '+p.stanje+')</option>'; };
  return vezani.map(opt).join('') +
    (vezani.length && ostali.length ? '<option disabled>──────</option>' : '') +
    ostali.map(opt).join('');
}
/* jedan izvor istine za "je li dio naručen": otvorena narudžba u Nabavi */
function narudzbaZaDio(id){
  return otvoreneNarudzbe().filter(function(n){ return n.dio_id === id; })[0] || null;
}
/* Jedna definicija "treba naručiti" za cijelu aplikaciju. Prije su postojale dvije —
   Dijelovi su brojali sve ispod minimuma, Nabava samo one bez otvorene narudžbe —
   pa je isti pojam u četiri dodira davao tri različita broja. */
function zaNaruciti(){
  return DATA.dijelovi.filter(function(p){ return p.stanje < p.min && !narudzbaZaDio(p.id); })
    .sort(function(a,b){ return (a.stanje/(a.min||1)) - (b.stanje/(b.min||1)); });
}
function nabavaRedak(n){
  var d = dioPoId(n.dio_id) || { naziv:'—' };
  var kasni = n.ocekivano && n.ocekivano < todayISO();
  return '<div class="row"><div class="grow">'+
    '<div class="row-title" style="font-size:13.5px">'+esc(d.naziv)+' &times;'+n.kolicina+
      (kasni ? ' <span class="chip kvar">Kasni isporuka</span>' : '')+'</div>'+
    '<div class="row-sub">'+esc(n.dobavljac||'—')+' &middot; naručeno '+fmtDate(n.narucen)+
      (n.ocekivano ? ' &middot; očekivano '+fmtDate(n.ocekivano) : '')+
      (vidiFinancije() && n.cijena ? ' &middot; '+EUR(n.cijena*n.kolicina) : '')+'</div>'+
    (n.napomena ? '<div class="row-sub">'+esc(n.napomena)+'</div>' : '')+
    '<div style="margin-top:6px"><button class="btn-mini role-write" onclick="app.primiNabavu(\''+n.id+'\')">Stiglo</button></div>'+
  '</div></div>';
}
function renderNabava(){
  var otv = otvoreneNarudzbe();
  var zaNar = zaNaruciti();
  var vrijednostNarudzbi = otv.reduce(function(s,n){ return s + (n.cijena||0)*n.kolicina; }, 0);

  $('#screen-nabava').innerHTML =
    '<button class="back" onclick="app.go(\'dijelovi\')">‹ Skladište</button>'+
    /* AUDIT-FIX (UX): korisnik koji stigne preko brojke "Za naručiti" s Pregleda nije
       nigdje vidio ime ekrana na kojem se nalazi — jedini orijentir bio je gumb "natrag". */
    '<div style="font-size:18px;font-weight:700;margin:4px 0 10px">Nabava</div>'+
    '<h2>Za naručiti ('+zaNar.length+')</h2>'+
    '<div class="card">'+ (zaNar.length ? zaNar.map(function(p){
      return '<div class="row"><div class="grow">'+
        '<div class="row-title" style="font-size:13.5px">'+esc(p.naziv)+'</div>'+
        '<div class="row-sub">stanje <b style="color:var(--red)">'+p.stanje+'</b> / min '+p.min+
          ' &middot; '+esc(p.dob||'bez dobavljača')+
          (vidiFinancije() ? ' &middot; '+EUR(p.cijena) : '')+'</div>'+
        '<div style="margin-top:6px"><button class="btn-mini role-voditelj" onclick="app.naruciDio(\''+p.id+'\')">Naruči</button></div>'+
      '</div></div>';
    }).join('') : '<div class="empty">Ništa ne treba naručiti — sve je iznad minimuma.</div>')+'</div>'+
    '<h2>U dolasku ('+otv.length+')</h2>'+
    '<div class="card">'+ (otv.length ? otv.map(nabavaRedak).join('')
      : '<div class="empty">Nema otvorenih narudžbi.</div>')+'</div>'+
    (vidiFinancije() && vrijednostNarudzbi
      ? '<div class="row-sub" style="text-align:center;margin-top:8px">Vrijednost otvorenih narudžbi: <b style="color:var(--text)">'+EUR(vrijednostNarudzbi)+'</b></div>' : '')+
    (function(){
      var primljene = (DATA.nabava||[]).filter(function(n){ return n.primljeno; })
        .sort(function(a,b){ return String(b.primljeno).localeCompare(String(a.primljeno)); }).slice(0,10);
      if(!primljene.length) return '';
      return '<h2>Zadnje primljeno</h2><div class="card">'+primljene.map(function(n){
        var d = dioPoId(n.dio_id) || {naziv:'—'};
        return '<div class="row"><div class="grow">'+
          '<div class="row-title" style="font-size:13.5px">'+esc(d.naziv)+' &times;'+(n.primljena_kolicina||n.kolicina)+'</div>'+
          '<div class="row-sub">'+esc(n.dobavljac||'—')+' &middot; primljeno '+fmtDate(n.primljeno)+
            (vidiFinancije() && n.cijena ? ' &middot; '+EUR(n.cijena*(n.primljena_kolicina||n.kolicina)) : '')+'</div>'+
        '</div></div>';
      }).join('')+'</div>';
    })();
}
function renderDijelovi(){
  var vrijednost = 0;

  var ispodMin = zaNaruciti().length;   /* isti broj kao na Pregledu i Nabavi */
  $('#screen-dijelovi').innerHTML =

        (function(){

var KONT_Q = '';

function kontaktiListHtml(){

/* Poruke i Kontakti dijele jednu karticu u dnu — ovaj segment je jedini način da se

/* =====================  render: Analitika (voditelj/direktor)  ===================== */
var ANA_DANA = 90;
var ANA_MJESEC = null;   /* 'GGGG-MM' — odabrani kalendarski mjesec nadjačava ANA_DANA */
function anaKvarovi(){
  if(ANA_MJESEC) return samoKvarovi().filter(function(k){ return k.date.slice(0,7) === ANA_MJESEC; });
  var od = ANA_DANA ? isoShift(-ANA_DANA) : '0000-00-00';
  return samoKvarovi().filter(function(k){ return k.date >= od; });
}
/* isto toliko dugo razdoblje prije ovoga (ili prethodni kalendarski mjesec) — za usporedbu */
function anaKvaroviPrethodno(){
  if(ANA_MJESEC){
    var p = ANA_MJESEC.split('-');
    var pm = new Date(parseInt(p[0],10), parseInt(p[1],10)-2, 1);
    var pmKey = pm.getFullYear()+'-'+pad2(pm.getMonth()+1);
    return samoKvarovi().filter(function(k){ return k.date.slice(0,7) === pmKey; });
  }
  if(!ANA_DANA) return null;
  var od = isoShift(-ANA_DANA*2), doo = isoShift(-ANA_DANA);
  return samoKvarovi().filter(function(k){ return k.date >= od && k.date < doo; });
}
/* AUDIT-FIX (§14.2 t.4): preventiva obavljena u istom razdoblju kao i kvarovi gore —
   isti filtar (mjesec ili "zadnjih N dana") nad datumom kad je STVARNO obavljena (zadnje). */
function anaPreventivaObavljena(){
  if(ANA_MJESEC) return DATA.preventiva.filter(function(p){ return p.zadnje && p.zadnje.slice(0,7) === ANA_MJESEC; });
  var od = ANA_DANA ? isoShift(-ANA_DANA) : '0000-00-00';
  return DATA.preventiva.filter(function(p){ return p.zadnje && p.zadnje >= od; });
}
function zbroji(lista){
  var s = { n:lista.length, sati:0, cost:0, mttr:0 };
  var r = 0, rs = 0;
  lista.forEach(function(k){
    s.sati += k.sati; s.cost += kvarCost(k);
    if(k.status==='rijesen'){ r++; rs += k.sati; }
  });
  s.mttr = r ? rs/r : 0;
  return s;
}
function deltaChip(sada, prije, manjeJeBolje){
  if(prije === 0 || prije == null) return '';
  var pct = Math.round((sada - prije) / prije * 100);
  if(pct === 0) return '<span class="delta jednako">bez promjene</span>';
  var dobro = manjeJeBolje ? pct < 0 : pct > 0;
  return '<span class="delta '+(dobro?'dobro':'lose')+'">'+(pct>0?'▲ +':'▼ ')+Math.abs(pct)+'%</span>';
}
function tbl(headeri, redovi, ukupno){
  return '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
    headeri.map(function(h,i){ return '<th'+(i?' class="num"':'')+'>'+h+'</th>'; }).join('')+
    '</tr></thead><tbody>'+
    redovi.map(function(r){ return '<tr>'+r.map(function(c,i){ return '<td'+(i?' class="num"':'')+'>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+
    (ukupno ? '<tr class="tbl-ukupno">'+ukupno.map(function(c,i){ return '<td'+(i?' class="num"':'')+'><b>'+c+'</b></td>'; }).join('')+'</tr>' : '')+
    '</tbody></table></div>';
}
function anaPeriodTekst(){
  if(ANA_MJESEC){ var p = ANA_MJESEC.split('-'); return MJESECI[parseInt(p[1],10)-1]+' '+p[0]+'.'; }
  return ANA_DANA ? ('zadnjih '+ANA_DANA+' dana') : 'cijela evidencija';
}
function anaPodaci(){
  var KV = anaKvarovi();
  var poStroju = {};
  KV.forEach(function(k){
    var key = k.m || '—';
    var s = poStroju[key] = poStroju[key] || { n:0, sati:0, cost:0, rijeseni:0, satiR:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
    if(k.status==='rijesen'){ s.rijeseni++; s.satiR += k.sati; }
  });
  var poSmjeni = {};
  KV.forEach(function(k){
    var key = k.smjena || '—';
    var s = poSmjeni[key] = poSmjeni[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var poKat = {};
  KV.forEach(function(k){
    var key = k.kategorija || 'Ostalo';
    var s = poKat[key] = poKat[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var uzroci = {};
  KV.forEach(function(k){
    var sig = kvarSig(k); if(!sig) return;
    var u = uzroci[sig] = uzroci[sig] || { n:0, sati:0, cost:0, primjer:k };
    u.n++; u.sati += k.sati; u.cost += kvarCost(k);
  });
  /* AUDIT-FIX (§14.2 t.4): sati po osobi — kvarovi.sati po tko (samo riješeni imaju tko) +
     preventiva.stvarno_h po tkoZadnji; voditelj/direktor jedini koji smiju vidjeti (financije). */
  var poOsobi = {};
  KV.forEach(function(k){
    if(!k.tko) return;
    var s = poOsobi[k.tko] = poOsobi[k.tko] || { satiKvar:0, satiPrev:0 };
    s.satiKvar += k.sati;
  });
  anaPreventivaObavljena().forEach(function(p){
    if(!p.tkoZadnji || p.stvarno_h == null) return;
    var s = poOsobi[p.tkoZadnji] = poOsobi[p.tkoZadnji] || { satiKvar:0, satiPrev:0 };
    s.satiPrev += p.stvarno_h;
  });
  return { KV:KV, poStroju:poStroju, poSmjeni:poSmjeni, poKat:poKat, uzroci:uzroci, poOsobi:poOsobi };
}
function renderAnalitika(){
  var d = anaPodaci();
  var uk = { n:d.KV.length, sati:0, cost:0 };
  d.KV.forEach(function(k){ uk.sati += k.sati; uk.cost += kvarCost(k); });
  var rijeseni = d.KV.filter(function(k){ return k.status==='rijesen'; });
  var mttr = rijeseni.length ? rijeseni.reduce(function(s,k){ return s+k.sati; },0)/rijeseni.length : 0;
  var prethodniKV = anaKvaroviPrethodno();
  var prethodno = prethodniKV && prethodniKV.length ? zbroji(prethodniKV) : null;
  var periodi = [[30,'30 dana'],[90,'90 dana'],[365,'12 mjeseci'],[0,'Sve']];
  var perOpts = periodi.map(function(p){
    return '<option value="'+p[0]+'"'+(ANA_DANA===p[0]?' selected':'')+'>'+p[1]+'</option>'; }).join('');

  var strojRedovi = Object.keys(d.poStroju).map(function(id){
    var s = d.poStroju[id]; var m = machineById(id) || {name:'—'};
    return { name:m.name, id:id, s:s };
  }).sort(function(a,b){ return b.s.cost - a.s.cost; }).map(function(x){
    var mt = x.s.rijeseni ? (x.s.satiR / x.s.rijeseni) : 0;
    return [esc(x.name), x.s.n, H(x.s.sati), EUR(x.s.cost), mt ? H(mt) : '—'];
  });
  var smjenaRedovi = Object.keys(d.poSmjeni).sort().map(function(sm){
    var s = d.poSmjeni[sm];
    return [esc(sm), s.n, H(s.sati), EUR(s.cost)];
  });
  var katRedovi = Object.keys(d.poKat).map(function(kk){
    return { kk:kk, s:d.poKat[kk] };
  }).sort(function(a,b){ return b.s.cost - a.s.cost; }).map(function(x){
    return [esc(x.kk), x.s.n, H(x.s.sati), EUR(x.s.cost)];
  });
  var uzrokRedovi = Object.keys(d.uzroci).map(function(sig){
    return d.uzroci[sig];
  }).filter(function(u){ return u.n >= 2; }).sort(function(a,b){ return b.cost - a.cost; })
    .slice(0,10).map(function(u){
      var m = machineById(u.primjer.m) || {name:'—'};
      return [esc(m.name)+': '+esc(u.primjer.opis.slice(0,44)), u.n+'×', H(u.sati), EUR(u.cost)];
    });
  var osobaRedovi = Object.keys(d.poOsobi).sort(function(a,b){
    return (d.poOsobi[b].satiKvar+d.poOsobi[b].satiPrev) - (d.poOsobi[a].satiKvar+d.poOsobi[a].satiPrev);
  }).map(function(ime){
    var s = d.poOsobi[ime];
    return [esc(ime), H(s.satiKvar), H(s.satiPrev), H(s.satiKvar+s.satiPrev)];
  });

  $('#screen-analitika').innerHTML =
    '<button class="back" onclick="app.go(\'pregled\')">‹ Pregled</button>'+
    '<div class="filters">'+
      '<select onchange="app.anaPeriod(this.value)">'+perOpts+'</select>'+
      '<input type="month" value="'+(ANA_MJESEC||'')+'" max="'+todayISO().slice(0,7)+'"'+
        ' onchange="app.anaMjesec(this.value)" title="Ili odaberi točan mjesec">'+
    '</div>'+
    (ANA_MJESEC ? '<button class="btn-mini" style="margin:-4px 0 8px" onclick="app.anaMjesec(\'\')">✕ '+
      esc(MJESECI[parseInt(ANA_MJESEC.split('-')[1],10)-1])+' '+ANA_MJESEC.split('-')[0]+' — natrag na razdoblje</button>' : '')+
    /* 2×2, ne 4 u redu — na 360px ekranu je 4-u-redu davalo ~80px po kartici i lomilo
       brojku usred znamenke; static jer dodir na ove kartice ne radi ništa */
    '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr)">'+
      /* sva četiri broja na isti font — različite veličine su sugerirale različitu važnost */
      '<div class="stat static"><span class="stat-num kpi">'+uk.n+'</span><span class="stat-label">kvarova</span>'+deltaChip(uk.n, prethodno?prethodno.n:null, true)+'</div>'+
      '<div class="stat static"><span class="stat-num kpi">'+H(uk.sati)+'</span><span class="stat-label">zastoja</span>'+deltaChip(uk.sati, prethodno?prethodno.sati:null, true)+'</div>'+
      /* to nije ukupan trošak održavanja — dijelovi i vanjski servis nisu u njemu */
      '<div class="stat static"><span class="stat-num kpi">'+EUR(uk.cost)+'</span><span class="stat-label">trošak zastoja</span>'+deltaChip(uk.cost, prethodno?prethodno.cost:null, true)+'</div>'+
      /* MTTR ne dijeli s istim brojem kao ostala tri broja — dijeli samo s riješenima.
         Broj uzoraka mora pisati, inače mjesec s jednim brzim popravkom izgleda kao rekord. */
      '<div class="stat static"><span class="stat-num kpi">'+(mttr?H(mttr):'—')+'</span>'+
        '<span class="stat-label">prosj. popravak'+(rijeseni.length ? ' ('+rijeseni.length+')' : '')+'</span>'+
        deltaChip(mttr, prethodno?prethodno.mttr:null, true)+'</div>'+
    '</div>'+
    (prethodno
      ? '<div class="row-sub" style="text-align:center;margin-top:7px">usporedba s '+
        (ANA_MJESEC ? 'prethodnim mjesecom' : 'prethodnih '+ANA_DANA+' dana')+
        ' ('+prethodno.n+' kvarova, '+H(prethodno.sati)+', '+EUR(prethodno.cost)+')</div>'
      : '')+
    /* SIM-FIX (Analitika — nijedan graf): direktorovo glavno pitanje je "bolje ili gore",
       a KPI brojke i pet tablica na to ne odgovaraju na prvi pogled. Isti bar-row/bar-track/
       bar-fill uzorak kao trendHtml na Pregledu (~1963), ali cijela evidencija (ne trenutni
       ANA_DANA/ANA_MJESEC filtar) i do 12 mjeseci — kratki filtar bi inače graf sveo na
       1 stupac. Zadaci/stornirani su već isključeni preko samoKvarovi() (isto kao uk.cost). */
    '<h2>Trošak zastoja po mjesecima</h2><div class="card">'+
      (function(){
        var mjTrosak = {};
        samoKvarovi().forEach(function(k){
          var key = k.date.slice(0,7);
          mjTrosak[key] = (mjTrosak[key]||0) + kvarCost(k);
        });
        var mjKljucevi = Object.keys(mjTrosak).sort().slice(-12);
        if(!mjKljucevi.length) return '<div class="empty">Nema podataka za graf.</div>';
        var tekuciMjesec = todayISO().slice(0,7);
        var maxMj = Math.max.apply(null, mjKljucevi.map(function(kk){ return mjTrosak[kk]; }).concat([1]));
        var visestrukaGodina = mjKljucevi[0].slice(0,4) !== mjKljucevi[mjKljucevi.length-1].slice(0,4);
        return mjKljucevi.map(function(kk){
          var idx = parseInt(kk.slice(5,7),10) - 1;
          var uTijeku = kk === tekuciMjesec;
          var label = esc(MJESECI[idx])+(visestrukaGodina ? " '"+kk.slice(2,4) : '');
          return '<div class="bar-row" style="cursor:default">'+
            '<div class="bar-name">'+label+(uTijeku ? ' <span class="nepotpun">u tijeku</span>' : '')+'</div>'+
            '<div class="bar-track"><div class="bar-fill'+(uTijeku?' u-tijeku':'')+
              '" style="width:'+Math.round(mjTrosak[kk]/maxMj*100)+'%"></div></div>'+
            '<div class="bar-val">'+EUR(mjTrosak[kk])+'</div></div>';
        }).join('');
      })()+
    '</div>'+
    '<h2>Po stroju</h2><div class="card" style="padding:4px 0">'+
      tbl(['Stroj','Kvarova','Sati','Trošak','MTTR'], strojRedovi,
        strojRedovi.length ? ['Ukupno', uk.n, H(uk.sati), EUR(uk.cost), mttr?H(mttr):'—'] : null)+'</div>'+
    '<h2>Po smjeni</h2><div class="card" style="padding:4px 0">'+
      tbl(['Smjena','Kvarova','Sati','Trošak'], smjenaRedovi,
        smjenaRedovi.length ? ['Ukupno', uk.n, H(uk.sati), EUR(uk.cost)] : null)+'</div>'+
    '<h2>Po kategoriji</h2><div class="card" style="padding:4px 0">'+
      tbl(['Kategorija','Kvarova','Sati','Trošak'], katRedovi,
        katRedovi.length ? ['Ukupno', uk.n, H(uk.sati), EUR(uk.cost)] : null)+'</div>'+
    '<h2>Ponovljeni uzroci (2+ puta)</h2><div class="card" style="padding:4px 0">'+
      (uzrokRedovi.length ? tbl(['Uzrok','Ponavljanja','Sati','Trošak'], uzrokRedovi)
        : '<div class="empty">Nema ponovljenih uzroka u periodu.</div>')+'</div>'+
    /* AUDIT-FIX (§14.2 t.4): sati po osobi — kvarovi + preventiva, samo voditelj/direktor */
    (osobaRedovi.length ? '<h2>Sati po osobi</h2><div class="card" style="padding:4px 0">'+
      tbl(['Osoba','Kvarovi','Redovni pregledi','Ukupno'], osobaRedovi)+'</div>' : '')+
    '<button class="btn primary block" style="margin-top:14px" onclick="app.izvozAnalitika()">Izvoz CSV — odabrano razdoblje</button>'+
    '<button class="btn sec block" style="margin-top:8px" onclick="app.analitikaIspis()">Ispis / PDF analitike</button>';
}

/* =====================  render: Raspored — organizacija tjedna  =====================
   Ovdje se planira: preventiva po danima, dogovoreni vanjski servisi i ZADACI
   (kupiti, dogovoriti, pripremiti). Kvarovi su prijave problema i žive na Kvarovi —
   miješanje zadataka među kvarove nije imalo logike, pa su preseljeni ovamo.
   Mjesečna mreža je izbačena (kritika §11.4 + odluka vlasnika): duplicirala je
   popis ispod i tražila učenje boja — organizaciji služi popis po danima. */
var DANI_TJEDNA = ['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
function danUTjednu(iso){
  var d = new Date(iso+'T00:00:00');
  return isNaN(d.getTime()) ? '' : DANI_TJEDNA[d.getDay()];
}
function otvoreniZadaci(){
  return DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='zadatak' && jeOtvoren(k); });
}
/* Rok trajne sanacije privremenog popravka (dorade.sql) — planska obveza s datumom,
   danas vidljiva samo u IFS izvještaju. Ovo NIJE kvar na kalendaru (kvar = prijava,
   model modula) — prikazuje se OBVEZA sanacije, ne prijava problema. */
function sanacijeOtvorene(){
  return DATA.kvarovi.filter(function(k){ return k.privremeni && k.status!=='otkazan' && k.rok_sanacije; });
}
/* §16 P1/P2: jedino što voditelja proizvodnje zanima na Rasporedu — kad je SLJEDEĆI planirani
   zastoj linije (preventiva označena "Zaustavlja liniju dok traje"), ne cijeli plan tima. */
function sljedeciZastojLinije(){
  return DATA.preventiva.filter(function(p){ return p.zaustavlja_liniju && p.next && p.next >= todayISO(); })
    .sort(function(a,b){ return a.next < b.next ? -1 : (a.next > b.next ? 1 : 0); })[0] || null;
}
function sanacijaRedak(k){
  var m = machineById(k.m) || {name:'—'};
  var kasni = k.rok_sanacije < todayISO();
  return '<div class="row click" onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:13.5px">Sanacija: '+esc(k.opis)+'</div>'+
    '<div class="row-sub">'+esc(m.name)+' &middot; rok '+fmtDate(k.rok_sanacije)+
      (kasni ? ' &middot; <b style="color:var(--red)">kasni</b>' : '')+'</div></div>'+
  '</div>';
}
/* Dodir na redak otvara popis radnji (K4) — ne bježi izravno na stroj/detalj kao prije.
   ✓ ostaje izravno u retku za najčešću radnju (obavljeno), sve ostalo je iza dodira na redak. */
function prevRedak(p){
  var m = machineById(p.m) || {name:'—'};
  var kasni = p.next < todayISO();
  return '<div class="row click" onclick="app.akcijeStavke(\'preventiva\',\''+p.id+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(p.opis)+
      (p.zaustavlja_liniju ? ' <span class="chip upoz">Zaustavlja liniju</span>' : '')+'</div>'+
    '<div class="row-sub">'+esc(m.name)+' &middot; '+fmtDate(p.next)+
      ((p.izv && p.izv!=='interno') ? ' &middot; <b>'+esc(p.izv)+'</b>' : '')+
      (p.dodijeljen ? ' &middot; '+esc(p.dodijeljen) : '')+
      (p.trajanje_h ? ' &middot; ~'+H(p.trajanje_h) : '')+
      (kasni ? ' &middot; <b style="color:var(--red)">kasni</b>' : '')+'</div></div>'+
    '<button class="okbtn role-write" onclick="event.stopPropagation();app.obaviPreventivu(\''+p.id+'\')">✓</button>'+
  '</div>';
}
function zadatakRedak(z){
  var kasni = z.rok && z.rok < todayISO();
  var zm = z.m ? machineById(z.m) : null;
  var kont = z.kontakt_id ? DATA.partneri.filter(function(x){ return x.id===z.kontakt_id; })[0] : null;
  return '<div class="row click" onclick="app.akcijeStavke(\'zadatak\',\''+z.id+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(z.opis)+'</div>'+
    '<div class="row-sub"><span class="chip zadatak">Zadatak</span>'+
      (z.dodijeljen ? ' '+esc(z.dodijeljen) : '')+
      (z.rok ? ' &middot; rok '+fmtDate(z.rok) : '')+
      (kasni ? ' &middot; <b style="color:var(--red)">kasni</b>' : '')+
      (z.ponavljanje ? ' &middot; ↻ svakih '+z.ponavljanje+' d' : '')+
      (zm ? ' &middot; '+esc(zm.name) : '')+
      (kont ? ' &middot; '+esc(kont.naziv) : '')+
      (z.izvor_kvar ? ' &middot; iz kvara' : '')+'</div></div>'+
    '<button class="okbtn role-write" title="Označi obavljeno" onclick="event.stopPropagation();app.obaviZadatak(\''+z.id+'\')">✓</button>'+
  '</div>';
}

/* ---------- kalendarska mreža: sklopiv ulaz za grubo planiranje, ne glavni prikaz ---------- */
function ponedjeljakTjedna(iso){
  var d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
var RASP_MJESEC = null;         /* 'GGGG-MM' prikazanog mjeseca */
var RASP_ODABRAN = null;        /* ISO zadnje dodirnutog dana (za isticanje ćelije/scroll cilj) */
var RASP_PREMJESTI = null;      /* {tip:'preventiva'|'zadatak', id} dok traje premještanje */
var RASP_KAL_OTVOREN = false;   /* je li mjesečna mreža razvijena — zatvorena po defaultu */
var RASP_OTVORENE_GRUPE = { kasnije:false, bezRoka:false, sedamDana:false };   /* sklopive niskoprioritetne grupe agende; perzistira kroz re-rendere */
var RASP_PRAZAN_DAN = null;     /* ISO dana bez ijedne stavke, dodirnutog u mreži — privremeni redak dok se ne dotakne drugi dan */
function stavkeZaDan(iso){
  return {
    prev: DATA.preventiva.filter(function(p){ return p.next===iso; }),
    zad: otvoreniZadaci().filter(function(z){ return z.rok===iso; }),
    san: sanacijeOtvorene().filter(function(k){ return k.rok_sanacije===iso; })
  };
}
function rasporedCelija(iso, danas){
  var st = stavkeZaDan(iso);
  var ukupno = st.prev.length + st.zad.length + st.san.length;
  /* točka nosi JEDNO app-wide značenje (isto kao chip "Zaustavlja liniju") — nikad "prošao je" */
  var kritican = st.prev.some(function(p){ return p.zaustavlja_liniju; });
  var izvan = iso.slice(0,7) !== RASP_MJESEC;   /* dan susjednog mjeseca — prigušen, ali živ */
  var klase = 'rasp-d'+(iso===danas?' danas':'')+(iso===RASP_ODABRAN?' odabran':'')+(izvan?' izvan':'');
  var tockaHtml = ukupno ? '<span class="rasp-tocka'+(kritican?' kritican':'')+'"></span>' : '';
  return '<div class="'+klase+'" onclick="app.rasporedDan(\''+iso+'\')">'+

}
