/* =====================  render: QR naljepnice za strojeve  ===================== */
function appBaseUrl(){
  return location.origin + location.pathname.replace(/[^/]*$/, 'index.html');
}
function renderQR(){
  $('#screen-qr').innerHTML =
    '<button class="back noprint" onclick="app.go(\'strojevi\')">‹ Strojevi</button>'+
    '<div class="noprint"><h2>Naljepnice za strojeve</h2>'+
      '<div class="card"><div style="padding:11px 13px">'+
        '<div class="row-sub">Ispiši, plastificiraj i zalijepi na stroj. Majstor skenira mobitelom i '+
        'aplikacija se otvara točno na tom stroju — bez traženja i bez pogrešnog unosa.</div>'+
        '<button class="btn primary block" style="margin-top:10px" onclick="window.print()">Ispiši naljepnice</button>'+
      '</div></div></div>'+
    '<div class="qr-list" id="qr-list"></div>';
  var cilj = $('#qr-list');
  DATA.machines.forEach(function(m){
    var kart = document.createElement('div');
    kart.className = 'qr-kart';
    kart.innerHTML = '<div class="qr-logo"><img src="'+document.querySelector('.hdr-logo').src+'" alt=""></div>'+
      '<div class="qr-naziv">'+esc(m.name)+'</div>'+
      '<div class="qr-slika"></div>'+
      '<div class="qr-upute">Skeniraj za prijavu kvara<br><b>'+esc(m.program)+'</b></div>';
    cilj.appendChild(kart);
    try{
      var okvir = kart.querySelector('.qr-slika');
      new QRCode(okvir, {
        text: appBaseUrl() + '#stroj=' + m.id,
        width: 132, height: 132,
        correctLevel: QRCode.CorrectLevel.M
      });
      /* na Androidu biblioteka ostavlja canvas — pretvaramo ga u sliku
         jer se slika pouzdano ispisuje na svakom uređaju i pisaču */
      setTimeout(function(){
        var cv = okvir.querySelector('canvas');
        if(!cv) return;
        try{
          var podatak = cv.toDataURL('image/png');
          var im = okvir.querySelector('img') || new Image();
          im.src = podatak; im.width = 132; im.height = 132;
          im.alt = 'QR kod — ' + m.name;
          im.style.display = 'block';
          if(!im.parentNode) okvir.appendChild(im);
          cv.style.display = 'none';
        }catch(e){}
      }, 0);
    }catch(e){ kart.querySelector('.qr-slika').textContent = 'QR nedostupan'; }
  });
}

/* =====================  render: Poruke (zajednički kanal)  ===================== */
function fmtDateTime(ts){
  var s = String(ts||'');
  var d = s.slice(0,10), t = s.length > 11 ? s.slice(11,16) : '';
  return (d ? fmtDate(d) : '') + (t ? ' ' + t : '');
}
function brojNeprocitanih(){
  var seen = ''; try{ seen = localStorage.getItem('porukeSeen') || ''; }catch(e){}
  return (DATA && DATA.poruke ? DATA.poruke : []).filter(function(p){ return String(p.created_at) > seen; }).length;
}
function oznaciProcitano(){
  var zadnja = (DATA.poruke||[]).reduce(function(m,p){ return String(p.created_at) > m ? String(p.created_at) : m; }, '');
  try{ if(zadnja) localStorage.setItem('porukeSeen', zadnja); }catch(e){}
}
var PORUKE_FILTER = 'sve';   /* sve | ljudi | sustav */
async function renderPoruke(){
  var seenPrije = '';
  try{ seenPrije = localStorage.getItem('porukeSeen') || ''; }catch(e){}
  var sve = (DATA.poruke||[]).slice().sort(function(a,b){
    return String(a.created_at).localeCompare(String(b.created_at));
  });
  var lista = sve.filter(function(p){
    if(PORUKE_FILTER === 'ljudi')  return p.tko !== 'Sustav';
    if(PORUKE_FILTER === 'sustav') return p.tko === 'Sustav';
    return true;
  });
  var zadnjiDan = '', crtaPostavljena = false;
  var html = lista.length ? lista.map(function(p){
    var out = '';
    var dan = String(p.created_at).slice(0,10);
    if(dan && dan !== zadnjiDan){
      zadnjiDan = dan;
      out += '<div class="msg-dan">'+(dan===todayISO() ? 'Danas' : fmtDate(dan))+'</div>';
    }
    if(!crtaPostavljena && seenPrije && String(p.created_at) > seenPrije && p.tko !== SESSION.ime){
      crtaPostavljena = true;
      out += '<div class="msg-nove">nove poruke</div>';
    }
    var sustav = p.tko === 'Sustav';
    var moja = !sustav && p.tko === SESSION.ime;
    var vrijeme = String(p.created_at).length > 11 ? String(p.created_at).slice(11,16) : '';
    var veza = p.kvar_id ? ' <a class="clink" onclick="app.izPoruke(\''+p.kvar_id+'\')">otvori kvar ›</a>' : '';
    out += '<div class="msg'+(moja?' moja':'')+(sustav?' sustav':'')+'">'+
      (sustav ? '' : '<div class="msg-meta">'+esc(p.tko)+' &middot; '+vrijeme+'</div>')+
      '<div class="msg-txt">'+esc(p.tekst)+(sustav?' <span style="opacity:.6">'+vrijeme+'</span>':'')+veza+'</div></div>';
    return out;
  }).join('') : '<div class="empty">Nema poruka za odabrani prikaz.</div>';

  var stanjePusha = await pushStanje();
  var pushRed = '<div class="row" style="padding:9px 13px"><div class="grow">'+
      '<div class="row-title" style="font-size:13px">Obavijesti na mobitel</div>'+
      '<div class="row-sub">'+
        (stanjePusha==='ukljuceno' ? 'Uključene — javljam hitne kvarove, dodjele i poruke.' :
         stanjePusha==='blokirano' ? 'Blokirane u postavkama preglednika — uključi ih u postavkama stranice.' :
         stanjePusha==='nepodrzano' ? 'Dostupno kad je app dodana na početni zaslon (preko interneta).' :
         'Isključene — nećeš znati za hitan kvar dok ne otvoriš app.')+
      '</div></div>'+
      (stanjePusha==='ukljuceno'
        ? '<button class="btn-mini" onclick="app.pushIskljuci()">Isključi</button>'
        : (stanjePusha==='iskljuceno' ? '<button class="btn-mini" onclick="app.pushUkljuci()">Uključi</button>' : ''))+
    '</div>';

  $('#screen-poruke').innerHTML =
    '<div class="filters" style="grid-template-columns:repeat(3,1fr)">'+
      ['sve','ljudi','sustav'].map(function(f){
        var nazivi = {sve:'Sve', ljudi:'Samo ljudi', sustav:'Samo sustav'};
        return '<button class="btn '+(PORUKE_FILTER===f?'primary':'sec')+' sm" onclick="app.porukeFilter(\''+f+'\')">'+nazivi[f]+'</button>';
      }).join('')+
    '</div>'+
    '<div class="card">'+pushRed+'</div>'+
    '<h2>Zajednički kanal — vide ga svi</h2>'+
    '<div class="card" style="padding:5px 0">'+html+'</div>'+
    '<form class="msg-form" onsubmit="app.posaljiPoruku(event)">'+
      '<textarea name="tekst" rows="2" required placeholder="Poruka svima — primopredaja, obavijest, upozorenje…"></textarea>'+
      '<button class="btn primary block" type="submit" style="margin-top:8px">Pošalji</button>'+
    '</form>';
  oznaciProcitano();
  updateBadge();
  var crta = document.querySelector('.msg-nove');
  if(crta) crta.scrollIntoView({block:'center'});
  else window.scrollTo(0, document.body.scrollHeight);
}

/* =====================  navigacija  ===================== */
var RENDERERS = {
  pregled: renderPregled, strojevi: renderStrojevi,
  kvarovi: renderKvarovi, dijelovi: renderDijelovi,
  kontakti: renderKontakti, poruke: renderPoruke,
  analitika: renderAnalitika, raspored: renderRaspored,
  sustav: renderSustav, qr: renderQR, nabava: renderNabava, stroj: renderStroj
};
function showScreen(name){
  CURRENT_SCREEN = name;
  ['pregled','strojevi','kvarovi','dijelovi','kontakti','poruke','analitika','raspored','sustav','qr','nabava','stroj'].forEach(function(s){
    $('#screen-'+s).classList.toggle('hidden', s!==name);
  });
  REPS = repCounts();
  RENDERERS[name]();
  /* pod-ekrani osvjetljavaju karticu iz koje su otvoreni (QR je pod Strojevima) */
  var tabName = (name==='stroj'||name==='qr') ? 'strojevi'
    : ((name==='analitika'||name==='raspored'||name==='sustav') ? 'pregled'
       : (name==='nabava' ? 'dijelovi' : name));
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-tab')===tabName);
  });
  updateBadge();
  window.scrollTo(0,0);
}
function updateBadge(){
  /* majstoru badge broji NJEGOVE dodijeljene kvarove, voditelju/direktoru sve otvorene */
  var n = SESSION.role==='majstor'
    ? DATA.kvarovi.filter(function(k){ return jeOtvoren(k) && k.dodijeljen===SESSION.ime; }).length
    : DATA.kvarovi.filter(function(k){ return jeOtvoren(k); }).length;
  var b = $('#badge-kvarovi');
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n;
  /* nepročitane zajedničke poruke */
  var bp = $('#badge-poruke');
  if(bp){
    var np = CURRENT_SCREEN === 'poruke' ? 0 : brojNeprocitanih();
    bp.style.display = np ? 'flex' : 'none';
    bp.textContent = np;
  }
}

  logoOdabran: function(e){
    var dat = e.target.files && e.target.files[0];
    if(!dat) return;
    var citac = new FileReader();
    citac.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        /* logo se sprema smanjen — baza i mreža ne trebaju nositi veliku sliku */
        var maxV = 120, om = Math.min(1, maxV / img.height);
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * om); c.height = Math.round(img.height * om);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_LOGO = c.toDataURL('image/png');
        var pr = document.getElementById('logo-prev');
        if(pr){ pr.src = PENDING_LOGO; pr.style.display = 'block'; pr.style.maxHeight = '70px'; }
      };
      img.src = ev.target.result;
    };
    citac.readAsDataURL(dat);
  },

  saveUvoz: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    var vrsta = f.get('vrsta');
    var redci = String(f.get('csv')||'').split('\n').map(function(r){ return r.trim(); }).filter(Boolean);
    var dodano = 0, greske = 0;
    for(var i=0;i<redci.length;i++){
      var c = redci[i].split(/[;\t]/).map(function(x){ return x.trim(); });
      if(/^(šifra|sifra|naziv)/i.test(c[0])) continue;   /* preskoči zaglavlje */
      try{
        if(vrsta === 'machines'){
          if(c.length < 2) { greske++; continue; }
          var m = { id:c[0].toLowerCase(), name:c[1], program:c[2] || PROGRAMS[0], rate:parseFloat(c[3])||350, bilj:'' };
          DATA.machines.push(m);
          await apiInsert('machines', m, null);
        } else {
          if(c.length < 2) { greske++; continue; }
          var d = { id:'d'+Date.now()+i, naziv:c[0], stroj:c[1]||'', stanje:parseInt(c[2],10)||0,
                    min:parseInt(c[3],10)||0, dob:c[4]||'', cijena:parseFloat(c[5])||0,
                    kategorija:c[6]||'Ostalo' };
          DATA.dijelovi.push(d);
          await apiInsert('dijelovi', { naziv:d.naziv, stroj:d.stroj, stanje:d.stanje, min:d.min,
            dob:d.dob, cijena:d.cijena, kategorija:d.kategorija }, d);
        }
        dodano++;
      }catch(err){ greske++; }
    }
    app.closeModal();
    alert('Uvezeno: '+dodano+(greske?('\nPreskočeno (neispravan redak): '+greske):''));
    showScreen(vrsta === 'machines' ? 'strojevi' : 'dijelovi');
  },

  izvozCSV: function(dani){

                'dodijeljen;rijesio;sudjelovali;zamijenjeno;ceka_dio;linija_otpustena;privremeni_popravak;rok_sanacije';
    var redovi = DATA.kvarovi.filter(function(k){ return k.date >= od; }).sort(byDateDesc).map(function(k){
      var m = machineById(k.m) || {name:''};
      var c = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
      return [k.date, m.name, k.tip||'kvar', k.kategorija||'', k.opis, k.status, k.prioritet||'', k.smjena||'', k.sati,
              Math.round(kvarCost(k)), k.dodijeljen||'', k.tko||'', k.sudjelovali||'', k.zam||'',

  primiNabavu: async function(id){
    var n = (DATA.nabava||[]).filter(function(x){ return x.id===id; })[0];
    if(!n) return;
    if(jeTempId(id)){ alert('Narudžba se upravo sprema — pokušaj za par sekundi.'); return; }
    var p = dioPoId(n.dio_id);
    var kol = prompt('Koliko je komada stiglo?', String(n.kolicina));
    if(kol === null) return;
    kol = Math.max(0, parseInt(kol,10) || 0);
    if(!kol) return;
    n.primljeno = todayISO();
    n.primljena_kolicina = kol;
    if(p) p.stanje = p.stanje + kol;
    showScreen('nabava');
    if(REMOTE && naMrezi()){
      try{
        var rpc = await sb.rpc('primi_nabavu', { p_id:id, p_kolicina:kol, p_datum:n.primljeno });
        if(!rpc.error && typeof rpc.data === 'number' && p) p.stanje = rpc.data;
        else throw rpc.error || new Error('rpc');
      }catch(e){
        await apiUpdate('nabava', id, { primljeno:n.primljeno, primljena_kolicina:kol });
        if(p) await apiUpdate('dijelovi', p.id, { stanje:p.stanje });

  saveKvar: async function(e){
    e.preventDefault();
    var f = new FormData(e.target);

    var status = tip==='zadatak' ? 'otvoren' : f.get('status');

    var satiUnos = parseFloat(f.get('sati'));
    if(tip==='kvar' && (isNaN(satiUnos) || satiUnos < 0 || satiUnos > 72)){
      alert('Trajanje zastoja mora biti između 0 i 72 sata.'); return; }
    if(tip==='kvar' && f.get('prioritet')==='hitno' && !PENDING_FOTO &&
       !confirm('HITAN kvar bez fotografije — nastaviti bez nje?')) return;
    var kvar = {
      id:'kv'+Date.now(), m:f.get('m') || null, date:f.get('date'),
      opis:String(f.get('opis')||'').trim(),
      sati: tip==='zadatak' ? 0 : (parseFloat(f.get('sati'))||0),
      status:status, upoz:false,
      tko: status==='rijesen' ? f.get('tko') : null,
      zam: status==='rijesen' ? (String(f.get('zam')||'').trim()||null) : null,
      foto: PENDING_FOTO || null,
      dodijeljen: f.get('dodijeljen') || null,
      prioritet: f.get('prioritet') || 'normalno',
      smjena: tip==='zadatak' ? null : (f.get('smjena') || null),
      ceka_dio: false, sudjelovali: null,
      tip: tip, rok: tip==='zadatak' ? (f.get('rok') || null) : null,
      kategorija: tip==='zadatak' ? 'Ostalo' : (f.get('kategorija') || autoKat(f.get('opis'))),
      otpusteno: false, privremeni: false, rok_sanacije: null
    };
    var pendingFoto = PENDING_FOTO; PENDING_FOTO = '';
    DATA.kvarovi.push(kvar);
    app.closeModal(); showScreen('kvarovi');
    var nm = machineById(kvar.m);
    var zapis = (tip==='zadatak' ? '📋 Novi zadatak: ' : '⚠ Prijavljen kvar: ')+
      (nm ? nm.name+' — ' : '')+kvar.opis+
      (kvar.dodijeljen ? ' → '+kvar.dodijeljen : '')+' ('+(SESSION.ime||'')+')';
    if(REMOTE){
      kvar.foto = await uploadFoto(pendingFoto) || null;
      var spremljen = await apiInsert('kvarovi', { m:kvar.m, date:kvar.date, opis:kvar.opis, sati:kvar.sati,
        status:kvar.status, upoz:kvar.upoz, tko:kvar.tko, zam:kvar.zam, foto:kvar.foto,
        dodijeljen:kvar.dodijeljen, prioritet:kvar.prioritet, smjena:kvar.smjena,
        tip:kvar.tip, rok:kvar.rok, kategorija:kvar.kategorija }, kvar);
      /* javljamo tek kad zapis stvarno postoji u bazi */
      if(spremljen){
        zapamtiMojUnos(kvar.id);
        sysPoruka(zapis, kvar.id);
        if(tip !== 'zadatak') obavijestNoviKvar(kvar, nm);
        else if(kvar.dodijeljen)
          posaljiObavijest('📋 Dodijeljeno tebi', (nm?nm.name+': ':'')+kvar.opis, '#kvarovi', kvar.dodijeljen);
      }

      save();
      sysPoruka(zapis, kvar.id);
    }
  },

  saveRijesen: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var sh = parseFloat(f.get('sati'));
    if(isNaN(sh) || sh < 0 || sh > 72){ alert('Trajanje zastoja mora biti između 0 i 72 sata.'); return; }
    k.sati = sh;
    k.status = 'rijesen'; k.upoz = false; k.ceka_dio = false;
    /* IFS: u izvještaj ide samo ono što je netko stvarno potvrdio */
    k.otpusteno = !!f.get('otpusteno');
    k.tko = f.get('tko');
    k.sudjelovali = String(f.get('sudjelovali')||'').trim() || null;
    k.zam = String(f.get('zam')||'').trim() || null;
    /* razduživanje skladišta: utrošeni dio smanjuje stanje i upisuje se u "Zamijenjeno" */
    var dioId = f.get('dio');
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    if(dioId){
      var p = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(p){
        var prije = p.stanje;
        p.stanje = Math.max(0, p.stanje - kol);
        if(!k.zam) k.zam = p.naziv + (kol>1 ? ' ×'+kol : '');
        else k.zam += ' + ' + p.naziv + (kol>1 ? ' ×'+kol : '');
        if(prije >= p.min && p.stanje < p.min)
          sysPoruka('📦 Dio ispod minimuma: '+p.naziv+' (stanje '+p.stanje+', min '+p.min+') — naručiti!');
        /* atomarno u bazi: dva majstora u isto vrijeme ne smiju izgubiti komad */
        if(REMOTE && naMrezi()){
          try{
            var rpc = await sb.rpc('razduzi_dio', { p_id: p.id, p_kolicina: kol });
            if(!rpc.error && typeof rpc.data === 'number') p.stanje = rpc.data;
            else await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
          }catch(e){ await apiUpdate('dijelovi', p.id, { stanje:p.stanje }); }
        } else {
          await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
        }
      }
    }
    app.closeModal();
    showScreen($('#screen-stroj').classList.contains('hidden') ? 'kvarovi' : 'stroj');
    var rm = machineById(k.m);
    sysPoruka('✅ '+(k.tip==='zadatak'?'Zadatak obavljen':'Kvar riješen')+': '+
      (rm ? rm.name+' — ' : '')+k.opis+' ('+esc(k.tko||'')+')', k.id);
    await apiUpdate('kvarovi', k.id, { sati:k.sati, status:k.status, upoz:false, ceka_dio:false,
      otpusteno:k.otpusteno, tko:k.tko, zam:k.zam, sudjelovali:k.sudjelovali,
      closed_at:new Date().toISOString() });
  },

  saveUredi: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    var prijeDodijeljen = k.dodijeljen;
    k.m = f.get('m') || null;
    k.opis = String(f.get('opis')||'').trim() || k.opis;
    k.date = f.get('date') || k.date;
    k.sati = parseFloat(f.get('sati')); if(isNaN(k.sati)) k.sati = 0;
    k.kategorija = f.get('kategorija') || 'Ostalo';
    k.dodijeljen = f.get('dodijeljen') || null;

      k.tko = f.get('tko') || k.tko;
      k.sudjelovali = String(f.get('sudjelovali')||'').trim() || null;
      k.zam = String(f.get('zam')||'').trim() || null;
    } else {
      k.ceka_dio = !!f.get('ceka');
    }
    k.privremeni = !!f.get('privremeni');
    k.rok_sanacije = k.privremeni ? (f.get('rok_sanacije') || null) : null;
    if(k.dodijeljen && k.dodijeljen !== prijeDodijeljen && jeOtvoren(k)){
      var dm = machineById(k.m);
      posaljiObavijest('📋 Dodijeljeno tebi', (dm?dm.name+': ':'')+k.opis, '#kvarovi', k.dodijeljen);
    }
    app.closeModal();
    showScreen($('#screen-stroj').classList.contains('hidden') ? 'kvarovi' : 'stroj');
    await apiUpdate('kvarovi', k.id, { m:k.m, opis:k.opis, date:k.date, sati:k.sati,
      kategorija:k.kategorija, dodijeljen:k.dodijeljen, prioritet:k.prioritet,
      smjena:k.smjena, ceka_dio:k.ceka_dio, tko:k.tko, sudjelovali:k.sudjelovali, zam:k.zam,

  fotoOdabrana: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_FOTO = c.toDataURL('image/jpeg', 0.72);
        var prev = document.getElementById('foto-prev');
        if(prev){ prev.src = PENDING_FOTO; prev.style.display = 'block'; }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

async function postLogin(){
  var u = (await sb.auth.getUser()).data.user;
  if(!u) throw new Error('nema sesije');
  var prof = await sb.from('users').select('*').eq('id', u.id).single();
  if(prof.error || !prof.data){
    /* račun postoji u Auth, ali nema red u tablici users → nema uloge.
       Jasna poruka umjesto tihe readonly prijave. */
    try{ await sb.auth.signOut(); }catch(e){}
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Račun postoji, ali nema dodijeljenu ulogu (tablica users) — javi voditelju.';
    return;
  }
  SESSION.ime  = prof.data.ime;
  SESSION.role = prof.data.role;
  document.body.dataset.role = SESSION.role;
  $('#screen-login').classList.remove('show');
  try{
    await load();
  }catch(e){
    /* nema mreže pri pokretanju — radi iz lokalnog keša */
    if(cacheUcitaj()){ primijeniRed(); toast('Radiš iz lokalne kopije — nema mreže'); }
    else { $('#login-err').textContent = 'Nema veze s bazom i nema lokalne kopije.'; throw e; }
  }
  osvjeziOfflineTraku();
  if(!initHash()) showScreen('pregled');
  dobrodoslica();
  sinkroniziraj();   /* pošalji što je ostalo od prošlog puta */
}
function dobrodoslica(){
  /* pri dolasku u smjenu: odmah reci što je bitno */
  var mojih = DATA.kvarovi.filter(function(k){ return jeOtvoren(k) && k.dodijeljen===SESSION.ime; }).length;
  var nep = brojNeprocitanih();
  var dijelovi_min = DATA.dijelovi.filter(function(p){ return p.stanje < p.min && !narudzbaZaDio(p.id); }).length;
  var dio = [];
  if(mojih) dio.push(mojih + (mojih===1?' tvoj zadatak':' tvoja zadatka/zadataka'));
  if(nep) dio.push(nep + ' nepročitanih poruka');
  if(SESSION.role!=='majstor' && dijelovi_min) dio.push(dijelovi_min + ' dijela za naručiti');
  if(dio.length) toast('' + esc(SESSION.ime) + ': ' + dio.join(' · '));
}
function majstorOpts(sel){
  var imena = MAJSTORI.slice();
  if(SESSION.ime && SESSION.ime !== 'Demo' && imena.indexOf(SESSION.ime) === -1) imena.push(SESSION.ime);
  return imena.map(function(t){
    return '<option'+(sel===t?' selected':'')+'>'+esc(t)+'</option>';
  }).join('');
}
function vidiFinancije(){ return SESSION.role !== 'majstor'; }
/* dijelovi se vežu na strojeve preko šifri (ne slobodnog teksta) — podaci ne trunu */
function strojeviCheckbox(odabrani){
  odabrani = odabrani || [];
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px">'+
    DATA.machines.map(function(m){
      return '<label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;'+
        'font-size:13px;font-weight:500;color:var(--text);margin:0">'+
        '<input type="checkbox" name="stroj_id" value="'+m.id+'" style="width:auto"'+
        (odabrani.indexOf(m.id)>-1?' checked':'')+'> '+esc(m.name)+'</label>';
    }).join('')+'</div>';
}
function strojeviNazivi(ids){
  if(!ids || !ids.length) return '';
  return ids.map(function(id){ var m = machineById(id); return m ? m.name : id; }).join(', ');
}
function citajStrojeve(form){
  return Array.prototype.slice.call(form.querySelectorAll('input[name="stroj_id"]:checked'))
    .map(function(el){ return el.value; });
}
var KAT_KVARA = ['Mehanički','Električni','Pneumatika i rashlada','Ostalo'];
var KAT_DIJELOVA = ['Remeni i prijenos','Ležajevi','Brtve i maziva','Senzori i elektrika',
                    'Grijači','Folije i ambalaža','Rashladna tehnika','Alati i matrice','Ostalo'];
var TIP_PARTNERA = ['Dobavljač','Servis','Proizvođač','Ostalo'];
function aktivni(){ return DATA.kvarovi.filter(function(k){ return k.status !== 'otkazan'; }); }
/* nezavrsen = prijavljen ili netko vec radi na njemu */
function jeOtvoren(k){ return k.status === 'otvoren' || k.status === 'u_radu'; }
function samoKvarovi(){ return aktivni().filter(function(k){ return (k.tip||'kvar') === 'kvar'; }); }
function autoKat(opis){
  var o = String(opis||'').toLowerCase();
  if(/senzor|grija|fotosen|elektri/.test(o)) return 'Električni';
  if(/tlak|ventil|kompresor|rashlad|kondenzator|led/.test(o)) return 'Pneumatika i rashlada';
  if(/remen|ležaj|matric|brtv|nož|folij|traka|valj|dozator|reduktor/.test(o)) return 'Mehanički';
  return 'Ostalo';
}
function sysPoruka(tekst, kvarId){
  /* automatski sistemski zapis u zajedničkom kanalu — živa knjiga smjene */
  var veza = (kvarId && !jeTempId(kvarId)) ? kvarId : null;
  var p = { id:'po'+Date.now(), tko:'Sustav', tekst:tekst, kvar_id:veza, created_at:new Date().toISOString() };
  if(!DATA.poruke) DATA.poruke = [];
  DATA.poruke.push(p);
  if(REMOTE){ try{ sb.from('poruke').insert({ tko:'Sustav', tekst:tekst, kvar_id:veza }).then(function(){}, function(){}); }catch(e){} }
  else save();
  updateBadge();
}
function smjenaOpts(){
  var h = new Date().getHours();
  var sm = TVRTKA.smjene && TVRTKA.smjene.length ? TVRTKA.smjene : ['1. smjena','2. smjena'];
  var def = (h >= 6 && h < 14) ? sm[0] : (sm[1] || sm[0]);
  return sm.map(function(s){
    return '<option'+(s===def?' selected':'')+'>'+s+'</option>';
  }).join('');
}
function initHash(){
  var h = /#stroj=([\w-]+)/.exec(location.hash || '');
  if(h && machineById(h[1])){ app.openStroj(h[1]); return true; }
  return false;
}

/* =====================  start  ===================== */
async function start(){
  $('#login-logo').src = document.querySelector('.hdr-logo').src;
  redUcitaj();
  osvjeziOfflineTraku();
  await ucitajIdentitet();   /* naziv, logo, boje i programi tvrtke iz baze */
  if(!REMOTE){
    /* DEMO NAČIN: lokalno, bez prijave, uloga voditelj */
    $('#demo-banner').style.display = '';
    document.body.dataset.role = 'voditelj';
    SESSION = { ime:'Voditelj', role:'voditelj' };
    localLoad();
    if(!initHash()) showScreen('pregled');
    return;
  }
  renderLoginTiles();
  try{
    var s = await sb.auth.getSession();
    if(s.data.session){ await postLogin(); }
    else { $('#screen-login').classList.add('show'); }
  }catch(ex){
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Greška u vezi s bazom — provjeri internet pa osvježi stranicu.';
  }
}
start();

/* osvježavanje za rad u 2 smjene (multi-user): polling dok je tab vidljiv */
setInterval(async function(){
  if(!REMOTE || document.visibilityState !== 'visible') return;
  if(!DATA || $('#screen-login').classList.contains('show')) return;
  if($('#modal-root').innerHTML) return;   /* ne diraj otvorenu formu */
  if(PENDING_OPS > 0) return;              /* ne gazi unos koji još putuje u bazu */
  if(!naMrezi()) return;
  if(RED.length){ await sinkroniziraj(); return; }   /* prvo pošalji svoje, pa povlači tuđe */
  try{
    await load(true);                      /* tiho — bez loadera */
    rerender();
  }catch(e){}
}, 30000);

/* realtime: nove poruke/kvarovi/komentari odmah stižu svima (multi-user) */
async function rtNovo(tip, pl){
  var row = (pl && pl['new']) ? pl['new'] : {};
  if(row.tko && row.tko === SESSION.ime) return;   /* moj vlastiti unos (poruke, komentari) */
  if(row.id && MOJI_UNOSI[row.id]) return;         /* moj vlastiti kvar — ne javljaj mi ga natrag */
  if(tip==='poruke')    toast('💬 Nova poruka — ' + (row.tko||''));
  if(tip==='kvarovi')   toast('⚠ Novi kvar prijavljen');
  if(tip==='komentari') toast('💬 Novi komentar na kvaru');
  if(PENDING_OPS > 0 || $('#modal-root').innerHTML){ return; }
  try{ await load(true); rerender(); }catch(e){}
}
if(REMOTE){
  ['poruke','kvarovi','komentari'].forEach(function(t){
    sb.channel('rt-'+t)
      .on('postgres_changes', {event:'INSERT', schema:'public', table:t},
          function(pl){ rtNovo(t, pl); })
      .subscribe();
  });
}

/* PWA servisni radnik (samo preko http/https, ne za file://) */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
