<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clarum — Održavanje</title>
<meta name="theme-color" content="#3a3285">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --accent:#3a3285; --accent-dark:#282465; --accent-soft:#edecf7;
  --gold:#ffd749;
  --bg:#f4f5f7; --card:#ffffff; --border:#e3e6eb;
  --text:#1b2430; --muted:#5b6570;
  --red:#c0181c; --red-bg:#fdeaea; --red-border:#f3cbcb;
  --yellow:#a15c07; --yellow-bg:#fdf3e0; --yellow-border:#f2dfba;
  --green:#1e6f3d; --green-bg:#e8f3ec; --green-border:#cbe3d3;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:var(--accent);color:#fff;
  padding-top:env(safe-area-inset-top);box-shadow:0 1px 4px rgba(30,30,80,.25);
  border-bottom:3px solid var(--gold)}
.hdr-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px}
.hdr-brand{display:flex;align-items:center;gap:11px;min-width:0}
.hdr-logo{height:42px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
h1{font-size:18px;font-weight:700;letter-spacing:.2px}
.hdr-sub{font-size:11px;opacity:.72;margin-top:1px}
.btn-audit{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);color:#fff;
  font-size:12px;font-weight:600;line-height:1.25;padding:8px 11px;border-radius:8px;
  max-width:140px;text-align:center;cursor:pointer;flex-shrink:0}
.btn-audit:active{background:rgba(255,255,255,.22)}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:16px 16px calc(86px + env(safe-area-inset-bottom))}
.screen.hidden{display:none}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  font-weight:700;margin:22px 0 9px}
h2:first-child{margin-top:2px}

/* ---------- cards & rows ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer}
.row.click:active{background:#f7f8fa}
.row-title{font-weight:600;font-size:14.5px}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chev{color:#b6bcc6;font-size:19px;line-height:1}
.grow{min-width:0;flex:1}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- chips ---------- */
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;
  padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;vertical-align:1px}
.chip.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.chip.upoz{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.chip.kvar{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.chip.rijesen{background:#eef0f3;color:var(--muted);border:1px solid var(--border)}
.chip.fg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);text-transform:none;letter-spacing:.2px}

/* ---------- dashboard ---------- */
.big-card{background:linear-gradient(160deg,var(--accent),var(--accent-dark));color:#fff;
  border-radius:12px;padding:18px 18px 16px;cursor:pointer;box-shadow:0 2px 10px rgba(22,50,79,.28)}
.big-label{font-size:12px;text-transform:uppercase;letter-spacing:.8px;opacity:.75;font-weight:600}
.big-num{font-size:44px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.big-sub{font-size:12.5px;opacity:.75}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{border-radius:var(--radius);padding:12px 8px 10px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--card)}
.stat-num{display:block;font-size:27px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-label{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;font-weight:600}
.stat.red{background:var(--red-bg);border-color:var(--red-border)}   .stat.red .stat-num{color:var(--red)}
.stat.yellow{background:var(--yellow-bg);border-color:var(--yellow-border)} .stat.yellow .stat-num{color:var(--yellow)}
.stat.green{background:var(--green-bg);border-color:var(--green-border)} .stat.green .stat-num{color:var(--green)}

/* ---------- trend na velikoj kartici ---------- */
.trend{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);
  padding:3px 9px;border-radius:20px;margin-left:10px;vertical-align:9px;letter-spacing:.2px}
.trend.up{color:#ffb4ad}
.trend.down{color:#96e6b0}

/* ---------- najskuplji strojevi (barovi) ---------- */
.bar-row{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer}
.bar-row:last-child{border-bottom:none}
.bar-row:active{background:#f7f8fa}
.bar-name{width:98px;flex-shrink:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:13px;background:#edf0f4;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar-val{width:58px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- ponovljeni kvar ---------- */
.rep{color:var(--red);font-size:11px;font-weight:700;white-space:nowrap}

/* ---------- analitika tablice ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- kalendar rasporeda ---------- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-naslov{font-size:15px;font-weight:700;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0;text-transform:uppercase}
.cal-d{min-height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:5px;font-size:13px;font-weight:600;color:var(--text);
  cursor:pointer;border:1.5px solid transparent}
.cal-d.prazan{cursor:default}
.cal-d.ima{background:#f2f3f7}
.cal-d.danas{border-color:var(--accent)}
.cal-d.odabran{background:var(--accent-soft);border-color:var(--accent)}
.cal-tocke{display:flex;gap:2.5px;margin-top:3px;min-height:6px}
.cal-t{display:inline-block;width:6px;height:6px;border-radius:50%}

/* ---------- statusna točka stroja ---------- */
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.sdot.ok{background:#2e9e57}.sdot.upoz{background:#e5a50a}.sdot.kvar{background:var(--red)}

/* ---------- poruke (chat) ---------- */
.msg{padding:7px 13px}
.msg-meta{font-size:11px;color:var(--muted);font-weight:600}
.msg-txt{font-size:14px;background:#f0f1f5;border-radius:0 10px 10px 10px;padding:8px 11px;margin-top:3px;
  display:inline-block;max-width:88%;text-align:left}
.msg.moja{text-align:right}
.msg.moja .msg-txt{background:var(--accent-soft);border-radius:10px 0 10px 10px}
.msg.sustav{text-align:center;padding:4px 13px}
.msg.sustav .msg-txt{background:none;border:none;font-size:12px;color:var(--muted);padding:2px 0;max-width:100%}
.msg.sustav .msg-meta{display:none}
.msg-form{margin-top:12px}
body[data-role="majstor"] .btn-audit{display:none}

/* ---------- kontakt linkovi ---------- */
.clink{color:var(--accent);font-weight:600;text-decoration:none}
.clink:active{text-decoration:underline}

/* ---------- loader i toast ---------- */
#loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;
  border:4px solid #e3e6eb;border-top-color:var(--accent);border-radius:50%;
  animation:spin 1s linear infinite;z-index:90;display:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:#fff;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:20px;
  z-index:95;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:.94}

/* ---------- tipkovnička navigacija ---------- */
.btn:focus-visible,.tab:focus-visible,.qbtn:focus-visible,.okbtn:focus-visible,
.x:focus-visible,.btn-mini:focus-visible,.user-tile:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* ---------- akcijski gumbi u listama ---------- */
.okbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--green-border);background:var(--green-bg);
  color:var(--green);font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1}
.okbtn:active{background:#d6ecdd}
.btn-mini{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:7px;
  padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-mini:active{background:var(--accent-soft)}

/* ---------- fotografije kvara ---------- */
.kthumb{margin-top:7px;max-width:170px;max-height:120px;border-radius:6px;border:1px solid var(--border);display:block;cursor:pointer}
.foto-prev{display:none;margin-top:8px;max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--border)}
.foto-full{max-width:100%;border-radius:8px;display:block}

/* ---------- prijava ---------- */
#screen-login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
#screen-login.show{display:flex}
.login-box{width:100%;max-width:360px;text-align:center}
.login-logo{height:72px;margin-bottom:6px}
.login-title{font-size:14px;font-weight:700;margin-bottom:18px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px}
.user-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.user-tile{padding:15px 8px;background:var(--card);border:1.5px solid var(--border);
  border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.user-tile.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pin-input{text-align:center;font-size:22px;letter-spacing:8px;font-weight:700}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- demo banner ---------- */
.demo-banner{background:var(--yellow-bg);color:var(--yellow);border-bottom:1px solid var(--yellow-border);
  font-size:11.5px;font-weight:600;text-align:center;padding:5px 10px}

/* ---------- uloge ---------- */
body[data-role="readonly"] .role-write{display:none !important}
body:not([data-role="voditelj"]) .role-voditelj{display:none !important}

/* ---------- sesija / izvoz ---------- */
.session-row{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
.session-row a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}

/* ---------- ispis IFS izvještaja ---------- */
.print-head{display:none}
@media print{
  @page{margin:16mm 14mm}
  header,#tabbar,main,#demo-banner,#loader,#toast{display:none !important}
  body{background:#fff;color:#000;font-size:11pt;line-height:1.5}
  .overlay{position:static;background:none;display:block;padding:0}
  .modal{max-height:none;overflow:visible;border-radius:0;width:100%;max-width:none;box-shadow:none;animation:none;padding:0}
  .modal .btn,.modal .x,.modal select,.modal input,.modal textarea,.modal form,.modal label{display:none !important}
  .modal-head{display:none !important}
  /* memorandum na vrhu ispisa */
  .print-head{display:flex !important;align-items:center;gap:14px;border-bottom:3px solid #3a3285;
    padding-bottom:10px;margin-bottom:14px}
  .print-head img{height:52px}
  .print-head .ph-naslov{font-size:16pt;font-weight:700;color:#3a3285}
  .print-head .ph-sub{font-size:9.5pt;color:#444;margin-top:2px}
  .audit h4{color:#000;border-bottom:1.5px solid #3a3285;font-size:12pt;margin:14pt 0 6pt;
    padding-bottom:3pt;page-break-after:avoid}
  .audit .a-item{page-break-inside:avoid;border-bottom:.5pt solid #ccc;padding:5pt 0;font-size:10pt}
  .audit .a-m{page-break-after:avoid;font-size:10.5pt}
  .audit .a-sub{color:#333;font-size:9pt}
  .audit .a-meta{color:#333;font-size:9pt;margin-bottom:8pt}
  .chip{border:.75pt solid #666 !important;background:none !important;color:#000 !important;font-size:7.5pt}
  .rep{color:#000;font-weight:700}
}

/* ---------- kvar items ---------- */
.kvar-item{padding:11px 13px;border-bottom:1px solid var(--border)}
.kvar-item:last-child{border-bottom:none}
.kvar-item.click{cursor:pointer}
.kvar-item.click:active{background:#f7f8fa}
.kvar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.kvar-opis{font-size:14px;font-weight:600;margin-top:3px}
.kvar-meta{font-size:12px;color:var(--muted);margin-top:3px}
.kvar-meta b{color:var(--text)}

/* ---------- filters / buttons ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters select:first-child{grid-column:1 / -1}
select,input,textarea{width:100%;border:1px solid #cdd3db;border-radius:8px;background:#fff;
  padding:11px 12px;font-size:16px;font-family:inherit;color:var(--text)}  /* 16px: sprječava iOS auto-zoom */
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.filters select{font-size:16px;padding:10px 8px}
.btn{border:none;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-dark)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.sec:active{background:#d8e3f0}
.btn.sm{padding:9px 13px;font-size:13.5px}
.btn.sec.block{margin-bottom:12px}
.btn.block{display:block;width:100%}
.btn-new{margin-bottom:12px}
.back{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;
  cursor:pointer;padding:10px 12px 12px 0;min-height:44px;display:inline-flex;align-items:center;gap:4px}

/* ---------- machine detail ---------- */
.detail-head{padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.detail-name{font-size:18px;font-weight:700}
.detail-sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- parts qty ---------- */
.qty{display:flex;align-items:center;gap:7px;flex-shrink:0}
.qbtn{width:44px;height:44px;border-radius:8px;border:1px solid #cdd3db;background:#fff;
  font-size:18px;line-height:1;color:var(--accent);cursor:pointer;font-weight:700}
.qbtn:active{background:var(--accent-soft)}
.qval{min-width:52px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.qval span{display:block;font-size:10px;color:var(--muted);font-weight:500}
.qval.low{color:var(--red)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .18s ease}
@keyframes slideup{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:640px){.overlay{align-items:center;padding:24px}.modal{border-radius:14px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{font-size:17px;font-weight:700}
.x{background:#e3e6eb;border:none;width:42px;height:42px;border-radius:50%;font-size:19px;
  color:var(--muted);cursor:pointer;line-height:1}
form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:11px 0 4px;
  text-transform:uppercase;letter-spacing:.4px}
form .btn{margin-top:18px}

/* ---------- audit ---------- */
.audit{font-size:13.5px}
.audit .a-meta{color:var(--muted);font-size:12px;margin:-6px 0 12px}
.audit h4{font-size:13px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--accent);color:var(--accent)}
.audit .a-item{padding:6px 0;border-bottom:1px solid var(--border)}
.audit .a-item:last-child{border-bottom:none}
.audit .a-m{font-weight:700;font-size:13px;margin-top:9px}
.audit .a-sub{color:var(--muted);font-size:12.5px}
.audit .late{color:var(--red);font-weight:700}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tab-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:none;padding:8px 1px 9px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--accent)}
.tab .dot{position:relative}
.badge{position:absolute;top:-5px;right:-10px;background:var(--red);color:#fff;font-size:10.5px;
  font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
</style>
</head>
<body>

<header>

/* =====================  pomoćne funkcije  ===================== */
function $(s){ return document.querySelector(s); }
function pad2(n){ return String(n).length<2 ? '0'+n : String(n); }
function isoShift(days){
  var d = new Date(); d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function todayISO(){ return isoShift(0); }
function fmtDate(iso){
  var p = iso.split('-');
  return parseInt(p[2],10)+'.'+parseInt(p[1],10)+'.'+p[0]+'.';
}
function EUR(n){ return Math.round(n).toLocaleString('hr-HR')+' €'; }
function H(n){ return n.toLocaleString('hr-HR',{maximumFractionDigits:1})+' h'; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MJESECI = ['siječanj','veljača','ožujak','travanj','svibanj','lipanj','srpanj','kolovoz','rujan','listopad','studeni','prosinac'];
function monthLabel(){ var d=new Date(); return MJESECI[d.getMonth()]+' '+d.getFullYear()+'.'; }
function intervalDays(s){
  var m = /([0-9]+)/.exec(s||'');
  var n = m ? parseInt(m[1],10) : 30;
  return String(s||'').indexOf('mjesec') > -1 ? Math.round(n*30.44) : n;
}
function addDaysISO(iso, days){
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function machineById(id){ for(var i=0;i<DATA.machines.length;i++) if(DATA.machines[i].id===id) return DATA.machines[i]; return null; }
function kvarCost(k){ var m = machineById(k.m); return k.sati * (m ? m.rate : 350); }
function byDateDesc(a,b){ return b.date===a.date ? 0 : (b.date>a.date?1:-1); }
function machineStatus(id){
  var open = DATA.kvarovi.filter(function(k){ return k.m===id && k.status==='otvoren'; });
  for(var i=0;i<open.length;i++) if(!open[i].upoz) return 'kvar';
  return open.length ? 'upoz' : 'ok';
}
function statusChip(st){
  if(st==='kvar') return '<span class="chip kvar">U kvaru</span>';
  if(st==='upoz') return '<span class="chip upoz">Upozorenje</span>';
  return '<span class="chip ok">OK</span>';
}
function lastKvarDate(id){
  var ds = DATA.kvarovi.filter(function(k){return k.m===id;}).map(function(k){return k.date;}).sort();
  return ds.length ? ds[ds.length-1] : null;
}
function nextPrevDate(id){
  var ds = DATA.preventiva.filter(function(p){return p.m===id;}).map(function(p){return p.next;}).sort();
  return ds.length ? ds[0] : null;
}

/* ---------- prepoznavanje ponovljenih kvarova (isti stroj + isti tip kvara) ---------- */
var REP_KEYS = ['remen','folij','senzor','matric','tlak','grijač','brtv','ležaj','filter','nož'];
var REPS = {};
function kvarSig(k){
  var o = String(k.opis||'').toLowerCase();
  for(var i=0;i<REP_KEYS.length;i++) if(o.indexOf(REP_KEYS[i])!==-1) return k.m+'|'+REP_KEYS[i];
  return null;
}
function repCounts(){
  var t90 = isoShift(-92), map = {};
  DATA.kvarovi.forEach(function(k){
    if(k.date < t90 || k.status==='otkazan' || (k.tip||'kvar')!=='kvar') return;
    var s = kvarSig(k);
    if(s) map[s] = (map[s]||0)+1;
  });
  return map;
}

async function load(tiho){

    sb.from('komentari').select('*').order('created_at'),

  };

function save(){
  if(REMOTE) return; /* u multi-user načinu svaki handler zove svoj API poziv */
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
}
/* API sloj: u demo načinu samo save(); u multi-user upis u Supabase.
   Optimistički obrazac: UI se ažurira odmah, mreža ide u pozadini.
   PENDING_OPS štiti unos u tijeku od pregaženja pollingom; kod greške
   se lokalni unos vraća (rollback) i stanje ponovno povlači iz baze. */
var PENDING_OPS = 0;
var TABLE2KEY = { machines:'machines', kvarovi:'kvarovi', dijelovi:'dijelovi', preventiva:'preventiva', partneri:'partneri', komentari:'komentari', poruke:'poruke' };
function rerender(){
  REPS = repCounts();
  if(RENDERERS[CURRENT_SCREEN]) RENDERERS[CURRENT_SCREEN]();
  updateBadge();
}
function pokaziLoader(){ var l=$('#loader'); if(l) l.style.display='block'; }
function sakrijLoader(){ var l=$('#loader'); if(l) l.style.display='none'; }
var TOAST_T = null;
function toast(msg){
  var t = $('#toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}
/* zaštita od dvostrukog tapa na "Spremi" — vrijedi za sve forme */
document.addEventListener('submit', function(ev){
  var b = ev.target.querySelector('button[type="submit"]');
  if(b && !b.disabled){
    b.disabled = true; b.dataset.txt = b.textContent; b.textContent = 'Sprema se…';
    setTimeout(function(){ b.disabled = false; b.textContent = b.dataset.txt || 'Spremi'; }, 1600);
  }
}, true);
function jeTempId(id){ return REMOTE && /^(kv|pr|d|pt)\d+$/.test(String(id)); }
async function apiInsert(table, row, localObj){
  if(!REMOTE){ save(); toast('Spremljeno ✓'); return localObj; }
  PENDING_OPS++;
  try{
    var res = await sb.from(table).insert(row).select().single();
    if(res.error) throw res.error;
    if(localObj && res.data && res.data.id && localObj.id !== res.data.id){
      localObj.id = res.data.id;  /* pravi ID iz baze */
      rerender();                 /* osvježi onclick atribute na novi ID */
    }
    toast('Spremljeno ✓');
    return res.data;
  }catch(err){
    if(localObj){
      var arr = DATA[TABLE2KEY[table]] || [];
      var idx = arr.indexOf(localObj);
      if(idx > -1) arr.splice(idx, 1);  /* rollback optimističkog unosa */
    }
    alert('Spremanje NIJE uspjelo — zapis nije u bazi. Provjeri mrežu i pokušaj ponovno.\n('+((err&&err.message)||err)+')');
    try{ await load(); }catch(e2){}
    rerender();
    return null;
  }finally{ PENDING_OPS--; }
}
async function apiUpdate(table, id, patch){
  if(!REMOTE){ save(); toast('Spremljeno ✓'); return; }
  PENDING_OPS++;
  try{
    var res = await sb.from(table).update(patch).eq('id', id);
    if(res.error) throw res.error;
    toast('Spremljeno ✓');
  }catch(err){
    alert('Spremanje NIJE uspjelo — promjena nije u bazi.\n('+((err&&err.message)||err)+')');
    try{ await load(); }catch(e2){}  /* vrati se na stanje iz baze */
    rerender();
  }finally{ PENDING_OPS--; }
}
async function uploadFoto(dataUrl){
  if(!REMOTE || !dataUrl) return dataUrl;
  try{
    var blob = await (await fetch(dataUrl)).blob();
    var path = 'kv-' + Date.now() + '.jpg';
    var up = await sb.storage.from('fotke-kvarova').upload(path, blob, {contentType:'image/jpeg'});
    if(up.error) return dataUrl;  /* fallback: base64 ostaje u zapisu */
    return sb.storage.from('fotke-kvarova').getPublicUrl(path).data.publicUrl;
  }catch(e){ return dataUrl; }
}

function renderPregled(){
  var KV = samoKvarovi();  /* bez storniranih i bez zadataka — financije i brojke */
  var mm = todayISO().slice(0,7);
  var mk = KV.filter(function(k){ return k.date.slice(0,7)===mm; });
  var cost = 0, hrs = 0;
  mk.forEach(function(k){ cost += kvarCost(k); hrs += k.sati; });
  var open = KV.filter(function(k){ return k.status==='otvoren'; });
  var low  = DATA.dijelovi.filter(function(p){ return p.stanje < p.min; });
  var late = DATA.preventiva.filter(function(p){ return p.next < todayISO(); });
  var last3 = aktivni().slice().sort(byDateDesc).slice(0,3);

  /* usporedba s prošlim mjesecom */
  var now = new Date();
  var pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
  var pmKey = pm.getFullYear()+'-'+pad2(pm.getMonth()+1);
  var prevCost = 0;
  KV.forEach(function(k){ if(k.date.slice(0,7)===pmKey) prevCost += kvarCost(k); });
  var trend = '';
  if(prevCost > 0){
    var pct = Math.round((cost - prevCost) / prevCost * 100);
    trend = '<span class="trend '+(pct>=0?'up':'down')+'">'+(pct>=0?'▲ +':'▼ ')+Math.abs(pct)+'% vs '+esc(MJESECI[pm.getMonth()])+'</span>';
  }

  /* najskuplji strojevi u zadnja 3 mjeseca */
  var t90 = isoShift(-92), costBy = {};
  KV.forEach(function(k){ if(k.date >= t90 && k.m) costBy[k.m] = (costBy[k.m]||0) + kvarCost(k); });
  var top = Object.keys(costBy).map(function(id){ return {id:id, c:costBy[id]}; })
    .sort(function(a,b){ return b.c - a.c; }).slice(0,3);
  var maxC = top.length ? top[0].c : 1;
  var topHtml = top.map(function(t){
    var tm = machineById(t.id) || {name:'—'};
    return '<div class="bar-row" onclick="app.openStroj(\''+t.id+'\')">'+
      '<div class="bar-name">'+esc(tm.name)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(t.c/maxC*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(t.c)+'</div></div>';
  }).join('');

  /* za obaviti — kasne i sljedećih 7 dana */
  var t7 = isoShift(7);
  var dueAll = DATA.preventiva.filter(function(p){ return p.next <= t7; })
    .sort(function(a,b){ return a.next < b.next ? -1 : 1; });
  var due = dueAll.slice(0, 5);
  var dueHtml = due.length ? due.map(function(p){
    var pm2 = machineById(p.m) || {name:'—'};
    var isLate = p.next < todayISO();
    return '<div class="row click" onclick="app.openStroj(\''+p.m+'\')">'+
      '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(p.opis)+'</div>'+
      '<div class="row-sub">'+esc(pm2.name)+' &middot; '+fmtDate(p.next)+
        ((p.izv && p.izv!=='interno') ? ' &middot; '+esc(p.izv) : '')+'</div></div>'+
      '<div class="row-right">'+(isLate?'<span class="chip upoz">Kasni</span>':'')+
      '<button class="okbtn role-write" title="Označi obavljeno" onclick="event.stopPropagation();app.obaviPreventivu(\''+p.id+'\')">✓</button></div></div>';
  }).join('') : '<div class="empty">Sve preventive su u roku.</div>';
  if(dueAll.length > 5){
    dueHtml += '<div class="row click" onclick="app.go(\'strojevi\')">'+
      '<div class="row-sub">… još '+(dueAll.length-5)+' stavki u planu — otvori Strojevi</div></div>';
  }

  /* trend troška po mjesecima (zadnja 3) */
  var mjeseci3 = [2,1,0].map(function(off){
    var d0 = new Date(); var md = new Date(d0.getFullYear(), d0.getMonth()-off, 1);
    var key = md.getFullYear()+'-'+pad2(md.getMonth()+1);
    var c = 0;
    KV.forEach(function(k){ if(k.date.slice(0,7)===key) c += kvarCost(k); });
    return { label: MJESECI[md.getMonth()], c: c };
  });
  var maxM = Math.max.apply(null, mjeseci3.map(function(x){ return x.c; }).concat([1]));
  var trendHtml = mjeseci3.map(function(x){
    return '<div class="bar-row" style="cursor:default">'+
      '<div class="bar-name">'+esc(x.label)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(x.c/maxM*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(x.c)+'</div></div>';
  }).join('');

  /* majstor ne vidi financije — njegov pregled počinje zadacima */

    ? '<div class="big-card" onclick="app.go(\'kvarovi\')">'+
        '<div class="big-label">Trošak zastoja ovaj mjesec</div>'+
        '<div class="big-num">'+EUR(cost)+trend+'</div>'+
        '<div class="big-sub">'+esc(monthLabel())+' &middot; '+mk.length+' zastoja &middot; ukupno '+H(hrs)+'</div>'+
      '</div>'
    : '<div class="big-card" onclick="app.go(\'kvarovi\')">'+
        '<div class="big-label">Zastoji ovaj mjesec</div>'+
        '<div class="big-num">'+mk.length+'</div>'+
        '<div class="big-sub">'+esc(monthLabel())+' &middot; ukupno '+H(hrs)+' zastoja</div>'+
      '</div>';
  $('#screen-pregled').innerHTML =
    bigCard+
    '<div class="stat-grid">'+
      statCard(open.length, 'Otvoreni kvarovi',        open.length ? 'red'    : 'green', "app.goKvaroviOtvoreni()")+
      statCard(low.length,  'Dijelovi ispod minimuma', low.length  ? 'red'    : 'green', "app.go('dijelovi')")+
      statCard(late.length, 'Preventive kasne',        late.length ? 'yellow' : 'green', "app.skociNaObaveze()")+
    '</div>'+
    (vidiFinancije() ? '<button class="btn sec sm block" style="margin-top:10px" onclick="app.go(\'analitika\')">📊 Analitika i izvoz</button>' : '')+
    (function(){
      /* majstoru odmah pokaži njegove zadatke na vrhu */
      var moji = aktivni().filter(function(k){ return k.status==='otvoren' && k.dodijeljen===SESSION.ime; });
      return moji.length
        ? '<h2>Moji zadaci ('+moji.length+')</h2><div class="card">'+moji.map(function(k){ return kvarItem(k,true); }).join('')+'</div>'
        : '';
    })()+
    '<h2 id="za-obaviti">Za obaviti — kasne i sljedećih 7 dana</h2>'+
    '<div class="card">'+dueHtml+'</div>'+
    '<button class="btn sec sm block" style="margin-top:8px" onclick="app.go(\'raspored\')">📅 Cijeli raspored preventive</button>'+
    (vidiFinancije()
      ? '<h2>Najskuplji strojevi — zadnja 3 mj.</h2>'+
        '<div class="card">'+topHtml+'</div>'+
        '<h2>Trošak zastoja po mjesecima</h2>'+
        '<div class="card">'+trendHtml+'</div>'
      : '')+
    '<h2>Zadnji događaji</h2>'+

  var prevHtml = ps.length ? ps.map(function(p){
    var late = p.next < todayISO();

      '<div class="row-right">'+(late ? '<span class="chip upoz">Kasni</span>' : '')+
      '<button class="okbtn role-write" title="Označi obavljeno" onclick="app.obaviPreventivu(\''+p.id+'\')">✓</button></div></div>';
  }).join('') : '<div class="empty">Nema planiranih stavki.</div>';

  var kvarHtml = ks.length ? ks.map(function(k){ return kvarItem(k,false); }).join('')
                           : '<div class="empty">Nema zabilježenih kvarova.</div>';

  $('#screen-stroj').innerHTML =
    '<button class="back" onclick="app.go(\'strojevi\')">‹ Strojevi</button>'+
    '<div class="card"><div class="detail-head"><div>'+
      '<div class="detail-name">'+esc(m.name)+'</div>'+
      '<div class="detail-sub">'+esc(m.program)+
      (vidiFinancije() ? ' &middot; trošak zastoja '+m.rate+' €/h &middot; ukupno zadnja 3 mj.: <b>'+EUR(ukupno)+'</b>' : '')+
      (mttr ? ' &middot; prosj. trajanje popravka: <b>'+H(mttr)+'</b>' : '')+'</div>'+
      '<div style="margin-top:7px"><button class="btn-mini role-voditelj" onclick="app.urediStroj(\''+m.id+'\')">Uredi stroj</button></div></div>'+
      statusChip(machineStatus(m.id))+'</div></div>'+
    '<h2>Plan preventive</h2><div class="card">'+prevHtml+'</div>'+
    '<button class="btn sec sm block role-write" style="margin-top:8px" onclick="app.novaPreventiva(\''+m.id+'\')">+ Dodaj stavku preventive</button>'+
    '<h2>Bilješke o stroju</h2><div class="card"><div style="padding:11px 13px">'+
      (m.bilj ? '<div style="font-size:13.5px;white-space:pre-wrap">'+esc(m.bilj)+'</div>'
              : '<div class="row-sub">Nema bilješki (manual, serijski broj, napomene o servisu…)</div>')+

    '</div></div>'+
    '<h2>Povijest kvarova ('+ks.length+')</h2><div class="card">'+kvarHtml+'</div>';

function kvarItem(k, showMachine){
  var zadatak = (k.tip||'kvar') === 'zadatak';
  var m = machineById(k.m) || {id:'', name: zadatak ? 'Opći zadatak' : 'Nepoznat stroj'};
  var chip;
  if(k.status==='otkazan') chip = '<span class="chip rijesen">Otkazan</span>';
  else if(k.status==='otvoren') chip = k.upoz ? '<span class="chip upoz">Upozorenje</span>' : '<span class="chip kvar">Otvoren</span>';
  else chip = '<span class="chip rijesen">Riješen</span>';
  var meta;
  if(zadatak){
    meta = k.rok ? ('Rok: '+(k.rok < todayISO() && k.status==='otvoren' ? '<b style="color:var(--red)">'+fmtDate(k.rok)+'</b>' : fmtDate(k.rok))) : 'Bez roka';
  } else {
    meta = 'Zastoj '+H(k.sati)+(vidiFinancije() ? ' &middot; <b>'+EUR(kvarCost(k))+'</b>' : '');
    if(k.kategorija && k.kategorija!=='Ostalo') meta += ' &middot; '+esc(k.kategorija);
  }
  if(k.smjena && !zadatak) meta += ' &middot; '+esc(k.smjena);
  if(k.status==='otvoren' && k.dodijeljen) meta += ' &middot; Dodijeljeno: <b>'+esc(k.dodijeljen)+'</b>';
  if(k.tko) meta += ' &middot; Riješio: '+esc(k.tko);
  if(k.sudjelovali) meta += ' &middot; Sudjelovali: '+esc(k.sudjelovali);
  if(k.zam) meta += ' &middot; Zamijenjeno: '+esc(k.zam);
  if(k.status==='otkazan' && k.storno_razlog) meta += ' &middot; Storno: '+esc(k.storno_razlog);
  var brKom = (DATA.komentari||[]).filter(function(c){ return c.kvar_id===k.id; }).length;
  var pChip = '';
  if(zadatak) pChip += '<span class="chip" style="background:var(--accent-soft);color:var(--accent);border:1px solid #d5d2ef">Zadatak</span> ';
  if(k.status==='otvoren'){
    if(k.prioritet==='hitno') pChip += '<span class="chip kvar">HITNO</span> ';
    else if(k.prioritet==='visok') pChip += '<span class="chip upoz">Visok</span> ';
    if(k.ceka_dio) pChip += '<span class="chip upoz">Čeka dio</span> ';
  }
  var sig = zadatak ? null : kvarSig(k);
  var rep = (sig && REPS[sig] >= 2) ? ' <span class="rep">'+REPS[sig]+'× u 3 mj.</span>' : '';
  /* kompaktna kartica — klik otvara fokusirani prozor kvara */
  var ind = [];
  if(brKom) ind.push('💬 '+brKom);
  if(k.foto) ind.push('📷');
  return '<div class="kvar-item click"'+(k.status==='otkazan'?' style="opacity:.55"':'')+
    ' onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="kvar-top"><span>'+(showMachine?'<b style="color:var(--text)">'+esc(m.name)+'</b> &middot; ':'')+fmtDate(k.date)+
      (ind.length ? ' &middot; '+ind.join(' ') : '')+'</span>'+
    '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'+pChip+chip+'</span></div>'+
    '<div class="kvar-opis">'+esc(k.opis)+rep+'</div>'+
    '<div class="kvar-meta">'+meta+'</div></div>';
}

var FILTER = { stroj:'svi', status:'svi', majstor:'svi', od:'', do:'', q:'', vrsta:'svi' };
var PENDING_FOTO = '';
function renderKvarovi(){
  var list = DATA.kvarovi.filter(function(k){
    if(FILTER.status==='svi' && k.status==='otkazan') return false;  /* otkazane samo na izričit zahtjev */
    if(FILTER.stroj!=='svi' && k.m!==FILTER.stroj) return false;
    if(FILTER.status!=='svi' && k.status!==FILTER.status) return false;
    if(FILTER.majstor==='nedodijeljeno'){ if(k.dodijeljen || k.status!=='otvoren') return false; }
    else if(FILTER.majstor!=='svi' && k.dodijeljen!==FILTER.majstor) return false;
    if(FILTER.vrsta!=='svi' && (k.tip||'kvar')!==FILTER.vrsta) return false;
    if(FILTER.od && k.date < FILTER.od) return false;
    if(FILTER.do && k.date > FILTER.do) return false;
    if(FILTER.q && (k.opis+' '+(k.zam||'')+' '+(k.kategorija||'')).toLowerCase().indexOf(FILTER.q.toLowerCase()) === -1) return false;
    return true;
  }).sort(function(a,b){
    /* otvoreni prije riješenih; među otvorenima HITNO → Visok → Normalno; pa najnoviji */
    var oa = a.status==='otvoren'?0:1, ob = b.status==='otvoren'?0:1;
    if(oa!==ob) return oa-ob;
    if(oa===0){
      var red = {hitno:0, visok:1, normalno:2};
      var pa = red[a.prioritet]!==undefined?red[a.prioritet]:2;
      var pb = red[b.prioritet]!==undefined?red[b.prioritet]:2;
      if(pa!==pb) return pa-pb;
    }
    return b.date===a.date ? 0 : (b.date>a.date?1:-1);
  });

  var strojOpts = '<option value="svi">Svi strojevi</option>'+DATA.machines.map(function(m){
    return '<option value="'+m.id+'"'+(FILTER.stroj===m.id?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join('');
  var statusOpts =
    '<option value="svi"'+(FILTER.status==='svi'?' selected':'')+'>Svi statusi</option>'+
    '<option value="otvoren"'+(FILTER.status==='otvoren'?' selected':'')+'>Otvoreni</option>'+
    '<option value="rijesen"'+(FILTER.status==='rijesen'?' selected':'')+'>Riješeni</option>'+
    '<option value="otkazan"'+(FILTER.status==='otkazan'?' selected':'')+'>Otkazani (storno)</option>';
  var majstorOpts = '<option value="svi">Svi majstori</option>'+
    MAJSTORI.map(function(mj){
      return '<option'+(FILTER.majstor===mj?' selected':'')+'>'+mj+'</option>';
    }).join('')+
    '<option value="nedodijeljeno"'+(FILTER.majstor==='nedodijeljeno'?' selected':'')+'>Nedodijeljeni</option>';

  $('#screen-kvarovi').innerHTML =
    '<div class="role-write" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
      '<button class="btn primary" onclick="app.brzaPrijava()">⚡ Brza prijava</button>'+
      '<button class="btn sec" onclick="app.noviKvar()">+ Detaljna</button>'+
    '</div>'+
    '<div class="filters">'+
      '<select onchange="app.setFilter(\'stroj\',this.value)">'+strojOpts+'</select>'+
      '<select onchange="app.setFilter(\'status\',this.value)">'+statusOpts+'</select>'+
      '<select onchange="app.setFilter(\'majstor\',this.value)">'+majstorOpts+'</select>'+
      '<select onchange="app.setFilter(\'vrsta\',this.value)" style="grid-column:1/-1">'+
        '<option value="svi"'+(FILTER.vrsta==='svi'?' selected':'')+'>Kvarovi i zadaci</option>'+
        '<option value="kvar"'+(FILTER.vrsta==='kvar'?' selected':'')+'>Samo kvarovi</option>'+
        '<option value="zadatak"'+(FILTER.vrsta==='zadatak'?' selected':'')+'>Samo zadaci</option></select>'+
      '<input type="search" value="'+esc(FILTER.q)+'" placeholder="Pretraži opis…" oninput="app.setFilterTiho(\'q\',this.value)" style="grid-column:1/-1">'+
      '<input type="date" value="'+FILTER.od+'" onchange="app.setFilter(\'od\',this.value)" title="Od datuma">'+
      '<input type="date" value="'+FILTER.do+'" onchange="app.setFilter(\'do\',this.value)" title="Do datuma">'+
    '</div>'+
    ((FILTER.q||FILTER.od||FILTER.do||FILTER.stroj!=='svi'||FILTER.status!=='svi'||FILTER.majstor!=='svi')
      ? '<button class="btn-mini" style="margin-bottom:10px" onclick="app.resetFiltere()">✕ Poništi filtere ('+list.length+' rezultata)</button>' : '')+
    '<div class="card">'+
      (list.length ? list.map(function(k){ return kvarItem(k,true); }).join('')
                   : '<div class="empty">Nema kvarova za odabrani filter.</div>')+
    '</div>';
}

var PART_Q = '';
function partRow(p){

    ((low || p.naruceno)
      ? '<button class="btn-mini role-write" onclick="app.toggleNaruceno(\''+p.id+'\')">'+
        (p.naruceno?'Poništi narudžbu':'Označi naručeno')+'</button> ' : '')+

  return '<div class="row"><div class="grow">'+

    '<div class="qty">'+
      '<button class="qbtn role-write" onclick="app.qty(\''+p.id+'\',-1)">−</button>'+
      '<div class="qval'+(low?' low':'')+'">'+p.stanje+'<span>min '+p.min+'</span></div>'+
      '<button class="qbtn role-write" onclick="app.qty(\''+p.id+'\',1)">+</button>'+
    '</div></div>';
}
function partsListHtml(){
  var q = PART_Q.trim().toLowerCase();
  var list = DATA.dijelovi.slice().sort(function(a,b){
    var la = a.stanje < a.min ? 0 : 1, lb = b.stanje < b.min ? 0 : 1;
    if(la!==lb) return la-lb;
    /* među kritičnima: najbliže nuli prvo (omjer stanje/minimum) */
    var ra = a.min ? a.stanje/a.min : 99, rb = b.min ? b.stanje/b.min : 99;
    if(ra!==rb) return ra-rb;
    return a.naziv.localeCompare(b.naziv,'hr');
  });
  if(q){
    list = list.filter(function(p){
      return (p.naziv+' '+p.stroj+' '+p.dob+' '+(p.kategorija||'')).toLowerCase().indexOf(q) > -1;
    });
    return '<div class="card">'+(list.length ? list.map(partRow).join('')
      : '<div class="empty">Nema dijelova za traženi pojam.</div>')+'</div>';
  }
  /* bez pretrage: kritično na vrh, ostalo grupirano po kategorijama */
  var krit = list.filter(function(p){ return p.stanje < p.min; });
  var ost  = list.filter(function(p){ return p.stanje >= p.min; });
  var html = '';
  if(krit.length){
    html += '<h2 style="color:var(--red)">⚠ Ispod minimuma — naručiti</h2>'+
            '<div class="card" style="border-color:var(--red-border)">'+krit.map(partRow).join('')+'</div>';
  }
  var kats = {};
  ost.forEach(function(p){ var k = p.kategorija || 'Ostalo'; (kats[k] = kats[k] || []).push(p); });
  Object.keys(kats).sort(function(a,b){ return a.localeCompare(b,'hr'); }).forEach(function(k){
    html += '<h2>'+esc(k)+'</h2><div class="card">'+kats[k].map(partRow).join('')+'</div>';
  });
  return html || '<div class="card"><div class="empty">Nema dijelova.</div></div>';
}
function renderDijelovi(){
  var vrijednost = 0, ispodMin = 0;
  DATA.dijelovi.forEach(function(p){ vrijednost += p.stanje * p.cijena; if(p.stanje < p.min) ispodMin++; });
  $('#screen-dijelovi').innerHTML =

    '<div class="row-sub" style="margin-top:8px">Vrijednost skladišta: <b style="color:var(--text)">'+EUR(vrijednost)+'</b>'+
      ' &middot; ispod minimuma: <b style="color:'+(ispodMin?'var(--red)':'var(--green)')+'">'+ispodMin+'</b></div>'+

function anaPodaci(){
  var KV = anaKvarovi();
  var poStroju = {};
  KV.forEach(function(k){
    var key = k.m || '—';
    var s = poStroju[key] = poStroju[key] || { n:0, sati:0, cost:0, rijeseni:0, satiR:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
    if(k.status==='rijesen'){ s.rijeseni++; s.satiR += k.sati; }
  });
  var poSmjeni = {};
  KV.forEach(function(k){
    var key = k.smjena || '—';
    var s = poSmjeni[key] = poSmjeni[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var poKat = {};
  KV.forEach(function(k){
    var key = k.kategorija || 'Ostalo';
    var s = poKat[key] = poKat[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var uzroci = {};
  KV.forEach(function(k){
    var sig = kvarSig(k); if(!sig) return;
    var u = uzroci[sig] = uzroci[sig] || { n:0, sati:0, cost:0, primjer:k };
    u.n++; u.sati += k.sati; u.cost += kvarCost(k);
  });
  return { KV:KV, poStroju:poStroju, poSmjeni:poSmjeni, poKat:poKat, uzroci:uzroci };
}
function renderAnalitika(){

  }).sort(function(a,b){ return b.s.cost - a.s.cost; }).map(function(x){

  }).sort(function(a,b){ return b.s.cost - a.s.cost; }).map(function(x){

      '<div class="stat"><span class="stat-num" style="font-size:19px">'+H(uk.sati)+'</span><span class="stat-label">zastoja</span></div>'+
      '<div class="stat"><span class="stat-num" style="font-size:17px">'+EUR(uk.cost)+'</span><span class="stat-label">trošak</span></div>'+
      '<div class="stat"><span class="stat-num" style="font-size:19px">'+(mttr?H(mttr):'—')+'</span><span class="stat-label">MTTR</span></div>'+
    '</div>'+
    '<h2>Po stroju</h2><div class="card" style="padding:4px 0">'+

var RASP_GOD = null, RASP_MJ = null, RASP_DAN = null;
function prevZaDan(iso){
  return DATA.preventiva.filter(function(p){ return p.next === iso; });
}
function prevRedak(p){
  var m = machineById(p.m) || {name:'—'};
  var kasni = p.next < todayISO();
  return '<div class="row click" onclick="app.openStroj(\''+p.m+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:13.5px">'+esc(p.opis)+'</div>'+
    '<div class="row-sub">'+esc(m.name)+' &middot; '+fmtDate(p.next)+
      ((p.izv && p.izv!=='interno') ? ' &middot; <b>'+esc(p.izv)+'</b>' : '')+
      (kasni ? ' &middot; <b style="color:var(--red)">kasni</b>' : '')+'</div></div>'+
    '<button class="okbtn role-write" onclick="event.stopPropagation();app.obaviPreventivu(\''+p.id+'\')">✓</button>'+
  '</div>';
}
function renderRaspored(){
  var danas = new Date();
  if(RASP_GOD===null){ RASP_GOD = danas.getFullYear(); RASP_MJ = danas.getMonth(); }
  var prvi = new Date(RASP_GOD, RASP_MJ, 1);
  var danaUMj = new Date(RASP_GOD, RASP_MJ+1, 0).getDate();
  var pomak = (prvi.getDay()+6)%7;  /* ponedjeljak prvi */
  var danasISO = todayISO();
  var celije = '';
  ['P','U','S','Č','P','S','N'].forEach(function(d){ celije += '<div class="cal-h">'+d+'</div>'; });
  for(var i=0;i<pomak;i++) celije += '<div class="cal-d prazan"></div>';
  for(var dan=1; dan<=danaUMj; dan++){
    var iso = RASP_GOD+'-'+pad2(RASP_MJ+1)+'-'+pad2(dan);
    var stavke = prevZaDan(iso);
    var tocke = stavke.slice(0,3).map(function(p){
      var boja = iso < danasISO ? 'var(--red)' : ((p.izv && p.izv!=='interno') ? 'var(--gold)' : 'var(--accent)');
      return '<span class="cal-t" style="background:'+boja+'"></span>';
    }).join('');
    celije += '<div class="cal-d'+(iso===danasISO?' danas':'')+(iso===RASP_DAN?' odabran':'')+
      (stavke.length?' ima':'')+'" onclick="app.rasporedDan(\''+iso+'\')">'+
      '<span>'+dan+'</span><div class="cal-tocke">'+tocke+'</div></div>';
  }
  var kasne = DATA.preventiva.filter(function(p){ return p.next < danasISO; })
    .sort(function(a,b){ return a.next < b.next ? -1 : 1; });
  var odabranog = RASP_DAN ? prevZaDan(RASP_DAN) : [];
  var sljedecih = DATA.preventiva.filter(function(p){ return p.next >= danasISO; })
    .sort(function(a,b){ return a.next < b.next ? -1 : 1; }).slice(0,8);
  $('#screen-raspored').innerHTML =
    '<button class="back" onclick="app.go(\'pregled\')">‹ Pregled</button>'+
    '<div class="cal-nav">'+
      '<button class="qbtn" onclick="app.rasporedMjesec(-1)">‹</button>'+
      '<div class="cal-naslov">'+MJESECI[RASP_MJ]+' '+RASP_GOD+'.</div>'+
      '<button class="qbtn" onclick="app.rasporedMjesec(1)">›</button>'+
    '</div>'+
    '<div class="card" style="padding:8px"><div class="cal">'+celije+'</div>'+
      '<div class="row-sub" style="padding:6px 4px 2px;text-align:center">'+
      '<span class="cal-t" style="background:var(--accent);vertical-align:0"></span> interno &nbsp; '+
      '<span class="cal-t" style="background:var(--gold);vertical-align:0"></span> vanjski servis &nbsp; '+
      '<span class="cal-t" style="background:var(--red);vertical-align:0"></span> kasni</div></div>'+
    (RASP_DAN && odabranog.length
      ? '<h2>'+fmtDate(RASP_DAN)+' ('+odabranog.length+')</h2><div class="card">'+odabranog.map(prevRedak).join('')+'</div>' : '')+
    (kasne.length
      ? '<h2 style="color:var(--red)">⚠ Kasni ('+kasne.length+')</h2><div class="card">'+kasne.map(prevRedak).join('')+'</div>' : '')+
    '<h2>Sljedeće na redu</h2><div class="card">'+
      (sljedecih.length ? sljedecih.map(prevRedak).join('') : '<div class="empty">Nema planiranih stavki.</div>')+'</div>';
}

function fmtDateTime(ts){
  var s = String(ts||'');
  var d = s.slice(0,10), t = s.length > 11 ? s.slice(11,16) : '';
  return (d ? fmtDate(d) : '') + (t ? ' ' + t : '');
}
function brojNeprocitanih(){
  var seen = ''; try{ seen = localStorage.getItem('porukeSeen') || ''; }catch(e){}
  return (DATA && DATA.poruke ? DATA.poruke : []).filter(function(p){ return String(p.created_at) > seen; }).length;
}
function oznaciProcitano(){
  var zadnja = (DATA.poruke||[]).reduce(function(m,p){ return String(p.created_at) > m ? String(p.created_at) : m; }, '');
  try{ if(zadnja) localStorage.setItem('porukeSeen', zadnja); }catch(e){}
}
function renderPoruke(){
  var lista = (DATA.poruke||[]).slice().sort(function(a,b){
    return String(a.created_at).localeCompare(String(b.created_at));

  }).join('') : '<div class="empty">Još nema poruka.</div>';
  $('#screen-poruke').innerHTML =
    '<h2>Zajedničke poruke — vide ih svi</h2>'+
    '<div class="card" style="padding:5px 0">'+html+'</div>'+
    '<form class="msg-form" onsubmit="app.posaljiPoruku(event)">'+
      '<textarea name="tekst" rows="2" required placeholder="Poruka svima — primopredaja, obavijest, upozorenje…"></textarea>'+
      '<button class="btn primary block" type="submit" style="margin-top:8px">Pošalji</button>'+
    '</form>';
  oznaciProcitano();
  window.scrollTo(0, document.body.scrollHeight);

function showScreen(name){
  CURRENT_SCREEN = name;
  ['pregled','strojevi','kvarovi','dijelovi','kontakti','poruke','analitika','raspored','stroj'].forEach(function(s){
    $('#screen-'+s).classList.toggle('hidden', s!==name);
  });
  REPS = repCounts();
  RENDERERS[name]();
  var tabName = name==='stroj' ? 'strojevi' : (name==='analitika'||name==='raspored' ? 'pregled' : name);
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-tab')===tabName);
  });
  updateBadge();
  window.scrollTo(0,0);
}
function updateBadge(){
  /* majstoru badge broji NJEGOVE dodijeljene kvarove, voditelju/direktoru sve otvorene */
  var n = SESSION.role==='majstor'
    ? DATA.kvarovi.filter(function(k){ return k.status==='otvoren' && k.dodijeljen===SESSION.ime; }).length
    : DATA.kvarovi.filter(function(k){ return k.status==='otvoren'; }).length;
  var b = $('#badge-kvarovi');
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n;
  /* nepročitane zajedničke poruke */
  var bp = $('#badge-poruke');
  if(bp){
    var np = CURRENT_SCREEN === 'poruke' ? 0 : brojNeprocitanih();
    bp.style.display = np ? 'flex' : 'none';
    bp.textContent = np;
  }
}

  izvozCSV: function(dani){

      var m = machineById(k.m) || {name:''};

      return [k.date, m.name, k.tip||'kvar', k.kategorija||'', k.opis, k.status, k.prioritet||'', k.smjena||'', k.sati,

  saveRijesen: async function(e, kId){
    e.preventDefault();
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var f = new FormData(e.target);
    k.sati = parseFloat(f.get('sati'))||k.sati;
    k.status = 'rijesen'; k.upoz = false; k.ceka_dio = false;
    k.tko = f.get('tko');
    k.sudjelovali = String(f.get('sudjelovali')||'').trim() || null;
    k.zam = String(f.get('zam')||'').trim() || null;
    /* razduživanje skladišta: utrošeni dio smanjuje stanje i upisuje se u "Zamijenjeno" */
    var dioId = f.get('dio');
    var kol = Math.max(1, parseInt(f.get('kol'),10)||1);
    if(dioId){
      var p = DATA.dijelovi.filter(function(x){ return x.id===dioId; })[0];
      if(p){
        var prije = p.stanje;
        p.stanje = Math.max(0, p.stanje - kol);
        if(!k.zam) k.zam = p.naziv + (kol>1 ? ' ×'+kol : '');
        else k.zam += ' + ' + p.naziv + (kol>1 ? ' ×'+kol : '');
        if(prije >= p.min && p.stanje < p.min)
          sysPoruka('📦 Dio ispod minimuma: '+p.naziv+' (stanje '+p.stanje+', min '+p.min+') — naručiti!');
        await apiUpdate('dijelovi', p.id, { stanje:p.stanje });
      }
    }
    app.closeModal();
    showScreen($('#screen-stroj').classList.contains('hidden') ? 'kvarovi' : 'stroj');
    var rm = machineById(k.m);
    sysPoruka('✅ '+(k.tip==='zadatak'?'Zadatak obavljen':'Kvar riješen')+': '+
      (rm ? rm.name+' — ' : '')+k.opis+' ('+esc(k.tko||'')+')');
    await apiUpdate('kvarovi', k.id, { sati:k.sati, status:k.status, upoz:false, ceka_dio:false,
      tko:k.tko, zam:k.zam, sudjelovali:k.sudjelovali, closed_at:new Date().toISOString() });

  fotoOdabrana: function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_FOTO = c.toDataURL('image/jpeg', 0.72);
        var prev = document.getElementById('foto-prev');
        if(prev){ prev.src = PENDING_FOTO; prev.style.display = 'block'; }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

        '<button class="btn primary block" type="submit">Spremi bilješke</button>'+
      '</form></div></div>';
  },
  saveBiljeske: async function(e, mId){
    e.preventDefault();
    var f = new FormData(e.target);
    var m = machineById(mId);
    if(!m) return;
    m.bilj = String(f.get('bilj')||'').trim();
    app.closeModal(); showScreen('stroj');
    await apiUpdate('machines', mId, { bilj:m.bilj });
  },

  audit: function(dani){
    dani = parseInt(dani,10) || 30;
    var t30 = isoShift(-dani);
    var zahvati = DATA.kvarovi.filter(function(k){ return k.status==='rijesen' && k.date>=t30; }).sort(byDateDesc);
    var otvoreni = DATA.kvarovi.filter(function(k){ return k.status==='otvoren'; });

    var prevHtml = DATA.machines.map(function(m){
      var ps = DATA.preventiva.filter(function(p){ return p.m===m.id; });
      if(!ps.length) return '';
      return '<div class="a-m">'+esc(m.name)+' <span class="a-sub">('+esc(m.program)+')</span></div>'+
        ps.map(function(p){
          var late = p.next < todayISO();
          return '<div class="a-item">'+esc(p.opis)+' — '+esc(p.interval)+
            '<div class="a-sub">sljedeće: '+fmtDate(p.next)+' &middot; izvođač: '+esc(p.izv||'interno')+
            (p.zadnje ? ' &middot; zadnje obavljeno: '+fmtDate(p.zadnje)+(p.tkoZadnji?' ('+esc(p.tkoZadnji)+')':'') : '')+
            (late?' <span class="late">— KASNI</span>':'')+'</div></div>';
        }).join('');
    }).join('');

    var zahvatiHtml = zahvati.length ? zahvati.map(function(k){
      var m = machineById(k.m) || {name: (k.tip==='zadatak' ? 'Zadatak' : '—')};
      return '<div class="a-item"><b>'+fmtDate(k.date)+'</b> — '+esc(m.name)+': '+esc(k.opis)+
        '<div class="a-sub">zastoj '+H(k.sati)+' &middot; izvršio: '+esc(k.tko||'—')+
        (k.zam?' &middot; zamijenjeno: '+esc(k.zam):'')+'</div>'+
        '<div class="a-sub">otpuštanje linije: čišćenje i pregled na strana tijela — '+esc(k.tko||'—')+', '+fmtDate(k.date)+'</div></div>';
    }).join('') : '<div class="a-sub">Nema zahvata u zadnjih 30 dana.</div>';

    var mjernaHtml = MJERNA.map(function(u){
      return '<div class="a-item">'+esc(u.naziv)+'<div class="a-sub">'+esc(u.rezim)+'</div></div>';
    }).join('');

    var mazivaHtml = MAZIVA.map(function(z){
      return '<div class="a-item">'+esc(z.naziv)+' <span class="chip fg">food-grade &middot; '+esc(z.oznaka)+'</span>'+
        '<div class="a-sub">primjena: '+esc(z.primjena)+'</div></div>';
    }).join('');

    var otvHtml = otvoreni.length
      ? '<h4>7. Otvorene stavke</h4>'+otvoreni.map(function(k){
          var m = machineById(k.m) || {name: (k.tip==='zadatak' ? 'Zadatak' : '—')};
          return '<div class="a-item"><b>'+fmtDate(k.date)+'</b> — '+esc(m.name)+': '+esc(k.opis)+
            '<div class="a-sub">status: '+(k.upoz?'upozorenje':'otvoren kvar')+', u tijeku</div></div>';
        }).join('')
      : '';

    $('#modal-root').innerHTML =
      '<div class="overlay" onclick="if(event.target===this)app.closeModal()"><div class="modal audit">'+
      '<div class="modal-head"><h3>Izvještaj za audit (IFS)</h3>'+
        '<span style="display:flex;gap:8px;align-items:center">'+
        '<button class="btn sec sm" onclick="window.print()">📄 PDF</button>'+
        '<button class="x" onclick="app.closeModal()">✕</button></span></div>'+
      '<div class="print-head"><img src="'+document.querySelector('.hdr-logo').src+'" alt="Clarum">'+
        '<div><div class="ph-naslov">Izvještaj za audit (IFS)</div>'+
        '<div class="ph-sub">Clarum d.o.o. &middot; Sektor održavanja &middot; '+fmtDate(todayISO())+
        ' &middot; ref. IFS Food v8, t. 4.16 / 4.17 / 5.4</div></div></div>'+
      '<div class="a-meta">Generirano: '+fmtDate(todayISO())+' &middot; Clarum &middot; Sektor održavanja &middot; ref. IFS Food v8, t. 4.16 / 4.17 / 5.4</div>'+
      '<label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Razdoblje zahvata</label>'+
      '<select onchange="app.audit(this.value)" style="margin:4px 0 6px">'+
        '<option value="30"'+(dani===30?' selected':'')+'>Zadnjih 30 dana</option>'+
        '<option value="90"'+(dani===90?' selected':'')+'>Zadnjih 90 dana</option>'+
        '<option value="365"'+(dani===365?' selected':'')+'>Zadnjih 12 mjeseci</option>'+
      '</select>'+
      '<h4>1. Plan preventivnog održavanja po stroju</h4>'+prevHtml+
      '<h4>2. Zahvati u zadnjih '+dani+' dana (s otpuštanjem linije)</h4>'+zahvatiHtml+
      '<h4>3. Privremeni popravci</h4>'+
      '<div class="a-sub">Nema aktivnih privremenih popravaka. Privremeni popravak se označava, procjenjuje s aspekta sigurnosti hrane i dobiva rok trajne sanacije.</div>'+
      '<h4>4. Mjerna i kontrolna oprema</h4>'+mjernaHtml+
      '<h4>5. Korištena maziva</h4>'+mazivaHtml+
      '<div class="a-sub" style="margin-top:6px">Sva maziva u zoni proizvoda su prehrambene klase (NSF H1); skladište maziva odvojeno i označeno, primjena se bilježi po točki podmazivanja.</div>'+
      '<h4>6. Rashladni sustav (F-gas)</h4>'+
      '<div class="a-sub">Kontrola propuštanja i godišnji servis — MB Frigo (ugovor); punjenja rashladne tvari evidentiraju se po datumu, količini i razlogu.</div>'+
      otvHtml+
      '<button class="btn sec block" style="margin-top:18px" onclick="window.print()">Ispis / PDF</button>'+
      '<button class="btn primary block" style="margin-top:8px" onclick="app.closeModal()">Zatvori</button>'+
      '</div></div>';
  }
};

/* =====================  prijava — pomoćne  ===================== */
function renderLoginTiles(){
  var el = $('#user-tiles');
  if(el) el.innerHTML = KORISNICI.map(function(k){
    return '<div class="user-tile'+(LOGIN_SEL===k.naziv?' sel':'')+'" onclick="app.odaberiKorisnika(\''+esc(k.naziv)+'\')">'+esc(k.naziv)+'</div>';
  }).join('');
}
function korisnikEmail(naziv){
  var k = KORISNICI.filter(function(x){ return x.naziv===naziv; })[0];
  return k ? k.email : null;
}
async function postLogin(){
  var u = (await sb.auth.getUser()).data.user;
  if(!u) throw new Error('nema sesije');
  var prof = await sb.from('users').select('*').eq('id', u.id).single();
  if(prof.error || !prof.data){
    /* račun postoji u Auth, ali nema red u tablici users → nema uloge.
       Jasna poruka umjesto tihe readonly prijave. */
    try{ await sb.auth.signOut(); }catch(e){}
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Račun postoji, ali nema dodijeljenu ulogu (tablica users) — javi voditelju.';
    return;
  }
  SESSION.ime  = prof.data.ime;
  SESSION.role = prof.data.role;
  document.body.dataset.role = SESSION.role;
  $('#screen-login').classList.remove('show');
  await load();
  if(!initHash()) showScreen('pregled');
  dobrodoslica();
}
function dobrodoslica(){
  /* pri dolasku u smjenu: odmah reci što je bitno */
  var mojih = DATA.kvarovi.filter(function(k){ return k.status==='otvoren' && k.dodijeljen===SESSION.ime; }).length;
  var nep = brojNeprocitanih();
  var dijelovi_min = DATA.dijelovi.filter(function(p){ return p.stanje < p.min && !p.naruceno; }).length;
  var dio = [];
  if(mojih) dio.push(mojih + (mojih===1?' tvoj zadatak':' tvoja zadatka/zadataka'));
  if(nep) dio.push(nep + ' nepročitanih poruka');
  if(SESSION.role!=='majstor' && dijelovi_min) dio.push(dijelovi_min + ' dijela za naručiti');
  if(dio.length) toast('👋 ' + esc(SESSION.ime) + ': ' + dio.join(' · '));
}
function majstorOpts(sel){
  var imena = MAJSTORI.slice();
  if(SESSION.ime && SESSION.ime !== 'Demo' && imena.indexOf(SESSION.ime) === -1) imena.push(SESSION.ime);
  return imena.map(function(t){
    return '<option'+(sel===t?' selected':'')+'>'+esc(t)+'</option>';
  }).join('');
}
function vidiFinancije(){ return SESSION.role !== 'majstor'; }
var KAT_KVARA = ['Mehanički','Električni','Pneumatika i rashlada','Ostalo'];
var TIP_PARTNERA = ['Dobavljač','Servis','Proizvođač','Ostalo'];
function aktivni(){ return DATA.kvarovi.filter(function(k){ return k.status !== 'otkazan'; }); }
function samoKvarovi(){ return aktivni().filter(function(k){ return (k.tip||'kvar') === 'kvar'; }); }
function autoKat(opis){
  var o = String(opis||'').toLowerCase();
  if(/senzor|grija|fotosen|elektri/.test(o)) return 'Električni';
  if(/tlak|ventil|kompresor|rashlad|kondenzator|led/.test(o)) return 'Pneumatika i rashlada';
  if(/remen|ležaj|matric|brtv|nož|folij|traka|valj|dozator|reduktor/.test(o)) return 'Mehanički';
  return 'Ostalo';
}
function sysPoruka(tekst){
  /* automatski sistemski zapis u zajedničkom kanalu — živa knjiga smjene */
  var p = { id:'po'+Date.now(), tko:'Sustav', tekst:tekst, created_at:new Date().toISOString() };
  if(!DATA.poruke) DATA.poruke = [];
  DATA.poruke.push(p);
  if(REMOTE){ try{ sb.from('poruke').insert({ tko:'Sustav', tekst:tekst }).then(function(){}); }catch(e){} }
  else save();
  updateBadge();
}
function smjenaOpts(){
  var h = new Date().getHours();
  var def = (h >= 6 && h < 14) ? '1. smjena' : '2. smjena';
  return ['1. smjena','2. smjena'].map(function(s){
    return '<option'+(s===def?' selected':'')+'>'+s+'</option>';
  }).join('');
}
function initHash(){
  var h = /#stroj=([\w-]+)/.exec(location.hash || '');
  if(h && machineById(h[1])){ app.openStroj(h[1]); return true; }
  return false;
}

/* =====================  start  ===================== */
async function start(){
  $('#login-logo').src = document.querySelector('.hdr-logo').src;
  if(!REMOTE){
    /* DEMO NAČIN: lokalno, bez prijave, uloga voditelj */
    $('#demo-banner').style.display = '';
    document.body.dataset.role = 'voditelj';
    SESSION = { ime:'Voditelj', role:'voditelj' };
    localLoad();
    if(!initHash()) showScreen('pregled');
    return;
  }
  renderLoginTiles();
  try{
    var s = await sb.auth.getSession();
    if(s.data.session){ await postLogin(); }
    else { $('#screen-login').classList.add('show'); }
  }catch(ex){
    $('#screen-login').classList.add('show');
    $('#login-err').textContent = 'Greška u vezi s bazom — provjeri internet pa osvježi stranicu.';
  }
}
start();

/* osvježavanje za rad u 2 smjene (multi-user): polling dok je tab vidljiv */
setInterval(async function(){
  if(!REMOTE || document.visibilityState !== 'visible') return;
  if(!DATA || $('#screen-login').classList.contains('show')) return;
  if($('#modal-root').innerHTML) return;   /* ne diraj otvorenu formu */
  if(PENDING_OPS > 0) return;              /* ne gazi unos koji još putuje u bazu */
  try{
    await load(true);                      /* tiho — bez loadera */
    rerender();
  }catch(e){}
}, 30000);

/* realtime: nove poruke/kvarovi/komentari odmah stižu svima (multi-user) */
async function rtNovo(tip, pl){
  var row = (pl && pl['new']) ? pl['new'] : {};
  if(row.tko && row.tko === SESSION.ime) return;   /* moj vlastiti unos */
  if(tip==='poruke')    toast('💬 Nova poruka — ' + (row.tko||''));
  if(tip==='kvarovi')   toast('⚠ Novi kvar prijavljen');
  if(tip==='komentari') toast('💬 Novi komentar na kvaru');
  if(PENDING_OPS > 0 || $('#modal-root').innerHTML){ return; }
  try{ await load(true); rerender(); }catch(e){}
}
if(REMOTE){
  ['poruke','kvarovi','komentari'].forEach(function(t){
    sb.channel('rt-'+t)
      .on('postgres_changes', {event:'INSERT', schema:'public', table:t},
          function(pl){ rtNovo(t, pl); })
      .subscribe();
  });
}

/* PWA servisni radnik (samo preko http/https, ne za file://) */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
