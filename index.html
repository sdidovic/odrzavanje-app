/* ODLUKA 4 (3.9.2026., za pokazati): Kontakti su bili zaseban ekran (segment na vrhu

/* =====================  render: Analitika (voditelj/direktor)  ===================== */
var ANA_DANA = 90;
/* ═══ [23] RENDER: ANALITIKA — anaKvarovi, agregacije, KPI, tablice, renderAnalitika ═══ */
var ANA_MJESEC = null;   /* 'GGGG-MM' — odabrani kalendarski mjesec nadjačava ANA_DANA */
/* ODLUKA 11 (3.9.2026.): dan otkad se smjena upisuje uz kvar — prije toga stara evidencija
   nema smjenu pa bi tablica "Po smjeni" bila skoro sva "nije upisano". */
var SMJENA_OD = '2026-09-03';
function anaKvarovi(){
  if(ANA_MJESEC) return samoKvarovi().filter(function(k){ return k.date.slice(0,7) === ANA_MJESEC; });
  var od = ANA_DANA ? isoShift(-ANA_DANA) : '0000-00-00';
  return samoKvarovi().filter(function(k){ return k.date >= od; });
}
/* isto toliko dugo razdoblje prije ovoga (ili prethodni kalendarski mjesec) — za usporedbu */
function anaKvaroviPrethodno(){
  if(ANA_MJESEC){
    var p = ANA_MJESEC.split('-');
    var pm = new Date(parseInt(p[0],10), parseInt(p[1],10)-2, 1);
    var pmKey = pm.getFullYear()+'-'+pad2(pm.getMonth()+1);
    return samoKvarovi().filter(function(k){ return k.date.slice(0,7) === pmKey; });
  }
  if(!ANA_DANA) return null;
  var od = isoShift(-ANA_DANA*2), doo = isoShift(-ANA_DANA);
  return samoKvarovi().filter(function(k){ return k.date >= od && k.date < doo; });
}
/* AUDIT-FIX (§14.2 t.4): preventiva obavljena u istom razdoblju kao i kvarovi gore —
   isti filtar (mjesec ili "zadnjih N dana") nad datumom kad je STVARNO obavljena (zadnje). */
function anaPreventivaObavljena(){
  if(ANA_MJESEC) return DATA.preventiva.filter(function(p){ return p.zadnje && p.zadnje.slice(0,7) === ANA_MJESEC; });
  var od = ANA_DANA ? isoShift(-ANA_DANA) : '0000-00-00';
  return DATA.preventiva.filter(function(p){ return p.zadnje && p.zadnje >= od; });
}
function zbroji(lista){
  var s = { n:lista.length, sati:0, cost:0, mttr:0 };
  var r = 0, rs = 0;
  lista.forEach(function(k){
    s.sati += k.sati; s.cost += kvarCost(k);
    if(k.status==='rijesen'){ r++; rs += k.sati; }
  });
  s.mttr = r ? rs/r : 0;
  return s;
}
function deltaChip(sada, prije, manjeJeBolje){
  if(prije === 0 || prije == null) return '';
  var pct = Math.round((sada - prije) / prije * 100);
  if(pct === 0) return '<span class="delta jednako">bez promjene</span>';
  var dobro = manjeJeBolje ? pct < 0 : pct > 0;
  return '<span class="delta '+(dobro?'dobro':'lose')+'">'+(pct>0?'▲ +':'▼ ')+Math.abs(pct)+'%</span>';
}
function tbl(headeri, redovi, ukupno, cls){
  /* E2-8: omotano u .tbl-scroll (sjena na desnom rubu = naznaka da se tablica može
     pomicati; vidi CSS). `cls` je opcionalna dodatna klasa na <table> — koristi
     je "Po stroju" (tbl-stroj) za responzivno skrivanje MTTR stupca ispod 430px. */
  return '<div class="tbl-scroll"><table class="tbl'+(cls?' '+cls:'')+'"><thead><tr>'+
    headeri.map(function(h,i){ return '<th'+(i?' class="num"':'')+'>'+h+'</th>'; }).join('')+
    '</tr></thead><tbody>'+
    redovi.map(function(r){ return '<tr>'+r.map(function(c,i){ return '<td'+(i?' class="num"':'')+'>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+
    (ukupno ? '<tr class="tbl-ukupno">'+ukupno.map(function(c,i){ return '<td'+(i?' class="num"':'')+'><b>'+c+'</b></td>'; }).join('')+'</tr>' : '')+
    '</tbody></table></div>';
}
function anaPeriodTekst(){
  if(ANA_MJESEC){ var p = ANA_MJESEC.split('-'); var im = MJESECI[parseInt(p[1],10)-1]; return im ? im+' '+p[0]+'.' : ANA_MJESEC; }   /* AUDIT-FIX: neispravan mjesec vise ne ispisuje "undefined" */
  return ANA_DANA ? ('zadnjih '+ANA_DANA+' dana') : 'cijela evidencija';
}
/* ODLUKA 11 (3.9.2026.): "Po smjeni" ima smisla tek kad je smjena stvarno upisana kod
   većine kvarova u razdoblju — inače je tablica uglavnom "nije upisano" i samo zbunjuje.
   Prag je namjerno visok (80%) jer stara evidencija (prije SMJENA_OD) nikad nema smjenu. */
function smjenaZrelaZaTablicu(KV){
  if(!KV.length) return false;
  var saSmjenom = KV.filter(function(k){ return !!k.smjena; }).length;
  return (saSmjenom / KV.length) >= 0.8;
}
function anaPodaci(){
  var KV = anaKvarovi();
  var poStroju = {};
  KV.forEach(function(k){
    var key = k.m || '—';
    var s = poStroju[key] = poStroju[key] || { n:0, sati:0, cost:0, rijeseni:0, satiR:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
    if(k.status==='rijesen'){ s.rijeseni++; s.satiR += k.sati; }
  });
  var poSmjeni = {};
  KV.forEach(function(k){
    var key = k.smjena || '—';
    var s = poSmjeni[key] = poSmjeni[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var poKat = {};
  KV.forEach(function(k){
    var key = k.kategorija || 'Ostalo';
    var s = poKat[key] = poKat[key] || { n:0, sati:0, cost:0 };
    s.n++; s.sati += k.sati; s.cost += kvarCost(k);
  });
  var uzroci = {};
  KV.forEach(function(k){
    var sig = kvarSig(k); if(!sig) return;
    var u = uzroci[sig] = uzroci[sig] || { n:0, sati:0, cost:0, primjer:k };
    u.n++; u.sati += k.sati; u.cost += kvarCost(k);
  });
  /* AUDIT-FIX (§14.2 t.4): sati po osobi — kvarovi.sati po tko (samo riješeni imaju tko) +
     preventiva.stvarno_h po tkoZadnji; voditelj/direktor jedini koji smiju vidjeti (financije). */
  var poOsobi = {};
  KV.forEach(function(k){
    if(!k.tko) return;
    var s = poOsobi[k.tko] = poOsobi[k.tko] || { satiKvar:0, satiPrev:0 };
    s.satiKvar += k.sati;
  });
  anaPreventivaObavljena().forEach(function(p){
    /* AUDIT F8: vanjski izvođač (p.izv!=='interno') upiše tkoZadnji=naziv servisa
       (npr. "MB Frigo") — to nije osoba iz tima i ne pripada tablici "Sati po osobi". */
    if(!p.tkoZadnji || p.stvarno_h == null || (p.izv && p.izv!=='interno')) return;
    var s = poOsobi[p.tkoZadnji] = poOsobi[p.tkoZadnji] || { satiKvar:0, satiPrev:0 };
    s.satiPrev += p.stvarno_h;
  });
  return { KV:KV, poStroju:poStroju, poSmjeni:poSmjeni, poKat:poKat, uzroci:uzroci, poOsobi:poOsobi };
}

        var mjKljucevi = [];

        })();

           na mjesece otkad evidencija stvarno postoji, uz napomenu iznad grafa. */
        var najstariji = Object.keys(mjTrosak).reduce(function(a,b){ return (!a || b<a) ? b : a; }, null);
        var mjPuniBroj = mjKljucevi.length;

        var tekuciMjesec = todayISO().slice(0,7);

        return napomena+'<div class="card">'+mjKljucevi.map(function(kk){
          var idx = parseInt(kk.slice(5,7),10) - 1;
          var uTijeku = kk === tekuciMjesec;

/* ═══ [24] RENDER: RASPORED (1/3) — osnove, otvoreni zadaci, kalendarska mreža ═══ */
/* =====================  render: Raspored — organizacija tjedna  =====================
   Ovdje se planira: preventiva po danima, dogovoreni vanjski servisi i ZADACI
   (kupiti, dogovoriti, pripremiti). Kvarovi su prijave problema i žive na Kvarovi —
   miješanje zadataka među kvarove nije imalo logike, pa su preseljeni ovamo.
   Mjesečna mreža je izbačena (kritika §11.4 + odluka vlasnika): duplicirala je
   popis ispod i tražila učenje boja — organizaciji služi popis po danima. */
var DANI_TJEDNA = ['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
function danUTjednu(iso){
  var d = new Date(iso+'T00:00:00');
  return isNaN(d.getTime()) ? '' : DANI_TJEDNA[d.getDay()];
}
function otvoreniZadaci(){
  return DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='zadatak' && jeOtvoren(k); });
}
/* Rok trajne sanacije privremenog popravka (dorade.sql) — planska obveza s datumom,
   danas vidljiva samo u IFS izvještaju. Ovo NIJE kvar na kalendaru (kvar = prijava,
   model modula) — prikazuje se OBVEZA sanacije, ne prijava problema. */
function sanacijeOtvorene(){
  return DATA.kvarovi.filter(function(k){ return k.privremeni && k.status!=='otkazan' && k.rok_sanacije; });
}
/* §16 P1/P2: jedino što voditelja proizvodnje zanima na Rasporedu — kad je SLJEDEĆI planirani
   zastoj linije (preventiva označena "Zaustavlja liniju dok traje"), ne cijeli plan tima. */
function sljedeciZastojLinije(){
  return DATA.preventiva.filter(function(p){ return p.zaustavlja_liniju && p.next && p.next >= todayISO(); })
    .sort(function(a,b){ return a.next < b.next ? -1 : (a.next > b.next ? 1 : 0); })[0] || null;
}
/* AUDIT-FIX (dead-code): sanacijaRedak i prevRedak su bez ijednog pozivatelja u cijeloj
   aplikaciji (grep app/+tests.html) — obrisani. */
function zadatakRedak(z){
  var kasni = z.rok && z.rok < todayISO();
  var zm = z.m ? machineById(z.m) : null;
  var kont = z.kontakt_id ? DATA.partneri.filter(function(x){ return x.id===z.kontakt_id; })[0] : null;
  return '<div class="row click" onclick="app.akcijeStavke(\'zadatak\',\''+z.id+'\')">'+
    '<div class="grow"><div class="row-title" style="font-size:var(--t-meta)">'+esc(z.opis)+'</div>'+
    '<div class="row-sub"><span class="chip zadatak">Zadatak</span>'+
      (z.dodijeljen ? ' '+esc(z.dodijeljen) : '')+
      /* E-18: "rok danas" umjesto uvijek punog datuma. */
      (z.rok ? ' &middot; rok '+relDatumKratak(z.rok) : '')+
      (kasni ? ' &middot; <b style="color:var(--red)">kasni</b>' : '')+
      (z.ponavljanje ? ' &middot; ↻ svakih '+z.ponavljanje+' d' : '')+
      (zm ? ' &middot; '+esc(zm.name) : '')+
      (kont ? ' &middot; '+esc(kont.naziv) : '')+
      (z.izvor_kvar ? ' &middot; iz kvara' : '')+'</div></div>'+
    '<button class="okbtn role-write" title="Označi obavljeno" onclick="event.stopPropagation();app.obaviZadatak(\''+z.id+'\')">✓</button>'+
  '</div>';
}

/* ---------- kalendarska mreža: sklopiv ulaz za grubo planiranje, ne glavni prikaz ---------- */
function ponedjeljakTjedna(iso){
  var d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
var RASP_MJESEC = null;         /* 'GGGG-MM' prikazanog mjeseca */
var RASP_ODABRAN = null;        /* ISO zadnje dodirnutog dana (za isticanje ćelije/scroll cilj) */
var RASP_PREMJESTI = null;      /* {tip:'preventiva'|'zadatak', id} dok traje premještanje */
var RASP_KAL_OTVOREN = false;   /* je li mjesečna mreža razvijena — zatvorena po defaultu */
var RASP_OTVORENE_GRUPE = { kasnije:false, bezRoka:false, sedamDana:false };   /* sklopive niskoprioritetne grupe agende; perzistira kroz re-rendere */
var RASP_PRAZAN_DAN = null;     /* ISO dana bez ijedne stavke, dodirnutog u mreži — privremeni redak dok se ne dotakne drugi dan */
function stavkeZaDan(iso){
  return {
    prev: DATA.preventiva.filter(function(p){ return p.next===iso; }),
    zad: otvoreniZadaci().filter(function(z){ return z.rok===iso; }),
    san: sanacijeOtvorene().filter(function(k){ return k.rok_sanacije===iso; })
  };
}
function rasporedCelija(iso, danas){
  var st = stavkeZaDan(iso);
  var ukupno = st.prev.length + st.zad.length + st.san.length;
  /* točka nosi JEDNO app-wide značenje (isto kao chip "Zaustavlja liniju") — nikad "prošao je" */
  var kritican = st.prev.some(function(p){ return p.zaustavlja_liniju; });
  var izvan = iso.slice(0,7) !== RASP_MJESEC;   /* dan susjednog mjeseca — prigušen, ali živ */
  var klase = 'rasp-d'+(iso===danas?' danas':'')+(iso===RASP_ODABRAN?' odabran':'')+(izvan?' izvan':'');
  var tockaHtml = ukupno ? '<span class="rasp-tocka'+(kritican?' kritican':'')+'"></span>' : '';
  return '<div class="'+klase+'" onclick="app.rasporedDan(\''+iso+'\')">'+
    '<span>'+parseInt(iso.slice(8,10),10)+'</span>'+tockaHtml+'</div>';
}
function rasporedRaspon(){
  /* mjesec u punim tjednima: od ponedjeljka tjedna s 1. do nedjelje tjedna sa zadnjim danom */
  var p = RASP_MJESEC.split('-');
  var start = ponedjeljakTjedna(RASP_MJESEC+'-01');
  var zadnjiDan = new Date(parseInt(p[0],10), parseInt(p[1],10), 0).getDate();
  return { start: start, kraj: addDaysISO(ponedjeljakTjedna(RASP_MJESEC+'-'+pad2(zadnjiDan)), 6) };
}
function renderKalendarskaMreza(){
  var danas = todayISO();
  if(!RASP_MJESEC) RASP_MJESEC = danas.slice(0,7);
  var p = RASP_MJESEC.split('-');
  var raspon = rasporedRaspon();
  var zaglavlje = '';
  DANI_TJEDNA.slice(1).concat([DANI_TJEDNA[0]]).forEach(function(dn){   /* P U S Č P S N */
    zaglavlje += '<div class="rasp-h">'+dn.slice(0,1).toUpperCase()+'</div>';
  });
  /* mreža ostaje GEOMETRIJSKI CIJELA — dodir na dan više ništa ne umeće ovdje, samo
     scrolla/ističe postojeći redak dolje u agendi (scrollNaDan) */
  var tjedni = '';
  for(var pon = raspon.start; pon <= raspon.kraj; pon = addDaysISO(pon, 7)){
    for(var d = 0; d < 7; d++) tjedni += rasporedCelija(addDaysISO(pon, d), danas);
  }
  var pomaknuto = RASP_MJESEC !== danas.slice(0,7);
  var naslov = MJESECI[parseInt(p[1],10)-1]+' '+p[0]+'.';
  return '<div class="card" style="padding:var(--r2)">'+
    '<div class="rasp-nav">'+
      '<button class="qbtn" onclick="app.rasporedMjesec(-1)" aria-label="Prethodni mjesec">‹</button>'+
      '<div class="rasp-naslov">'+naslov+'</div>'+
      (pomaknuto ? '<button class="btn-mini" onclick="app.rasporedDanas()">Danas</button>' : '<span style="width:34px"></span>')+
      '<button class="qbtn" onclick="app.rasporedMjesec(1)" aria-label="Sljedeći mjesec">›</button>'+
    '</div>'+
    '<div class="rasp-grid">'+zaglavlje+tjedni+'</div>'+
  '</div>';
}

/* ═══ [25] RENDER: RASPORED (2/3) — model „Dnevne ploče": kante kasni/danas/tjedan, RASP_* stanje ═══ */
/* S5: brzi premještaj bez otvaranja mreže — Danas · Sutra · +7 dana */
function brziPremjestaj(tip, id){
  /* §16 P1: premještanje termina je planiranje (voditeljev posao) — tehničaru je njegov dan

    '<button class="btn sec" style="flex:1" onclick="app.premjestiNa(\''+tip+'\',\''+id+'\',\''+todayISO()+'\')">Danas</button>'+
    '<button class="btn sec" style="flex:1" onclick="app.premjestiNa(\''+tip+'\',\''+id+'\',\''+isoShift(1)+'\')">Sutra</button>'+
    '<button class="btn sec" style="flex:1" onclick="app.premjestiNa(\''+tip+'\',\''+id+'\',\''+isoShift(7)+'\')">+7 dana</button>'+

/* ---------- Raspored v45 — "Dnevna ploča": planer dana, ne lista s gumbima ----------
   Jedan ekran, odozgo: tjedni trak (opterećenje po danu) → hero dana (datum, smjena i "još X h",
   3 brojke, segmentna traka napretka, pilule tima sa satima) → "Sada u pogonu" (kvarovi u radu
   = stvarnost dana, s trakom smjene) → Kasni (+ "Sve na danas") → Plan dana → Sljedećih 7 dana →
   Kasnije / Bez roka (sklopivo) → FAB. Svaka stavka postoji na ekranu TOČNO JEDNOM — hero,
   pilule, trak i sheetovi ispisuju samo brojke/tip/stroj, nikad opis. Dodjela osobe i procjena
   sati = 2 dodira (avatar/čip → sheet), bez punog obrasca. Vlasnikov nalog 17.8.2026.:
   "tu se planira dan i gleda šta ima za odraditi — a bilo je basic i jadno". */
var RASP_TJEDAN = null;            /* ISO ponedjeljka tjedna prikazanog u traci */
var RASP_ODABRAN_ZA = null;        /* datum na koji je RASP_ODABRAN postavljen — novi dan → natrag na danas */
var RASP_FILTER_OSOBA = null;      /* null | ime | '__nitko' — filtar agende po osobi (pilule tima) */
var RASP_FILTER_INIT = null;       /* za koga je filtar inicijaliziran (majstor → svoje ime, ostali null) */
var RASP_PLAN = null;              /* {red:[{tip,id}], i} dok traje "Planiraj dan" */
var RASP_TIHO = false;             /* potiskuje rerender tijekom skupnih radnji (Sve na danas) */
var KASNI_U_TIJEKU = false;        /* AUDIT F8: "Sve na danas" nije submit gumb — globalna zaštita od duplog tapa ga ne pokriva */
var RASP_SWIPE = null;
var SVG_KVACICA = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

/* JEDAN klasifikacijski prolaz — svaka stavka u točno jednu kantu. Sidro = odabrani dan
   (zadano danas): 'danas' = datum===sidro, 'tjedan' = (sidro, sidro+7], 'kasnije' > sidro+7,
   'kasni' UVIJEK datum < stvarnog danas, 'prije' = između danas i sidra (ne prikazuje se —
   dostupno kroz trak). Zadaci bez roka posebno. Nikad dvije neovisne petlje nad istim podacima. */
function klasifikacijaStavki(sidro){
  var danas = todayISO();
  sidro = sidro || danas;
  var tjedanKraj = addDaysISO(sidro, 7);
  var kasni = [], danasArr = [], tjedan = [], kasnije = [], bezRoka = [], prije = [];
  function stavka(tip, item, datum, osoba, h, krit){
    return { tip:tip, item:item, datum:datum, osoba:osoba||null, h:(h==null?null:h), krit:!!krit, kasni:!!datum && datum < danas };
  }
  function razvrstaj(s){
    var d = s.datum;
    if(d < danas) kasni.push(s);
    else if(d < sidro) prije.push(s);
    else if(d === sidro) danasArr.push(s);
    else if(d <= tjedanKraj) tjedan.push(s);
    else kasnije.push(s);
  }
  DATA.preventiva.forEach(function(p){ razvrstaj(stavka('prev', p, p.next, p.dodijeljen, p.trajanje_h, p.zaustavlja_liniju)); });
  var servisGranica = isoShift(7);
  otvoreniZadaci().forEach(function(z){
    /* AUDIT F8: zadaci koje "Servis dolazi" vec prikazuje (vidi jeServisZadatak) se ovdje
       preskacu da ne budu na ekranu dvaput; servisni zadatak s dalekim rokom (izvan
       sedmodnevne granice) i dalje ide u normalne sekcije. */
    if(jeServisZadatak(z) && (!z.rok || z.rok <= servisGranica)) return;
    if(!z.rok){ bezRoka.push(stavka('zad', z, null, z.dodijeljen, null, false)); return; }
    razvrstaj(stavka('zad', z, z.rok, z.dodijeljen, null, false));
  });
  sanacijeOtvorene().forEach(function(k){ razvrstaj(stavka('san', k, k.rok_sanacije, k.dodijeljen, null, false)); });
  function sortDatum(a,b){ return a.datum < b.datum ? -1 : (a.datum > b.datum ? 1 : 0); }
  kasni.sort(sortDatum); danasArr.sort(sortDatum); tjedan.sort(sortDatum); kasnije.sort(sortDatum); prije.sort(sortDatum);
  return { kasni:kasni, danas:danasArr, tjedan:tjedan, kasnije:kasnije, bezRoka:bezRoka, prije:prije };
}

/* Sažetak dana za hero, pilule i zone — jedan prolaz. Za danas skup = kasni + danas + kvarovi
   (tip kvar) koji su otvoreni ("Sada u pogonu"); za drugi dan = stavke s tim datumom. */
function danSazetak(iso){
  var danas = todayISO(), jeDanas = iso===danas;
  var kl = klasifikacijaStavki(iso);
  var stavke = jeDanas ? kl.kasni.concat(kl.danas)
                       : kl.kasni.concat(kl.prije, kl.danas).filter(function(x){ return x.datum===iso; });
  var sada = jeDanas ? DATA.kvarovi.filter(function(k){ return (k.tip||'kvar')==='kvar' && jeOtvoren(k); }) : [];
  var gotove = [];
  DATA.preventiva.forEach(function(p){
    if(p.zadnje===iso) gotove.push({ tip:'prev', item:p, osoba:p.tkoZadnji||null, h:p.trajanje_h, kad:'' });
  });
  DATA.kvarovi.forEach(function(z){
    if((z.tip||'kvar')!=='zadatak' || z.status!=='rijesen' || !z.closed_at) return;
    /* C: closed_at je UTC iz baze, iso (todayISO) je LOKALNI datum — usporedba sirovih
       stringova krivo broji "odrađeno danas" u rubnim satima. localDT().d vraća lokalni dan. */
    if(localDT(z.closed_at).d!==iso) return;
    var d = new Date(z.closed_at);
    gotove.push({ tip:'zad', item:z, osoba:z.tko||null, h:null, kad: isNaN(d.getTime()) ? '' : fmtSat(d) });
  });
  var poOsobi = {};
  function po(ime){ var k = ime || '__nitko'; if(!poOsobi[k]) poOsobi[k] = {n:0,h:0,bezH:0,gotN:0,gotH:0}; return poOsobi[k]; }
  MAJSTORI.forEach(function(m){ po(m); }); po('Voditelj'); po(null);
  var sati = 0, bezProcjene = 0, kasni = 0, nMoj = 0, kasniMoj = 0;
  /* A: hero brojke moraju pratiti isti filtar osobe kao popis ispod (prolaziFiltar) — inače
     hero pokaže "5" dok popis ima 3 retka. Nedodijeljene stavke prolaze filtar (kandidati
     svima), pa ulaze i u *Moj varijantu — isto kao što ih popis već prikazuje. */
  stavke.forEach(function(x){
    var o = po(x.osoba); o.n++;
    if(x.tip==='prev'){
      if(x.h==null){ bezProcjene++; o.bezH++; }
      else { sati += x.h; o.h += x.h; }
    }
    if(x.datum < danas) kasni++;
    if(prolaziFiltar(x)){ nMoj++; if(x.datum < danas) kasniMoj++; }
  });
  sada.forEach(function(k){
    var o = po(k.dodijeljen); o.n++;
    if(k.status==='u_radu'){ var s = satiKvara(k); sati += s; o.h += s; }
    if(prolaziFiltar({osoba:k.dodijeljen})) nMoj++;
  });
  gotove.forEach(function(g){ var o = po(g.osoba); o.gotN++; if(g.h) o.gotH += g.h; });
  return {
    iso:iso, danas:jeDanas, kl:kl, stavke:stavke, sada:sada, gotove:gotove,
    n: stavke.length + sada.length, nGotove: gotove.length,
    sati: Math.round(sati*10)/10, bezProcjene:bezProcjene, kasni:kasni,
    nMoj:nMoj, kasniMoj:kasniMoj,
    hitno: sada.filter(function(k){ return k.prioritet==='hitno'; }).length,
    poOsobi:poOsobi
  };
}
/* opterećenje po danu za tjedni trak: {iso:{n, kasni}} */
function tjedanMapa(pon){
  var danas = todayISO(), mapa = {};
  for(var i=0;i<7;i++){
    var iso = addDaysISO(pon, i), st = stavkeZaDan(iso);
    var n = st.prev.length + st.zad.length + st.san.length;
    mapa[iso] = { n:n, kasni: iso < danas && n > 0 };
  }
  return mapa;
}
/* prva stavka nakon dana — samo tip/stroj/datum, nikad opis (svaka stavka jednom na ekranu) */
function sljedecaStavka(iso){
  var best = null;
  function kand(datum, tip, m){
    if(!datum || datum <= iso) return;
    if(!best || datum < best.datum){ var mm = m ? machineById(m) : null; best = { datum:datum, tip:tip, stroj: mm ? mm.name : '' }; }
  }
  DATA.preventiva.forEach(function(p){ kand(p.next, 'Redovni pregled', p.m); });
  otvoreniZadaci().forEach(function(z){ kand(z.rok, 'Zadatak', z.m); });
  sanacijeOtvorene().forEach(function(k){ kand(k.rok_sanacije, 'Sanacija', k.m); });
  return best;
}
function nazivTjedna(pon){
  var ned = addDaysISO(pon, 6);
  var p1 = pon.split('-'), p2 = ned.split('-');
  var d1 = parseInt(p1[2],10), d2 = parseInt(p2[2],10), m1 = parseInt(p1[1],10)-1, m2 = parseInt(p2[1],10)-1;
  return m1===m2 ? d1+'.–'+d2+'. '+MJESECI_G[m1] : d1+'. '+MJESECI_G[m1]+' – '+d2+'. '+MJESECI_G[m2];
}
function prolaziFiltar(x){
  if(!RASP_FILTER_OSOBA) return true;
  if(RASP_FILTER_OSOBA==='__nitko') return !x.osoba;
  return x.osoba===RASP_FILTER_OSOBA || !x.osoba;   /* nedodijeljene su svačiji kandidati */
}
/* poredak u Planu dana: nedodijeljene → zaustavlja liniju → po osobi (redoslijed tima) → sati silazno → sanacije */
function poredakPlana(a, b){
  function rang(x){ if(x.tip==='san') return 9; if(!x.osoba) return 0; if(x.krit) return 1; return 2; }
  var ra = rang(a), rb = rang(b); if(ra!==rb) return ra-rb;
  var red = MAJSTORI.concat(['Voditelj']);
  var ia = red.indexOf(a.osoba), ib = red.indexOf(b.osoba); if(ia<0) ia = 99; if(ib<0) ib = 99;
  if(ia!==ib) return ia-ib;
  return (b.h||0) - (a.h||0);
}

/* ═══ [26] RENDER: RASPORED (3/3) — avatar, planRedak, tjedni trak, sekcije, renderRaspored ═══ */
/* ---------- gradivni elementi retka ---------- */
function avatarHtml(ime, o){
  o = o || {};
  var readonly = neMozePlanirati();
  var klik = (!readonly && o.tip && o.id) ? ' onclick="event.stopPropagation();app.sheetTko(\''+o.tip+'\',\''+o.id+'\')"' : '';
  var kl = 'av'+(o.velik?' velik':'');
  if(o.gotov) return '<span class="av ok" aria-label="Obavljeno">'+SVG_KVACICA+'</span>';
  if(o.servis) return '<span class="'+kl+' servis" title="'+esc(o.servis)+'">S</span>';
  if(!ime) return '<span class="'+kl+' prazan"'+klik+' aria-label="Nedodijeljeno"><span class="role-write">+</span></span>';
  return '<span class="'+kl+' '+avatarBoja(ime)+'"'+klik+' title="'+esc(ime)+'">'+esc(inicijali(ime))+'</span>';
}
/* §15 #2 (istraživanje UI): ista osoba = uvijek ista boja avatara, na svakom ekranu — oko
   nauči "plava je Tehničar" i ne mora čitati inicijale. Voditelj je uvijek osnovna (ljubičasta)
   boja tvrtke; ostali dobiju stabilnu boju iz hasha imena (ne ovisi o redoslijedu u popisu). */
function avatarBoja(ime){
  if(ime === 'Voditelj') return 'ab0';
  var h = 0, s = String(ime||'');
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffff;
  return 'ab'+(1 + (h % 5));
}
/* SMJER-B: trajanje ide u podnaslov (.s) kao tekst, ne kao poseban čip — .k je rezerviran za
   JEDAN element (kasni/dan u tjednu/zaustavlja liniju). Uređivanje sati ostaje dostupno kroz
   akcijeStavke (dodir na redak), sheetSati se otvara odande. */
function trajanjeTekst(p){
  return p.trajanje_h != null ? '≈ '+H(p.trajanje_h) : (neMozePlanirati() ? '' : '≈ ? h');
}
/* jedini renderer redaka u zonama Kasni / Plan dana / Sljedećih 7 dana / Kasnije / Bez roka.
   Anatomija: avatar osobe · naslov · meta (tip riječju · stroj · chip trajanja) · jedan element desno (✓).
   Boja SAMO kao 3px pruga: crvena = kasni, isprekidana žuta = sanacija. Nikad chip za tip. */
/* SMJER-B "moj dan": jedini renderer redaka u zonama Stoji/Kasni/Danas/Sljedećih 7 dana/
   Kasnije/Bez roka. Anatomija .li: prsten (kvačica) lijevo · naslov (.t) · podnaslov (.s) ·
   jedan čip (.k) desno. Dodir na prsten = obavi (stopPropagation); dodir na ostatak retka =
   otvori detalj. Sanacija nema prsten (nije jednostavan toggle) — dobiva avatar kao dosad. */
function planRedak(x, opts){
  opts = opts || {};
  var it = x.item, danas = todayISO();
  var kasni = !!x.datum && x.datum < danas && !opts.gotov;
  var m = it.m ? machineById(it.m) : null;
  var kl = 'li click'+(kasni?' li-kasni':'')+(x.tip==='san'?' li-sanacija':'')+(opts.gotov?' li-gotov':'');
  var onclick, naslov, tekst = [], ring, kChip = '';
  if(opts.gotov){
    ring = '<span class="ring ring-on" aria-hidden="true"></span>';
    naslov = esc(it.opis);
    tekst.push(x.tip==='prev' ? 'Redovni pregled' : 'Zadatak');
    if(x.osoba) tekst.push(esc(x.osoba));
    if(x.kad) tekst.push(x.kad);
    onclick = x.tip==='prev' ? "app.akcijeStavke('preventiva','"+it.id+"')" : "app.detaljKvara('"+it.id+"')";
  } else if(x.tip==='prev'){
    onclick = "app.akcijeStavke('preventiva','"+it.id+"')";
    /* E2-10: čip "Pregled" maknut ispred naslova — podnaslov već piše "Redovni pregled",
       čip je samo ponavljao istu riječ i krao prostor naslovu (VLASNIK: miran ekran). */
    naslov = esc(it.opis);
    var vanjski = it.izv && it.izv!=='interno';
    tekst.push('Redovni pregled'+(vanjski ? ' · <b>'+esc(it.izv)+'</b>' : ''));
    if(m) tekst.push(esc(m.name));
    /* prsten ne nosi inicijale (za razliku od stare kartice) — ime osobe mora biti negdje
       vidljivo, ide u podnaslov kad je dodijeljeno (audit-fix: "avatar retka" test). */
    if(it.dodijeljen) tekst.push(esc(it.dodijeljen));
    if(!opts.tiho) tekst.push(trajanjeTekst(it));
    if(it.zaustavlja_liniju) kChip = '<span class="k yel">Zaustavlja liniju</span>';
    ring = neMozePlanirati()
      ? '<span class="ring'+(kasni?' ring-crv':'')+'" aria-hidden="true"></span>'
      : '<span class="ring'+(kasni?' ring-crv':'')+' role-write" onclick="event.stopPropagation();app.rasporedObaviPreventivu(\''+it.id+'\')" aria-label="Obavljeno"></span>';
  } else if(x.tip==='zad'){
    onclick = "app.akcijeStavke('zadatak','"+it.id+"')";
    naslov = esc(it.opis);
    tekst.push('Zadatak'+(it.ponavljanje ? ' · ↻ '+it.ponavljanje+' d' : ''));
    if(it.dodijeljen) tekst.push(esc(it.dodijeljen));
    if(m) tekst.push(esc(m.name));
    else if(it.kontakt_id){ var kont = DATA.partneri.filter(function(p){ return p.id===it.kontakt_id; })[0]; if(kont) tekst.push(esc(kont.naziv)); }
    if(it.izvor_kvar) tekst.push('iz kvara');
    ring = neMozePlanirati()
      ? '<span class="ring'+(kasni?' ring-crv':'')+'" aria-hidden="true"></span>'
      : '<span class="ring'+(kasni?' ring-crv':'')+' role-write" onclick="event.stopPropagation();app.rasporedObaviZadatak(\''+it.id+'\')" aria-label="Obavljeno"></span>';
  } else {
    onclick = "app.detaljKvara('"+it.id+"')";
    naslov = 'Sanacija: '+esc(it.opis);
    tekst.push('Sanacija · trajni popravak do '+fmtDate(it.rok_sanacije));
    if(m) tekst.push(esc(m.name));
    ring = avatarHtml(it.dodijeljen, { tip:'kvar', id:it.id });
  }
  /* E2-10: "Kasni X d" maknuto iz podnaslova — desni čip (kChip) već nosi isti broj,
     ponavljanje je bilo trošenje širine retka (VLASNIK: miran ekran, ne dupliciraj). */
  if(kasni){ kChip = '<span class="k red">'+danaOd(x.datum)+' d</span>'; }
  else if(opts.dan) kChip = '<span class="k grey">'+danUTjednu(opts.dan).slice(0,3)+'.</span>';
  return '<div class="'+kl+'" data-id="'+it.id+'" onclick="'+onclick+'">'+
    ring+
    '<div class="grow"><div class="t dvored">'+naslov+'</div>'+
      '<div class="s">'+tekst.join(' &middot; ')+'</div></div>'+
    kChip+
  '</div>';
}

/* ---------- ZONA 1: tjedni trak ---------- */
function renderTjedniTrak(sz){

    dani += '<div class="'+kl+'" onclick="app.rasporedOdaberiDan(\''+iso+'\')">'+

      '<span class="rasp-tj-load"><i'+(m.kasni?' class="crv"':'')+' style="width:'+pct+'%"></i></span></div>';
  }
  var danasSkok = (RASP_ODABRAN !== danas) ? '<button class="rasp-skok" onclick="app.rasporedDanas()">Danas ›</button>' : '';
  return '<div class="rasp-tj">'+
    '<div class="rasp-tj-nav">'+
      '<button class="rasp-tj-naslov" onclick="app.rasporedKalToggle()" aria-expanded="'+(kalOtvoren?'true':'false')+'">'+
        '<span>'+nazivTjedna(RASP_TJEDAN)+'</span><span class="rasp-tj-kal">Kalendar</span>'+
        '<span class="chev" style="transform:rotate('+(kalOtvoren?90:0)+'deg)">›</span></button>'+
      danasSkok+
      '<button class="qbtn rasp-tj-nav-btn" onclick="app.rasporedTjedan(-1)" aria-label="Prethodni tjedan">‹</button>'+
      '<button class="qbtn rasp-tj-nav-btn" onclick="app.rasporedTjedan(1)" aria-label="Sljedeći tjedan">›</button>'+
    '</div>'+
    '<div class="rasp-tj-dani">'+dani+'</div>'+
  '</div>'+
  (kalOtvoren ? '<div style="margin-bottom:var(--r3)">'+renderKalendarskaMreza()+'</div>' : '');
}

/* ---------- pilule tima (samo za uloge koje vide više osoba: voditelj, proizvodnja) ---------- */
function renderTim(sz){
  var red = [];
  if(SESSION.role==='majstor' && SESSION.ime) red.push(SESSION.ime);
  MAJSTORI.forEach(function(m){ if(red.indexOf(m)===-1) red.push(m); });
  if(sz.poOsobi['Voditelj'] && sz.poOsobi['Voditelj'].n>0 && red.indexOf('Voditelj')===-1) red.push('Voditelj');
  var kap = smjenaTrajanje();
  var nitko = sz.poOsobi.__nitko;
  var nitkoHtml = (nitko && nitko.n>0)
    ? '<button class="rasp-os nitko'+(RASP_FILTER_OSOBA==='__nitko'?' aktivna':'')+'" onclick="app.rasporedFilterOsoba(\'__nitko\')">Tko? · '+nitko.n+'</button>'
    : '';
  var osobeHtml = red.map(function(ime){
    var po = sz.poOsobi[ime] || {n:0,h:0};
    var txt = po.h>0 ? H(po.h) : (po.n>0 ? po.n+' st.' : '—');
    var kl = 'rasp-os'+((po.h===0&&po.n===0)?' slobodan':'')+(po.h>kap?' preko':'')+(RASP_FILTER_OSOBA===ime?' aktivna':'');
    return '<button class="'+kl+'" onclick="app.rasporedFilterOsoba(\''+jsArg(ime)+'\')">'+avatarHtml(ime,{})+'<span>'+txt+'</span></button>';
  }).join('');
  /* "Tko?" (nedodijeljeno) ide PRVI — to je pilula koju voditelj najviše treba, a red je
     horizontalno skrolabilan bez vizualne najave; na uskom zaslonu ne smije završiti odrezana
     s ruba (audit-fix, §14). Iznimka: majstor ima svoju (aktivnu) pilulu prvu — to je već
     njegov filtrirani dan, "Tko?" mu je manje bitan od potvrde "ovo je moje". */
  var html = (SESSION.role==='majstor') ? (osobeHtml+nitkoHtml) : (nitkoHtml+osobeHtml);
  return '<div class="rasp-tim-wrap"><div class="rasp-tim">'+html+'</div></div>';
}
/* SMJER-B: hero-blok (velike brojke) je uklonjen iz tijela — brojke sad žive u header
   badge-evima (postaviBadgeveEkrana) i u naslovu sekcije "Danas". Ovdje ostaje samo tekst
   napretka koji je hero nekad ispisivao ("Odrađeno X od Y" / "Danas · X od Y"). */
function naslovDana(sz){
  var danas = todayISO(), iso = sz.iso;
  var N = sz.n + sz.nGotove;
  var osnova = iso===danas ? 'Danas' : (iso===isoShift(1) ? 'Sutra' : (iso===isoShift(-1) ? 'Jučer' : danUTjednu(iso)));
  if(RASP_FILTER_OSOBA && RASP_FILTER_OSOBA!=='__nitko'){

    return osnova+' · '+esc(inicijali(RASP_FILTER_OSOBA))+': '+po.gotN+' od '+(po.n+po.gotN);
  }
  return osnova+' · '+sz.nGotove+' od '+N;
}
/* ---------- crvena sekcija "Stoji": kvarovi koji stvarno zaustavljaju liniju upravo sad ---------- */

/* ---------- SMJER-E: "Servis dolazi" — auto-zadaci iz "Zovi servis" (opis počinje "Servis ")
   ili zadaci s kontaktom tipa Servis, otvoreni i s rokom unutar 7 dana (ili bez roka).
   Prikazuje se na SAM VRH tehničarova rasporeda, iznad "Stoji" — prazna sekcija se ne renderira. */
/* AUDIT F8: dijeljeni predikat s klasifikacijaStavki — bez njega su "Servis dolazi" i
   Kasni/Danas/Sljedećih 7 dana/Kasnije/Bez roka prikazivali ISTI zadatak dvaput. */
function jeServisZadatak(k){
  if((k.tip||'kvar')!=='zadatak') return false;
  if(String(k.opis||'').indexOf('Servis ')===0) return true;
  if(!k.kontakt_id) return false;
  var p = (DATA.partneri||[]).filter(function(x){ return x.id===k.kontakt_id; })[0];
  return !!(p && p.tip==='Servis');
}
function servisDolaziStavke(){
  var granica = isoShift(7);
  return DATA.kvarovi.filter(function(k){
    if(!jeOtvoren(k) || !jeServisZadatak(k)) return false;
    return !k.rok || k.rok <= granica;
  }).sort(function(a,b){ return String(a.rok||'9999').localeCompare(String(b.rok||'9999')); });
}
function servisRokChipTxt(rok){
  if(!rok) return 'bez roka';
  var danas = todayISO();
  if(rok < danas) return 'kasni';
  if(rok === danas) return 'danas';
  if(rok === isoShift(1)) return 'sutra';
  var d = new Date(rok+'T00:00:00');
  return isNaN(d.getTime()) ? 'bez roka' : DANI_KR[d.getDay()]+'.';   /* AUDIT-FIX: isti obrazac kao danUTjednu (3960) */
}
function servisRedak(k){
  var kont = k.kontakt_id ? (DATA.partneri||[]).filter(function(p){ return p.id===k.kontakt_id; })[0] : null;
  var izvorK = k.izvor_kvar ? DATA.kvarovi.filter(function(x){ return x.id===k.izvor_kvar; })[0] : null;
  var m = izvorK && izvorK.m ? machineById(izvorK.m) : null;
  var naslov = (kont ? esc(kont.naziv) : 'Servis')+(m ? ' &middot; '+esc(m.name) : '');
  var opisKvara = izvorK ? izvorK.opis : k.opis;
  var opisSkr = opisKvara ? (String(opisKvara).length>50 ? esc(String(opisKvara).slice(0,50))+'…' : esc(opisKvara)) : '';
  var rokTxt = k.rok ? fmtDate(k.rok) : 'bez roka';
  return '<div class="li click" data-id="'+k.id+'" style="border-left-color:var(--plava-rub)" onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="grow"><div class="t">'+naslov+'</div>'+
    '<div class="s">'+esc(rokTxt)+(opisSkr ? ' &middot; '+opisSkr : '')+'</div></div>'+
    '<span class="k" style="background:var(--plava-bg);color:var(--plava-tekst)">'+esc(servisRokChipTxt(k.rok))+'</span>'+
  '</div>';
}
function renderServisDolazi(){
  var stavke = servisDolaziStavke();
  if(!stavke.length) return '';
  return renderSec('Servis dolazi &middot; '+stavke.length, null)+
    '<div class="card" style="border-color:var(--plava-rub)">'+stavke.map(servisRedak).join('')+'</div>';
}

/* ---------- ZONA 3: Sada u pogonu (kvarovi = stvarnost dana) ---------- */
function smjenaTrakaHtml(k){
  var poc = pocetakKvara(k); if(!poc) return '';
  var g = smjenaGranice();
  var od = g.od, doS = g.do;
  var sada = new Date(); var hSirovo = sada.getHours() + sada.getMinutes()/60;
  var hS = hSirovo; if(hS < od) hS += 24;
  var hP = poc.getHours() + poc.getMinutes()/60;
  /* kvar preuzet jučer ili ranije: traka od početka smjene */
  if(poc.toDateString() !== sada.toDateString()) hP = od;
  /* AUDIT F8: hP+=24 je bio bezuvjetan — kvar preuzet JUTROS u ranijoj smjeni (npr. 10:00,
     trenutna smjena 14-22) dobivao je hP=34, x0 preko 100% i traka negativne širine.
     +24 ima smisla SAMO kad trenutna smjena stvarno prelazi ponoc (doS>24) i hP pripada
     jutru te iste (prelazeće) smjene; inače je rijec o ranijoj smjeni ISTOG dana — traka
     jednostavno pocinje od pocetka trenutne smjene. */
  /* E-odmah #6 (pregled): uvjet "hP+24 > doS" nije pravi razdjelnik — kod zadanih dviju
     smjena (6-14, 14-6) kvar preuzet danas u 03:00, gledan u 20:00, daje hP=27 ≤ doS=30,
     pa je traka i dalje ispadala negativne širine. Poc je ovdje UVIJEK današnji (grana
     iznad je odbacila ranije dane), pa +24 vrijedi samo kad smo i SAMI u dijelu smjene
     poslije ponoći (sirovi sat sada < od) — tada je poc iz tog jutra. Inače je poc ranija
     smjena ISTOG dana i traka počinje od početka trenutne smjene. */
  if(hP < od){ if(doS > 24 && hSirovo < od) hP += 24; else hP = od; }
  var rasp = doS - od; if(!(rasp > 0)) return '';
  function cl(v){ return Math.max(0, Math.min(1, v)); }
  var x0 = cl((Math.max(od,hP)-od)/rasp), x1 = cl((hS-od)/rasp);
  /* Pregled serije E1: traka ne smije nikad imati negativnu širinu (početak iza "sada") —
     to je uvijek nemoguć podatak (npr. poceo_at u budućnosti, sat na tabletu pomaknut),
     a kao CSS ispada nevidljiva traka bez ikakve poruke. Radije je prikažemo praznom. */
  if(x0 > x1) x0 = x1;
  var proc = '';
  if(k.procjena_gotovo){
    var pg = new Date(k.procjena_gotovo);
    if(!isNaN(pg.getTime())){
      var hG = pg.getHours() + pg.getMinutes()/60; if(hG < od) hG += 24;
      var xp = cl((hG-od)/rasp);
      var a = Math.min(x1,xp), b = Math.max(x1,xp);
      /* E-odmah #6: kašnjenje se prikazuje čim je procjena u prošlosti — usporedba xp<x1
         je znala izostati (npr. procjena i "sada" u istom postotku trake) baš kad je rok
         davno prošao, pa je crvena oznaka kasnjenja nestajala. */
      proc = '<i class="proc'+(pg.getTime() < Date.now() ? ' kasni' : '')+'" style="left:'+(a*100).toFixed(1)+'%;width:'+((b-a)*100).toFixed(1)+'%"></i>';
    }
  }
  return '<div class="rasp-smj-traka">'+
    '<i class="fill" style="left:'+(x0*100).toFixed(1)+'%;width:'+((x1-x0)*100).toFixed(1)+'%"></i>'+proc+
    '</div><div class="rasp-smj-lbl">smjena '+pad2(od)+':00&ndash;'+pad2(doS%24)+':00</div>';
}
function sadaRedak(k){
  var m = machineById(k.m) || {name:'—'};
  var urad = k.status==='u_radu';
  var hitno = !urad && k.prioritet==='hitno' && !k.dodijeljen;
  var kl = 'row click rasp-st'+(urad?' st-urad':'')+(hitno?' st-hitno':'');
  var poc = pocetakKvara(k);
  var meta, desno = '';
  if(urad){
    meta = esc(m.name)+' · od '+(poc?fmtSat(poc):'—')+' · '+trajanjeKvara(k);
    if(k.ceka_dio) desno = '<span class="chip upoz">Čeka dio</span>';
    else if(k.ceka_servis) desno = '<span class="chip servis">Čeka servis</span>';
    else if(k.procjena_gotovo){
      var pg = new Date(k.procjena_gotovo);
      if(!isNaN(pg.getTime())) desno = '<span class="rasp-do'+(pg.getTime() < Date.now() ? ' kasni' : '')+'">→ '+fmtSat(pg)+'</span>';
    }
  } else if(hitno){
    meta = 'Hitno · nitko ne radi · prijavljen '+(poc?fmtSat(poc):fmtDate(k.date));
    desno = '<span class="chip kvar">HITNO</span>';
  } else if(k.dodijeljen){
    var jucer = poc && poc.toDateString() !== new Date().toDateString();
    meta = esc(m.name)+' · dodijeljen · još nije preuzeo'+(poc ? ' · '+fmtSat(poc)+(jucer?' jučer':'') : '');
  } else {
    meta = 'Kvar · '+esc(m.name)+' · '+trajanjeKvara(k);
  }
  var naslov = (urad ? '<i class="puls'+(k.ceka_dio?' pauza':'')+'"></i>' : '')+esc(k.opis);
  return '<div class="'+kl+'" data-id="'+k.id+'" onclick="app.detaljKvara(\''+k.id+'\')">'+
    avatarHtml(k.dodijeljen, { tip:'kvar', id:k.id, velik:urad })+
    '<div class="grow"><div class="row-title">'+naslov+'</div><div class="row-sub">'+meta+'</div></div>'+
    desno+
    (urad ? smjenaTrakaHtml(k) : '')+
  '</div>';
}
function renderSadaUPogonu(sz){
  if(!sz.danas || !sz.sada.length) return '';
  var red = sz.sada.slice().sort(function(a,b){
    function r(k){ if(k.status==='u_radu') return 0; if(k.prioritet==='hitno' && !k.dodijeljen) return 1; if(k.dodijeljen) return 2; return 3; }
    return r(a)-r(b);
  });
  var d = new Date();
  return renderSec('<i class="puls"></i>Sada u pogonu', pad2(d.getHours())+':'+pad2(d.getMinutes()))+
    '<div class="card rasp-sada">'+red.map(sadaRedak).join('')+'</div>';
}

/* ---------- SMJER-B: zaglavlje sekcije "moj dan" — .sec, prazna sekcija se ne renderira
   (poziva se samo kad ima sadržaja, provjera je na pozivatelju). ---------- */
function renderSec(naslov, desno, opts){
  opts = opts || {};
  var atr = opts.toggleId ? ' onclick="app.rasporedGrupaToggle(\''+opts.toggleId+'\')" style="cursor:pointer"' : '';
  var chev = opts.toggleId ? '<span class="chev" style="transform:rotate('+(opts.otvoreno?90:0)+'deg)">›</span>' : '';
  return '<div class="sec'+(opts.crv?' crv':'')+'"'+atr+'><span>'+naslov+'</span>'+
    '<span class="sec-desno">'+(desno!=null?desno:'')+chev+'</span></div>';
}
function rasporedPrazno(iso, sz){
  var danas = todayISO(), jeDanas = iso===danas;
  if(RASP_FILTER_OSOBA && RASP_FILTER_OSOBA!=='__nitko'){
    return '<div class="rasp-prazno"><div class="row-title">'+esc(RASP_FILTER_OSOBA)+(jeDanas?' danas':'')+' nema ništa dodijeljeno</div>'+
      '<div class="row-sub">slobodan '+H(smjenaTrajanje())+'</div>'+
      '<div><button class="btn-mini" onclick="app.rasporedFilterOsoba(null)">Prikaži sve</button></div></div>';
  }
  if(RASP_FILTER_OSOBA==='__nitko')
    return '<div class="rasp-prazno"><div class="row-title">Sve je dodijeljeno</div>'+
      '<div><button class="btn-mini" onclick="app.rasporedFilterOsoba(null)">Prikaži sve</button></div></div>';
  if(jeDanas && sz.gotove.filter(prolaziFiltar).length && sz.n===0) return '';   /* naslov sekcije već kaže "X od Y" gdje je X=Y */
  var sl = sljedecaStavka(iso);
  var imaIsta = DATA.preventiva.length || otvoreniZadaci().length;
  var naslov = !imaIsta ? 'Raspored je prazan' : (jeDanas ? 'Za danas nema planiranog' : 'Ništa planirano za '+danUTjednu(iso));
  var sub = sl ? 'Sljedeće: '+sl.tip+(sl.stroj?' · '+esc(sl.stroj):'')+' · '+danUTjednu(sl.datum).slice(0,3)+' '+fmtDate(sl.datum) : '';
  var gumbi = (iso >= danas ? '<button class="btn-mini role-write" onclick="app.noviZadatak(\''+iso+'\')">Dodaj zadatak</button>' : '')+
    (jeDanas && sz.kasni>0 ? '<button class="btn-mini" onclick="app.rasporedSkokNa(\'kasni\')">Pogledaj Kasni</button>' : '')+
    (!DATA.preventiva.length ? '<button class="btn-mini" onclick="app.go(\'strojevi\')">Otvori strojeve</button>' : '');
  return '<div class="rasp-prazno"><div class="row-title">'+naslov+'</div>'+
    (sub ? '<div class="row-sub">'+sub+'</div>' : '')+(gumbi ? '<div>'+gumbi+'</div>' : '')+'</div>';
}
/* SMJER-B "moj dan": Stoji → Kasni → Danas (X od Y) → Sljedećih 7 dana → Kasnije → Bez roka.
   Svaka sekcija je .sec + red .li redaka; prazna sekcija se preskače u cijelosti. */
function renderPlan(sz){
  var danas = todayISO(), iso = sz.iso, jeDanas = iso===danas, kl = sz.kl;
  var voditelj = SESSION.role==='voditelj';
  var html = '';
  if(jeDanas){
    var kasni = kl.kasni.filter(prolaziFiltar);
    /* PREGLED E2-11: broj na gumbu mora biti TOČNO ono što gumb premješta — sanacije
       petlja preskače (rok sanacije je obveza, ne termin), pa se ne broje. Ako nema
       nijedne pomične stavke, gumb bi bio mrtva radnja i ne prikazuje se (VLASNIK). */
    var kasniPomicno = kasni.filter(function(x){ return x.tip!=='san'; }).length;
    if(kasni.length){
      html += '<div id="rasp-z-kasni"></div>'+
        renderSec('Kasni', (voditelj && kasniPomicno)
          /* §15 #3: skupno premještanje plana je voditeljska odluka — tehničaru je to samo
             još jedan gumb koji ne treba (i kojim slučajno prebacuje tuđi plan).
             E2-11: gumb kaže KOLIKO mijenja (isti broj kao redci ispod), umjesto nejasnog
             "Sve na danas" koje je zvučalo kao globalna radnja bez razmjera. */
          ? '<button class="btn-mini role-voditelj" onclick="app.kasniSveNaDanas()">Prebaci '+kasniPomicno+' na danas</button>'
          : String(kasni.length), {crv:true})+
        kasni.map(function(x){ return '<div data-dan="'+x.datum+'">'+planRedak(x)+'</div>'; }).join('');
    }
  }
  var plan = (jeDanas ? kl.danas : sz.stavke).filter(prolaziFiltar).slice().sort(poredakPlana);
  /* AUDIT F8: gotove stavke nisu prolazile prolaziFiltar — filtriran "moj dan" je
     pokazivao i tude obavljene stavke na dnu sekcije Danas. */
  var gotoveF = sz.gotove.filter(prolaziFiltar);
  var trebaPlan = voditelj && jeDanas && ((sz.poOsobi.__nitko && sz.poOsobi.__nitko.n>0) || sz.bezProcjene>0);
  /* naslov mora brojati i gotove stavke za taj dan — inače je manji od broja redaka
     ispod čim za dan (prošli ili budući) postoji i otvorena i gotova stavka */
  var naslovDanas = jeDanas ? naslovDana(sz) : (danUTjednu(iso)+' — '+fmtDate(iso)+' · '+(plan.length+gotoveF.length));
  /* §16.7-B: veliki gumb "Novi zadatak" je uklonjen (bio je rasp-fab) — sad je tekstualni
     link u naslovu sekcije Danas, isto pravo pisanja kao dosad (role-write, ne samo voditelj). */
  var noviZadatakLink = (iso>=danas) ? '<a href="javascript:void(0)" class="btn-mini role-write" onclick="app.noviZadatak(\''+iso+'\')">+ Zadatak</a>' : '';
  html += '<div id="rasp-z-plan"></div>'+
    renderSec(naslovDanas, (trebaPlan ? '<button class="btn-mini role-write" onclick="app.planirajDan()">Planiraj dan</button>' : '')+noviZadatakLink);
  html += (plan.length ? plan.map(function(x){ return '<div data-dan="'+iso+'">'+planRedak(x)+'</div>'; }).join('') : rasporedPrazno(iso, sz));
  if(gotoveF.length){
    /* obavljene današnje stavke ostaju u istoj sekciji "Danas", na dnu, precrtane (prsten
       zelen, opacity .55) — nema više posebnog sklopivog "Odrađeno" podnaslova. */
    html += gotoveF.map(function(g){ return '<div data-dan="'+iso+'">'+planRedak(g, {gotov:true})+'</div>'; }).join('');
  }
  var tj = kl.tjedan.filter(prolaziFiltar);
  if(tj.length){
    /* §16 P2 (vlasnikova primjedba): "kad je sve prenatrpano, to je konfuzija" — Danas i Kasni
       ostaju uvijek otvoreni (moraju upasti u oko), ali tjedan unaprijed je sklopiv i ZATVOREN
       po defaultu, isto kao Kasnije/Bez roka. */
    html += renderSec('Sljedećih 7 dana', String(tj.length), {toggleId:'sedamDana', otvoreno:RASP_OTVORENE_GRUPE.sedamDana});
    if(RASP_OTVORENE_GRUPE.sedamDana){
      var poDanu = {}, red = [];
      tj.forEach(function(x){ if(!poDanu[x.datum]){ poDanu[x.datum] = []; red.push(x.datum); } poDanu[x.datum].push(x); });
      html += red.map(function(d){
        return poDanu[d].slice().sort(poredakPlana).map(function(x){ return '<div data-dan="'+d+'">'+planRedak(x, {dan:d})+'</div>'; }).join('');
      }).join('');
    }
  }
  /* AUDIT F8: Kasni/Danas/Sljedećih 7 dana su vec filtrirani po odabranoj osobi (prolaziFiltar) —
     Kasnije i Bez roka nisu bili, pa je "moj dan" majstora pokazivao i tude stavke. */
  var kasnijeF = kl.kasnije.filter(prolaziFiltar);
  if(kasnijeF.length){
    html += renderSec('Kasnije', String(kasnijeF.length), {toggleId:'kasnije', otvoreno:RASP_OTVORENE_GRUPE.kasnije});
    if(RASP_OTVORENE_GRUPE.kasnije)
      html += kasnijeF.map(function(x){ return '<div data-dan="'+x.datum+'">'+planRedak(x,{tiho:true})+'</div>'; }).join('');
  }
  var bezRokaF = kl.bezRoka.filter(prolaziFiltar);
  if(bezRokaF.length){
    html += renderSec('Bez roka', String(bezRokaF.length), {toggleId:'bezRoka', otvoreno:RASP_OTVORENE_GRUPE.bezRoka});
    if(RASP_OTVORENE_GRUPE.bezRoka)
      html += bezRokaF.map(function(x){ return planRedak(x,{tiho:true}); }).join('');
  }
  return html;
}

function renderRaspored(){
  if(RASP_TIHO) return;
  var danas = todayISO();
  /* filtar po ulozi: majstor vidi svoj dan (+ nedodijeljeno), ostali cijeli tim */
  if(RASP_FILTER_INIT !== SESSION.ime){ RASP_FILTER_OSOBA = SESSION.role==='majstor' ? SESSION.ime : null; RASP_FILTER_INIT = SESSION.ime; }
  /* AUDIT-FIX: tablet u pogonu ostaje otvoren preko ponoći (polling svakih 30 s) —
     kad dan poteče, i tjedan/mjesec moraju skočiti na danas, ne samo odabrani dan. */
  var danPotekao = !RASP_ODABRAN || RASP_ODABRAN_ZA !== danas;
  if(danPotekao){ RASP_ODABRAN = danas; RASP_ODABRAN_ZA = danas; }
  if(!RASP_TJEDAN || danPotekao) RASP_TJEDAN = ponedjeljakTjedna(RASP_ODABRAN);
  if(!RASP_MJESEC || danPotekao) RASP_MJESEC = danas.slice(0,7);
  var sz = danSazetak(RASP_ODABRAN);
  var premjestiHtml = '';
  if(RASP_PREMJESTI){
    var st2 = RASP_PREMJESTI.tip==='preventiva'
      ? DATA.preventiva.filter(function(x){ return x.id===RASP_PREMJESTI.id; })[0]
      : DATA.kvarovi.filter(function(x){ return x.id===RASP_PREMJESTI.id; })[0];
    if(st2){
      premjestiHtml = '<div class="rasp-premjesti">'+
        '<div class="row-sub">Premještaš: '+esc(st2.opis)+'</div>'+
        '<div class="row-sub">Dodirni dan u traci tjedna ili u kalendaru</div>'+
        '<button class="btn-mini" style="margin-top:6px" onclick="app.odustaniPremjestanje()">Odustani</button></div>';
    } else RASP_PREMJESTI = null;
  }
  var scrollY = window.scrollY || 0;
  /* SMJER-B: pilule tima (Tko radi na čemu) su za uloge koje vide više osoba — tehničaru je
     ekran već filtriran na njega, pilule bi mu samo dupliciralo ono što već zna. */
  /* voditelj/proizvodnja dodjeljuju pa im pilule trebaju za rad; direktor (readonly) ih
     samo čita — i dalje mu koriste kao pregled tima. Tehničaru (majstor) su skrivene jer
     je ekran već filtriran na njega (glavni SMJER-B zahtjev). */
  var vidiTim = SESSION.role==='voditelj' || SESSION.role==='proizvodnja' || SESSION.role==='readonly';
  $('#screen-raspored').innerHTML =
    renderTjedniTrak(sz)+
    premjestiHtml+
    (vidiTim ? renderTim(sz) : '')+
    renderServisDolazi()+
    renderStoji(sz)+
    renderPlan(sz)+
    renderSadaUPogonu(sz);
  /* swipe lijevo/desno na traci = tjedan naprijed/natrag; chevroni su uvijek tu (rukavice) */
  var tj = $('#screen-raspored .rasp-tj');
  if(tj){
    tj.addEventListener('touchstart', function(e){ var t = e.touches && e.touches[0]; if(t) RASP_SWIPE = {x:t.clientX, y:t.clientY}; }, false);
    tj.addEventListener('touchend', function(e){
      if(!RASP_SWIPE) return;
      var t = e.changedTouches && e.changedTouches[0]; if(!t){ RASP_SWIPE = null; return; }
      var dx = t.clientX - RASP_SWIPE.x, dy = t.clientY - RASP_SWIPE.y; RASP_SWIPE = null;
      if(Math.abs(dx) > 48 && Math.abs(dy) < 30) app.rasporedTjedan(dx < 0 ? 1 : -1);
    }, false);
  }
  if(sz.danas && sz.n===0 && sz.nGotove>0){
    try{ if(!sessionStorage.getItem('rasp-gotovo-'+danas)){ sessionStorage.setItem('rasp-gotovo-'+danas, '1'); toast('Sve za danas odrađeno'); } }catch(e){}
  }
  if(scrollY) window.scrollTo(0, scrollY);
}

/* ═══ [28] RENDER: QR NALJEPNICE — appBaseUrl, qrPrintCss, renderQR ═══ */
function appBaseUrl(){
  return location.origin + location.pathname.replace(/[^/]*$/, 'index.html');
}
function qrPrintCss(){
  /* Standardni samoljepivi A4 arci (Herma/Avery raster, bez bočnih margina):
     f8 = 2×4 naljepnice 105×74 mm · f12 = 2×6 od 105×48 mm · f24 = 3×8 od 70×36 mm.
     @page je globalan pa se ubacuje dinamički samo dok je QR ekran otvoren. */
  var F = {
    f8:  { pageTop:'0.5mm', cols:'repeat(2,105mm)', row:'74mm', qr:'42mm', okomito:true,  naziv:'13pt', upute:'9pt',   logo:'8mm', pad:'4mm'  },
    f12: { pageTop:'4.5mm', cols:'repeat(2,105mm)', row:'48mm', qr:'33mm', okomito:false, naziv:'12pt', upute:'8pt',   logo:'7mm', pad:'3mm'  },
    f24: { pageTop:'4.5mm', cols:'repeat(3,70mm)',  row:'36mm', qr:'24mm', okomito:false, naziv:'9pt',  upute:'6.5pt', logo:'0',   pad:'2mm'  }
  };
  var f = F[QR_FORMAT] || F.f8;
  return '@media print{'+
    '@page{size:A4 portrait;margin:0}'+
    '.qr-list{display:grid !important;grid-template-columns:'+f.cols+' !important;'+
      'grid-auto-rows:'+f.row+' !important;gap:0 !important;margin:0 !important;padding:'+f.pageTop+' 0 0 !important;justify-content:center}'+
    '.qr-kart{box-sizing:border-box;width:100%;height:100%;margin:0 !important;border-radius:0 !important;'+
      'border:0.2mm dashed var(--print-rub) !important;padding:'+f.pad+' !important;overflow:hidden;'+
      (f.okomito
        ? 'display:flex;flex-direction:column;align-items:center;justify-content:center'
        : 'display:grid;grid-template-columns:'+f.qr+' 1fr;grid-template-rows:auto auto auto;align-items:center;column-gap:'+f.pad+';text-align:left')+'}'+
    (f.okomito ? '' :
      '.qr-kart .qr-slika{grid-column:1;grid-row:1/4}'+
      '.qr-kart .qr-logo{grid-column:2;grid-row:1}'+
      '.qr-kart .qr-naziv{grid-column:2;grid-row:2;margin:1mm 0 !important}'+
      '.qr-kart .qr-upute{grid-column:2;grid-row:3}')+
    '.qr-slika img,.qr-slika canvas{width:'+f.qr+' !important;height:'+f.qr+' !important}'+
    '.qr-naziv{font-size:'+f.naziv+' !important;line-height:1.15 !important}'+
    '.qr-upute{font-size:'+f.upute+' !important;line-height:1.25 !important}'+
    (f.logo==='0' ? '.qr-logo{display:none !important}' : '.qr-logo img{height:'+f.logo+' !important}')+
  '}';
}
var QR_FORMAT = 'f8';
function renderQR(){
  $('#screen-qr').innerHTML =
    '<button class="back noprint" onclick="app.go(\'strojevi\')">‹ Strojevi</button>'+
    '<div class="noprint"><h2>Naljepnice za strojeve</h2>'+
      '<div class="card"><div style="padding:11px 13px">'+
        '<div class="row-sub">Ispiši, plastificiraj i zalijepi na stroj. Tehničar skenira mobitelom i '+
        'aplikacija se otvara točno na tom stroju — bez traženja i bez pogrešnog unosa.</div>'+
        '<label style="margin-top:10px">Format arka za ispis</label>'+
        '<select onchange="app.qrFormat(this.value)">'+
          '<option value="f8"'+(QR_FORMAT==='f8'?' selected':'')+'>A4 arak — 8 naljepnica (105 × 74 mm)</option>'+
          '<option value="f12"'+(QR_FORMAT==='f12'?' selected':'')+'>A4 arak — 12 naljepnica (105 × 48 mm)</option>'+
          '<option value="f24"'+(QR_FORMAT==='f24'?' selected':'')+'>A4 arak — 24 naljepnice (70 × 36 mm)</option>'+
        '</select>'+
        '<div class="row-sub" style="margin-top:6px">Standardni samoljepivi A4 arci (Herma/Avery raster). '+
          'Na običnom papiru isprekidana linija služi kao vodilja za rezanje.</div>'+
        '<button class="btn primary block" style="margin-top:10px" onclick="window.print()">Ispiši naljepnice</button>'+
      '</div></div></div>'+
    '<div class="qr-list" id="qr-list"></div>';
  var stil = document.getElementById('qr-print-stil');
  if(stil) stil.textContent = qrPrintCss();
  var cilj = $('#qr-list');
  DATA.machines.forEach(function(m){
    var kart = document.createElement('div');
    kart.className = 'qr-kart';
    kart.innerHTML = '<div class="qr-logo"><img src="'+esc(document.querySelector('.hdr-logo').src)+'" alt=""></div>'+
      '<div class="qr-naziv">'+esc(m.name)+'</div>'+
      '<div class="qr-slika"></div>'+
      '<div class="qr-upute">Skeniraj za prijavu kvara<br><b>'+esc(m.program)+'</b></div>';
    cilj.appendChild(kart);
    try{
      var okvir = kart.querySelector('.qr-slika');
      new QRCode(okvir, {
        text: appBaseUrl() + '#stroj=' + m.id,
        width: 132, height: 132,
        correctLevel: QRCode.CorrectLevel.M
      });
      /* na Androidu biblioteka ostavlja canvas — pretvaramo ga u sliku
         jer se slika pouzdano ispisuje na svakom uređaju i pisaču */
      setTimeout(function(){
        var cv = okvir.querySelector('canvas');
        if(!cv) return;
        try{
          var podatak = cv.toDataURL('image/png');
          var im = okvir.querySelector('img') || new Image();
          im.src = podatak; im.width = 132; im.height = 132;
          im.alt = 'QR kod — ' + m.name;
          im.style.display = 'block';
          if(!im.parentNode) okvir.appendChild(im);
          cv.style.display = 'none';
        }catch(e){}
      }, 0);
    }catch(e){ kart.querySelector('.qr-slika').textContent = 'QR nedostupan'; }
  });
}

/* ═══ [29] RENDER: PORUKE — grupiranje po danu, brojNeprocitanih, nacrt preživi rerender ═══ */
/* SIM-FIX: Supabase vraća timestamptz kao UTC ("...+00:00"/"...Z") — dosad se
   samo REZALA string pa je prikazano vrijeme bilo UTC, ne hrvatsko. localDT
   pretvara u lokalno SAMO za prikaz. Demo/seed zapisi bez zone (npr.
   "2026-08-21T09:10:00") su već lokalni — ostavljamo netaknute, inače bi se
   demo pomaknuo za offset. Koristiti isključivo za prikaz, ne za usporedbe
   (te ostaju na sirovom stringu — konzistentne su dok uspoređuju sebe s
   drugim sirovim stringom istog izvora). */
function localDT(ts){
  var s = String(ts||'');
  if(!s) return {d:'', t:''};
  var imaZonu = /(Z|[+\-]\d{2}:?\d{2})$/i.test(s);
  if(!imaZonu){
    /* mora barem izgledati kao YYYY-MM-DD — inače je besmislen ulaz, ne datum */
    if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return {d:'', t:''};
    return { d: s.slice(0,10), t: s.length > 11 ? s.slice(11,16) : '' };
  }
  var dt = new Date(s);
  if(isNaN(dt.getTime())) return {d:'', t:''};
  return {
    d: dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()),
    t: pad2(dt.getHours())+':'+pad2(dt.getMinutes())
  };
}

  var dt = localDT(ts);
  return (dt.d ? fmtDate(dt.d) : '') + (dt.t ? ' ' + dt.t : '');
}

function porukeListaHtml(){

     pregledan bez filtriranja; sistemske poruke se ionako vizualno razlikuju (.msg.sustav).

  var q = PORUKE_Q.trim().toLowerCase();

  if(q) lista = lista.filter(function(p){ return (p.tekst+' '+p.tko).toLowerCase().indexOf(q) > -1; });

    var dan = localDT(p.created_at).d;
    if(dan && dan !== zadnjiDan){
      zadnjiDan = dan;
      /* E-18: isto pravilo kao svugdje drugdje u aplikaciji (danas/jučer/naziv dana/datum) —
         razdjelnik je prije pisao pun datum čim dan nije "danas", npr. "1.9.2026." umjesto "jučer". */

      var golTekst = String(p.tekst).replace(/^[\u{2190}-\u{21FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F300}-\u{1FAFF}️]+\s*/u, '');

  var bp = $('#badge-zvono');

         (kriv PIN, pauzirana baza, previse pokusaja) prikazivao se kao "Pogrešan PIN." */

  logoOdabran: function(e){
    var dat = e.target.files && e.target.files[0];
    if(!dat) return;
    var citac = new FileReader();
    citac.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        /* logo se sprema smanjen — baza i mreža ne trebaju nositi veliku sliku */
        var maxV = 120, om = Math.min(1, maxV / img.height);
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * om); c.height = Math.round(img.height * om);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PENDING_LOGO = c.toDataURL('image/png');
        var pr = document.getElementById('logo-prev');
        if(pr){ pr.src = PENDING_LOGO; pr.style.display = 'block'; pr.style.maxHeight = '70px'; }
        var lbl = document.getElementById('logo-label');
        if(lbl) lbl.textContent = '✓ '+dat.name;
      };
      img.src = ev.target.result;
    };
    citac.readAsDataURL(dat);
  },

  /* ODLUKA 3 (3.9.2026.): sama petlja uvoza izdvojena iz saveUvoz — čarobnjak „prvi dan"
     (korak 3) uvozi strojeve istim putem, ali ostaje u svom obrascu (bez zatvaranja modala
     i skoka na ekran). Vraća {dodano, azurirano, greske}. */
  uvozRedaka: async function(vrsta, tekst){
    var redci = String(tekst||'').split('\n').map(function(r){ return r.trim(); }).filter(Boolean);
    /* ODLUKA 12 (3.9.2026.): uvoz spaja po šifri (ili nazivu) umjesto da uvijek dodaje —
       ponovni uvoz istog popisa (ili popisa s promijenjenim stanjem) više ne udvostručuje. */
    var norm = function(s){ return String(s||'').trim().toLowerCase(); };
    var dodano = 0, azurirano = 0, greske = 0;
    for(var i=0;i<redci.length;i++){
      var c = redci[i].split(/[;\t]/).map(function(x){
        x = x.trim();
        /* PREGLED SERIJE B: izvoz (izvozSkladiste) stavlja svako polje u navodnike — kad se
           takav redak zalijepi natrag, navodnici nisu dio podatka (bez ovoga se "TEST-1" ne
           poklopi ni sa šifrom ni s nazivom pa uvoz UDVOSTRUČI dio, što Odluka 12 zabranjuje). */
        if(x.length > 1 && x.charAt(0)==='"' && x.charAt(x.length-1)==='"') x = x.slice(1,-1).replace(/""/g,'"');
        return x;
      });
      /* AUDIT-FIX: bilo je prefiks-podudaranje (bez $) — dio pod nazivom "Nazivna pločica"
         ili "Nazivni prsten" bi se tiho preskočio kao da je zaglavlje CSV-a. */
      if(i===0 && /^(šifra|sifra|naziv)$/i.test(c[0])) continue;   /* preskoči zaglavlje */
      try{
        /* AUDIT F8: localObj je bio null — odbijeni redak (npr. dupla šifra) je ostajao
           u DATA i brojao se kao uvezen; {tiho:true} sprjecava alert()+load() PO RETKU
           (200 losih redaka = 200 dijaloga) — jedan sazetak i jedno osvjezavanje na kraju. */
        var odbijeno = false;
        if(vrsta === 'machines'){
          /* PREGLED SERIJE B: šifra i naziv su sada OBAVEZNI. Prije je redak s praznim
             nazivom dodavao bezimeni stroj (bezopasno smeće), a otkako uvoz spaja po šifri
             isti takav redak PREPISUJE naziv postojećeg stroja praznim tekstom. */
          if(c.length < 2 || !c[0] || !c[1]) { greske++; continue; }
          /* AUDIT-FIX: ||350 odbacivao je legitimnu vrijednost 0 (isto kao saveStroj) */
          var rCsv = parseFloat(c[3]);
          var noviId = c[0].toLowerCase();
          /* ODLUKA 12: id je već šifra stroja — ponovni uvoz istog id-a ažurira, ne duplicira */
          var stariM = DATA.machines.filter(function(x){ return x.id === noviId; })[0] || null;
          if(stariM){
            stariM.name = c[1]; stariM.program = c[2] || stariM.program;
            stariM.rate = (isNaN(rCsv)||rCsv<0) ? stariM.rate : rCsv;
            var rMU = await apiUpdate('machines', stariM.id, { name:stariM.name, program:stariM.program, rate:stariM.rate }, null, {tiho:true});
            odbijeno = (rMU === null && REMOTE && naMrezi());
            if(!odbijeno) azurirano++;
          } else {
            var m = { id:noviId, name:c[1], program:c[2] || PROGRAMS[0], rate:(isNaN(rCsv)||rCsv<0)?350:rCsv, bilj:'' };
            DATA.machines.push(m);
            var rM = await apiInsert('machines', m, m, {tiho:true});
            odbijeno = (rM === null && REMOTE && naMrezi());
            if(!odbijeno) dodano++;
          }
        } else {
          /* ODLUKA 12: stupci sad nose šifru na početku (kao i kod strojeva).
             PREGLED SERIJE B: redoslijed je TOČNO onaj koji ispisuje app.izvozSkladiste
             (sifra;naziv;za koji stroj;lokacija;stanje;minimum;dobavljac;cijena;kategorija) —
             bez stupca "lokacija" u sredini svaki izvezen pa vraćen redak upisao bi stanje
             u minimum, minimum u dobavljača i cijenu u kategoriju, i to sada preko
             POSTOJEĆEG retka (spajanje po šifri), dakle preko ispravnih podataka. */
          if(c.length < 2 || !c[1]) { greske++; continue; }   /* AUDIT-FIX: prazan naziv bi pokupio sve poruke u Povijesti */
          var sifraU = c[0] || '', nazivU = c[1];
          var stanjeU = (c[4]!==undefined && c[4]!=='') ? parseInt(c[4],10) : NaN;
          var minU = (c[5]!==undefined && c[5]!=='') ? parseInt(c[5],10) : NaN;
          var cijenaU = (c[7]!==undefined && c[7]!=='') ? parseFloat(c[7]) : NaN;
          /* spajanje: prvo po šifri (bez obzira na velika/mala slova i razmake), pa po nazivu */
          var stariD = sifraU ? (DATA.dijelovi.filter(function(x){ return x.sku && norm(x.sku)===norm(sifraU); })[0] || null) : null;
          if(!stariD) stariD = DATA.dijelovi.filter(function(x){ return norm(x.naziv)===norm(nazivU); })[0] || null;
          if(stariD){
            /* naziv se namjerno ne dira — samo stanje/min/cijena/kategorija/dobavljač, i to
               samo ona polja koja CSV redak stvarno nosi */
            if(!isNaN(stanjeU)) stariD.stanje = stanjeU;
            if(!isNaN(minU)) stariD.min = minU;
            if(c[6]) stariD.dob = c[6];
            if(!isNaN(cijenaU)) stariD.cijena = cijenaU;
            if(c[8]) stariD.kategorija = c[8];
            if(c[3]) stariD.lokacija = c[3];
            if(sifraU && !stariD.sku) stariD.sku = sifraU;
            var rDU = await apiUpdate('dijelovi', stariD.id, { stanje:stariD.stanje, min:stariD.min,
              dob:stariD.dob, cijena:stariD.cijena, kategorija:stariD.kategorija,
              lokacija:stariD.lokacija, sku:stariD.sku }, null, {tiho:true});
            odbijeno = (rDU === null && REMOTE && naMrezi());
            if(!odbijeno) azurirano++;
          } else {
            var d = { id:'d'+Date.now()+i, naziv:nazivU, stroj:c[2]||'', lokacija:c[3]||null,
                      stanje:isNaN(stanjeU)?0:stanjeU, min:isNaN(minU)?0:minU, dob:c[6]||'',
                      cijena:isNaN(cijenaU)?0:cijenaU, kategorija:c[8]||'Ostalo', sku:sifraU || null };
            DATA.dijelovi.push(d);
            var rD = await apiInsert('dijelovi', { naziv:d.naziv, stroj:d.stroj, lokacija:d.lokacija,
              stanje:d.stanje, min:d.min, dob:d.dob, cijena:d.cijena, kategorija:d.kategorija, sku:d.sku }, d, {tiho:true});
            odbijeno = (rD === null && REMOTE && naMrezi());
            if(!odbijeno) dodano++;
          }
        }
        if(odbijeno) greske++;
      }catch(err){ greske++; }
    }
    return { dodano:dodano, azurirano:azurirano, greske:greske };
  },

  /* ─── app [05] DETALJ KVARA — detaljKvara, komentariKvara ─── */
  detaljKvara: function(kId){
    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var zadatak = (k.tip||'kvar')==='zadatak';
    var m = machineById(k.m) || {name: zadatak ? 'Opći zadatak' : '—'};
    var chips = '';
    if(zadatak) chips += '<span class="chip zadatak">Zadatak</span> ';
    if(k.status==='otkazan') chips += '<span class="chip otkazan">Otkazan</span>';
    else if(jeOtvoren(k)){
      if(k.prioritet==='hitno') chips += '<span class="chip kvar">HITNO</span> ';
      else if(k.prioritet==='visok') chips += '<span class="chip upoz">Visok</span> ';
      if(k.ceka_dio) chips += '<span class="chip upoz">Čeka dio · stoji</span> ';
      if(k.ceka_servis) chips += '<span class="chip servis">Čeka servis</span> ';
      chips += (k.status==='u_radu') ? '<span class="chip rad">U radu</span>'
             : (k.upoz ? '<span class="chip upoz">Upozorenje</span>' : '<span class="chip kvar">Otvoren</span>');
    } else chips += '<span class="chip rijesen">Riješen</span>';
    var izvorK = (zadatak && k.izvor_kvar) ? DATA.kvarovi.filter(function(x){ return x.id===k.izvor_kvar; })[0] : null;
    var kontaktZ = (zadatak && k.kontakt_id) ? DATA.partneri.filter(function(x){ return x.id===k.kontakt_id; })[0] : null;
    var zadaciUzKvar = zadatak ? [] : DATA.kvarovi.filter(function(x){ return x.tip==='zadatak' && x.izvor_kvar===kId; });
    /* K-3: narudžba koja zna za ovaj kvar — prikaži kao obvezu koja stiže, ne samo "čeka dio" */
    var narudzbaZaKvar = zadatak ? null : (DATA.nabava||[]).filter(function(x){ return x.kvar_id===kId && !x.primljeno; })[0];
    var red = function(l, v){ return v ? '<div class="row-sub" style="margin-top:var(--r1)"><b style="color:var(--text)">'+l+':</b> '+v+'</div>' : ''; };
    /* SMJER-B Detalj (ZADATAK 4/5): podaci koji nisu u meta mreži (rijetko traženi) ostaju
       iza "+ Detalji", istom logikom kao stari "+ Kategorija i smjena" — ne brišu se, samo
       nisu na prvom pogledu. */
    var dodatnoInfo =
      red('Sudjelovali', k.sudjelovali ? esc(k.sudjelovali) : '') +
      red('Zamijenjeno', k.zam ? esc(k.zam) : '') +
      red('Privremeni popravak', k.privremeni
        ? ('da &middot; rok trajne sanacije: '+(k.rok_sanacije
            ? (k.rok_sanacije < todayISO() && k.status!=='rijesen'
                ? '<b style="color:var(--red)">'+fmtDate(k.rok_sanacije)+' — kasni</b>'
                : fmtDate(k.rok_sanacije))
            : 'nije određen'))
        : '') +
      red('Linija otpuštena', k.otpusteno ? 'čišćenje i pregled na strana tijela — '+esc(k.tko||'') : '') +
      (k.status==='otkazan' ? red('Razlog storna', esc(k.storno_razlog||'')) : '') +
      (zadatak ? '' : red('Kategorija', esc(k.kategorija||'Ostalo')) + red('Smjena', k.smjena ? esc(k.smjena) : ''));
    var dodatnoHtml = dodatnoInfo ? '<button type="button" class="btn-mini" style="margin:var(--r2) 0 0" '+
      'onclick="this.nextElementSibling.style.display=\'block\';this.style.display=\'none\'">+ Detalji</button>'+
      '<div style="display:none">'+dodatnoInfo+'</div>' : '';
    /* zaglavlje: podnaslov "kvar · prijavljen danas 07:20" / "zadatak · rok ..." */
    var dan = danaOd(k.date);
    var kada = dan===null ? '' : (dan===0 ? 'danas' : dan===1 ? 'jučer' : dan>1 ? 'prije '+danaTekst(dan) : fmtDate(k.date));
    var vrijemePrij = localDT(k.created_at).t;
    /* E-18: rok danas/jučer/naziv dana/datum kao svugdje drugdje, ne uvijek pun datum. */
    var podnaslov = zadatak
      ? ('zadatak'+(k.rok ? ' · rok '+relDatumKratak(k.rok) : ' · bez roka'))
      : ('kvar'+(kada ? ' · prijavljen '+kada+(vrijemePrij?' '+vrijemePrij:'') : ''));
    /* meta mreža — samo podaci koji stvarno postoje (ne izmišljamo prazne retke) */
    var metaCells = [];
    var mc = function(label, val, cls){ if(val) metaCells.push('<div class="m'+(cls?' '+cls:'')+'"><b>'+label+'</b><span>'+val+'</span></div>'); };
    if(zadatak){
      mc('Rok', k.rok ? relDatumKratak(k.rok) : '—');
      mc('Dodijeljen', k.dodijeljen ? esc(k.dodijeljen) : '—');
      if(izvorK) mc('Iz kvara', '<a class="clink" onclick="app.closeModal();app.detaljKvara(\''+izvorK.id+'\')">'+
        esc((machineById(izvorK.m)||{name:'—'}).name)+'</a>');
      if(kontaktZ) mc('Kontakt', esc(kontaktZ.naziv)+(kontaktZ.tel ?
        ' &middot; <a class="clink" href="tel:'+esc(String(kontaktZ.tel).replace(/[\s\/]/g,''))+'">'+esc(kontaktZ.tel)+'</a>' : ''));
    } else {
      /* VLASNIK-2: "Traje" je preselio u traku koraka, "Gotovo do" u redak stanja —
         meta mreža ostaje kompaktnija: samo Trošak · Radi/Riješio · Dio */
      /* AUDIT F8: dok je kvar otvoren kvarCost(k) je 0 (k.sati se upisuje tek pri rješavanju) —
         "Trošak do sada" je uvijek lagao 0 €, čak i dok je linija stvarno stajala satima.
         Isti izračun kao "Stoji" na Pregledu i kvRedak: samo dok linija stoji, iz poceo_at. */
      if(vidiFinancije()){
        if(jeOtvoren(k)){
          var pM = zaustavljaLiniju(k) ? pocetakKvara(k) : null;
          var satiM = pM ? Math.max(0,(Date.now()-pM.getTime())/3600000) : null;
          if(satiM !== null) mc('Trošak do sada', EUR(satiM*(m.rate||350)), 'role-fin');
        } else mc('Trošak', EUR(kvarCost(k)), 'role-fin');
      }
      if(jeOtvoren(k)) mc('Tko radi', k.tko ? (esc(k.tko)+(localDT(k.poceo_at).t ? ' · od '+localDT(k.poceo_at).t : '')) : (k.dodijeljen ? esc(k.dodijeljen) : ''));
      else mc('Riješio', k.tko ? esc(k.tko) : '—');
      /* ODLUKA 7 (3.9.2026.): "Treba mi do" iz brze prijave (Linija stoji) — samo kad postoji. */
      if(k.treba_do){
        var tdD = localDT(k.treba_do);
        mc('Proizvodnja treba do', esc(tdD.d === todayISO() ? tdD.t : fmtDateTime(k.treba_do)));
      }
      /* E-14: bez narudžbe redak DIO se ne prikazuje uopće (mc preskače prazan val) — prije
         je uvijek renderirao "—" pa je i prazna ćelija u mreži ostajala vidljiva. */
      var dioZaMeta = narudzbaZaKvar ? dioPoId(narudzbaZaKvar.dio_id) : null;
      mc('Dio', narudzbaZaKvar ? (esc(dioZaMeta ? dioZaMeta.naziv : 'naručeno')+(narudzbaZaKvar.ocekivano ? ' · stiže '+fmtDate(narudzbaZaKvar.ocekivano) : '')) : '');
    }
    var kom = (DATA.komentari||[]).filter(function(c){ return c.kvar_id===kId; });
    var komHtml = kom.length ? kom.map(function(c){
      var inic = String(c.tko||'?').trim().split(/\s+/).map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase();
      return '<div class="li" style="align-items:flex-start">'+
        '<div style="width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);'+
        'font-size:var(--t-label);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">'+esc(inic)+'</div>'+
        '<div style="flex:1;min-width:0"><div class="s" style="color:var(--text-2);font-weight:600">'+esc(c.tko)+' · '+fmtDateTime(c.created_at)+'</div>'+
        '<div style="font-size:var(--t-body);margin-top:2px;line-height:1.4">'+esc(c.tekst)+'</div></div></div>';
    }).join('') : '<div class="empty" style="padding:var(--r3)">Još nema komentara.</div>';
    /* Tijek — kronologija sysPoruka vezanih uz ovaj kvar/zadatak, najnovije gore, bez emoji prefiksa */
    var poruke = (DATA.poruke||[]).filter(function(p){ return p.kvar_id===kId; })
      .slice().sort(function(a,b){ return String(b.created_at).localeCompare(String(a.created_at)); });
    var tijekHtml = poruke.length ? poruke.map(function(p){
      var t = String(p.tekst||'').replace(/^[^\wČĆŽŠĐčćžšđ]+\s*/u,'');
      return '<div class="li" style="min-height:40px;align-items:flex-start">'+
        '<div class="s" style="width:44px;flex:none">'+esc(localDT(p.created_at).t)+'</div>'+
        '<div class="s" style="color:var(--text-2)">'+esc(t)+'</div></div>';
    }).join('') : '';
    /* ---- VLASNIK-2: kvar/zadatak = radni nalog — 1 primarna radnja + "Više", umjesto
       popisa .act redaka. "Čeka dio/servis/gotovo do" su STANJE u koraku "U radu", ne
       radnje uz bok. Sve rjeđe potrebno (uredi, storniraj, dodaj dio, naruči dio, zovi
       servis, vrati u rad) živi iza "Više". */
    var koraciHtml = korakTraka(k, zadatak);
    var stanjeHtml = '';
    /* E-14: rok probijen kad je procjena_gotovo u prošlosti dok je nalog otvoren — pilula
       postaje crvena i piše "Rok probijen", dodir i dalje otvara isti gotovoDoSheet. */
    var rokProbijen = !!(k.procjena_gotovo && new Date(k.procjena_gotovo).getTime() < Date.now());
    if(jeOtvoren(k) && !zadatak){
      stanjeHtml = '<div class="stanje role-write">'+
        '<button type="button" class="f'+(k.ceka_dio?' zut-akt':'')+'" onclick="app.cekaDioIzDetalja(\''+kId+'\')">Čeka dio</button>'+
        '<button type="button" class="f'+(k.ceka_servis?' plava-akt':'')+'" onclick="'+
          (k.ceka_servis ? 'app.cekaServisToggle(\''+kId+'\')' : 'app.zoviServis(\''+kId+'\')')+'">Čeka servis</button>'+
        '<button type="button" class="f'+(k.procjena_gotovo ? (rokProbijen ? ' crv-akt' : ' acc-akt') : '')+'" onclick="app.gotovoDoSheet(\''+kId+'\')">'+
          (k.procjena_gotovo ? (rokProbijen ? 'Rok probijen ('+esc(localDT(k.procjena_gotovo).t||k.procjena_gotovo.replace('T',' '))+')' : 'Gotovo do: '+esc(localDT(k.procjena_gotovo).t||k.procjena_gotovo.replace('T',' '))) : 'Gotovo do…')+
        '</button>'+
        '</div>';
    }
    /* jedna primarna radnja — uvijek sljedeći logičan korak dok je nalog otvoren */
    var primarnoHtml = '';
    if(jeOtvoren(k)){
      var primFn = (!zadatak && k.status==='otvoren') ? 'preuzmiKvar' : 'rijesiKvar';
      var primTekst = (!zadatak && k.status==='otvoren') ? 'Preuzimam — radim na ovome' : (zadatak ? 'Označi obavljeno' : 'Riješi kvar');
      primarnoHtml = '<button type="button" class="btn primary nalog-primarni role-write" style="flex:1" '+
        'onclick="app.'+primFn+'(\''+kId+'\')">'+primTekst+'</button>';
    } else if(k.status==='rijesen'){
      primarnoHtml = '<div class="row-sub role-write" style="font-weight:700;color:var(--text)">Riješio '+
        esc(k.tko||'—')+' · '+fmtDateTime(k.closed_at)+' · '+H(k.sati)+'</div>';
    } else if(k.status==='otkazan'){
      primarnoHtml = '<div class="row-sub" style="font-weight:700;color:var(--text)">Stornirano · '+esc(k.storno_razlog||'')+'</div>';
    }
    /* "Više" — sheet sa svime što nije svakodnevna radnja; isti uvjeti kao dosadašnji .act redci */
    var viseStavke = [];
    if(jeOtvoren(k) && !zadatak) viseStavke.push({t:'+ Ugrađen dio', fn:'ugradiDioZaKvar'});
    if(jeOtvoren(k) && !zadatak && !narudzbaZaKvar) viseStavke.push({t:'Naruči dio za ovaj kvar', fn:'naruciZaKvar', cls:'role-voditelj'});
    if(jeOtvoren(k) && !zadatak && !k.ceka_servis) viseStavke.push({t:'Zovi servis', fn:'zoviServis'});
    if(k.status==='rijesen') viseStavke.push({t:'Nije riješeno — vrati u rad', fn:'vratiURad'});
    if(k.status!=='otkazan') viseStavke.push({t:'Uredi', fn:'urediKvar'});
    if(k.status!=='otkazan') viseStavke.push({t:'Storniraj', fn:'stornirajKvar', cls:'role-voditelj opasno', zadnji:true});
    var viseHtml = viseStavke.length
      ? '<button type="button" class="btn sec nalog-vise role-write" onclick="app.viseKvar(\''+kId+'\')">Više</button>'
      : '';
    var akcijeHtml = (primarnoHtml || viseHtml)
      ? '<div style="display:flex;gap:8px;margin-top:var(--r3)'+(primarnoHtml?'':';justify-content:flex-start')+'">'+primarnoHtml+viseHtml+'</div>'
      : '';
    /* podaci za "Više" sheet — spremljeni na window da ih app.viseKvar/otvoriVise pokupi bez
       ponovnog računanja uvjeta (viseStavke već sadrži samo dopuštene retke).
       AUDIT-FIX: mapa po kId je rasla bez granica cijelu sesiju i držala zastarjelo stanje
       (uvjeti izračunati kod otvaranja detalja, ne kod klika na "Više") — pamti se samo
       zadnje otvoreni kvar. */
    window._VISE_STAVKE = { id:kId, stavke:viseStavke };
    var zadaciUzKvarHtml = zadaciUzKvar.length
      ? '<h2 style="margin-top:var(--r4)">Zadaci uz ovaj kvar ('+zadaciUzKvar.length+')</h2><div class="card">'+
        zadaciUzKvar.map(zadatakRedak).join('')+'</div>'
      : '';
    $('#modal-root').innerHTML =
      '<div class="overlay" onclick="if(event.target===this)app.closeModal(\'izvan\')"><div class="modal">'+
      '<div class="det-glava"><button type="button" class="nazad" onclick="app.closeModal()">'+actIkona('back')+'</button>'+
      '<div class="naslov"><div class="t">'+esc(m.name)+'</div><div class="s">'+esc(podnaslov)+'</div></div>'+
      '</div>'+
      '<div class="det-opis'+(zaustavljaLiniju(k) ? ' stoji' : '')+'">'+
      '<div>'+chips+'</div>'+
      '<div class="opis-tekst">'+esc(k.opis)+'</div>'+
      (k.foto ? '<img src="'+esc(k.foto)+'" alt="fotografija kvara" onclick="app.viewFoto(\''+kId+'\')" '+
        'style="margin-top:10px;max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--border);cursor:pointer;display:block">' : '')+
      (k.foto_rijeseno ? '<div class="row-sub" style="margin-top:var(--r2)">Fotografija popravka:</div>'+
        '<img src="'+esc(k.foto_rijeseno)+'" alt="fotografija popravka" onclick="app.viewFotoRijeseno(\''+kId+'\')" '+
        'style="margin-top:var(--r1);max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--border);cursor:pointer;display:block">' : '')+
      '</div>'+
      koraciHtml+
      stanjeHtml+
      akcijeHtml+
      '<div class="meta" style="margin-top:var(--r3)">'+metaCells.join('')+'</div>'+
      dodatnoHtml+
      zadaciUzKvarHtml+
      '<div class="sec"><span>Komentari</span><span>'+kom.length+'</span></div>'+
      komHtml+
      '<form class="role-write" style="margin-top:var(--r2)" onsubmit="app.dodajKomentar(event,\''+kId+'\',\'detalj\')">'+
        '<label>Novi komentar</label>'+
        '<textarea name="tekst" rows="2" required placeholder="što je napravljeno, što čeka, kome je predano…"></textarea>'+
        '<button class="btn sec block" type="submit" style="margin-top:var(--r2)">Dodaj komentar</button>'+
      '</form>'+
      (tijekHtml ? '<div class="sec"><span>Tijek</span></div>'+tijekHtml : '')+
      '</div></div>';
  },

    var k = DATA.kvarovi.filter(function(x){ return x.id===kId; })[0];
    if(!k) return;
    var m = machineById(k.m) || {name:''};
    var lista = (DATA.komentari||[]).filter(function(c){ return c.kvar_id===kId; });
    var listaHtml = lista.length ? lista.map(function(c){
      return '<div class="kvar-item">'+
        '<div class="kvar-top"><span><b style="color:var(--text)">'+esc(c.tko)+'</b></span>'+
        '<span>'+fmtDate(localDT(c.created_at).d)+'</span></div>'+
        '<div style="font-size:var(--t-meta);margin-top:3px">'+esc(c.tekst)+'</div></div>';

    $('#modal-root').innerHTML =
      '<div class="overlay" onclick="if(event.target===this)app.closeModal(\'izvan\')"><div class="modal">'+
