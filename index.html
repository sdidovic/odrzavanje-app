function hexUTamnije(hex, faktor){
  var h = String(hex||'#3a3285').replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16);
  var r = Math.round(((n>>16)&255) * faktor), g = Math.round(((n>>8)&255) * faktor), b = Math.round((n&255) * faktor);
  return '#' + [r,g,b].map(function(x){ return ('0'+Math.min(255,Math.max(0,x)).toString(16)).slice(-2); }).join('');
}
function hexUSvjetlije(hex, udio){
  var h = String(hex||'#3a3285').replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16);
  var r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.round(r + (255-r)*udio); g = Math.round(g + (255-g)*udio); b = Math.round(b + (255-b)*udio);
  return '#' + [r,g,b].map(function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
}
function primijeniIdentitet(){
  var k = document.documentElement.style;
  k.setProperty('--accent', TVRTKA.boja);
  k.setProperty('--accent-dark', hexUTamnije(TVRTKA.boja, 0.72));
  k.setProperty('--accent-soft', hexUSvjetlije(TVRTKA.boja, 0.90));
  k.setProperty('--accent-rub', hexUSvjetlije(TVRTKA.boja, 0.68));
  k.setProperty('--gold', TVRTKA.boja_akcent);
  /* zlatna je pretamna za rub zaglavlja, ali presvijetla za točku od 6 px na bijelom
     (izmjereno 1,39:1) — za oznake u kalendaru koristimo potamnjenu inačicu */
  k.setProperty('--gold-tamni', hexUTamnije(TVRTKA.boja_akcent, 0.54));
  document.title = TVRTKA.naziv + ' — Održavanje';
  var meta = document.querySelector('meta[name="theme-color"]');

  if(pod) pod.textContent = TVRTKA.naziv;
  if(TVRTKA.logo){

    var ll = document.getElementById('login-logo'); if(ll) ll.src = TVRTKA.logo;

  KAT_KVARA = (TVRTKA.kategorije_kvara && TVRTKA.kategorije_kvara.length) ? TVRTKA.kategorije_kvara : KAT_KVARA;
  KAT_DIJELOVA = (TVRTKA.kategorije_dijelova && TVRTKA.kategorije_dijelova.length) ? TVRTKA.kategorije_dijelova : KAT_DIJELOVA;
  MAZIVA = (TVRTKA.maziva && TVRTKA.maziva.length) ? TVRTKA.maziva : MAZIVA_ZADANO;
  MJERNA = (TVRTKA.mjerna_oprema && TVRTKA.mjerna_oprema.length) ? TVRTKA.mjerna_oprema : MJERNA_ZADANO;
}
async function ucitajIdentitet(){

    var r = await sb.from('tvrtka').select('*').eq('id',1).single();

/* ODLUKA 3: tijelo app.saveTvrtku razdvojeno na „primijeni polja iz obrasca" i „spremi",
   pa isti put vrijedi i za korake čarobnjaka. f.has() štiti polja kojih u obrascu NEMA
   (čarobnjak pokazuje samo dio identiteta) — inače bi ih spremanje obrisalo. */
function primijeniTvrtkuIzForme(f){
  var uListu = function(v){ return String(v||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); };
  if(f.has('naziv')) TVRTKA.naziv = String(f.get('naziv')||'').trim() || TVRTKA.naziv;
  if(f.has('puni_naziv')) TVRTKA.puni_naziv = String(f.get('puni_naziv')||'').trim();
  if(f.has('boja')) TVRTKA.boja = f.get('boja') || TVRTKA.boja;
  if(f.has('boja_akcent')) TVRTKA.boja_akcent = f.get('boja_akcent') || TVRTKA.boja_akcent;
  if(f.has('audit_norma')) TVRTKA.audit_norma = String(f.get('audit_norma')||'').trim();
  ['programi','smjene','kategorije_kvara','kategorije_dijelova'].forEach(function(k){
    if(!f.has(k)) return;
    var l = uListu(f.get(k)); if(l.length) TVRTKA[k] = l;
  });
  /* početak smjena: brojevi 0-23, mora ih biti isto koliko i smjena — inače je
     auto-dodjela nepouzdana (tipfeler u satu bi tiho krivo dodjeljivao smjenu) */
  if(f.has('smjene_od')){
    var uneseno = uListu(f.get('smjene_od'));
    var satiOd = uneseno.map(function(x){ return parseInt(x,10); })
      .filter(function(n){ return !isNaN(n) && n>=0 && n<24; });
    /* AUDIT-FIX: neispravan unos se tiho odbacivao natrag na auto-raspored bez ikakve
       poruke — korisnik nije znao zašto se početak smjena „nije spremio". */
    if(uneseno.length && satiOd.length !== TVRTKA.smjene.length){
      toast('Početak smjena nije spremljen — treba '+TVRTKA.smjene.length+' broj(eva) 0–23');
    }
    TVRTKA.smjene_od = (satiOd.length === TVRTKA.smjene.length) ? satiOd : null;
  }
  /* §11.5: maziva/mjerna oprema iz koda u postavku — „naziv | oznaka | primjena" po retku;
     redak koji ne prati format (nema dovoljno „|") se preskoči, ne ruši spremanje */
  if(f.has('maziva')){
    var mazivaL = uListu(f.get('maziva')).map(function(r){
      var d = r.split('|').map(function(x){ return x.trim(); });
      return d.length>=3 ? {naziv:d[0], oznaka:d[1], primjena:d.slice(2).join(' | ')} : null;
    }).filter(Boolean);
    if(mazivaL.length) TVRTKA.maziva = mazivaL;
  }
  if(f.has('mjerna_oprema')){
    var mjernaL = uListu(f.get('mjerna_oprema')).map(function(r){
      var d = r.split('|').map(function(x){ return x.trim(); });
      return d.length>=2 ? {naziv:d[0], rezim:d.slice(1).join(' | ')} : null;
    }).filter(Boolean);
    if(mjernaL.length) TVRTKA.mjerna_oprema = mjernaL;
  }
  if(PENDING_LOGO){ TVRTKA.logo = PENDING_LOGO; PENDING_LOGO = ''; }
  primijeniIdentitet();
}

/* ═══ [06] OPĆI HELPERI — $(), datumi, fmtDate/EUR, esc(), traka koraka ═══ */
function $(s){ return document.querySelector(s); }
function pad2(n){ return String(n).length<2 ? '0'+n : String(n); }
function isoShift(days){
  var d = new Date(); d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function todayISO(){ return isoShift(0); }
/* ODLUKA 8 (3.9.2026.): izdvojeno iz renderPregled da test može zamijeniti W.danUMjesecu
   i simulirati početak/kraj mjeseca bez diranja pravog datuma. */
function danUMjesecu(){ return new Date().getDate(); }
/* VLASNIK-1: brzi izbori raspona datuma za filtar kvarova */
function iso(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function datumBrzoRaspon(key){
  var t = new Date();
  var y = t.getFullYear(), m = t.getMonth();
  if(key==='danas') return { od: todayISO(), do: todayISO() };
  if(key==='7d') return { od: isoShift(-6), do: todayISO() };
  if(key==='30d') return { od: isoShift(-29), do: todayISO() };
  if(key==='mj'){
    var zadnji = new Date(y, m+1, 0).getDate();
    return { od: iso(y,m+1,1), do: iso(y,m+1,zadnji) };
  }
  if(key==='prm'){
    var pm = m===0?11:m-1, py = m===0?y-1:y;
    var zadnjiP = new Date(py, pm+1, 0).getDate();
    return { od: iso(py,pm+1,1), do: iso(py,pm+1,zadnjiP) };
  }
  return { od:'', do:'' };  /* 'sve' */
}

function fmtDate(iso){
  var p = iso.split('-');
  return parseInt(p[2],10)+'.'+parseInt(p[1],10)+'.'+p[0]+'.';
}
/* E2-12: kratki datum bez godine ("4.9.") — za retke gdje puni fmtDate ("4.9.2026.")
   ne staje uz gumb u istom retku. Godina se u tim retcima ionako podrazumijeva (blizu dan). */
function fmtDateKratko(iso){
  var p = iso.split('-');
  return parseInt(p[2],10)+'.'+parseInt(p[1],10)+'.';
}
function EUR(n){ return Math.round(n).toLocaleString('hr-HR')+' €'; }
function H(n){ return n.toLocaleString('hr-HR',{maximumFractionDigits:1})+' h'; }
/* Točan početak kvara: poceo_at (preuzet) → created_at (prijavljen).
   Ako imamo SAMO datum, sat ne znamo — i ne izmišljamo ga. Prije je ovdje stajao
   datum + 06:00, pa je kvar prijavljen u podne odmah tvrdio da traje šest sati. */
function pocetakKvara(k){
  var t = k.poceo_at || k.created_at;
  if(t){ var d = new Date(t); if(!isNaN(d.getTime())) return d; }
  return null;
}
function danaOd(iso){
  if(!iso) return null;
  var a = new Date(String(iso).slice(0,10)+'T00:00:00');
  var b = new Date(todayISO()+'T00:00:00');
  if(isNaN(a.getTime())) return null;
  return Math.round((b - a) / 86400000);
}
function danaTekst(n){ return n + ((n%10===1 && n%100!==11) ? ' dan' : ' dana'); }
/* koliko kvar traje SADA — "Zastoj 0h" dok linija stoji je suprotno od istine */
function trajanjeKvara(k){
  var p = pocetakKvara(k);
  if(!p){
    /* znamo samo dan prijave — brojimo dane, ne sate */
    var d = danaOd(k.date);
    if(d === null) return '';
    return d <= 0 ? 'prijavljen danas' : 'traje već '+danaTekst(d);
  }
  var sati = (Date.now() - p.getTime()) / 3600000;
  if(sati < 0) sati = 0;
  if(sati < 1)  return 'traje već '+Math.max(1, Math.round(sati*60))+' min';
  if(sati < 24) return 'traje već '+H(Math.round(sati*10)/10);
  return 'traje već '+danaTekst(Math.floor(sati/24));
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* Za slobodan tekst (ime osobe, naziv stroja/dijela/partnera) koji se ubacuje u JS
   string literal unutar onclick="..." atributa: esc() sam nije dovoljan jer preglednik
   prvo HTML-dekodira atribut pa &#39; opet postane doslovni apostrof koji probija JS
   string. jsArg() prvo pobjegne \ i ' za JS, pa tek onda taj rezultat provuče kroz esc(). */
function jsArg(s){
  /* PREGLED-C: i novi red mora biti pobjegnut — doslovni \n preživi HTML atribut, a u JS
     string literalu je sintaksna greška, pa bi onclick bio mrtav (npr. pločica za prijavu
     korisnika čije ime je kroz API upisano s novim redom). \n/\r idu NAKON \\ zamjene. */
  return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/\n/g,'\\n').replace(/\r/g,'\\r'));
}
/* SERIJA F: prvi dan nove firme — DATA.machines/dijelovi/partneri prazni. Jedan vizualni

/* VLASNIK-2: kvar/zadatak je radni nalog s 4 (odn. 2) koraka — traka pokazuje gdje je
   nalog SADA, umjesto rečenice ili gomile gumba. otkazan nema korake, samo "Stornirano". */
function korakTraka(k, zadatak){
  if(k.status==='otkazan')
    return '<div class="koraci-off"><span>Stornirano</span></div>';
  var koraci, aktivnoIdx;
  if(zadatak){
    koraci = [
      {n:'Otvoren', v:localDT(k.created_at).t},
      {n:'Obavljen', v:localDT(k.closed_at).t}
    ];
    aktivnoIdx = k.status==='rijesen' ? 1 : 0;
  } else {
    koraci = [
      {n:'Prijavljen', v:localDT(k.created_at).t},
      {n:'Preuzet', v:localDT(k.poceo_at).t},
      {n:'U radu', v: k.status==='u_radu' ? (trajanjeKvara(k)||'') : ''},
      {n:'Riješen', v:localDT(k.closed_at).t}
    ];
    aktivnoIdx = (k.status==='otvoren' ? 1 : (k.status==='u_radu' ? 3 : 4)) - 1;
  }
  return '<div class="koraci">'+koraci.map(function(kr,i){
    var cls = i<aktivnoIdx ? 'proslo' : (i===aktivnoIdx ? 'aktivno' : 'buduce');
    return '<div class="korak '+cls+'"><div class="korak-tocka"></div>'+
      '<div class="korak-txt"><div class="korak-n">'+esc(kr.n)+'</div>'+
      (kr.v ? '<div class="korak-v">'+esc(kr.v)+'</div>' : '')+
      '</div></div>';
  }).join('')+'</div>';
}

var KV_LIMIT = 1000;   /* početno učitavanje — "Učitaj cijelu povijest" diže na sve */
var KV_SVE = false;
/* Raste na svaku promjenu načina rada (prijava, odjava, ulazak u demo). Dohvat iz baze
   koji je krenuo prije promjene mora odbaciti svoj rezultat, ne pregaziti DATA. */
var SESIJA_GEN = 0;
var LOAD_U_TIJEKU = false;
async function load(tiho){
  if(!REMOTE){ localLoad(); return; }
  /* AUDIT: polling (30s), povratak na tab i sva tri realtime kanala svaki neovisno
     mogu pokrenuti load() — bez brave dva preklopljena poziva mogu zavrsiti obrnutim
     redoslijedom pa noviji odgovor prepise stariji (isti obrazac kao SYNC_U_TIJEKU). */
  if(LOAD_U_TIJEKU) return;
  LOAD_U_TIJEKU = true;
  if(!tiho) pokaziLoader();
  var mojaSesija = SESIJA_GEN;   /* ako se u međuvremenu uđe u demo, ovaj rezultat je zastario */
  try{
  var qKv = sb.from('kvarovi').select('*').order('date', {ascending:false});
  if(!KV_SVE) qKv = qKv.limit(KV_LIMIT);
  var r = await Promise.all([
    sb.from('machines').select('*').order('id'),
    qKv,
    sb.from('dijelovi').select('*'),
    sb.from('preventiva').select('*'),
    sb.from('partneri').select('*'),
    sb.from('komentari').select('*').order('created_at'),
    sb.from('poruke').select('*').order('created_at', {ascending:false}).limit(300),  /* AUDIT F1: najnovije, ne najstarije */
    sb.from('users').select('ime, role, aktivan'),
    sb.from('nabava').select('*').order('narucen', {ascending:false}).limit(200),
    sb.from('dokumenti').select('*').order('created_at', {ascending:false})
  ]);
  /* Ranije je ovdje stajalo "i < 7", pa su greške za users i nabavu tiho nestale:
     "nema otvorenih narudžbi" zbog pada upita izgleda isto kao stvarno prazan popis,
     a posljedica je da voditelj naruči sve po drugi put. */
  var IMENA = ['strojevi','kvarovi','dijelovi','preventiva','partneri','komentari','poruke','korisnici','nabava','dokumenti'];
  for(var i=0;i<r.length;i++){
    if(!r[i] || !r[i].error) continue;
    if(i < 7) throw r[i].error;                       /* bez ovoga app nema što prikazati */
    zapisiGresku('Učitavanje nije uspjelo: '+IMENA[i], (r[i].error && r[i].error.message) || String(r[i].error));
    toast('Dio podataka ('+IMENA[i]+') nije učitan — osvježi ekran');
  }
  /* Dok je dohvat trajao, netko je mogao ući u demo način (ili se odjaviti). Rezultat
     tada NE smije pregaziti DATA — inače demo prikaže žive podatke, a već otvoreni
     zapisi ostanu vezani na objekte kojih više nema u DATA. */
  if(!REMOTE || SESIJA_GEN !== mojaSesija) return;
  /* AUDIT F8: ako je NOVA optimistička operacija krenula DOK je ovaj dohvat bio u
     tijeku (pozivatelji provjere PENDING_OPS samo PRIJE poziva load()), taj unos
     jos nije nuzno u odgovoru koji upravo dolazi — DATA=... nize bi ga tiho izbrisao
     do sljedeceg pollinga. Preskace se samo ako vec imamo sto cuvati (ne na prvom
     ucitavanju, gdje je prazan DATA gori od blago zastarjelog). */
  if(PENDING_OPS > 0 && DATA) return;
  /* popis majstora dolazi iz baze — kad se osoblje promijeni, alat to sam preuzme */
  if(r[7] && r[7].data && r[7].data.length){
    var akt = r[7].data.filter(function(u){ return u.aktivan !== false && u.role === 'majstor'; })
                       .map(function(u){ return u.ime; });
    if(akt.length) MAJSTORI = akt;
    /* Raspored v45: OSOBE je bio zamrznut na demo popis — na živoj bazi planer mora
       graditi pilule/čipove iz stvarnih majstora */
    OSOBE = MAJSTORI.concat(['Voditelj']);
    ULOGA_PO_IMENU = {};   /* AUDIT F8 */
    r[7].data.forEach(function(u){ ULOGA_PO_IMENU[u.ime] = u.role; });
  }
  DATA = {
    machines: r[0].data,
    kvarovi: r[1].data,
    dijelovi: r[2].data,
    preventiva: r[3].data.map(function(p){ p.tkoZadnji = p.tko_zadnji; return p; }),
    partneri: r[4].data,
    komentari: r[5].data,
    poruke: (r[6].data||[]).slice().reverse(),  /* AUDIT F1: dohvat je silazni, DATA ostaje kronoloski */
    nabava: (r[8] && r[8].data) ? r[8].data : [],
    dokumenti: (r[9] && r[9].data) ? r[9].data : []
  };
  primijeniRed();     /* nesinkronizirani lokalni unosi ostaju vidljivi */
  cacheSpremi();      /* da app radi i kad mreža padne */
  }finally{ LOAD_U_TIJEKU = false; if(!tiho) sakrijLoader(); }

function naMrezi(){ return navigator.onLine !== false; }
function uRed(table, op, row, localObj, extra){

            row:row, tempId: localObj ? localObj.id : (row && row.id) || null };
  /* AUDIT F3: uvjet (npr. status kvara) i najava (sysPoruka/push nakon uspjeha) putuju s redom */
  if(extra && extra.uvjet) z.uvjet = extra.uvjet;

/* AUDIT F3: idempotentan insert — id nastaje NA KLIJENTU, pa ponovljeno slanje istog
   zapisa (odgovor se izgubio na losoj mrezi, red ga posalje opet) zavrsi sudarom
   primarnog kljuca (23505) koji se tretira kao "vec je proslo", ne kao novi redak. */
function klijentskiUuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8); return v.toString(16);
  });
}
/* tablice ciji PK NIJE uuid koji klijent smije zadati */
var BEZ_KLIJENT_ID = { machines:1, tvrtka:1, greske:1, audit_log:1, sustav_postavke:1 };
function dupliKljuc(err){ return !!(err && err.code === '23505'); }
/* poznati PROLAZNI Postgres kodovi (timeout upita, deadlock, zauzeta veza...) — ovi
   NE smiju se tretirati kao trajno odbijanje (RLS/FK/23505 i sl.) u sinkroniziraj() */
var PROLAZNI_DB_KODOVI = { '57014':1,'40001':1,'40P01':1,'53300':1,'53400':1,'08000':1,'08003':1,'08006':1,'08001':1,'08004':1 };
function trajnaBazaGreska(err){ return !!(err && err.code && !PROLAZNI_DB_KODOVI[err.code]); }
/* kad zapis dobije pravi ID iz baze, prepiši ga u ostatku reda (npr. komentar na taj kvar) */
function zamijeniIdURedu(stari, novi){
  if(!stari || !novi || stari===novi) return;
  RED.forEach(function(z){
    if(z.tempId === stari) z.tempId = novi;
    if(z.row){
      Object.keys(z.row).forEach(function(k){ if(z.row[k] === stari) z.row[k] = novi; });
      if(z.row.params) Object.keys(z.row.params).forEach(function(k){ if(z.row.params[k] === stari) z.row.params[k] = novi; });  /* AUDIT F4: rpc namjere */
    }
  });

}
function primijeniRed(){
  /* lokalni zapisi koji još nisu u bazi ne smiju nestati nakon osvježavanja */
  RED.forEach(function(z){
    var kljuc = TABLE2KEY[z.table]; if(!kljuc || !DATA[kljuc]) return;
    if(z.op === 'insert'){
      var vec = DATA[kljuc].some(function(x){ return x.id === z.tempId; });
      if(!vec){
        var kopija = JSON.parse(JSON.stringify(z.row));
        kopija.id = z.tempId;
        if(z.table==='preventiva' && kopija.tko_zadnji) kopija.tkoZadnji = kopija.tko_zadnji;
        DATA[kljuc].push(kopija);
      }
    } else if(z.op === 'rpc'){
      /* AUDIT F4: svjeze ucitan DATA jos ne zna za deltu koja ceka u redu */
      if(z.row && z.row.fn === 'razduzi_dio'){
        var dioR = DATA.dijelovi.filter(function(x){ return x.id === z.row.params.p_id; })[0];
        if(dioR) dioR.stanje = Math.max(0, dioR.stanje - z.row.params.p_kolicina);
      }
    } else {
      var zapis = DATA[kljuc].filter(function(x){ return x.id === z.tempId; })[0];
      if(zapis) Object.keys(z.row).forEach(function(k){
        zapis[k] = z.row[k];
        if(k==='tko_zadnji') zapis.tkoZadnji = z.row[k];
      });
    }
  });
}
async function sinkroniziraj(rucno){
  /* AUDIT F8: jedan uvjet je spajao tri razlicita ishoda — "vec se salje" je dobivalo
     istu potvrdu kao "nema nista za slanje", iako u redu jos ceka nekoliko zapisa. */
  if(!REMOTE) return;
  if(SYNC_U_TIJEKU){ if(rucno) toast('Slanje je već u tijeku…'); return; }
  if(!RED.length){ if(rucno) toast('Sve je sinkronizirano ✓'); return; }
  if(!naMrezi()){ if(rucno) toast('Nema mreže — pokušat ću sam kad se vrati'); return; }
  SYNC_U_TIJEKU = true;
  var poslano = 0, zapelo = false, preskoceno = 0, sesijaIsteklaSad = false;
  try{
    while(RED.length){
      var z = RED[0];
      var res;
      if(z.op === 'insert'){
        res = await sb.from(z.table).insert(z.row).select().single();
        if(res.error && dupliKljuc(res.error)){
          /* AUDIT F3: raniji pokusaj je prosao, odgovor se izgubio — ne dupliciraj */
          res = { data: z.row, error: null };
        }
      } else if(z.op === 'rpc'){
        /* AUDIT F4: odgodjena namjera (razduzi_dio) — izvrsi se atomarno na serveru */
        res = await sb.rpc(z.row.fn, z.row.params);
        if(!res.error) res = { data: [{ id: z.tempId }], error: null };
      } else {
        var q = sb.from(z.table).update(z.row).eq('id', z.tempId);
        if(z.uvjet) Object.keys(z.uvjet).forEach(function(k){
          q = Array.isArray(z.uvjet[k]) ? q.in(k, z.uvjet[k]) : q.eq(k, z.uvjet[k]);
        });
        res = await q.select('id');
      }
      if(res.error){
        if(sesijaIstekla(res.error)){
          /* AUDIT-FIX: istekla sesija — retry sa starim tokenom NIKAD neće uspjeti,
             pa se ovo dosad tiho pokušavalo iznova svakih 30s zauvijek. Zapis ostaje
             u redu (poslat će se nakon ponovne prijave), ali korisnik mora znati zašto. */
          sesijaIsteklaSad = true; zapelo = true; break;
        }
        if(trajnaBazaGreska(res.error) && naMrezi()){
          /* trajna greška (npr. RLS/FK) — makni iz reda da ne blokira ostalo, zabilježi i javi korisniku.
             Prolazni kodovi (57014 timeout upita, deadlock...) padaju u granu ispod i probaju se ponovno. */
          zapisiGresku('Sinkronizacija odbijena ('+z.table+')', res.error.message);
          RED.shift(); redSpremi(); preskoceno++; continue;
        }
        zapelo = true; break;   /* mreža — probaj kasnije */
      }
      /* AUDIT-FIX: update().eq() na obrisan/nepostojeći redak vraća 0 pogođenih
         redaka BEZ greške — dosad se tiho tretiralo kao uspjeh, a promjena nikad
         nije primijenjena (npr. netko drugi je u međuvremenu obrisao/promijenio kvar). */
      if(z.op === 'update' && (!res.data || !res.data.length)){
        zapisiGresku('Sinkronizacija preskočena ('+z.table+')', 'zapis '+z.tempId+' više ne postoji ili nije dostupan za izmjenu');
        RED.shift(); redSpremi(); preskoceno++; continue;
      }
      if(z.op === 'insert' && res.data && res.data.id){
        var staroIdIns = z.tempId;   /* zamijeniIdURedu ispod mijenja i z.tempId (z je jos u RED-u) — zapamti prije */
        zamijeniIdURedu(z.tempId, res.data.id);
        /* AUDIT: zamijeniIdURedu mijenja samo preostale stavke REDA — zivi DATA objekt
           koji korisnik vec gleda dosad je cekao naknadni uvjetni load(), a dotle je
           jeTempId() blokirao svaku radnju nad vec spremljenim zapisom. */
        var kljucIns = TABLE2KEY[z.table];
        if(kljucIns && DATA[kljucIns] && staroIdIns !== res.data.id){
          var lokalniIns = DATA[kljucIns].filter(function(x){ return x.id === staroIdIns; })[0];
          if(lokalniIns){ lokalniIns.id = res.data.id; rerender(); }
        }
      }
      /* AUDIT F3: odgodjena najava — kvar prijavljen bez mreze sad ipak dobije
         sistemsku poruku i push kad se veza vrati */
      if(z.najava){
        try{
          /* PREGLED serije B: veza sistemske poruke je UVIJEK kvar (poruke.kvar_id ima FK na
             kvarovi). Za insert u 'kvarovi' to je bas taj novi zapis, ali za odgodjeni KOMENTAR
             je res.data.id id komentara — takva poruka pada na FK (23503), ide natrag u red i
             sinkronizacija je onda odbaci uz "1 zapis odbačen ⚠". Kvar se cita iz retka
             (zamijeniIdURedu ga je vec podigao na pravi ID). */
          var vezaNaj = (z.table === 'kvarovi') ? ((res.data && res.data.id) || null)
                                                : ((z.row && z.row.kvar_id) || null);
          if(z.najava.tekst) sysPoruka(z.najava.tekst, vezaNaj);
          if(z.najava.obavijest) posaljiObavijest(z.najava.obavijest.naslov, z.najava.obavijest.tekst,
                                                  z.najava.obavijest.ruta, z.najava.obavijest.samoZa);
        }catch(eN){}
      }
      RED.shift(); redSpremi(); poslano++;
    }
  }catch(e){ zapelo = true; }
  SYNC_U_TIJEKU = false;
  osvjeziOfflineTraku();
  /* AUDIT-FIX: prije je korisnik koji je unos napravio ostajao bez ikakve povratne
     informacije kad bi red trajno odbacio njegov zapis — javljalo se samo u admin
     dnevniku grešaka koji obični korisnik ne vidi. Sad se to vidi u traci na dnu ekrana. */
  if(sesijaIsteklaSad){
    toast('Sesija je istekla — ponovno se prijavi da nastaviš slanje');
  } else if(poslano || preskoceno){
    var dio = [];
    if(poslano) dio.push(poslano+' poslano');
    if(preskoceno) dio.push(preskoceno+(preskoceno===1?' zapis odbačen':' zapisa odbačeno'));
    toast('Sinkronizacija: '+dio.join(', ')+(poslano?' ✓':' ⚠'));
    /* AUDIT F3: load() nakon slanja postuje iste straze kao polling — ne gazi otvorenu formu */
    if(poslano && !$('#modal-root').innerHTML && PENDING_OPS <= 0){ try{ await load(true); rerender(); }catch(e){} }
  } else if(rucno && zapelo){ toast('Mreža još nije dostupna'); }
}
function osvjeziOfflineTraku(){
  var el = $('#offline-traka'); if(!el) return;
  var n = RED.length;
  if(RED_NESPREMLJEN){
    el.style.display = '';
    el.className = 'off-traka';
    el.innerHTML = '⚠ Memorija uređaja je puna — <b>unos nije trajno spremljen</b>. Ne zatvaraj aplikaciju.';
    return;
  }
  if(!REMOTE || (naMrezi() && !n)){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.className = 'off-traka' + (naMrezi() ? ' ceka' : '');
  el.innerHTML = naMrezi()
    ? '⏳ Nespremljeno: <b>'+n+'</b> — <button type="button" class="link-btn" onclick="app.sinkroniziraj()">pošalji sada</button>'
    : '📴 Nema mreže — radi se lokalno'+(n ? ', <b>'+n+'</b> za slanje' : '')+'. Sve se šalje samo kad se veza vrati.'+
      (CACHE_ZASTARIO ? ' <b>Lokalna kopija možda nije najnovija</b> (memorija uređaja je bila puna).' : '');
}

/* ═══ [13] API SLOJ — apiInsert / apiUpdate (jedini put za upis), klasifikacija grešaka ═══ */
/* AUDIT F4: jedinstveno razduzivanje skladista — uvijek DELTA kroz atomarni RPC,
   nikad apsolutna vrijednost. Offline (ili pad RPC-a) sprema NAMJERU u red pa je
   sinkronizacija izvrsi kroz isti RPC; apsolutni upis je gazio tudje razduzenje. */
async function razduziAtomarno(pDio, kolicina){
  if(!REMOTE){ save(); return; }
  if(naMrezi()){
    try{
      var r = await rpcMreza('razduzi_dio', { p_id: pDio.id, p_kolicina: kolicina });
      if(!r.error && typeof r.data === 'number'){ pDio.stanje = r.data; cacheSpremi(); return; }
      if(r.error && !sesijaIstekla(r.error) && !mreznaGreska(r.error)){
        zapisiGresku('Razduzivanje odbijeno', (r.error && r.error.message) || String(r.error));
        toast('Skladište nije ažurirano — osvježi ekran');
        return;
      }
    }catch(e){ /* mrezna greska — namjera ide u red */ }
  }
  uRed('dijelovi', 'rpc', { fn:'razduzi_dio', params:{ p_id:pDio.id, p_kolicina:kolicina } }, {id:pDio.id});
  toast('Spremljeno lokalno — čeka mrežu');
  cacheSpremi();
}
async function apiInsert(table, row, localObj, extra){
  if(!REMOTE){ if(save()) toast('Spremljeno ✓'); return localObj; }  /* AUDIT F8 */
  if(row && !row.id && !BEZ_KLIJENT_ID[table]) row.id = klijentskiUuid();  /* AUDIT F3 */
  if(!naMrezi()){ uRed(table, 'insert', row, localObj, extra); toast('Spremljeno lokalno — čeka mrežu'); cacheSpremi(); return null; }
  PENDING_OPS++;
  try{
    var res = await sb.from(table).insert(row).select().single();
    if(res.error) throw res.error;
    if(localObj && res.data && res.data.id && localObj.id !== res.data.id){
      zamijeniIdURedu(localObj.id, res.data.id);
      localObj.id = res.data.id;  /* pravi ID iz baze */
      rerender();                 /* osvježi onclick atribute na novi ID */
    }
    toast('Spremljeno ✓');
    cacheSpremi();
    return res.data;
  }catch(err){
    if(dupliKljuc(err)){
      /* AUDIT F3: zapis s ovim id-em vec postoji — raniji pokusaj je ipak prosao.
         Lokalni objekt jos uvijek nosi privremeni prikazni ID — bez ovoga jeTempId()
         ostaje zauvijek true za vec spremljen zapis (isti popravak kao uspjesna grana gore). */
      /* PREGLED serije B: i ovdje treba zamijeniIdURedu kao u uspjesnoj grani gore — inace
         zapisi koji vec cekaju u redu (npr. sistemska poruka na taj kvar) ostaju vezani na
         privremeni ID. Straza row.id: tablice iz BEZ_KLIJENT_ID nemaju klijentski id, pa bi
         se localObj.id inace prepisao s undefined. */
      if(localObj && row && row.id && localObj.id !== row.id){

      toast('Sesija je istekla — spremljeno lokalno, poslat će se nakon ponovne prijave');

    alert('Spremanje NIJE uspjelo — zapis nije u bazi.\n('+((err&&err.message)||err)+')');

}
async function apiUpdate(table, id, patch, uvjet, extra){
  /* ODLUKA 12 (3.9.2026.): peti argument `extra` ({tiho:true}) je nov — postojeći pozivi
     ga ne šalju i ponašaju se identično kao prije. Treba ga skupnom uvozu (CSV) koji
     ažurira više redaka: bez tihog moda bi svaki odbijeni redak iskočio kao alert(). */
  if(!REMOTE){ if(save()) toast('Spremljeno ✓'); return true; }  /* AUDIT F8 */
  if(!naMrezi()){ uRed(table, 'update', patch, {id:id}, {uvjet:uvjet}); toast('Spremljeno lokalno — čeka mrežu'); cacheSpremi(); return null; }
  PENDING_OPS++;
  try{
    /* AUDIT F3: uvjet (npr. { status:['otvoren','u_radu'] }) sprjecava da zastarjeli ekran
       pregazi tudju promjenu — 0 pogodjenih redaka ide u postojecu granu greske. */
    var q = sb.from(table).update(patch).eq('id', id);
    if(uvjet) Object.keys(uvjet).forEach(function(k){
      q = Array.isArray(uvjet[k]) ? q.in(k, uvjet[k]) : q.eq(k, uvjet[k]);
    });
    var res = await q.select('id');
    if(res.error) throw res.error;
    /* AUDIT-FIX: 0 pogođenih redaka (zapis obrisan/nedostupan u međuvremenu) nije
       greška po Supabase-u, ali ni uspjeh — bez ove provjere korisnik vidi "Spremljeno ✓"
       dok promjena stvarno nije nigdje upisana. */
    if(!res.data || !res.data.length){
      if(uvjet){
        /* ocekivan ishod uvjetnog updatea (npr. status vise nije 'otvoren') — netko je
           bio brzi, poruka ostaje generička */
        throw new Error('Zapis više ne postoji u bazi (možda ga je netko obrisao ili promijenio).');
      }
      /* AUDIT F8: bez uvjeta 0 redaka gotovo uvijek znaci da RLS nije dopustio pisanje
         (izmjena izvan uloge) — brisanje je RLS-om zabranjeno za skoro sve tablice, pa
         je "netko je obrisao" bila gotovo uvijek kriva dijagnoza. Provjera postojanja
         razlikuje ta dva ishoda. */
      var josPostoji = false;
      try{ var chk = await sb.from(table).select('id').eq('id', id).limit(1); josPostoji = !chk.error && !!(chk.data && chk.data.length); }catch(eChk){}
      throw new Error(josPostoji
        ? 'Nemaš ovlasti za ovu izmjenu — javi voditelju.'
        : 'Zapis više ne postoji u bazi (možda ga je netko obrisao ili promijenio).');
    }
    toast('Spremljeno ✓');
    cacheSpremi();
    return true;
  }catch(err){
    if(sesijaIstekla(err)){
      uRed(table, 'update', patch, {id:id}, {uvjet:uvjet});
      toast('Sesija je istekla — spremljeno lokalno, poslat će se nakon ponovne prijave');
      cacheSpremi();
      return null;
    }
    if(mreznaGreska(err)){
      uRed(table, 'update', patch, {id:id}, {uvjet:uvjet});
      toast('Mreža nedostupna — spremljeno lokalno');
      cacheSpremi();
      return null;
    }
    zapisiGresku('Izmjena odbijena ('+table+')', (err && err.message) || String(err));
    if(extra && extra.tiho) return null;   /* ODLUKA 12: skupni uvoz javlja JEDAN sažetak, ne alert po retku */
    alert('Spremanje NIJE uspjelo — promjena nije u bazi.\n('+((err&&err.message)||err)+')');
    try{ await load(); }catch(e2){}  /* vrati se na stanje iz baze */
    rerender();
    return null;
  }finally{ PENDING_OPS--; }
}
function mreznaGreska(err){
  if(!naMrezi()) return true;
  var m = ((err && (err.message || err.msg)) || String(err)).toLowerCase();
  return m.indexOf('fetch') > -1 || m.indexOf('network') > -1 || m.indexOf('timeout') > -1 ||
         m.indexOf('failed to') > -1 || m.indexOf('load failed') > -1;
}
/* AUDIT-FIX §5: "Failed to fetch" prema pauziranom Supabase projektu (besplatni plan,
   7 dana neaktivnosti) izgleda identično kao obična nestašica WiFi-ja — jedina razlika
   je da uređaj SAM sebe smatra online. Ne možemo biti sigurni, ali možemo barem ponuditi
   ispravnu sumnju umjesto da uvijek tvrdimo "nema mreže" kad internet zapravo radi. */
function mozdaBazaSpava(err){
  if(!naMrezi()) return false;
  var m = ((err && (err.message || err.msg)) || String(err)).toLowerCase();
  return m.indexOf('fetch') > -1 || m.indexOf('failed to') > -1 || m.indexOf('load failed') > -1;
}
/* AUDIT-FIX (2. krug): PGRST301 (istekla JWT sesija) je dosad prepoznat samo unutar
   sinkroniziraj() reda čekanja — izravno spremanje (apiInsert/apiUpdate, korisnik online
   s isteklom sesijom) padalo je na generičku "Spremanje NIJE uspjelo" s kriptičnom porukom
   greške. Zajednička provjera koristi se na sva tri mjesta. */
function sesijaIstekla(err){ return !!(err && err.code === 'PGRST301'); }

/* =====================================================================
   PUSH OBAVIJESTI — stižu na mobitel i kad je aplikacija zatvorena.

var VAPID_PUB = 'BHFE8J6blBatRrkvb7mCK8LErrSNMieIUA3IifazylyENNc58UhvSPO_bEyB81kIR5WCQsiox00RKn7ZBaRldJ4';
function b64uUArray(b64){
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var s = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  var raw = atob(s), arr = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushPodrzan(){
  return REMOTE && 'serviceWorker' in navigator && 'PushManager' in window &&
         location.protocol === 'https:';
}
async function pushStanje(){
  if(!pushPodrzan()) return 'nepodrzano';
  if(Notification.permission === 'denied') return 'blokirano';
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    return sub ? 'ukljuceno' : 'iskljuceno';
  }catch(e){ return 'iskljuceno'; }
}
/* dijeli je pushUkljuci() i poruka od service workera nakon automatske rotacije pretplate */
async function posaljiPushPretplatu(sub){
  if(!REMOTE || !SESSION || !SESSION.ime) return false;
  var j = sub.toJSON ? sub.toJSON() : sub;
  if(!j || !j.endpoint || !j.keys) return false;
  try{
    /* AUDIT F4: upsert preko tudjeg retka (dijeljeni uredjaj) RLS je tiho odbijao —
       push_preuzmi (audit1.sql) preuzima endpoint atomarno; dok migracija nije
       pokrenuta, pada se natrag na stari upsert (radi za vlastiti redak). */
    var rr = await sb.rpc('push_preuzmi', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    if(rr.error){
      var up = await sb.from('push_pretplate').upsert({
        korisnik: SESSION.ime,
        endpoint: j.endpoint,
        p256dh: j.keys.p256dh,
        auth: j.keys.auth
      }, { onConflict:'endpoint' });
      if(up.error){ zapisiGresku('Push pretplata nije uspjela', up.error.message || String(up.error)); return false; }
    }
    return true;
  }catch(e){ zapisiGresku('Push pretplata nije uspjela', String(e)); return false; }
}
async function pushUkljuci(){
  if(!pushPodrzan()){
    toastUpoz('Obavijesti rade kad je aplikacija dodana na početni zaslon i otvorena preko interneta (https).');
    return false;
  }
  var dozvola = await Notification.requestPermission();
  if(dozvola !== 'granted'){ toast('Obavijesti nisu dopuštene'); return false; }
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64uUArray(VAPID_PUB)
      });
    }
    /* AUDIT F8: prije se "Obavijesti uključene ✓" javljalo bez obzira je li server ikad
       primio pretplatu — sad poruka prati stvarni ishod. */
    var uspjeh = await posaljiPushPretplatu(sub);
    if(uspjeh) toast('Obavijesti uključene ✓');
    else toast('Obavijesti nisu spremljene na server — pokušaj ponovno');
    return uspjeh;
  }catch(e){ zapisiGresku('Push pretplata nije uspjela', String(e)); toast('Ne mogu uključiti obavijesti'); return false; }
}
async function pushIskljuci(){
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(sub){
      await sb.from('push_pretplate').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
    toast('Obavijesti isključene');
  }catch(e){}
}

/* ═══ [16] RENDER: PREGLED — početni ekran po ulozi (direktor / voditelj / proizvodnja / majstor) ═══ */
var PREGLED_FIN_OTVOREN = false;   /* AUDIT-FIX (UX): financijski blok sklopiv, zatvoren po
  defaultu — Pregled je jedini ekran gdje "gustoća iza dodira" (već primijenjeno na
  Kvarovima/Skladištu) nije postojala, iako je ovo i prvi ekran nakon prijave i demo ekran. */
function renderPregled(){
  var KV = samoKvarovi();  /* bez storniranih i bez zadataka — financije i brojke */
  var mm = todayISO().slice(0,7);
  var mk = KV.filter(function(k){ return k.date.slice(0,7)===mm; });
  var cost = 0, hrs = 0;
  mk.forEach(function(k){ cost += kvarCost(k); hrs += k.sati; });
  /* Zatvoreni kvarovi nose sate, otvoreni ih još nemaju — pa mjesečna brojka vrijedi
     0 € za kvar koji upravo stoji, dok sekcija ispod za isti kvar kaže 1.962 €.
     Procjenu držimo odvojeno od dokazive brojke, ali je ne prešućujemo. */
  var uTijekuCost = 0;
  mk.forEach(function(k){
    /* isto pravilo kao "Trenutno stoji": samo kvar koji stvarno zaustavlja liniju troši satnicu */
    if(!zaustavljaLiniju(k)) return;
    var p0 = pocetakKvara(k);
    if(!p0) return;
    var sm0 = machineById(k.m);
    uTijekuCost += Math.max(0, (Date.now() - p0.getTime())/3600000) * (sm0 ? sm0.rate : 350);
  });
  var open = KV.filter(function(k){ return jeOtvoren(k); });
  var low  = zaNaruciti();   /* ista definicija kao na Nabavi: bez otvorene narudžbe */
  var late = DATA.preventiva.filter(function(p){ return p.next < todayISO(); });
  var last3 = aktivni().slice().sort(byDateDesc).slice(0,3);
  /* AUDIT-FIX (dead-code): drugaStat se računao u tri grane i nikad nije ulazio u konačni
     HTML — cells (niže) ispisuje "naručiti" izravno iz low.length. Obrisano zajedno sa
     statCard/finTraka (jedini pozivatelji). */

  /* usporedba s prošlim mjesecom — samo do istog dana u mjesecu.
     Inače nepuni tekući mjesec ide protiv cijelog prošlog i svaki mjesec lažno pokazuje pad. */
  var now = new Date();
  var danMj = now.getDate();
  /* ODLUKA 8 (3.9.2026.): prvih dana u mjesecu je usporedba s prošlim mjesecom gotovo
     besmislena (2 dana protiv 2 dana) — trend pločica na Pregledu (i direktorov hero)
     šuti o postotku do 7. dana u mjesecu. */
  var ranoUMjesecu = danUMjesecu() < 7;
  var pm = new Date(now.getFullYear(), now.getMonth()-1, 1);
  var pmKey = pm.getFullYear()+'-'+pad2(pm.getMonth()+1);
  var prevCost = 0;
  KV.forEach(function(k){
    if(k.date.slice(0,7)===pmKey && parseInt(k.date.slice(8,10),10) <= danMj) prevCost += kvarCost(k);
  });
  var trend = '';
  if(prevCost > 0){
    var pct = Math.round((cost - prevCost) / prevCost * 100);
    /* pad se ne smije bojiti zeleno dok kvarovi koji traju još nisu ušli u brojku */
    var padJeSiguran = pct < 0 && uTijekuCost === 0;
    /* PREGLED SERIJE A: i ovaj postotak je isti trend s istog ekrana (velika kartica u
       sklopljenim financijama) — do 7. dana mora šutjeti kao pločica i direktorov chip,
       inače Pregled sam sebi proturječi ("ovaj mjesec" gore, "▲ +47% vs prva 3 dana" ispod). */
    if(!ranoUMjesecu){
      trend = '<span class="trend '+(pct>=0 ? 'up' : (padJeSiguran ? 'down' : ''))+
        '" title="usporedba s istim brojem dana prošlog mjeseca">'+
        (pct>=0?'▲ +':'▼ ')+Math.abs(pct)+'% vs prvih '+danMj+' dana '+esc(MJESECI_G[pm.getMonth()])+'</span>';
    }
  }

  /* najskuplji strojevi u zadnja 3 mjeseca */
  var t90 = isoShift(-92), costBy = {};
  KV.forEach(function(k){ if(k.date >= t90 && k.m) costBy[k.m] = (costBy[k.m]||0) + kvarCost(k); });
  var topSvi = Object.keys(costBy).map(function(id){ return {id:id, c:costBy[id]}; })
    .sort(function(a,b){ return b.c - a.c; });
  var top = topSvi.slice(0,3);
  var maxC = top.length ? top[0].c : 1;
  var topHtml = top.map(function(t){
    var tm = machineById(t.id) || {name:'—'};
    return '<div class="bar-row" onclick="app.openStroj(\''+t.id+'\')">'+
      '<div class="bar-name">'+esc(tm.name)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(t.c/maxC*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(t.c)+'</div></div>';
  }).join('');
  /* SMJER-B (DirektorB): direktoru do 5 strojeva umjesto 3 — isti izvor (topSvi), samo dulji rez */
  var top5 = topSvi.slice(0,5);
  var maxC5 = top5.length ? top5[0].c : 1;
  var topHtml5 = top5.map(function(t){
    var tm = machineById(t.id) || {name:'—'};
    return '<div class="bar-row" onclick="app.openStroj(\''+t.id+'\')">'+
      '<div class="bar-name">'+esc(tm.name)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(t.c/maxC5*100)+'%"></div></div>'+
      '<div class="bar-val">'+EUR(t.c)+'</div></div>';
  }).join('');

  /* Redak "Raspored i zadaci" je izbačen (PLAN-KAIZEN S1) — Raspored ima svoju

  var mjeseci3 = [2,1,0].map(function(off){

  var maxM = Math.max.apply(null, mjeseci3.map(function(x){ return x.c; }).concat([1]));
  var trendHtml = mjeseci3.map(function(x){

  var stoje = open.filter(function(k){ return zaustavljaLiniju(k) && k.m; })

    ? bigCard+

      /* AUDIT-FIX: direktoru je isti graf uvjetovan (top5.length) — voditelju se sekcija

  var dirHero = '', dirStojiHtml = '', najveciRedak = '';

function strojeviListaHtml(){

    var nadjeno = DATA.machines.filter(function(m){
      return (m.name+' '+(m.program||'')).toLowerCase().indexOf(q) > -1;
    });
    return '<div class="card">'+(nadjeno.length ? nadjeno.map(function(m){ return machineRow(m); }).join('')
      : '<div class="empty">Nema strojeva za traženi pojam.</div>')+'</div>';
  }
  var html = '';
  PROGRAMS.forEach(function(prog){
    var ms = DATA.machines.filter(function(m){ return m.program===prog; });
    if(!ms.length) return;   /* prazan sektor ne treba prazan naslov */
    html += '<h2>'+esc(prog)+'</h2><div class="card">'+
      ms.map(function(m){ return machineRow(m); }).join('') + '</div>';
  });

     a stroj još nosi stari naziv) NE SMIJE nestati s ekrana */

      bezSektora.map(function(m){ return machineRow(m); }).join('') + '</div>';

  return html;

            '<div class="row-sub">prosječno '+H(g.sati/g.n)+' po zahvatu'+
              (rj.length ? ' &middot; rješenje: <b style="color:var(--text)">'+esc(rj[0])+'</b>' : '')+
              (rj.length > 1 ? ' (i: '+esc(rj.slice(1,3).join(', '))+')' : '')+
              (dioRj ? ' &middot; '+dioStanjeCip(dioRj) : '')+'</div>'+
          '</div></div>';
        }).join('')+'</div>';
    })()+
    dijeloviZaStrojHtml(m.id)+
    '<h2>Povijest kvarova ('+ks.length+')</h2><div class="card">'+kvarHtml+'</div>';
}
/* ODLUKA 9 (3.9.2026.): "Dijelovi za ovaj stroj" na kartici stroja — samo čitanje, isti
   .li obrazac kao drugi retci (Skladište). Cijena se namjerno ne prikazuje ovdje (nije
   traženo za ovaj redak), pa nema potrebe za role provjerom majstor/proizvodnja. Prazna
   sekcija se ne prikazuje (§ "miran ekran"). */
function dijeloviZaStrojHtml(mId){
  var lista = DATA.dijelovi.filter(function(p){ return (p.strojevi||[]).indexOf(mId) > -1; })
    .sort(function(a,b){ return a.naziv.localeCompare(b.naziv,'hr'); });
  if(!lista.length) return '';
  return '<h2>Dijelovi za ovaj stroj</h2><div class="card">'+lista.map(function(p){
    var stanjeTxt = p.stanje===0
      ? '<span style="color:var(--red);font-weight:600">Nema</span>'
      : (p.stanje < p.min
        ? '<span style="color:var(--red);font-weight:600">Ispod minimuma &middot; '+p.stanje+'/'+p.min+'</span>'
        : '<span style="color:var(--text-2)">Ima &middot; '+p.stanje+'</span>');
    return '<div class="li click" onclick="app.otvoriDio(\''+p.id+'\')">'+
      '<div class="grow"><div class="t">'+esc(p.naziv)+'</div></div>'+
      stanjeTxt+
      '<span class="chev">›</span></div>';
  }).join('')+'</div>';
}
/* ═══ [19] RENDER: REDAK KVARA — kvarItem (povijest stroja) i kvRedak (popis Kvarovi) ═══ */
function kvarItem(k, showMachine){
  var zadatak = (k.tip||'kvar') === 'zadatak';
  var m = machineById(k.m) || {id:'', name: zadatak ? 'Opći zadatak' : 'Nepoznat stroj'};
  /* ČIŠĆENJE (korisnikov feedback: "natrpano, ništa ne dolazi do izražaja"):
     riješen kvar je NORMALNO stanje popisa — chip "Riješen" na većini kartica bio je
     čisti šum. Chip nose samo stanja koja traže pažnju: otvoren/u radu/upozorenje,
     hitno/visok/čeka dio, otkazan, zadatak. Kategorija i "Riješio" žive u detalju. */
  var chip = '';
  if(k.status==='otkazan') chip = '<span class="chip otkazan">Otkazan</span>';
  else if(k.status==='u_radu') chip = '<span class="chip rad">U radu</span>';
  else if(k.status==='otvoren') chip = k.upoz ? '<span class="chip upoz">Upozorenje</span>' : '<span class="chip kvar">Otvoren</span>';
  var meta;
  if(zadatak){
    /* E-18: rok kroz cijelu aplikaciju piše danas/jučer/naziv dana/datum (relDatumKratak),
       ne uvijek pun datum — "rok 2.9.2026." kad je danas postaje "rok danas". */
    meta = k.rok ? ('Rok: '+(k.rok < todayISO() && jeOtvoren(k) ? '<b style="color:var(--red)">'+relDatumKratak(k.rok)+'</b>' : relDatumKratak(k.rok))) : 'Bez roka';
  } else if(jeOtvoren(k)){
    /* dok linija stoji, "Zastoj 0h" je suprotno od istine — pokazujemo koliko već traje */
    meta = trajanjeKvara(k) || 'u tijeku';
    if(k.dodijeljen) meta += ' &middot; <b>'+esc(k.dodijeljen)+'</b>';
  } else {
    meta = 'Zastoj '+H(k.sati)+(vidiFinancije() ? ' &middot; <b>'+EUR(kvarCost(k))+'</b>' : '');
  }
  var pChip = '';
  if(zadatak) pChip += '<span class="chip zadatak">Zadatak</span> ';
  if(jeOtvoren(k)){
    if(k.prioritet==='hitno') pChip += '<span class="chip kvar">HITNO</span> ';
    else if(k.prioritet==='visok') pChip += '<span class="chip upoz">Visok</span> ';
    if(k.ceka_dio) pChip += '<span class="chip upoz">Čeka dio · stoji</span> ';
    if(k.ceka_servis) pChip += '<span class="chip servis">Čeka servis</span> ';
  }
  var sig = zadatak ? null : kvarSig(k);
  var rep = (sig && REPS[sig] >= 2) ? ' <span class="rep">'+REPS[sig]+'× u 3 mj.</span>' : '';
  /* Kartica je za čitanje — na njoj stoji SAMO radnja koja nedostaje: dodjela
     nedodijeljenog kvara. Sve ostalo ("Čeka dio", rješavanje, uređivanje) je u
     detalju koji se ionako otvara dodirom na karticu. */
  var brzeAkcije = '';
  if(jeOtvoren(k) && !k.dodijeljen){
    /* §16 P2: s jednim tehničarom (stvarni Clarum ustroj) je izbornik s jednom opcijom
       nepotreban dodir viška — jedan dodir na čip odmah dodjeljuje. S više tehničara (drugi
       kupac) ostaje izbornik, jer čip-red od N imena ne staje u redak kartice. */
    brzeAkcije = '<div class="kvar-brzo role-write" onclick="event.stopPropagation()">'+
      (MAJSTORI.length===1
        ? '<button class="rasp-cip puni" onclick="app.brzoDodijeli(\''+k.id+'\',\''+jsArg(MAJSTORI[0])+'\')">→ '+esc(MAJSTORI[0])+'</button>'
        : '<select onchange="app.brzoDodijeli(\''+k.id+'\',this.value)" aria-label="Dodijeli tehničaru">'+
          '<option value="">Dodijeli…</option>'+
          MAJSTORI.map(function(mj){ return '<option>'+esc(mj)+'</option>'; }).join('')+'</select>')+
    '</div>';
  }
  return '<div class="kvar-item click"'+(k.status==='otkazan'?' style="opacity:.55"':'')+
    ' onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="kvar-top"><span>'+(showMachine?'<b style="color:var(--text)">'+esc(m.name)+'</b> &middot; ':'')+fmtDate(k.date)+'</span>'+
    ((pChip||chip) ? '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">'+pChip+chip+'</span>' : '')+'</div>'+
    '<div class="kvar-opis">'+esc(k.opis)+rep+'</div>'+
    '<div class="kvar-meta">'+meta+'</div>'+brzeAkcije+'</div>';
}

/* SMJER-B: redak popisa Kvarovi — .li/.t/.s/.k iz zajedničkog rječnika (Raspored).
   Zadržava kvar-brzo (dodjela s kartice) i kvar-meta (test-kuka) iz starog kvarItem. */
function kvRedak(k){
  var m = machineById(k.m) || {id:'', name:'Nepoznat stroj'};
  var otvoren = jeOtvoren(k);
  var stoji = zaustavljaLiniju(k);
  var chip = '';
  if(k.status==='otkazan') chip = '<span class="k grey">Otkazan</span>';
  else if(otvoren){
    if(k.prioritet==='hitno') chip += '<span class="k red">Hitno</span> ';
    if(k.ceka_dio) chip += '<span class="k yel">Čeka dio</span> ';
    /* Čeka servis zadržava POSTOJEĆU plavu chip.servis (spec: "plava postojeća") */
    if(k.ceka_servis) chip += '<span class="chip servis">Čeka servis</span> ';
    if(k.status==='u_radu') chip += '<span class="k acc">U radu</span>';
  } else if(k.status==='rijesen'){
    chip = k.privremeni ? '<span class="k yel">Privremeno</span>' : '<span class="k grn">Riješen</span>';
  }
  var dioTxt = k.zam ? (' · '+esc(k.zam)) : '';
  var s1 = relDatumKratak(k.date)+' · '+esc(k.opis)+(otvoren ? '' : ' · '+H(k.sati))+dioTxt;
  var s2 = '';
  if(otvoren){
    /* E-odmah #5: "kad će stroj raditi" je najtraženiji, a dosad ga nigdje nije bilo u
       ovom popisu — procjena ide PRVA u meta redak; bez nje je to rupa, ne praznina,
       pa piše crveno "bez procjene". "3× u 3 mj." je maknut odavde (ostaje na detalju
       kvara i na kartici stroja) jer je gušio redak koji sad već ima procjenu + trajanje. */
    var bits = [];
    if(k.procjena_gotovo){
      var pg2 = new Date(k.procjena_gotovo);
      if(!isNaN(pg2.getTime())){
        var kasnjenjeH = (Date.now()-pg2.getTime())/3600000;
        bits.push('kreće ~'+fmtSat(pg2)+(kasnjenjeH>0 ? ' (kasni '+H(Math.round(kasnjenjeH*10)/10)+')' : ''));
      }
    } else {
      bits.push('<b style="color:var(--red)">bez procjene</b>');
    }
    /* ODLUKA 7 (3.9.2026.): "Treba mi do" iz brze prijave — kratak dodatak uz procjenu,
       samo kad ga je proizvodnja stvarno upisala. */
    if(k.treba_do){
      /* PREGLED SERIJE B: isti AUDIT-FIX kao stojiGotovoTxt — goli sat za zahtjev koji je
         SUTRA (noćna smjena traži liniju do 06:00) čita se kao da je danas ujutro. */
      var td1 = localDT(k.treba_do);
      if(td1.t) bits.push('treba do '+(td1.d === todayISO() ? td1.t : fmtDateTime(k.treba_do)));
    }
    bits.push(trajanjeKvara(k) || 'u tijeku');
    if(k.dodijeljen) bits.push(esc(k.dodijeljen));
    var narudzba = (DATA.nabava||[]).filter(function(x){ return x.kvar_id===k.id && !x.primljeno; })[0];
    if(narudzba && narudzba.ocekivano){
      var dioP = narudzba.dio_id ? (DATA.dijelovi.filter(function(p){ return p.id===narudzba.dio_id; })[0]||{}) : {};
      /* AUDIT-FIX: goli kratki dan u tjednu ("sri.") bio je dvosmislen za datum udaljen
         više od tjedan dana — svugdje drugdje u datoteci ovo isto polje ispisuje fmtDate() */
      bits.push(esc(dioP.naziv||'dio')+' stiže '+fmtDate(narudzba.ocekivano));
    }
    s2 = bits.join(' &middot; ');
  }
  var eur = '';
  if(vidiFinancije()){
    if(otvoren){
      var p = pocetakKvara(k);
      var sati = p ? Math.max(0,(Date.now()-p.getTime())/3600000) : null;
      /* AUDIT F8: "do sada" je satnica stroja koji STOJI — kvar koji je otvoren ali ne
         zaustavlja liniju (upozorenje, čeka dio bez zastoja...) ne troši ništa. */
      if(stoji && sati !== null) eur = '<div class="stoji-cijena">'+EUR(sati*(m.rate||350))+'<span>do sada</span></div>';
    } else {
      eur = '<div class="eur">'+EUR(kvarCost(k))+'</div>';
    }
  }
  var brzeAkcije = '';
  if(otvoren && !k.dodijeljen){
    brzeAkcije = '<div class="kvar-brzo role-write" onclick="event.stopPropagation()">'+
      (MAJSTORI.length===1
        ? '<button class="rasp-cip puni" onclick="app.brzoDodijeli(\''+k.id+'\',\''+jsArg(MAJSTORI[0])+'\')">→ '+esc(MAJSTORI[0])+'</button>'
        : '<select onchange="app.brzoDodijeli(\''+k.id+'\',this.value)" aria-label="Dodijeli tehničaru">'+
          '<option value="">Dodijeli…</option>'+
          MAJSTORI.map(function(mj){ return '<option>'+esc(mj)+'</option>'; }).join('')+'</select>')+
    '</div>';
  }
  var stil = stoji ? ' style="border-left-color:var(--red)'+(k.status==='otkazan'?';opacity:.55':'')+'"'
                    : (k.status==='otkazan' ? ' style="opacity:.55"' : '');
  return '<div class="li kvar-item click"'+stil+' onclick="app.detaljKvara(\''+k.id+'\')">'+
    '<div class="grow"><div><span class="t">'+esc(m.name)+'</span>'+(chip?' '+chip:'')+'</div>'+
    '<div class="s kvar-meta">'+s1+'</div>'+
    (s2 ? '<div class="s" style="color:var(--text-2);font-weight:600">'+s2+'</div>' : '')+
    '</div>'+eur+brzeAkcije+'</div>';
}
/* Grupiranje popisa "Svi" po mjesecu prijave — najnoviji mjesec na vrhu */
function kvGrupePoMjesecu(list){
  var mj = {}, redoslijed = [];
  list.forEach(function(k){
    var key = k.date.slice(0,7);
    if(!mj[key]){ mj[key]=[]; redoslijed.push(key); }
    mj[key].push(k);
  });
  redoslijed.sort().reverse();
  return redoslijed.map(function(key){
    var p = key.split('-');
    var lbl = MJESECI[parseInt(p[1],10)-1]+' '+p[0];
    return '<div class="sec"><span>'+esc(lbl)+'</span><span>'+mj[key].length+'</span></div>'+
      mj[key].map(kvRedak).join('');
  }).join('');
}

/* =====================  render: Kvarovi — samo prijave problema  =====================
   Zadaci (kupiti, dogovoriti…) su organizacija i žive na Rasporedu — miješati ih
   među kvarove nije imalo logike ni za brojku na kartici ni za majstora u hali. */
/* ═══ [20] RENDER: KVAROVI — FILTER stanje, renderKvarovi (filtriranje, čipovi, lista) ═══ */
var FILTER = { stroj:'svi', status:'svi', majstor:'svi', od:'', do:'', q:'' };
/* §11.5 dovršetak: pamćenje filtera na Kvarovima kroz osvježavanje stranice */
var ZADNJI_FILTER_KEY = 'odrzavanje-zadnji-filter-kvarovi';
function zapamtiFiltere(){
  try{ localStorage.setItem(ZADNJI_FILTER_KEY, JSON.stringify(FILTER)); }catch(e){}
}
function ucitajZapamceneFiltere(){
  /* AUDIT-FIX: bilo koji string je prolazio bez provjere — status/datum koji više ne
     odgovara nijednoj opciji u padajućem izborniku davao je tih prazan popis bez objašnjenja. */
  var VALJANI_STATUSI = {svi:1,aktivni:1,otvoren:1,u_radu:1,rijesen:1,otkazan:1,stoji:1};
  try{
    var v = JSON.parse(localStorage.getItem(ZADNJI_FILTER_KEY) || 'null');
    if(v && typeof v==='object'){
      /* AUDIT-FIX: 'q' (pojam pretrage) namjerno NIJE ovdje — to je trenutna radnja, ne
         postavka; preživljavanje kroz osvježavanje ostavljalo je ekran s "mrtvom" trakom
         čipova (zatamnjenom dok je pretraga aktivna) bez očitog razloga zašto. */
      ['stroj','status','majstor','od','do'].forEach(function(k){
        if(typeof v[k] !== 'string') return;
        if(k==='status' && !VALJANI_STATUSI[v[k]]) return;
        if((k==='od'||k==='do') && v[k] && !/^\d{4}-\d{2}-\d{2}$/.test(v[k])) return;
        FILTER[k] = v[k];
      });
    }
  }catch(e){}
}
ucitajZapamceneFiltere();
var KV_FILTRI_OTVORENI = false;
var KV_RASPON_OTVOREN = false;   /* VLASNIK-1: sklopljeni "Raspon…" s ručnim od/do poljima */
var KV_CIP = 'otvoreni';   /* SMJER-B: 'otvoreni' | 'rijeseni30' | 'svi' — jedini izvor istine za prikaz popisa */
function relDatumKratak(iso){
  if(iso===todayISO()) return 'danas';
  if(iso===isoShift(-1)) return 'jučer';
  if(iso>isoShift(-6) && iso<todayISO()){ return DANI_KR[new Date(iso+'T00:00:00').getDay()]; }
  var p = iso.split('-');
  /* AUDIT-FIX: bez godine je datum stariji od godinu dana izgledao kao ovogodišnji
     (npr. u ravnom popisu rezultata pretrage, bez grupe po mjesecu iznad) */
  return parseInt(p[2],10)+'. '+parseInt(p[1],10)+'.'+(p[0]!==todayISO().slice(0,4) ? ' '+p[0]+'.' : '');
}
var PENDING_FOTO = '';
var PENDING_DOK = null;   /* {dataUrl, mime, naziv, velicina} — dokument uz stroj čeka spremanje */
var PENDING_LOGO = '';
var BILJESKE_OTVORENO = '';   /* snimak m.bilj u trenutku otvaranja obrasca — otkriva sudar spremanja */
function brojAktivnihFiltera(){
  var n = 0;
  if(FILTER.stroj!=='svi') n++;
  if(FILTER.status!=='svi') n++;
  if(FILTER.majstor!=='svi') n++;
  if(FILTER.od) n++;
  if(FILTER.do) n++;
  return n;
}
function renderKvarovi(){
  /* AUDIT F8: renderKvarovi prepisuje CIJELI #screen-kvarovi.innerHTML — poziv iz pollinga
     ili realtimea (ne samo tipkanje) je time gasio fokus/tipkovnicu na search polju usred
     pisanja. setFilterTiho je to krpao samo za SVOJ poziv; ovdje je popravak opći. */
  var kvSearchFokus = false, kvSearchPoz = 0;
  (function(){
    var el = document.querySelector('#screen-kvarovi input[type="search"]');
    if(el && document.activeElement === el){ kvSearchFokus = true; kvSearchPoz = el.selectionStart==null ? el.value.length : el.selectionStart; }
  })();
  /* VLASNIK-1: dok je upit u pretrazi, traži se preko SVIH kvarova (svi čipovi/statusi,
     uključivo otkazane) — inače korisnik traži riješen/otkazan kvar dok je čip "Otvoreni"
     aktivan i dobije "ništa nema" iako kvar postoji. */
  var pretraga = !!(FILTER.q && FILTER.q.trim());
  var qn = pretraga ? normTxt(FILTER.q.trim()) : '';
  var list = DATA.kvarovi.filter(function(k){
    if((k.tip||'kvar')!=='kvar') return false;   /* zadaci su na Rasporedu */
    if(pretraga){
      /* AUDIT F8: stroj/raspon datuma su bili prikazani u ploci filtera kao da vrijede,
         ali predikat ih je posve ignorirao dok traje pretraga. Status/tehnicar namjerno
         OSTAJU iskljuceni (pretraga mora naci i rijesen/otkazan kvar dok je cip "Otvoreni"
         aktivan) — te dvije padajuce liste se zato onesposobe niže. */
      var m = machineById(k.m);
      var polje = normTxt((k.opis||'')+' '+(m?m.name:'')+' '+(k.tko||'')+' '+(k.dodijeljen||'')+' '+(k.zam||''));
      if(polje.indexOf(qn) === -1) return false;
      if(FILTER.stroj!=='svi' && k.m!==FILTER.stroj) return false;
      if(FILTER.od && k.date < FILTER.od) return false;
      if(FILTER.do && k.date > FILTER.do) return false;
      return true;
    }
    /* otkazane modal (FILTER) skriva dok se izričito ne zatraže — ali čip "Svi" (SMJER-B)
       je deklarirani izuzetak: on po specifikaciji uvijek uključuje i otkazane. */
    if(KV_CIP!=='svi' && FILTER.status==='svi' && k.status==='otkazan') return false;
    if(FILTER.stroj!=='svi' && k.m!==FILTER.stroj) return false;
    /* "aktivni" = otvoren + u radu — isto što broji kartica "Otvoreni kvarovi" na Pregledu */
    if(FILTER.status==='aktivni'){ if(!jeOtvoren(k)) return false; }
    else if(FILTER.status==='stoji'){ if(!jeOtvoren(k) || !zaustavljaLiniju(k)) return false; }  /* AUDIT F8 */
    else if(FILTER.status!=='svi' && k.status!==FILTER.status) return false;
    if(FILTER.majstor==='nedodijeljeno'){ if(k.dodijeljen || !jeOtvoren(k)) return false; }
    else if(FILTER.majstor!=='svi' && k.dodijeljen!==FILTER.majstor) return false;
    if(FILTER.od && k.date < FILTER.od) return false;
    if(FILTER.do && k.date > FILTER.do) return false;
    return true;
  }).sort(function(a,b){
    /* otvoreni prije riješenih; među otvorenima HITNO → Visok → Normalno; pa najnoviji */
    var oa = jeOtvoren(a)?0:1, ob = jeOtvoren(b)?0:1;
    if(oa!==ob) return oa-ob;
    if(oa===0){
      var red = {hitno:0, visok:1, normalno:2};
      var pa = red[a.prioritet]!==undefined?red[a.prioritet]:2;
      var pb = red[b.prioritet]!==undefined?red[b.prioritet]:2;
      if(pa!==pb) return pa-pb;
    }
    return b.date===a.date ? 0 : (b.date>a.date?1:-1);
  });

  var strojOpts = '<option value="svi">Svi strojevi</option>'+DATA.machines.map(function(m){
    return '<option value="'+m.id+'"'+(FILTER.stroj===m.id?' selected':'')+'>'+esc(m.name)+'</option>';
  }).join('');
  var statusOpts =
    '<option value="svi"'+(FILTER.status==='svi'?' selected':'')+'>Svi statusi</option>'+
    '<option value="aktivni"'+(FILTER.status==='aktivni'?' selected':'')+'>Otvoreni + u radu</option>'+
    '<option value="stoji"'+(FILTER.status==='stoji'?' selected':'')+'>Zaustavlja liniju</option>'+
    '<option value="otvoren"'+(FILTER.status==='otvoren'?' selected':'')+'>Otvoreni</option>'+
    '<option value="u_radu"'+(FILTER.status==='u_radu'?' selected':'')+'>U radu</option>'+
    '<option value="rijesen"'+(FILTER.status==='rijesen'?' selected':'')+'>Riješeni</option>'+
    '<option value="otkazan"'+(FILTER.status==='otkazan'?' selected':'')+'>Otkazani (storno)</option>';
  var majstorOpts = '<option value="svi">Svi tehničari</option>'+
    MAJSTORI.map(function(mj){
      return '<option'+(FILTER.majstor===mj?' selected':'')+' value="'+esc(mj)+'">'+esc(mj)+'</option>';
    }).join('')+
    '<option value="nedodijeljeno"'+(FILTER.majstor==='nedodijeljeno'?' selected':'')+'>Nedodijeljeni</option>';

  /* miran ekran: stalno su vidljivi samo pretraga i red čipova —
     pet padajućih polja i dva datuma otvore se tek na dodir gumba "Filtri" */

/* ═══ [21] RENDER: SKLADIŠTE (I NABAVA) — partRow, dioKarticaHtml, partsListHtml, otvoreneNarudzbe ═══ */
var PART_Q = '';
function partRow(p){
  var low = p.stanje < p.min;
  /* "naručeno" se izvodi iz stvarne narudžbe u Nabavi — ne drži se drugi put na dijelu */
  var nar = narudzbaZaDio(p.id);
  /* Naručeno != stiglo (korisnikov feedback) — "Naručeno" je zvučalo kao gotova stvar
     dok je dio i dalje na 0 na skladištu. "U dolasku" je pošteniji opis stanja, a
     zakašnjela isporuka ostaje crvena umjesto smirene žute — i dalje nešto gori. */
  var chip = '';
  if(nar){
    var kasniIsporuka = nar.ocekivano && nar.ocekivano < todayISO();
    chip = kasniIsporuka
      ? ' <span class="chip kvar">Kasni isporuka</span>'
      : ' <span class="chip upoz">U dolasku</span>';
  }
  else if(low) chip = ' <span class="chip kvar">'+(p.stanje===0?'Naruči odmah':'Naruči')+'</span>';
  /* VLASNIK-3A: redak je opet "miran ekran" — samo naziv/oznaka/stanje; dodir na redak
     otvara karticu dijela kao donji list (app.otvoriDio), sve radnje su ondje. */
  return '<div class="li click" onclick="app.otvoriDio(\''+p.id+'\')">'+
    '<div class="grow"><div class="t">'+esc(p.naziv)+chip+'</div>'+
    '<div class="s">'+esc(p.stroj)+' &middot; '+esc(p.dob)+
       (p.lokacija ? ' &middot; '+esc(p.lokacija) : '')+'</div>'+
    '</div>'+
    '<span class="qval'+(low?' low':'')+'">'+p.stanje+'<span>min '+p.min+'</span></span>'+
    '<span class="chev">›</span></div>';
}
/* VLASNIK-3A: potrošnja iz slobodnog teksta "Zamijenjeno" — S8.2, i dalje korisno
   za "otprilike koliko trošimo" ali sad se ne prikazuje u kartici (samo povijest poruka
   je tražena); funkcija ostaje jer je koristi drugdje (npr. buduće izvještaje). */
/* VLASNIK-3A: kartica dijela kao donji list. */

/* povijest kretanja dijela — iz DATA.poruke po podudaranju naziva u tekstu (case-insensitive) */
function povijestDijelaHtml(p){
  /* AUDIT-FIX: dio bez naziva (npr. redak iz CSV uvoza koji je proletio pored validacije)
     inace pokupi svaku poruku — regex bez naziva je gotovo uvijek "istinit". */
  if(!p.naziv) return '<h2 style="margin-top:var(--r3)">Povijest &middot; 0</h2><div class="card"><div class="empty">Još nema kretanja.</div></div>';
  /* AUDIT-FIX: podudaranje bez granica riječi je "Remen" vuklo iz "Remen zupčasti 8M" i
     obrnuto — dodane granice (početak/kraj stringa ili ne-slovo/broj) da kratki nazivi
     ne pokupe tuđa kretanja. */
  var re = new RegExp('(^|[^\\p{L}\\p{N}])'+p.naziv.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^\\p{L}\\p{N}]|$)', 'iu');
  /* ODLUKA 2 (3.9.2026.): kretanje sad dolazi iz DVA izvora — poruka (narudžbe, zaprimanja)
     i kvarova s ovim dio_id. Bez drugog izvora je dio potrošen na kvaru pisao "Povijest · 0".
     Kvarovi imaju prednost: sistemska poruka istog kvara ("Ugrađen dio: …") se preskače da
     isti zahvat ne stoji dvaput — redak kvara nosi i stroj i količinu. */
  var izKvarova = samoKvarovi().filter(function(k){ return k.dio_id === p.id; }).map(function(k){
    var sm = machineById(k.m);
    /* PREGLED serije D: datum je NE ponavljati u tekstu — lijevi stupac retka ga već nosi
       (i to onaj pravi, dan zahvata), pa je "…, 29.8.2026., ×1" uz "29.8.2026." u stupcu bio
       dvaput isti podatak, a kod kvara prijavljenog ranije od zatvaranja i dva različita.
       Količina se piše samo kad je veća od 1 — isti obrazac kao sysPoruka "Ugrađen dio". */
    return { created_at: k.closed_at || (k.date+'T12:00:00'), kvar_id:k.id,
      tekst: 'Ugrađen u '+(sm ? sm.name : '—')+((k.dio_kol||1) > 1 ? ' ×'+k.dio_kol : '')+' — '+k.opis };
  });
  var pokriveni = {};
  izKvarova.forEach(function(x){ pokriveni[x.kvar_id] = true; });
  var sve = (DATA.poruke||[]).filter(function(m){
    return re.test(String(m.tekst||'')) &&
      !(m.kvar_id && pokriveni[m.kvar_id] && String(m.tekst||'').indexOf('Ugrađen dio') > -1);
  }).concat(izKvarova)
    .sort(function(a,b){ return String(b.created_at||'').localeCompare(String(a.created_at||'')); });
  /* AUDIT-FIX: naslov je prije brojao stavke NAKON rezanja na 20, pa je dio sa 50
     kretanja pisao isto "Povijest · 20" kao dio s točno 20 — bez naznake da je odsječeno. */
  var stavke = sve.slice(0,20);
  var danas = todayISO();
  var redak = function(m){
    var dt = localDT(m.created_at);
    var vrijeme = dt.d === danas ? dt.t : (dt.d ? fmtDate(dt.d) : '');
    var tekst = String(m.tekst||'').replace(/^[^\p{L}\p{N}]+/u, '').trim();
    return '<div class="li"><div style="width:44px;flex-shrink:0;font-size:var(--t-sub);color:var(--text-2)">'+esc(vrijeme)+'</div>'+
      '<div class="grow" style="font-size:var(--t-sub)">'+esc(tekst)+'</div></div>';
  };
  /* ODLUKA 2 (3.9.2026.): sažetak iznad povijesti — "koliko ovoga stvarno trošimo" je prvo
     pitanje pri naručivanju; računa se iz dio_kol zadnjih 90 dana. Nula se ne piše (§ "miran ekran"). */
  var pot3 = potrosnjaVezana(p, 90);
  return (pot3 > 0 ? '<div class="row-sub" style="margin-top:var(--r3)">Potrošeno '+pot3+' u 3 mj.</div>' : '')+
    '<h2 style="margin-top:'+(pot3 > 0 ? '2px' : 'var(--r3)')+'">Povijest &middot; '+sve.length+'</h2>'+
    '<div class="card">'+(stavke.length ? stavke.map(redak).join('') : '<div class="empty">Još nema kretanja.</div>')+
    (sve.length > 20 ? '<div class="row-sub" style="text-align:center;padding:var(--r2)">prikazano zadnjih 20</div>' : '')+
    '</div>';
}
/* S8.2: procjena potrošnje iz slobodnog teksta "Zamijenjeno" — dio nema strukturiranu
   vezu na kvar (namjerno, F3 je odbila tablicu veza za rijedak scenarij više dijelova
   po kvaru), pa se broji podudaranje naziva; dovoljno dobro za "otprilike koliko trošimo". */
function potrosnjaDijela(p, dana){
  var od = dana ? isoShift(-dana) : '0000-00-00';
  var re = new RegExp(p.naziv.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\s*[×x](\\d+))?', 'i');
  var zahvata = 0, komada = 0;
  samoKvarovi().forEach(function(k){
    if(!k.zam || k.date < od) return;
    var m = re.exec(k.zam);
    if(m){ zahvata++; komada += m[1] ? parseInt(m[1],10) : 1; }
  });
  return { zahvata:zahvata, komada:komada };
}
/* ODLUKA 2 (3.9.2026.): kvar sad pamti KOJI dio je potrošen (dio_id/dio_kol), ne samo
   slobodan tekst zam — bez toga kartica dijela nije znala za vlastitu potrošnju. Jedan kvar
   nosi jedan dio (F3 je odbila tablicu veza): isti dio zbraja količinu, drugi dio preuzme
   mjesto, a puni popis svih zahvata i dalje čita čovjek iz teksta zam. */
function upisiDioUKvar(k, p, kol){
  if(k.dio_id === p.id) k.dio_kol = (k.dio_kol||0) + kol;
  else { k.dio_id = p.id; k.dio_kol = kol; }
}
/* ODLUKA 2 (3.9.2026.): koliko je komada ovog dijela otišlo u zadnjih `dana` dana — broji se
   iz prave veze kvar→dio, za razliku od potrosnjaDijela (gore) koja pogađa iz teksta. */
function potrosnjaVezana(p, dana){
  var od = isoShift(-dana), kom = 0;
  samoKvarovi().forEach(function(k){
    if(k.dio_id !== p.id) return;
    /* PREGLED serije D: dio ode sa skladišta na dan ZAHVATA, ne na dan prijave kvara.
       "Čeka dio" je ovdje svakodnevica — kvar prijavljen u travnju, dio ugrađen jučer —
       pa je brojanje po k.date takav utrošak izostavljalo, iako kretanje odmah ispod stoji
       s jučerašnjim datumom. Isti trenutak koji nosi i redak povijesti (closed_at || date). */
    var kad = k.closed_at ? localDT(k.closed_at).d : String(k.date||'');
    if(!kad || kad < od) return;
    kom += (k.dio_kol||1);
  });
  return kom;
}
/* ODLUKA 2 (3.9.2026.): stanje dijela u jednom retku (Iskustvo na kartici stroja) — samo
   čitanje, dodir otvara karticu dijela. */
function dioStanjeCip(p){
  if(!p) return '';
  var txt = p.stanje===0 ? 'nema na skladištu'
    : (p.stanje < p.min ? 'ispod minimuma · '+p.stanje+'/'+p.min : 'ima · '+p.stanje);
  /* PREGLED serije D: min je po zadanom 0, pa je dio bez minimuma i bez stanja pisao
     "nema na skladištu" SIVO (0 < 0 nije istina) — a "Dijelovi za ovaj stroj" na istoj
     kartici stroja isti takav dio boji crveno. Prazno skladište je crveno u oba retka. */
  return '<span style="cursor:pointer;font-weight:600;color:'+(p.stanje === 0 || p.stanje < p.min ? 'var(--red)' : 'var(--text-2)')+'"'+
    ' onclick="event.stopPropagation();app.otvoriDio(\''+p.id+'\')">'+txt+'</span>';
}
/* SMJER-B: redak "Ispod minimuma" — crvena traka, gumb Naruči (voditelj) ili čip
   "U dolasku" ako je narudžba u međuvremenu otvorena (obrambeno, prije rerendera). */
function dioIspodMinRow(p){
  var nar = narudzbaZaDio(p.id);
  return '<div class="li click" style="border-left-color:var(--red)" onclick="app.otvoriDio(\''+p.id+'\')">'+
    '<div class="grow"><div class="t">'+esc(p.naziv)+'</div>'+
    '<div class="s">'+esc(p.stroj)+' &middot; '+esc(p.dob)+(p.lokacija?' &middot; '+esc(p.lokacija):'')+'</div></div>'+
    '<span class="qval low">'+p.stanje+'<span>min '+p.min+'</span></span>'+
    (nar ? '<span class="k yel">U dolasku</span>'
         : '<button class="btn-mini role-voditelj" onclick="event.stopPropagation();app.naruciDio(\''+p.id+'\')">Naruči</button>')+
    /* E2-13: redak se ionako otvara dodirom (kao svi ostali u Skladištu) — strelica je
       dosad nedostajala baš ovdje, pa je izgledalo kao da se ne može dirati. */
    '<span class="chev">›</span>'+
  '</div>';
}
/* SMJER-B: redak "U dolasku" — žuta traka, dobavljač/datumi u podnaslovu, gumb Stiglo
   (role-write — RLS zaprimanje već dopušta tehničaru). */
function dioUDolaskuRow(n){
  var p = dioPoId(n.dio_id) || { naziv:'—', min:0, stanje:0 };
  var kasni = n.ocekivano && n.ocekivano < todayISO();
  /* E2-12: meta redak skraćen na dobavljača + rok isporuke — "naručeno DATUM" i "za kvar
     STROJ" su rezali baš onaj podatak zbog kojeg tehničar gleda ovaj redak (kad stiže),
     jer gumb "Stiglo" i stanje/min već zauzimaju desnu polovicu retka (kratki datum bez
     godine, kao i drugdje u retku gdje mjesto nedostaje). */
  return '<div class="li click" style="border-left-color:var(--yellow-border)" onclick="app.otvoriDio(\''+n.dio_id+'\')">'+
    '<div class="grow"><div class="t">'+esc(p.naziv)+'</div>'+
    '<div class="s">'+esc(n.dobavljac||'—')+
      (kasni ? ' &middot; <span style="color:var(--red);font-weight:600">Kasni isporuka</span>'
        : (n.ocekivano ? ' &middot; stiže '+fmtDateKratko(n.ocekivano) : ''))+
    '</div></div>'+
    '<span class="qval'+(p.stanje<p.min?' low':'')+'">'+(p.stanje==null?0:p.stanje)+'<span>min '+p.min+'</span></span>'+  /* AUDIT F1: pisalo je doslovno 0 */
    '<button class="btn-mini role-write" onclick="event.stopPropagation();app.primiNabavu(\''+n.id+'\')">Stiglo</button>'+
  '</div>';
}
function partsListHtml(){
  var q = PART_Q.trim().toLowerCase();
  var list = DATA.dijelovi.slice().sort(function(a,b){
    var la = a.stanje < a.min ? 0 : 1, lb = b.stanje < b.min ? 0 : 1;
    if(la!==lb) return la-lb;
    /* među kritičnima: najbliže nuli prvo (omjer stanje/minimum) */
    var ra = a.min ? a.stanje/a.min : 99, rb = b.min ? b.stanje/b.min : 99;
    if(ra!==rb) return ra-rb;
    return a.naziv.localeCompare(b.naziv,'hr');
  });
  if(q){
    list = list.filter(function(p){
      /* AUDIT-FIX: lokacija i šifra (sku) se prikazuju u retku i izvoze u CSV, ali se
         nisu mogli pronaći pretragom */
      return (p.naziv+' '+p.stroj+' '+p.dob+' '+(p.kategorija||'')+' '+(p.lokacija||'')+' '+(p.sku||'')).toLowerCase().indexOf(q) > -1;
    });
    return '<div class="card">'+(list.length ? list.map(partRow).join('')
      : '<div class="empty">Nema dijelova za traženi pojam.</div>')+'</div>';
  }
  /* bez pretrage: (a) ispod minimuma bez otvorene narudžbe, (b) otvorene narudžbe,
     (c) ostalo po kategorijama iz TVRTKA.kategorije_dijelova — svaka stavka točno jednom,
     prazna sekcija se ne prikazuje (§ "miran ekran"). */
  var krit = zaNaruciti();   /* jedan izvor istine — isti broj kao badge "N naručiti" */
  var kritIds = {}; krit.forEach(function(p){ kritIds[p.id] = true; });
  var otv = otvoreneNarudzbe();
  var otvIds = {}; otv.forEach(function(n){ otvIds[n.dio_id] = true; });
  var ost = list.filter(function(p){ return !kritIds[p.id] && !otvIds[p.id]; });
  var html = '';
  if(krit.length){
    html += '<div class="sec crv"><span>Ispod minimuma</span><span>'+krit.length+'</span></div>'+
            '<div class="card" style="border-color:var(--red-border)">'+krit.map(dioIspodMinRow).join('')+'</div>';
  }
  if(otv.length){
    /* ODLUKA 1 (3.9.2026.): zaseban ekran Nabava (i link "sve narudžbe" na njega) je
       ukinut — ova sekcija već nabraja SVE otvorene narudžbe, link na "sve" je bio
       suvišan dodir prema istom popisu. */
    html += '<div class="sec" style="color:var(--yellow)"><span>U dolasku &middot; '+otv.length+'</span></div>'+
            '<div class="card" style="border-color:var(--yellow-border)">'+otv.map(dioUDolaskuRow).join('')+'</div>';
  }
  var kats = {};
  ost.forEach(function(p){ var k = p.kategorija || 'Ostalo'; (kats[k] = kats[k] || []).push(p); });
  var redoslijed = KAT_DIJELOVA.slice();
  Object.keys(kats).forEach(function(k){ if(redoslijed.indexOf(k)===-1) redoslijed.push(k); });
  redoslijed.forEach(function(k){
    if(!kats[k] || !kats[k].length) return;
    html += '<div class="sec"><span>'+esc(k)+'</span><span>'+kats[k].length+'</span></div>'+
            '<div class="card">'+kats[k].map(partRow).join('')+'</div>';
  });
  /* SERIJA F: html je prazan točno kad DATA.dijelovi.length===0 (svaki dio inače padne u
     krit/otv/ost) — prvi dan nove firme, dodaj naslov+rečenicu+radnju umjesto golog "Nema
     dijelova." */
  return html || (SESSION.role==='voditelj'
    ? praznoStanjeKartica('Skladište je prazno', 'Upiši dijelove koje držiš na zalihi ili ih uvezi (CSV). Minimum po dijelu javlja kad treba naručiti.',
        '<button class="btn sec" onclick="app.noviDio()">+ Novi dio</button>'+
        '<button class="btn sec" onclick="app.uvozCSV()">Uvezi CSV</button>')
    : '<div class="card"><div class="empty">Skladište je prazno.</div></div>');
}
function otvoreneNarudzbe(){
  return (DATA.nabava||[]).filter(function(n){ return !n.primljeno; })
    .sort(function(a,b){ return String(a.ocekivano||'9999').localeCompare(String(b.ocekivano||'9999')); });
}
function dioPoId(id){ return DATA.dijelovi.filter(function(x){ return x.id===id; })[0] || null; }
// SIM-FIX B2: "Naruči dio"/"Ugrađen dio" su dosad prikazivali SAMO dijelove vezane uz stroj —
// dio bez veze u šifrarniku izgledao je kao da ga skladište nema. Sad: prvo vezani, pa razdjelnik,
// pa svi ostali (abecedno) — ništa se ne skriva.
function dioOptsZaStroj(mId){
  var vezani = DATA.dijelovi.filter(function(p){ return (p.strojevi||[]).indexOf(mId) > -1; });
  var vezaniIds = {}; vezani.forEach(function(p){ vezaniIds[p.id] = true; });
  var ostali = DATA.dijelovi.filter(function(p){ return !vezaniIds[p.id]; })
    .sort(function(a,b){ return a.naziv.localeCompare(b.naziv,'hr'); });
  var opt = function(p){ return '<option value="'+p.id+'">'+esc(p.naziv)+' (stanje '+p.stanje+')</option>'; };
  return vezani.map(opt).join('') +
    (vezani.length && ostali.length ? '<option disabled>──────</option>' : '') +
    ostali.map(opt).join('');
}
/* jedan izvor istine za "je li dio naručen": otvorena narudžba u Nabavi */
function narudzbaZaDio(id){
  return otvoreneNarudzbe().filter(function(n){ return n.dio_id === id; })[0] || null;
}
/* Jedna definicija "treba naručiti" za cijelu aplikaciju. Prije su postojale dvije —
   Dijelovi su brojali sve ispod minimuma, Nabava samo one bez otvorene narudžbe —
   pa je isti pojam u četiri dodira davao tri različita broja. */
function zaNaruciti(){
  return DATA.dijelovi.filter(function(p){ return p.stanje < p.min && !narudzbaZaDio(p.id); })
    .sort(function(a,b){ return (a.stanje/(a.min||1)) - (b.stanje/(b.min||1)); });
}
/* ODLUKA 1 (3.9.2026.): renderNabava/nabavaRedak (zaseban ekran "Nabava") su ukinuti —
   "Za naručiti" je Skladištova sekcija "Ispod minimuma" (zaNaruciti/dioIspodMinRow),
   "U dolasku" je sekcija s istim imenom (otvoreneNarudzbe/dioUDolaskuRow), a povijest
   narudžbi po dijelu ostaje na kartici dijela (povijestDijelaHtml čita sysPoruka zapise). */
function renderDijelovi(){
  var vrijednost = 0;
  DATA.dijelovi.forEach(function(p){ vrijednost += p.stanje * p.cijena; });
  /* AUDIT-FIX: isti fokus-obrazac kao renderKvarovi/renderStrojevi — polling prepisuje
     cijeli #screen-dijelovi, uključujući input, i gasio je fokus/tipkovnicu usred pretrage. */
  var djFokus = false, djPoz = 0;
  (function(){
    var el = document.querySelector('#screen-dijelovi input[type="search"]');
    if(el && document.activeElement === el){ djFokus = true; djPoz = el.selectionStart==null ? el.value.length : el.selectionStart; }
  })();
  /* SMJER-B: "+ Novi dio" seli u #fab (varijanta na ovom ekranu, role-voditelj).
     SMJER-D: gumb "Nabava (N)" je maknut s vrha. ODLUKA 1 (3.9.2026.): i link
     "sve narudžbe ›" je maknut — otvorene narudžbe su sekcija "U dolasku"
     (partsListHtml), povijest po dijelu je na kartici dijela (povijestDijelaHtml). */
  /* PREGLED SERIJE F: prazno skladište je dobilo karticu s radnjom, ali je polje pretrage
     ostalo iznad nje — pretraga nad nula dijelova je mrtva kontrola (§ "miran ekran"), isti
     slučaj kao polje pretrage na praznim Strojevima. PART_Q u uvjetu: ako je upit ostao
     upisan a popis se u međuvremenu ispraznio, polje mora ostati da se upit može obrisati. */
  $('#screen-dijelovi').innerHTML =
    ((DATA.dijelovi.length || PART_Q)
      ? '<div style="display:flex;align-items:center;gap:8px;margin-bottom:var(--r2)">'+
          '<input type="search" placeholder="Naziv, stroj, dobavljač…" value="'+esc(PART_Q)+'"'+
            ' oninput="app.traziDio(this.value)" style="flex:1;margin-bottom:0">'+
        '</div>'
      : '')+
    '<div id="parts-list">'+partsListHtml()+'</div>'+
    /* SERIJA F: "Vrijednost skladišta: 0 €" na prazno skladište ne javlja ništa korisno */
    (vidiFinancije() && DATA.dijelovi.length ? '<div class="row-sub" style="text-align:center;margin-top:var(--r3)">Vrijednost skladišta: <b style="color:var(--text)">'+EUR(vrijednost)+'</b></div>' : '');
  if(djFokus){
    var noviDjEl = document.querySelector('#screen-dijelovi input[type="search"]');
    if(noviDjEl){ noviDjEl.focus(); noviDjEl.setSelectionRange(djPoz, djPoz); }
  }
}
/* ═══ [22] KONTAKTI — partnerRow, kontaktiListHtml (ODLUKA 4, 3.9.2026.: sekcija u
   Sustavu "Dobavljači i servisi", ne zaseban ekran/kartica) ═══ */
var KONT_Q = '';
function partnerRow(pt){
  var kontakt = '';
  if(pt.tel || pt.email){
    /* stopPropagation: poziv i mail su glavna radnja i ne smiju otvarati uređivanje */
    kontakt = '<div class="row-sub" style="margin-top:2px">'+
      (pt.tel ? '<a class="clink" onclick="event.stopPropagation()" href="tel:'+esc(String(pt.tel).replace(/[\s\/]/g,''))+'">'+esc(pt.tel)+'</a>' : '')+
      (pt.tel && pt.email ? ' &middot; ' : '')+
      (pt.email ? '<a class="clink" onclick="event.stopPropagation()" href="mailto:'+esc(pt.email)+'">'+esc(pt.email)+'</a>' : '')+
    '</div>';
  }
  /* E-17: broj za 24-satni servis je dosad bio sivi tekst unutar napomene ("24h servis: 091…")
     — jedini broj u kartici koji nije poveznica. Izvučen je u vlastiti redak s oznakom
     "24 h" i pretvoren u tel: poveznicu. */
  var nap = pt.nap || '';
  var nap24 = null;
  var m24 = /24\s*-?\s*h\w*\s*servis\s*:?\s*([\d][\d\s/]*\d)/i.exec(nap);
  if(m24){
    nap24 = m24[1].trim();
    nap = (nap.slice(0, m24.index) + nap.slice(m24.index + m24[0].length)).trim();
  }
  var kontakt24 = nap24 ? '<div class="row-sub" style="margin-top:2px">'+
    '<b style="color:var(--text)">24 h:</b> <a class="clink" onclick="event.stopPropagation()" href="tel:'+
    esc(nap24.replace(/[\s\/]/g,''))+'">'+esc(nap24)+'</a></div>' : '';
  /* Bez gumba "Uredi" na svakom retku — deset istih gumba je šum, a uređuje se
     jednom godišnje. Voditelju dodir na redak otvara uređivanje. */
  var voditelj = SESSION.role === 'voditelj';
  return '<div class="row'+(voditelj?' click':'')+'"'+
    (voditelj ? ' onclick="app.urediPartnera(\''+pt.id+'\')"' : '')+'><div class="grow">'+
    '<div class="row-title" style="font-size:var(--t-meta)">'+esc(pt.naziv)+'</div>'+
    '<div class="row-sub">'+esc(pt.usluga)+' &middot; '+esc(pt.mjesto)+(nap?' &middot; '+esc(nap):'')+'</div>'+
    kontakt24+
    kontakt+
  '</div>'+(voditelj ? '<span class="chev">›</span>' : '')+'</div>';
}
